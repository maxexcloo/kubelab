[env]
PYTHONDONTWRITEBYTECODE = "1"

[tools]
actionlint = "1.7.12"
flux2 = "2.9.4"
helm = "4.2.3"
kubeconform = "0.8.0"
kubectl = "1.36.3"
kustomize = "5.8.1"
opentofu = "1.12.5"
prek = "0.4.13"
prettier = "3.9.6"
talosctl = "1.13.8"
tflint = "0.64.0"
trivy = "0.73.0"
yamllint = "1.38.0"

# Setup
[tasks.setup]
description = "Install tools and Git hooks"
run = """
mise install
prek install
"""

# Development
[tasks.check]
description = "Check formatting and repository configuration"
run = """
prettier --check .
actionlint .github/workflows/*.yaml
yamllint .
"""

[tasks.fmt]
description = "Format project files"
run = """
prettier --write .
"""

[tasks.prek]
description = "Run all repository hooks"
run = "prek run --all-files"
