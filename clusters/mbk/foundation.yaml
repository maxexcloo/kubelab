apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation
  namespace: flux-system
spec:
  interval: 30m
  path: ./clusters/mbk/foundation
  prune: true
  retryInterval: 2m
  timeout: 10m
  wait: true
  healthChecks:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      name: gateway-api-crds
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: flux-system
