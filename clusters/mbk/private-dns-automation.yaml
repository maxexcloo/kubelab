apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: private-dns-automation
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/integrations/private-dns
  prune: true
  retryInterval: 2m
  timeout: 10m
  wait: true
  dependsOn:
    - name: apps
  sourceRef:
    kind: GitRepository
    name: flux-system
