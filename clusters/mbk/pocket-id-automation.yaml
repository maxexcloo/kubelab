apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pocket-id-automation
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/integrations/pocket-id
  prune: true
  retryInterval: 2m
  timeout: 10m
  dependsOn:
    - name: apps
  sourceRef:
    kind: GitRepository
    name: flux-system
