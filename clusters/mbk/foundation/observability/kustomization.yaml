apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../platform/observability/victoria-metrics/base
patches:
  - patch: |-
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1ssa
        value: IfNotPresent
    target:
      annotationSelector: kustomize.toolkit.fluxcd.io/prune=disabled
