apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: automation
spec:
  path: ./clusters/mbk/automation
  dependsOn:
    - name: crossplane-runtime
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: b2objectstorages.automation.excloo.dev
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: pocketidclients.automation.excloo.dev
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: privatednsrecords.automation.excloo.dev
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: resendkeys.automation.excloo.dev
