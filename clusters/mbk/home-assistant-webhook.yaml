apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant-webhook
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/integrations/home-assistant
  prune: true
  retryInterval: 2m
  suspend: true
  timeout: 10m
  wait: true
  dependsOn:
    - name: platform
  sourceRef:
    kind: GitRepository
    name: flux-system
