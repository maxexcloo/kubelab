apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/overlays/mbk
  prune: true
  retryInterval: 2m
  timeout: 10m
  wait: false
  dependsOn:
    - name: automation
  sourceRef:
    kind: GitRepository
    name: flux-system
