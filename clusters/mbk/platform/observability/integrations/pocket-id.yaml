apiVersion: automation.excloo.dev/v1alpha1
kind: PocketIDClient
metadata:
  name: grafana
  namespace: observability
spec:
  client:
    callbackURLs:
      - https://app.invalid/login/generic_oauth
    description: Infrastructure Observability
    id: grafana-au-truenas
    launchURL: https://app.invalid
    name: Grafana
    pkceEnabled: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: observability
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: Grafana
        property: oidc-client-id
      secretKey: oidc-client-id
    - remoteRef:
        key: Grafana
        property: oidc-client-secret
      secretKey: oidc-client-secret
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: grafana-oidc
