apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
  annotations:
    gethomepage.dev/description: Kubernetes Dashboard · MBK
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/href: https://headlamp.mbk.excloo.dev
    gethomepage.dev/icon: headlamp
    gethomepage.dev/name: Headlamp
    gethomepage.dev/siteMonitor: https://headlamp.mbk.excloo.dev
  labels:
