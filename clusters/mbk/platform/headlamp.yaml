apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
spec:
  parentRefs:
    - name: private
      namespace: networking
  hostnames:
    - headlamp.mbk.excloo.dev
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
