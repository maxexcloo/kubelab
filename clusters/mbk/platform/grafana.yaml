apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
  annotations:
    gethomepage.dev/description: Infrastructure Observability
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Operations
    gethomepage.dev/href: https://grafana.excloo.com
    gethomepage.dev/icon: grafana
    gethomepage.dev/name: Grafana (MBK)
    gethomepage.dev/siteMonitor: https://grafana.excloo.com
    gethomepage.dev/weight: "-100"
    gethomepage.dev/widget.password: "{{HOMEPAGE_FILE_GRAFANA_MBK_PASSWORD}}"
    gethomepage.dev/widget.type: grafana
    gethomepage.dev/widget.url: https://grafana.excloo.com
    gethomepage.dev/widget.username: "{{HOMEPAGE_FILE_GRAFANA_MBK_USERNAME}}"
    gethomepage.dev/widget.version: "2"
  labels:
    app.kubernetes.io/name: grafana
spec:
  hostnames:
    - grafana.excloo.com
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: victoria-metrics-k8s-stack-grafana
          port: 80
