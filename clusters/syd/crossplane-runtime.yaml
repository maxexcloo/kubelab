apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-runtime
  namespace: flux-system
spec:
  interval: 30m
  path: ./platform/automation/crossplane-runtime
  prune: true
  retryInterval: 2m
  timeout: 10m
  wait: false
  dependsOn:
    - name: platform
  healthChecks:
    - apiVersion: pkg.crossplane.io/v1
      kind: Function
      name: crossplane-contrib-function-patch-and-transform
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      name: crossplane-contrib-provider-http
  sourceRef:
    kind: GitRepository
    name: flux-system
