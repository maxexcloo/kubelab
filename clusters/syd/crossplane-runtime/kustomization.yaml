apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform/automation/crossplane-runtime
patches:
  - target:
      kind: DeploymentRuntimeConfig
    patch: |-
      - op: add
        path: /spec/deploymentTemplate/spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: kimbap
