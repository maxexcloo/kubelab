apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform/automation/b2
  - ../../../platform/automation/cloudflare
  - ../../../platform/automation/private-dns
patches:
  - patch: |-
      - op: replace
        path: /spec/forProvider/payload/baseUrl
        value: https://cloudflare-dns.com/dns-query?name=private.syd.excloo.dev&type=A
    target:
      kind: Request
      name: private-dns-target-ipv4
  - patch: |-
      - op: replace
        path: /spec/forProvider/payload/baseUrl
        value: https://cloudflare-dns.com/dns-query?name=private.syd.excloo.dev&type=AAAA
    target:
      kind: Request
      name: private-dns-target-ipv6
