# Flux substitutes these cluster ${variables} when it builds the cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: _
spec:
  postBuild:
    substitute:
      backup_destination: s3://syd-backups/postgres
      backup_endpoint: https://saturn.mbk.excloo.net:9000
      cluster_name: syd
      control_d_profile: 653224sydwhf
      dataset_root: /var/mnt/datasets
      grafana_host: grafana.syd.excloo.dev
      home_assistant_host: luna.mbk.excloo.net
      storage_node: saturn
      unifi_host: sol.mbk.excloo.net
