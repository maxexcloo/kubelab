apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../../../platform/settings
resources:
  - settings.yaml
patches:
  # The cluster is IPv4-only; Tailscale ingress needs dual-stack Services for IPv6.
  - patch: |-
      apiVersion: automation.excloo.dev/v1alpha1
      kind: PrivateDNSRecord
      metadata:
        name: application
      spec:
        ipv6Enabled: false
    target:
      kind: PrivateDNSRecord
  - patch: |-
      - op: replace
        path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/ipv6Enabled/default
        value: false
    target:
      kind: CompositeResourceDefinition
      name: privatednsrecords.automation.excloo.dev
replacements:
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.cluster_name
    targets:
      - select:
          kind: CronJob
          name: state-backup
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=backup].env.[name=CLUSTER].value
        options:
          create: true
      - select:
          kind: HelmRelease
          name: homepage
          namespace: homepage
        fieldPaths:
          - spec.values.controllers.homepage.initContainers.endpoints.env.HOMEPAGE_CLUSTER
        options:
          create: true
      - select:
          kind: Kustomization
          name: mini-apps
          namespace: flux-system
        fieldPaths:
          - spec.path
        options:
          delimiter: /
          index: 2
      - select:
          kind: B2ObjectStorage
          name: beszel
          namespace: beszel
        fieldPaths:
          - spec.keyName
        options:
          delimiter: "-"
          index: 1
      - select:
          kind: ExternalSecret
          name: beszel-object-storage
          namespace: beszel
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: "-"
          index: 3
      - select:
          kind: HelmRelease
          name: victoria-metrics-k8s-stack
          namespace: observability
        fieldPaths:
          - spec.values.vmagent.spec.externalLabels.cluster
        options:
          create: true
      - select:
          kind: ResendKey
        fieldPaths:
          - spec.cluster
        options:
          create: true
      # Private names and gateway targets live in the cluster's own zone.
      - select:
          kind: Certificate
          name: wildcard
          namespace: networking
        fieldPaths:
          - spec.dnsNames.2
        options:
          delimiter: .
          index: 1
      - select:
          kind: ConfigMap
          name: cluster-settings
        fieldPaths:
          - data.headlamp_host
          - data.private_dns_host
        options:
          delimiter: .
          index: 1
      - select:
          kind: Gateway
          name: public-direct
          namespace: networking
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/target]
        options:
          delimiter: .
          index: 1
      - select:
          kind: Gateway
          name: public-tunnel
          namespace: networking
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/target]
        options:
          delimiter: .
          index: 1
      - select:
          kind: HelmRelease
          name: actual-up
          namespace: actual-up
        fieldPaths:
          - spec.values.route.private.hostnames.0
        options:
          delimiter: .
          index: 1
      - select:
          kind: HelmRelease
          labelSelector: gateway.excloo.dev/internal-alias=app-template
        fieldPaths:
          - spec.values.route.private.hostnames.1
        options:
          delimiter: .
          index: 1
      - select:
          kind: HTTPRoute
          labelSelector: gateway.excloo.dev/internal-alias=primary
        fieldPaths:
          - spec.hostnames.0
        options:
          delimiter: .
          index: 1
      - select:
          kind: HTTPRoute
          labelSelector: gateway.excloo.dev/internal-alias=true
        fieldPaths:
          - spec.hostnames.1
        options:
          delimiter: .
          index: 1
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.bento_address
    targets:
      - select:
          kind: EndpointSlice
          name: heiss-mcp
          namespace: litellm
        fieldPaths:
          - endpoints.0.addresses.0
      - select:
          kind: EndpointSlice
          name: heiss-x-mcp
          namespace: litellm
        fieldPaths:
          - endpoints.0.addresses.0
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.bento_llm_authority
    targets:
      - select:
          kind: HelmRelease
          name: librechat
          namespace: librechat
        fieldPaths:
          - spec.values.librechat.configEnv.BENTO_API_URL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: litellm
          namespace: litellm
        fieldPaths:
          - spec.values.proxy_config.model_list.[model_name=ai/.*].litellm_params.api_base
        options:
          delimiter: /
          index: 2
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.private_dns_host
    targets:
      - select:
          kind: ConfigMap
          name: cluster-settings
        fieldPaths:
          - data.private_dns_lookup
        options:
          delimiter: name=
          index: 1
      - select:
          kind: CompositeResourceDefinition
          name: privatednsrecords.automation.excloo.dev
        fieldPaths:
          - spec.versions.0.schema.openAPIV3Schema.properties.spec.properties.target.default
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.target
        options:
          create: true
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.private_dns_lookup
    targets:
      - select:
          kind: Request
          name: private-dns-target-ipv4
        fieldPaths:
          - spec.forProvider.payload.baseUrl
        options:
          delimiter: "&"
          index: 0
      - select:
          kind: Request
          name: private-dns-target-ipv6
        fieldPaths:
          - spec.forProvider.payload.baseUrl
        options:
          delimiter: "&"
          index: 0
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.grafana_host
    targets:
      - select:
          kind: HTTPRoute
          name: grafana
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: HTTPRoute
          name: grafana
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
          - metadata.annotations.[gethomepage.dev/widget.url]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: victoria-metrics-k8s-stack
        fieldPaths:
          - spec.values.grafana.[grafana.ini].server.domain
      - select:
          kind: HelmRelease
          name: victoria-metrics-k8s-stack
        fieldPaths:
          - spec.values.grafana.[grafana.ini].server.root_url
        options:
          delimiter: /
          index: 2
      - select:
          kind: PrivateDNSRecord
          name: grafana
        fieldPaths:
          - spec.hostname
      - select:
          kind: PocketIDClient
          name: grafana
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.unifi_host
    targets:
      - select:
          kind: HelmRelease
          name: litellm
          namespace: litellm
        fieldPaths:
          - spec.values.envVars.UNIFI_NETWORK_HOST
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.headlamp_host
    targets:
      - select:
          kind: HTTPRoute
          name: headlamp
          namespace: headlamp
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: HTTPRoute
          name: headlamp
          namespace: headlamp
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: headlamp
          namespace: headlamp
        fieldPaths:
          - spec.values.config.oidc.callbackURL
        options:
          delimiter: /
          index: 2
      - select:
          kind: PocketIDClient
          name: headlamp
          namespace: headlamp
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.backup_endpoint
    targets:
      - select:
          kind: ObjectStore
        fieldPaths:
          - spec.configuration.endpointURL
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.backup_destination
    targets:
      - select:
          kind: ObjectStore
        fieldPaths:
          - spec.configuration.destinationPath
