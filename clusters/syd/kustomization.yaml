apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - apps.yaml
  - cloudflare-automation.yaml
  - flux-system
  - platform.yaml
components:
  - ../../platform/bootstrap/flux-reconciliation
patches:
  - patch: |-
      - op: add
        path: /spec/healthChecks/-
        value:
          apiVersion: kustomize.toolkit.fluxcd.io/v1
          kind: Kustomization
          name: cloudflare-automation
          namespace: flux-system
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: flux-system
      namespace: flux-system
