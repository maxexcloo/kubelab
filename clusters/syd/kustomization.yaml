apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - apps.yaml
  - automation.yaml
  - cloudflare-access-integrations.yaml
  - crossplane-runtime.yaml
  - flux-system
  - foundation.yaml
  - headlamp-integrations.yaml
  - observability-integrations.yaml
  - platform.yaml
patches:
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: _
      spec:
        interval: 30m
        prune: true
        retryInterval: 30s
        timeout: 10m
        wait: true
        sourceRef:
          kind: GitRepository
          name: flux-system
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: _
      spec:
        wait: false
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: (apps|automation|crossplane-runtime|flux-system|platform)
  # Bootstrap dependencies must be healthy at their current generation; unrelated
  # application revisions do not need to reconcile the whole platform in lockstep.
  - patch: |-
      - op: add
        path: /spec/dependsOn/0/readyExpr
        value: >-
          dep.metadata.generation == dep.status.observedGeneration &&
          dep.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: (apps|automation|cloudflare-access-integrations|crossplane-runtime|headlamp-integrations|observability-integrations|platform)
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: flux-system
      spec:
        interval: 10m
        timeout: 2m
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: flux-system
  # The apps Kustomization adopts these objects next; removing these
  # Kustomizations must leave their Pocket ID clients, DNS record and secret.
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: _
      spec:
        prune: false
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: (cloudflare-access-integrations|headlamp-integrations|observability-integrations)
