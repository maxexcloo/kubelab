apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - apps.yaml
  - automation.yaml
  - flux-system
  - headlamp-integrations.yaml
  - observability-integrations.yaml
  - platform.yaml
components:
  - ../../platform/bootstrap/flux-reconciliation
patches:
  - target:
      kind: Kustomization
      name: crossplane-runtime
    patch: |-
      - op: replace
        path: /spec/path
        value: ./clusters/syd/crossplane-runtime
