apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-services
spec:
  path: ./platform/networking/traefik/homelab/certificates
  dependsOn:
    - name: platform
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: homelab-services
      namespace: networking
  postBuild:
    substituteFrom:
      - kind: Secret
        name: homelab-services-settings
