apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: networking
spec:
  secretName: wildcard
  dnsNames:
    - "*.public-domain.invalid"
    - "*.minilab-domain.invalid"
    - "*.cluster.excloo.dev"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns01
