apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: networking
spec:
  secretName: wildcard
  dnsNames:
    - "*.${public_domain}"
    - "*.mini.${public_domain}"
    - "*.syd.excloo.dev"
    # One level deeper than the wildcard: the Redlib www redirect serves this
    # name directly, unproxied, on both the public and private gateways.
    - "www.reddit.${public_domain}"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns01
