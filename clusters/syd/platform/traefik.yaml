apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: networking
spec:
  values:
    ports:
      web:
        expose:
          private: true
      websecure:
        expose:
          private: true
    resources:
      requests:
        cpu: 25m
    service:
      additionalServices:
        private:
          annotations:
            tailscale.com/hostname: syd-ingress
            tailscale.com/proxy-group: ingress
            tailscale.com/tags: tag:cluster-syd
          spec:
            allocateLoadBalancerNodePorts: false
            trafficDistribution: PreferSameNode
            loadBalancerClass: tailscale
            type: LoadBalancer
      spec:
        type: ClusterIP
