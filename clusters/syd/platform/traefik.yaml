apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: networking
spec:
  values:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                # Ingress stays on always-online nodes when GPU workers join.
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - hsp
                    - kimbap
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: traefik-networking
                app.kubernetes.io/name: traefik
            topologyKey: kubernetes.io/hostname
    ports:
      web:
        expose:
          private: true
      webdirect:
        exposedPort: 80
        port: 8082
        protocol: TCP
        expose:
          default: false
          direct: true
        http:
          redirections:
            entryPoint:
              permanent: true
              scheme: https
              to: websecuredirect
      websecure:
        expose:
          private: true
      websecuredirect:
        exposedPort: 443
        port: 8444
        protocol: TCP
        expose:
          default: false
          direct: true
    resources:
      requests:
        cpu: 25m
    service:
      additionalServices:
        direct:
          spec:
            externalTrafficPolicy: Local
            externalIPs:
              - public-direct-address.invalid
            internalTrafficPolicy: Local
            type: ClusterIP
        private:
          annotations:
            tailscale.com/hostname: name.invalid-ingress
            tailscale.com/proxy-group: ingress
            tailscale.com/tags: tag:cluster-name.invalid
          spec:
            allocateLoadBalancerNodePorts: false
            internalTrafficPolicy: Local
            loadBalancerClass: tailscale
            type: LoadBalancer
      spec:
        type: ClusterIP
