apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
  annotations:
    gethomepage.dev/description: Infrastructure Observability
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servers
    gethomepage.dev/href: https://app.invalid
    gethomepage.dev/icon: sh-grafana
    gethomepage.dev/name: &title Grafana
    gethomepage.dev/widget.password: "{{HOMEPAGE_FILE_GRAFANA_PASSWORD}}"
    gethomepage.dev/widget.type: grafana
    gethomepage.dev/widget.url: https://app.invalid
    gethomepage.dev/widget.username: "{{HOMEPAGE_FILE_GRAFANA_USERNAME}}"
    gethomepage.dev/widget.version: "2"
    monitoring.excloo.dev/enabled: "true"
    onepassword.excloo.dev/item: *title
  labels:
    app.kubernetes.io/name: grafana
    gateway.excloo.dev/internal-alias: "true"
spec:
  hostnames:
    - app.invalid
    - grafana.cluster.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: victoria-metrics-k8s-stack-grafana
          port: 80
