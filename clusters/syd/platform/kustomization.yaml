apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform
  - observability/backups
  - certificate.yaml
  - gateway-public-direct.yaml
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: _
        annotations:
          kustomize.toolkit.fluxcd.io/substitute: disabled
    target:
      kind: ConfigMap
  - path: secret-store.yaml
  - path: traefik.yaml
