apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform
  - ../../../platform/automation/crossplane
  - ../../../platform/databases/cloudnative-pg
  - ../../../platform/networking/external-dns-private
  - ../../../platform/networking/external-dns-lan
  - observability
  - certificate.yaml
  - grafana.yaml
  - gateway-public-direct.yaml
  - headlamp
patches:
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: private
        namespace: networking
        annotations:
          # An A override alone lets UniFi forward AAAA to public DNS.
          external-dns.alpha.kubernetes.io/target: "private-lan-address.invalid,::"
  - path: crossplane.yaml
  - path: secret-store.yaml
  - path: tailscale.yaml
  - path: traefik.yaml
replacements:
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.private_lan_address
    targets:
      - select:
          kind: HelmRelease
          name: traefik
          namespace: networking
        fieldPaths:
          - spec.values.service.additionalServices.lan.spec.externalIPs.0
      - select:
          kind: Gateway
          name: private
          namespace: networking
        fieldPaths:
          - metadata.annotations.[external-dns.alpha.kubernetes.io/target]
        options:
          delimiter: ","
          index: 0
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.unifi_host
    targets:
      - select:
          kind: HelmRelease
          name: external-dns-lan
          namespace: external-dns
        fieldPaths:
          - spec.values.provider.webhook.env.[name=UNIFI_HOST].value
        options:
          delimiter: /
          index: 2
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.cluster_name
    targets:
      - select:
          kind: HelmRelease
          name: external-dns-lan
          namespace: external-dns
        fieldPaths:
          - spec.values.txtOwnerId
        options:
          delimiter: "-"
          index: 0
  # Cluster settings resolve before this kustomization's patches add the address.
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.public_direct_address
    targets:
      - select:
          kind: HelmRelease
          name: traefik
          namespace: networking
        fieldPaths:
          - spec.values.service.additionalServices.direct.spec.externalIPs.0
  # Tailscale device names and tags carry the cluster name.
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.cluster_name
    targets:
      - select:
          kind: HelmRelease
          name: tailscale-operator
          namespace: tailscale
        fieldPaths:
          - spec.values.operatorConfig.hostname
        options:
          delimiter: "-"
          index: 0
      - select:
          kind: HelmRelease
          name: tailscale-operator
          namespace: tailscale
        fieldPaths:
          - spec.values.operatorConfig.defaultTags.0
          - spec.values.proxyConfig.defaultTags
        options:
          delimiter: "-"
          index: 1
      - select:
          kind: HelmRelease
          name: traefik
          namespace: networking
        fieldPaths:
          - spec.values.service.additionalServices.private.annotations.[tailscale.com/hostname]
        options:
          delimiter: "-"
          index: 0
      - select:
          kind: HelmRelease
          name: traefik
          namespace: networking
        fieldPaths:
          - spec.values.service.additionalServices.private.annotations.[tailscale.com/tags]
        options:
          delimiter: "-"
          index: 1
  # Tunnel connectors and private proxies share Traefik's always-online nodes.
  - source:
      kind: HelmRelease
      name: traefik
      namespace: networking
      fieldPath: spec.values.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution
    targets:
      - select:
          kind: HelmRelease
          name: cloudflared
          namespace: cloudflared
        fieldPaths:
          - spec.values.defaultPodOptions.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution
        options:
          create: true
      - select:
          kind: ProxyClass
          name: ingress
        fieldPaths:
          - spec.statefulSet.pod.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution
        options:
          create: true
components:
  - ../settings
