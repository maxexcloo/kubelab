apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform
  - ../../../platform/automation/crossplane
  - ../../../platform/databases/cloudnative-pg
  - ../../../platform/networking/external-dns-private
  - observability
  - certificate.yaml
  - grafana.yaml
  - gateway-public-direct.yaml
  - headlamp.yaml
patches:
  - path: crossplane.yaml
  - path: secret-store.yaml
  - path: tailscale.yaml
  - path: traefik-gateway.yaml
  - path: traefik.yaml
replacements:
  # Tunnel connectors and private proxies share Traefik's always-online nodes.
  - source:
      kind: HelmRelease
      name: traefik
      namespace: networking
      fieldPath: spec.values.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution
    targets:
      - select:
          kind: HelmRelease
          name: cloudflared
          namespace: cloudflared
        fieldPaths:
          - spec.values.defaultPodOptions.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution
        options:
          create: true
      - select:
          kind: ProxyClass
          name: ingress
        fieldPaths:
          - spec.statefulSet.pod.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution
        options:
          create: true
  - source:
      kind: HTTPRoute
      name: headlamp
      namespace: headlamp
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: headlamp
          namespace: headlamp
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: grafana
      namespace: observability
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: grafana
          namespace: observability
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
          - metadata.annotations.[gethomepage.dev/widget.url]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: victoria-metrics-k8s-stack
          namespace: observability
        fieldPaths:
          - spec.values.grafana.[grafana.ini].server.domain
      - select:
          kind: HelmRelease
          name: victoria-metrics-k8s-stack
          namespace: observability
        fieldPaths:
          - spec.values.grafana.[grafana.ini].server.root_url
        options:
          delimiter: /
          index: 2
      - select:
          kind: PrivateDNSRecord
          name: grafana
          namespace: observability
        fieldPaths:
          - spec.hostname
      - select:
          kind: PocketIDClient
          name: grafana
          namespace: observability
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
components:
  - ../settings
