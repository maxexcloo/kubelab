apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform
  - ../../../platform/automation/crossplane
  - ../../../platform/databases/cloudnative-pg
  - ../../../platform/networking/external-dns-private
  - observability
  - certificate.yaml
  - grafana.yaml
  - gateway-public-direct.yaml
  - headlamp
patches:
  - path: crossplane.yaml
  - path: secret-store.yaml
  - path: tailscale.yaml
  - path: traefik.yaml
replacements:
  # Cluster settings resolve before this kustomization's patches add the address.
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.public_direct_address
    targets:
      - select:
          kind: HelmRelease
          name: traefik
          namespace: networking
        fieldPaths:
          - spec.values.service.additionalServices.direct.spec.externalIPs.0
  # Tunnel connectors and private proxies share Traefik's always-online nodes.
  - source:
      kind: HelmRelease
      name: traefik
      namespace: networking
      fieldPath: spec.values.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution
    targets:
      - select:
          kind: HelmRelease
          name: cloudflared
          namespace: cloudflared
        fieldPaths:
          - spec.values.defaultPodOptions.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution
        options:
          create: true
      - select:
          kind: ProxyClass
          name: ingress
        fieldPaths:
          - spec.statefulSet.pod.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution
        options:
          create: true
components:
  - ../settings
