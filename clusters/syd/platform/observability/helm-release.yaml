apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: observability
spec:
  values:
    grafana:
      nodeSelector:
        kubernetes.io/hostname: kimbap
    kube-state-metrics:
      nodeSelector:
        kubernetes.io/hostname: kimbap
    victoria-metrics-operator:
      nodeSelector:
        kubernetes.io/hostname: kimbap
    vlsingle:
      spec:
        nodeSelector:
          kubernetes.io/hostname: kimbap
    vmagent:
      spec:
        externalLabels:
          cluster: syd
        nodeSelector:
          kubernetes.io/hostname: kimbap
    vmsingle:
      spec:
        nodeSelector:
          kubernetes.io/hostname: kimbap
