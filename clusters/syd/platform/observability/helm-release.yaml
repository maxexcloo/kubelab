apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: observability
spec:
  values:
    grafana:
      nodeSelector:
        node.excloo.dev/network: internal
    kube-state-metrics:
      nodeSelector:
        node.excloo.dev/network: internal
    victoria-metrics-operator:
      nodeSelector:
        node.excloo.dev/network: internal
    vlsingle:
      spec:
        nodeSelector:
          node.excloo.dev/network: internal
    vmagent:
      spec:
        externalLabels:
          cluster: syd
        nodeSelector:
          node.excloo.dev/network: internal
    vmsingle:
      spec:
        nodeSelector:
          node.excloo.dev/network: internal
