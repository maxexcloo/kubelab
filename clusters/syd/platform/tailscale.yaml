apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  values:
    operatorConfig:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.excloo.dev/network
                    operator: In
                    values:
                      - internal
      hostname: name.invalid-operator
      defaultTags:
        - tag:cluster-name.invalid-operator
    proxyConfig:
      defaultTags: tag:cluster-name.invalid
