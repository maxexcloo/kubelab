apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crds
  namespace: flux-system
spec:
  deletionPolicy: Orphan
  interval: 30m
  path: ./platform/crds
  prune: false
  retryInterval: 2m
  timeout: 10m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
