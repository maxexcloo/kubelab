name: Validate
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: validate-${{ github.workflow }}-${{ github.ref }}
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4
      - name: Run Hooks
        run: mise run check
  monitoring:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Refresh External Monitoring
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy The Validated Inventory
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_FLY_DEPLOY_TOKEN }}
          KUBELAB_REVISION: ${{ github.sha }}
        run: |
          gh workflow run deploy.yaml --field deployment=gatus-fly \
            --field kubelab_revision="$KUBELAB_REVISION" --ref main --repo maxexcloo/flylab
