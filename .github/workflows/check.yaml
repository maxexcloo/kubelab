name: Check
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: check-${{ github.ref }}
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
      - name: Run Checks
        run: mise run check
      - name: Refresh External Monitoring
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_FLY_DEPLOY_TOKEN }}
          KUBELAB_REVISION: ${{ github.sha }}
        run: |
          gh workflow run deploy.yaml --field deployment=gatus-fly \
            --field kubelab_revision="$KUBELAB_REVISION" --ref main --repo maxexcloo/flylab
