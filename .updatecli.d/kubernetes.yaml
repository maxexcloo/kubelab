# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Kubernetes
pipelineid: update-kubernetes
autodiscovery:
  crawlers:
    kubernetes:
      digest: false
      ignore:
        # The Kubernetes client policy pins kubectl images to the cluster version.
        - images:
            - docker.io/alpine/k8s
        # Flux components are upgraded manually with `flux install --export`.
        - path: platform/bootstrap/flux-system/gotk-components.yaml
labels:
  group: kubernetes
