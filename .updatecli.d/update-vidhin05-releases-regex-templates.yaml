# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Vidhin05/Releases-Regex Templates
pipelineid: update-vidhin05-releases-regex-templates
labels:
  group: sources
sources:
  version:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/Vidhin05/Releases-Regex.git refs/heads/main | awk 'NR == 1 { print $1 }')
        test -n "$revision"
        printf '%s\n' "$revision"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: apps/base/aiostreams/settings.yaml
      matchpattern: (raw.githubusercontent.com/Vidhin05/Releases\-Regex/)[a-f0-9]{40}/
      replacepattern: ${1}{{ source "version" }}/
