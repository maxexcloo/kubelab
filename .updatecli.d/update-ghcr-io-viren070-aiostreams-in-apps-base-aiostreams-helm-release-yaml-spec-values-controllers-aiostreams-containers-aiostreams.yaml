# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update ghcr.io/viren070/aiostreams In apps/base/aiostreams/helm-release.yaml $.spec.values.controllers.aiostreams.containers.aiostreams
pipelineid: update-ghcr-io-viren070-aiostreams-in-apps-base-aiostreams-helm-release-yaml-spec-values-controllers-aiostreams-containers-aiostreams
labels:
  group: containers
sources:
