    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/aiostreams/helm-release.yaml
      key: $.spec.values.controllers.aiostreams.containers.aiostreams.image.tag
    transformers:
      - find: ^[^@]+
  digest:
    kind: dockerdigest
    spec:
      image: '{{ source "repository" }}'
      tag: '{{ source "version" }}'
  repository:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/aiostreams/helm-release.yaml
      key: $.spec.values.controllers.aiostreams.containers.aiostreams.image.repository
  version:
    kind: dockerimage
    spec:
      image: '{{ source "repository" }}'
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})$
targets:
