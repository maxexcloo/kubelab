# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update docker.io/mikefarah/yq In apps/base/homepage/helm-release.yaml $.spec.values.controllers.homepage.initContainers.endpoints
pipelineid: update-docker-io-mikefarah-yq-in-apps-base-homepage-helm-release-yaml-spec-values-controllers-homepage-initcontainers-endpoints
labels:
  group: containers
sources:
  current:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/homepage/helm-release.yaml
      key: $.spec.values.controllers.homepage.initContainers.endpoints.image.tag
    transformers:
      - find: ^[^@]+
  repository:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/homepage/helm-release.yaml
      key: $.spec.values.controllers.homepage.initContainers.endpoints.image.repository
  version:
    kind: dockerimage
    spec:
      image: '{{ source "repository" }}'
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})$
targets:
  image:
    kind: yaml
    sourceid: version
    spec:
      engine: yamlpath
      file: apps/base/homepage/helm-release.yaml
      key: $.spec.values.controllers.homepage.initContainers.endpoints.image.tag
