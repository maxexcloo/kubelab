# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update CRD Catalogue
pipelineid: update-crd-catalogue
labels:
  group: sources
sources:
  version:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/datreeio/CRDs-catalog.git refs/heads/main | awk 'NR == 1 { print $1 }')
        test -n "$revision"
        printf '%s\n' "$revision"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: scripts/check_manifests.sh
      matchpattern: (crd_catalog_revision=")[a-f0-9]{40}(")
      replacepattern: ${1}{{ source "version" }}${2}
---
