pipelineid: update-cloudflare-cloudflared-in-platform-networking-cloudflared-helm-release-yaml-spec-values-controllers-cloudflared-containers-cloudflared
labels:
  group: containers
sources:
  digest:
    kind: dockerdigest
    spec:
      image: '{{ source "repository" }}'
      tag: '{{ source "version" }}'
  repository:
    kind: yaml
    spec:
      engine: yamlpath
      file: platform/networking/cloudflared/helm-release.yaml
      key: $.spec.values.controllers.cloudflared.containers.cloudflared.image.repository
  version:
    kind: dockerimage
    spec:
      image: '{{ source "repository" }}'
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})$
targets:
  image:
    kind: yaml
    sourceid: digest
    spec:
      engine: yamlpath
      file: platform/networking/cloudflared/helm-release.yaml
      key: $.spec.values.controllers.cloudflared.containers.cloudflared.image.tag
    transformers:
      - addprefix: '{{ source "version" }}@'
