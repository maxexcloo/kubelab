name: Update ghcr.io/cloudnative-pg/postgresql 18.6-minimal-trixie Digest
pipelineid: update-database-ghcr-io-cloudnative-pg-postgresql-18-6-minimal-trixie
labels:
  group: containers
sources:
  version:
    kind: dockerdigest
    spec:
      image: ghcr.io/cloudnative-pg/postgresql
      tag: 18.6-minimal-trixie
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      matchpattern: ((?:imageName|reference):\s+ghcr\.io/cloudnative\-pg/postgresql:18\.6\-minimal\-trixie@)sha256:[a-f0-9]{64}
      replacepattern: ${1}{{ source "version" }}
      files:
        - apps/base/linkwarden/database.yaml
        - apps/base/miniflux/database.yaml
