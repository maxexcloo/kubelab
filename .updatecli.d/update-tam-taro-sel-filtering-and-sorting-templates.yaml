# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Tam-Taro/SEL-Filtering-and-Sorting Templates
pipelineid: update-tam-taro-sel-filtering-and-sorting-templates
labels:
  group: sources
sources:
  version:
    kind: shell
    spec:
      command: |-
        set -eu
        revision=$(git ls-remote --exit-code https://github.com/Tam-Taro/SEL-Filtering-and-Sorting.git refs/heads/main | awk 'NR == 1 { print $1 }')
        test -n "$revision"
        printf '%s\n' "$revision"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: apps/base/aiostreams/settings.yaml
      matchpattern: (raw.githubusercontent.com/Tam\-Taro/SEL\-Filtering\-and\-Sorting/)[a-f0-9]{40}/
      replacepattern: ${1}{{ source "version" }}/
