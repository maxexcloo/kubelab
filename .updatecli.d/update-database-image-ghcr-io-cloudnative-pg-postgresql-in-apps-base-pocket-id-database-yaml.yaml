# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Database Image ghcr.io/cloudnative-pg/postgresql In apps/base/pocket-id/database.yaml
pipelineid: update-database-image-ghcr-io-cloudnative-pg-postgresql-in-apps-base-pocket-id-database-yaml
labels:
  group: containers
sources:
  version:
    kind: dockerdigest
    spec:
      image: ghcr.io/cloudnative-pg/postgresql
      tag: 18.6-standard-trixie
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: apps/base/pocket-id/database.yaml
      matchpattern: ((?:imageName|reference):\s+ghcr\.io/cloudnative\-pg/postgresql:18\.6\-standard\-trixie@)sha256:[a-f0-9]{64}
      replacepattern: ${1}{{ source "version" }}
