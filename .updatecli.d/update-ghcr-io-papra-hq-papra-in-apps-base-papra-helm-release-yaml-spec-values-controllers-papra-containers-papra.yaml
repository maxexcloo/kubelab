# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update ghcr.io/papra-hq/papra In apps/base/papra/helm-release.yaml $.spec.values.controllers.papra.containers.papra
pipelineid: update-ghcr-io-papra-hq-papra-in-apps-base-papra-helm-release-yaml-spec-values-controllers-papra-containers-papra
labels:
  group: containers
sources:
  current:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/papra/helm-release.yaml
      key: $.spec.values.controllers.papra.containers.papra.image.tag
    transformers:
      - find: ^[^@]+
  digest:
    kind: dockerdigest
    spec:
      image: '{{ source "repository" }}'
      tag: '{{ source "version" }}'
  repository:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/papra/helm-release.yaml
      key: $.spec.values.controllers.papra.containers.papra.image.repository
  version:
    kind: dockerimage
    spec:
      image: '{{ source "repository" }}'
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}\-rootless$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})\-rootless$
targets:
  image:
    kind: yaml
    sourceid: digest
    spec:
      engine: yamlpath
      file: apps/base/papra/helm-release.yaml
      key: $.spec.values.controllers.papra.containers.papra.image.tag
    transformers:
      - addprefix: '{{ source "version" }}@'
