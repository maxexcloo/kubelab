# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update ghcr.io/immich-app/immich-server In apps/base/immich/helm-release.yaml $.spec.values.server.controllers.main.containers.main
pipelineid: update-ghcr-io-immich-app-immich-server-in-apps-base-immich-helm-release-yaml-spec-values-server-controllers-main-containers-main
labels:
  group: containers
sources:
  current:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/immich/helm-release.yaml
      key: $.spec.values.server.controllers.main.containers.main.image.tag
    transformers:
      - find: ^[^@]+
  digest:
    kind: dockerdigest
    spec:
      image: '{{ source "repository" }}'
      tag: '{{ source "version" }}'
  repository:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/immich/helm-release.yaml
      key: $.spec.values.server.controllers.main.containers.main.image.repository
  version:
    kind: dockerimage
    spec:
      image: '{{ source "repository" }}'
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})$
targets:
  image:
    kind: yaml
    sourceid: digest
    spec:
      engine: yamlpath
      file: apps/base/immich/helm-release.yaml
      key: $.spec.values.server.controllers.main.containers.main.image.tag
    transformers:
      - addprefix: '{{ source "version" }}@'
