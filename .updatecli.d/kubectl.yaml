# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Kubernetes Clients
pipelineid: update-kubernetes-client
labels:
  group: platform
sources:
  version:
    kind: shell
    spec:
      # Require one configured API version; mixed versions need an explicit choice.
      command: yq --exit-status -r '[.clusters[].kubernetes_version] | unique | select(length == 1) | .[0] | sub("^v"; "")' ../homelab/data/clusters.yaml
targets:
  backup:
    kind: file
    sourceid: version
    spec:
      file: platform/backups/files/cron-job.yaml
      matchpattern: (docker\.io/alpine/k8s:)[0-9.]+
      replacepattern: ${1}{{ source "version" }}
  mise:
    kind: file
    sourceid: version
    spec:
      file: .mise.toml
      matchpattern: (?m)^(kubectl = ")[^"]+("$)
      replacepattern: ${1}{{ source "version" }}${2}
