# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update docker.io/library/nginx In apps/base/atvloadly/helm-release.yaml $.spec.values.controllers.atvloadly.containers.proxy
pipelineid: update-docker-io-library-nginx-in-apps-base-atvloadly-helm-release-yaml-spec-values-controllers-atvloadly-containers-proxy
labels:
  group: containers
sources:
  current:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/atvloadly/helm-release.yaml
      key: $.spec.values.controllers.atvloadly.containers.proxy.image.tag
    transformers:
      - find: ^[^@]+
  digest:
    kind: dockerdigest
    spec:
      image: '{{ source "repository" }}'
      tag: '{{ source "version" }}'
  repository:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/atvloadly/helm-release.yaml
      key: $.spec.values.controllers.atvloadly.containers.proxy.image.repository
  version:
    kind: dockerimage
    spec:
      image: '{{ source "repository" }}'
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}\-alpine$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})\-alpine$
targets:
  image:
    kind: yaml
    sourceid: digest
    spec:
      engine: yamlpath
      file: apps/base/atvloadly/helm-release.yaml
      key: $.spec.values.controllers.atvloadly.containers.proxy.image.tag
    transformers:
      - addprefix: '{{ source "version" }}@'
