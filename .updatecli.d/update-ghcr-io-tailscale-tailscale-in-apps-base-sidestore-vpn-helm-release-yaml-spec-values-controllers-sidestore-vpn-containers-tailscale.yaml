# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update ghcr.io/tailscale/tailscale In apps/base/sidestore-vpn/helm-release.yaml $.spec.values.controllers.sidestore-vpn.containers.tailscale
pipelineid: update-ghcr-io-tailscale-tailscale-in-apps-base-sidestore-vpn-helm-release-yaml-spec-values-controllers-sidestore-vpn-containers-tailscale
labels:
  group: containers
sources:
  current:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/sidestore-vpn/helm-release.yaml
      key: $.spec.values.controllers.sidestore-vpn.containers.tailscale.image.tag
    transformers:
      - find: ^[^@]+
  digest:
    kind: dockerdigest
    spec:
      image: '{{ source "repository" }}'
      tag: '{{ source "version" }}'
  repository:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/sidestore-vpn/helm-release.yaml
      key: $.spec.values.controllers.sidestore-vpn.containers.tailscale.image.repository
  version:
    kind: dockerimage
    spec:
      image: '{{ source "repository" }}'
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})$
targets:
  image:
    kind: yaml
    sourceid: digest
    spec:
      engine: yamlpath
      file: apps/base/sidestore-vpn/helm-release.yaml
      key: $.spec.values.controllers.sidestore-vpn.containers.tailscale.image.tag
    transformers:
      - addprefix: '{{ source "version" }}@'
