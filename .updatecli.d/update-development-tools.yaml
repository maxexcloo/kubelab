# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Development Tools
pipelineid: update-development-tools
labels:
  group: tools
sources:
  1password-cli:
    kind: http
    spec:
      url: https://app-updates.agilebits.com/check/1/0/CLI2/en/2.0.0/N
    transformers:
      - jsonmatch:
          key: .version
  actionlint:
    kind: shell
    spec:
      command: mise latest actionlint
  flux2:
    kind: shell
    spec:
      command: mise latest flux2
  helm:
    kind: shell
    spec:
      command: mise latest helm
  kubeconform:
    kind: shell
    spec:
      command: mise latest kubeconform
  kubectl:
    kind: shell
    spec:
      command: mise latest kubectl
  prek:
    kind: shell
    spec:
      command: mise latest prek
  prettier:
    kind: shell
    spec:
      command: mise latest prettier
  python:
    kind: shell
    spec:
      command: mise latest python
  shellcheck:
    kind: shell
    spec:
      command: mise latest shellcheck
  updatecli:
    kind: shell
    spec:
      command: mise latest updatecli
  yq:
    kind: shell
    spec:
      command: mise latest yq
targets:
  1password-cli:
    kind: file
    sourceid: 1password-cli
    spec:
      file: .mise.toml
      matchpattern: (?m)^(1password\-cli = ")[^"]+(")$
      replacepattern: ${1}{{ source "1password-cli" }}${2}
  actionlint:
    kind: file
    sourceid: actionlint
    spec:
      file: .mise.toml
      matchpattern: (?m)^(actionlint = ")[^"]+(")$
      replacepattern: ${1}{{ source "actionlint" }}${2}
  flux2:
    kind: file
    sourceid: flux2
    spec:
      file: .mise.toml
      matchpattern: (?m)^(flux2 = ")[^"]+(")$
      replacepattern: ${1}{{ source "flux2" }}${2}
  helm:
    kind: file
    sourceid: helm
    spec:
      file: .mise.toml
      matchpattern: (?m)^(helm = ")[^"]+(")$
      replacepattern: ${1}{{ source "helm" }}${2}
  kubeconform:
    kind: file
    sourceid: kubeconform
    spec:
      file: .mise.toml
      matchpattern: (?m)^(kubeconform = ")[^"]+(")$
      replacepattern: ${1}{{ source "kubeconform" }}${2}
  kubectl:
    kind: file
    sourceid: kubectl
    spec:
      file: .mise.toml
      matchpattern: (?m)^(kubectl = ")[^"]+(")$
      replacepattern: ${1}{{ source "kubectl" }}${2}
  prek:
    kind: file
    sourceid: prek
    spec:
      file: .mise.toml
      matchpattern: (?m)^(prek = ")[^"]+(")$
      replacepattern: ${1}{{ source "prek" }}${2}
  prettier:
    kind: file
    sourceid: prettier
    spec:
      file: .mise.toml
      matchpattern: (?m)^(prettier = ")[^"]+(")$
      replacepattern: ${1}{{ source "prettier" }}${2}
  python:
    kind: file
    sourceid: python
    spec:
      file: .mise.toml
      matchpattern: (?m)^(python = ")[^"]+(")$
      replacepattern: ${1}{{ source "python" }}${2}
  shellcheck:
    kind: file
    sourceid: shellcheck
    spec:
      file: .mise.toml
      matchpattern: (?m)^(shellcheck = ")[^"]+(")$
      replacepattern: ${1}{{ source "shellcheck" }}${2}
  updatecli:
    kind: file
    sourceid: updatecli
    spec:
      file: .mise.toml
      matchpattern: (?m)^(updatecli = ")[^"]+(")$
      replacepattern: ${1}{{ source "updatecli" }}${2}
  yq:
    kind: file
    sourceid: yq
    spec:
      file: .mise.toml
      matchpattern: (?m)^(yq = ")[^"]+(")$
      replacepattern: ${1}{{ source "yq" }}${2}
