# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update docker.io/getmeili/meilisearch In apps/base/linkwarden/helm-release.yaml $.spec.values.controllers.meilisearch.containers.meilisearch
pipelineid: update-docker-io-getmeili-meilisearch-in-apps-base-linkwarden-helm-release-yaml-spec-values-controllers-meilisearch-containers-meilisearch
labels:
  group: containers
sources:
