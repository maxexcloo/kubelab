    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/linkwarden/helm-release.yaml
      key: $.spec.values.controllers.meilisearch.containers.meilisearch.image.tag
    transformers:
      - find: ^[^@]+
  digest:
    kind: dockerdigest
    spec:
      image: '{{ source "repository" }}'
      tag: '{{ source "version" }}'
  repository:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/linkwarden/helm-release.yaml
      key: $.spec.values.controllers.meilisearch.containers.meilisearch.image.repository
  version:
    kind: dockerimage
    spec:
      image: '{{ source "repository" }}'
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})$
targets:
  image:
    kind: yaml
    sourceid: digest
    spec:
      engine: yamlpath
      file: apps/base/linkwarden/helm-release.yaml
      key: $.spec.values.controllers.meilisearch.containers.meilisearch.image.tag
    transformers:
