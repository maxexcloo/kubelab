# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update docker.io/actualbudget/actual-server In apps/base/actual-budget/helm-release.yaml $.spec.values.controllers.actual-budget.containers.actual-budget
pipelineid: update-docker-io-actualbudget-actual-server-in-apps-base-actual-budget-helm-release-yaml-spec-values-controllers-actual-budget-containers-actual-budget
labels:
  group: containers
sources:
  current:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/actual-budget/helm-release.yaml
      key: $.spec.values.controllers.actual-budget.containers.actual-budget.image.tag
    transformers:
      - find: ^[^@]+
  digest:
    kind: dockerdigest
    spec:
      image: '{{ source "repository" }}'
      tag: '{{ source "version" }}'
  repository:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/actual-budget/helm-release.yaml
      key: $.spec.values.controllers.actual-budget.containers.actual-budget.image.repository
  version:
    kind: dockerimage
    spec:
      image: '{{ source "repository" }}'
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})$
targets:
  image:
    kind: yaml
    sourceid: digest
    spec:
      engine: yamlpath
      file: apps/base/actual-budget/helm-release.yaml
      key: $.spec.values.controllers.actual-budget.containers.actual-budget.image.tag
    transformers:
      - addprefix: '{{ source "version" }}@'
