# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update docker.io/rustmailer/bichon In apps/base/bichon/helm-release.yaml $.spec.values.controllers.bichon.containers.bichon
pipelineid: update-docker-io-rustmailer-bichon-in-apps-base-bichon-helm-release-yaml-spec-values-controllers-bichon-containers-bichon
labels:
  group: containers
sources:
  current:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/bichon/helm-release.yaml
      key: $.spec.values.controllers.bichon.containers.bichon.image.tag
    transformers:
      - find: ^[^@]+
  digest:
    kind: dockerdigest
    spec:
      image: '{{ source "repository" }}'
      tag: '{{ source "version" }}'
  repository:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/bichon/helm-release.yaml
      key: $.spec.values.controllers.bichon.containers.bichon.image.repository
  version:
    kind: dockerimage
    spec:
      image: '{{ source "repository" }}'
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})$
targets:
  image:
    kind: yaml
    sourceid: digest
    spec:
      engine: yamlpath
      file: apps/base/bichon/helm-release.yaml
      key: $.spec.values.controllers.bichon.containers.bichon.image.tag
    transformers:
      - addprefix: '{{ source "version" }}@'
