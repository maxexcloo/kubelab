# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update VictoriaLogs Grafana Plugin
pipelineid: update-victorialogs-grafana-plugin
labels:
  group: packages
sources:
  version:
    kind: githubrelease
    spec:
      owner: VictoriaMetrics
      repository: victorialogs-datasource
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
    transformers:
      - trimprefix: v
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: platform/observability/victoria-metrics/helm-release.yaml
      matchpattern: (victoriametrics-logs-datasource@)[0-9.]+
      replacepattern: ${1}{{ source "version" }}
