# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Standard Dependencies
pipelineid: update-standard-dependencies
autodiscovery:
  crawlers:
    flux:
      digest: false
    kubernetes:
      ignore:
        # Backup client images are derived from their owning database Cluster.
        - path: platform/backups/postgres/cronjob.yaml
    precommit:
      digest: false
labels:
  group: standard
