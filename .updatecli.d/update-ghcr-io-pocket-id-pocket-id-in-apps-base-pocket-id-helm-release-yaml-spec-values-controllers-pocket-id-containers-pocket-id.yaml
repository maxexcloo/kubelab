# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update ghcr.io/pocket-id/pocket-id In apps/base/pocket-id/helm-release.yaml $.spec.values.controllers.pocket-id.containers.pocket-id
pipelineid: update-ghcr-io-pocket-id-pocket-id-in-apps-base-pocket-id-helm-release-yaml-spec-values-controllers-pocket-id-containers-pocket-id
labels:
  group: containers
sources:
  current:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/pocket-id/helm-release.yaml
      key: $.spec.values.controllers.pocket-id.containers.pocket-id.image.tag
    transformers:
      - find: ^[^@]+
  digest:
    kind: dockerdigest
    spec:
      image: '{{ source "repository" }}'
      tag: '{{ source "version" }}'
  repository:
    kind: yaml
    spec:
      engine: yamlpath
      file: apps/base/pocket-id/helm-release.yaml
      key: $.spec.values.controllers.pocket-id.containers.pocket-id.image.repository
  version:
    kind: dockerimage
    spec:
      image: '{{ source "repository" }}'
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})$
targets:
  image:
    kind: yaml
    sourceid: digest
    spec:
      engine: yamlpath
      file: apps/base/pocket-id/helm-release.yaml
      key: $.spec.values.controllers.pocket-id.containers.pocket-id.image.tag
    transformers:
      - addprefix: '{{ source "version" }}@'
