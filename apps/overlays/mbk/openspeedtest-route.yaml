apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openspeedtest
  namespace: openspeedtest
  annotations:
    gethomepage.dev/description: Network Speed Test
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/href: https://speed.mbk.excloo.dev
    gethomepage.dev/icon: openspeedtest
    gethomepage.dev/name: OpenSpeedTest
    gethomepage.dev/siteMonitor: https://speed.mbk.excloo.dev
  labels:
    app.kubernetes.io/name: openspeedtest
spec:
  hostnames:
    - speed.mbk.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: openspeedtest
          port: 80
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: openspeedtest-buffering
