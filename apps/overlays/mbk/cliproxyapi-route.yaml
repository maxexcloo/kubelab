apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
  annotations:
    gethomepage.dev/description: AI Provider Proxy
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/href: https://cliproxy.excloo.com
    gethomepage.dev/icon: mdi-api
    gethomepage.dev/name: CLIProxyAPI
  labels:
    app.kubernetes.io/name: cliproxyapi
spec:
  hostnames:
    - cliproxy.excloo.com
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: cliproxyapi
          port: 8317
