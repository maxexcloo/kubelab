apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: windmill
  namespace: windmill
  labels:
    app.kubernetes.io/name: windmill
spec:
  hostnames:
    - windmill.mbk.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ws/
        - path:
            type: PathPrefix
            value: /ws_debug/
      backendRefs:
        - name: windmill-extra
          port: 3000
    - backendRefs:
        - name: windmill-app
          port: 8000
