apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shelfmark
  namespace: shelfmark
  annotations:
    gethomepage.dev/description: E-book Search
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/href: https://shelf.excloo.com
    gethomepage.dev/icon: mdi-book-search
    gethomepage.dev/name: Shelfmark
  labels:
    app.kubernetes.io/name: shelfmark
spec:
  hostnames:
    - shelf.excloo.com
  parentRefs:
    - name: public-tunnel
      namespace: networking
  rules:
    - backendRefs:
        - name: shelfmark
          port: 3000
