apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit
  namespace: bookorbit
  annotations:
    gethomepage.dev/description: E-book Library
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/href: https://books.excloo.com
    gethomepage.dev/icon: mdi-bookshelf
    gethomepage.dev/name: BookOrbit
  labels:
    app.kubernetes.io/name: bookorbit
spec:
  hostnames:
    - books.excloo.com
  parentRefs:
    - name: public-tunnel
      namespace: networking
  rules:
    - backendRefs:
        - name: bookorbit
          port: 3000
