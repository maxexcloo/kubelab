apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: byparr
  namespace: byparr
  labels:
    app.kubernetes.io/name: byparr
spec:
  hostnames:
    - byparr.mbk.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: byparr
          port: 8191
