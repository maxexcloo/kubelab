apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minilab
  namespace: flux-system
spec:
  postBuild:
    substitute:
      MINILAB_DOMAIN: mini.${public_domain}
      REDLIB_CHECK_URL: http://redlib.redlib.svc.cluster.local:8080
      REDLIB_URL: https://app.invalid
  # Mini apps run on external nodes, like external-placement.yaml; Flux patches
  # are strings, so Kustomize cannot share that file here.
  patches:
    - patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: _
        spec:
          values:
            defaultPodOptions:
              nodeSelector:
                node.excloo.dev/network: external
      target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
