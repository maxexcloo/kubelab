apiVersion: batch/v1
kind: CronJob
metadata:
  name: state-backup
spec:
  schedule: 30 3 * * *
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsUser: 1000
          tolerations:
            - key: node.excloo.dev/dedicated
              operator: Equal
              value: gpu
              effect: NoSchedule
