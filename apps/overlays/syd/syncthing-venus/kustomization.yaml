apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: syncthing-venus
components:
  - ../../../base/syncthing
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: storage.yaml
transformers:
  - ../../../base/syncthing/instance
  - ../../../transformers/cluster-scoped
