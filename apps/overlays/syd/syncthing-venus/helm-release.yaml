apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          oauth2-proxy:
            env:
              OAUTH2_PROXY_REDIRECT_URL: https://syncthing-venus.${cluster_name}.excloo.dev/oauth2/callback
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
      nodeSelector:
        kubernetes.io/hostname: venus
      tolerations:
        - key: node.excloo.dev/dedicated
          operator: Equal
          value: gpu
          effect: NoSchedule
    persistence:
      models:
        hostPath: ${dataset_root}/ai/models
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /models
    route:
      private:
        annotations:
          gethomepage.dev/href: https://syncthing-venus.${cluster_name}.excloo.dev
          gethomepage.dev/name: Syncthing (Venus)
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_SYNCTHING_VENUS_API_KEY}}" }}'
          gethomepage.dev/widget.url: https://syncthing-venus.${cluster_name}.excloo.dev
          onepassword.excloo.dev/item: Syncthing (Venus)
        hostnames:
          - syncthing-venus.${cluster_name}.excloo.dev
