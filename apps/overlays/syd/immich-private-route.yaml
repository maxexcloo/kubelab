apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-private
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    gateway.excloo.dev/internal-alias: "true"
spec:
  hostnames:
    - app.invalid
    - immich.cluster.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
