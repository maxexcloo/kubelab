apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-release.yaml
  - public-route.yaml
components:
  - ../../../base/openspeedtest/instance
patches:
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: openspeedtest-hsp
        namespace: openspeedtest
        annotations:
          gethomepage.dev/name: OpenSpeedTest (syd/hsp)
replacements:
  - source:
      kind: HTTPRoute
      name: openspeedtest-hsp-public
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: openspeedtest-hsp-public
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
