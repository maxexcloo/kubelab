apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-release.yaml
  - public-route.yaml
  - route.yaml
components:
  - ../../../base/openspeedtest/chart
replacements:
  - source:
      kind: HTTPRoute
      name: openspeedtest-hsp
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: openspeedtest-hsp
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: openspeedtest-hsp-public
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: openspeedtest-hsp-public
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
