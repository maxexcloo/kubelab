apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openspeedtest-hsp-public
  namespace: openspeedtest
  annotations:
    # Bypass Cloudflare so tests measure the internet path to HSP itself.
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    # Homepage omits this route; the group places its Gatus check beside the private one.
    gethomepage.dev/group: Operations
    monitoring.excloo.dev/enabled: "true"
    monitoring.excloo.dev/name: OpenSpeedTest Public (syd/hsp)
  labels:
    app.kubernetes.io/name: openspeedtest-hsp
    gateway.excloo.dev/public-access: "true"
spec:
  hostnames:
    - openspeedtest-hsp.excloo.com
  parentRefs:
    - name: public-direct
      namespace: networking
  rules:
    - backendRefs:
        - name: openspeedtest-hsp
          port: 80
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: openspeedtest-buffering
