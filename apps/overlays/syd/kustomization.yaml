apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/actual-budget
  - ../../base/actual-up
  - ../../base/aiometadata
  - ../../base/aiostreams
  - ../../base/atvloadly
  - ../../base/beszel
  - ../../base/beszel-agent
  - ../../base/bichon
  - ../../base/bookorbit
  - ../../base/cliproxyapi
  - ../../base/homepage
  - ../../base/immich
  - ../../base/larapaper
  - ../../base/librechat
  - ../../base/librechat-admin
  - ../../base/linkwarden
  - ../../base/litellm
  - ../../base/mini-apps
  - ../../base/miniflux
  - ../../base/openspeedtest
  - ../../base/papra
  - ../../base/pocket-id
  - ../../base/redlib
  - ../../base/romm
  - ../../base/shelfmark
  - ../../base/sidestore-vpn
  - ../../base/signtools
  - ../../base/syncthing
  - openspeedtest-hsp
  - openspeedtest-kimbap
  - redlib-multi-backup
  - homepage-private-dns.yaml
  - immich-private-route.yaml
patches:
  - path: external-placement.yaml
    target:
      kind: HelmRelease
      name: (aiometadata|aiostreams|cliproxyapi|redlib)
  - path: external-ingress.yaml
    target:
      kind: HelmRelease
      name: (aiometadata|aiostreams|redlib)
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: _
        annotations:
          kustomize.toolkit.fluxcd.io/substitute: disabled
    target:
      kind: ConfigMap
  - path: actual-budget.yaml
  - path: atvloadly.yaml
  - path: beszel-agent.yaml
  - path: homepage.yaml
  - path: mini-apps.yaml
  - path: syncthing.yaml
# Reapply hostname consumers after cluster settings resolve the private alias.
transformers:
  - ../../base/homepage/routing
replacements:
  - source:
      kind: HTTPRoute
      name: openspeedtest-hsp
      namespace: openspeedtest
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: openspeedtest-hsp
          namespace: openspeedtest
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: openspeedtest-kimbap
      namespace: openspeedtest
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: openspeedtest-kimbap
          namespace: openspeedtest
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
  - source:
      kind: HelmRelease
      name: redlib
      namespace: redlib
      fieldPath: spec.values.route.public.hostnames.0
    targets:
      - select:
          kind: Kustomization
          name: mini-apps
          namespace: flux-system
        fieldPaths:
          - spec.postBuild.substitute.REDLIB_URL
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: immich
      namespace: immich
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: immich-private
        fieldPaths:
          - spec.hostnames.0
  # The cluster's Syncthing item is named for its host.
  - source:
      kind: HelmRelease
      name: syncthing
      namespace: syncthing
      fieldPath: spec.values.route.private.annotations.[onepassword.excloo.dev/item]
    targets:
      - select:
          kind: ExternalSecret
          name: syncthing
          namespace: syncthing
        fieldPaths:
          - spec.data.*.remoteRef.key
components:
  - ../../../clusters/syd/settings
