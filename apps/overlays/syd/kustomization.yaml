apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/actual-budget
  - ../../base/actual-budget-mcp
  - ../../base/actual-up
  - ../../base/aiometadata
  - ../../base/aiostreams
  - ../../base/atvloadly
  - ../../base/beszel
  - ../../base/beszel-agent
  - ../../base/bichon
  - ../../base/bifrost
  - ../../base/bookorbit
  - ../../base/cliproxyapi
  - ../../base/comfyui
  - ../../base/comfyui-video
  - ../../base/studio
  - ../../base/homepage
  - ../../base/home-assistant
  - ../../base/home-assistant-mcp
  - ../../base/immich
  - ../../base/larapaper
  - ../../base/librechat
  - ../../base/librechat-admin
  - ../../base/linkwarden
  - ../../base/minilab
  - ../../base/miniflux
  - ../../base/openspeedtest
  - ../../base/papra
  - ../../base/pocket-id
  - ../../base/reactive-resume
  - ../../base/redlib
  - ../../base/romm
  - ../../base/shelfmark
  - ../../base/sidestore-vpn
  - ../../base/signtools
  - ../../base/syncthing
  - ../../base/text
  - ../../base/unifi-network-mcp
  - ../../../platform/identity/cloudflare-access
  - ../../../platform/identity/headlamp/integrations
  - ../../../platform/observability/grafana/integrations
  - openspeedtest-hsp
  - openspeedtest-kimbap
  - immich-private-route.yaml
patches:
  # Retry installs that outwait new credentials; failed upgrades are not rolled
  # back over migrated data.
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        install:
          remediation:
            retries: 3
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
  - path: external-placement.yaml
    target:
      kind: HelmRelease
      name: (aiometadata|aiostreams|cliproxyapi|homepage|redlib)
  - path: external-ingress.yaml
    target:
      kind: HelmRelease
      name: (aiometadata|aiostreams|redlib)
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: _
        annotations:
          kustomize.toolkit.fluxcd.io/substitute: disabled
    target:
      kind: ConfigMap
  - path: actual-budget.yaml
  - path: beszel-agent.yaml
  - path: minilab.yaml
  - path: syncthing.yaml
replacements:
  - source:
      kind: HelmRelease
      name: redlib
      namespace: redlib
      fieldPath: spec.values.route.public.hostnames.0
    targets:
      - select:
          kind: Kustomization
          name: minilab
          namespace: flux-system
        fieldPaths:
          - spec.postBuild.substitute.REDLIB_URL
        options:
          delimiter: /
          index: 2
  - source:
      kind: HelmRelease
      name: bookorbit
      namespace: bookorbit
      fieldPath: spec.values.route.public.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: shelfmark
          namespace: shelfmark
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.CALIBRE_WEB_URL
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: librechat
      namespace: librechat
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: Deployment
          name: librechat-admin
          namespace: librechat-admin
        fieldPaths:
          - spec.template.spec.containers.[name=admin].env.[name=VITE_API_BASE_URL].value
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: librechat-admin
      namespace: librechat-admin
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: librechat
          namespace: librechat
        fieldPaths:
          - spec.values.librechat.adminPanelUrl
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: immich
      namespace: immich
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: immich-private
        fieldPaths:
          - spec.hostnames.0
  # Studio's Refine in Chat links to LibreChat's host.
  - source:
      kind: HTTPRoute
      name: librechat
      namespace: librechat
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: studio
          namespace: studio
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.CHAT_HOST
  # Studio serves result links on Bifrost's host.
  - source:
      kind: HTTPRoute
      name: bifrost
      namespace: bifrost
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: studio
          namespace: studio
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.BIFROST_HOST
  # The cluster's Syncthing item is named for its host.
  - source:
      kind: HelmRelease
      name: syncthing
      namespace: syncthing
      fieldPath: spec.values.route.private.annotations.[onepassword.excloo.dev/item]
    targets:
      - select:
          kind: ExternalSecret
          name: syncthing
          namespace: syncthing
        fieldPaths:
          - spec.data.*.remoteRef.key
