apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/actual-budget
  - ../../base/actual-budget-mcp
  - ../../base/actual-up
  - ../../base/aiometadata
  - ../../base/aiostreams
  - ../../base/atvloadly
  - ../../base/beszel
  - ../../base/beszel-agent
  - ../../base/bichon
  - ../../base/bifrost
  - ../../base/bookorbit
  - ../../base/cliproxyapi
  - ../../base/comfyui-image
  - ../../base/comfyui-video
  - ../../base/home-assistant
  - ../../base/home-assistant-mcp
  - ../../base/homepage
  - ../../base/immich
  - ../../base/immich-mcp
  - ../../base/karakeep
  - ../../base/karakeep-mcp
  - ../../base/kubernetes-mcp
  - ../../base/larapaper
  - ../../base/librechat
  - ../../base/librechat-admin
  - ../../base/miniflux
  - ../../base/minilab
  - ../../base/openspeedtest
  - ../../base/papra
  - ../../base/pocket-id
  - ../../base/reactive-resume
  - ../../base/redlib
  - ../../base/romm
  - ../../base/shelfmark
  - ../../base/sidestore-vpn
  - ../../base/signtools
  - ../../base/studio
  - ../../base/text
  - ../../base/trcc
  - ../../base/unifi-network-mcp
  - ../../../platform/identity/cloudflare-access
  - ../../../platform/identity/headlamp/integrations
  - ../../../platform/observability/grafana/integrations
  - openspeedtest-saturn
  - openspeedtest-neptune
  - syncthing-saturn
  - syncthing-venus
patches:
  # Retry installs that outwait new credentials; failed upgrades are not rolled
  # back over migrated data.
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        install:
          remediation:
            retries: 3
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
  - path: external-placement.yaml
    target:
      kind: HelmRelease
      name: (aiometadata|aiostreams|cliproxyapi|homepage|redlib)
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: _
        annotations:
          kustomize.toolkit.fluxcd.io/substitute: disabled
    target:
      kind: ConfigMap
  - path: beszel-agent.yaml
  - path: minilab.yaml
replacements:
  - source:
      kind: HelmRelease
      name: redlib
      namespace: redlib
      fieldPath: spec.values.route.public.hostnames.0
    targets:
      - select:
          kind: Kustomization
          name: minilab
          namespace: flux-system
        fieldPaths:
          - spec.postBuild.substitute.REDLIB_URL
        options:
          delimiter: /
          index: 2
  - source:
      kind: HelmRelease
      name: bookorbit
      namespace: bookorbit
      fieldPath: spec.values.route.public.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: shelfmark
          namespace: shelfmark
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.CALIBRE_WEB_URL
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: librechat
      namespace: librechat
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: librechat-admin
          namespace: librechat-admin
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.VITE_API_BASE_URL
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: librechat-admin
      namespace: librechat-admin
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: librechat
          namespace: librechat
        fieldPaths:
          - spec.values.librechat.adminPanelUrl
        options:
          delimiter: /
          index: 2
