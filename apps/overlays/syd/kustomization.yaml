apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/actual-budget
  - ../../base/actual-budget-mcp
  - ../../base/actual-up
  - ../../base/aiometadata
  - ../../base/aiostreams
  - ../../base/atvloadly
  - ../../base/beszel
  - ../../base/beszel-agent
  - ../../base/bichon
  - ../../base/bookorbit
  - ../../base/cliproxyapi
  - ../../base/studio
  - ../../base/homepage
  - ../../base/home-assistant
  - ../../base/home-assistant-mcp
  - ../../base/immich
  - ../../base/larapaper
  - ../../base/librechat
  - ../../base/librechat-admin
  - ../../base/linkwarden
  - ../../base/litellm
  - ../../base/minilab
  - ../../base/miniflux
  - ../../base/openspeedtest
  - ../../base/papra
  - ../../base/pocket-id
  - ../../base/reactive-resume
  - ../../base/redlib
  - ../../base/romm
  - ../../base/shelfmark
  - ../../base/sidestore-vpn
  - ../../base/signtools
  - ../../base/syncthing
  - ../../base/unifi-network-mcp
  - openspeedtest-hsp
  - openspeedtest-kimbap
  - redlib-multi-backup
  - homepage-private-dns.yaml
  - immich-private-route.yaml
patches:
  # Retry installs that outwait new credentials; failed upgrades are not rolled
  # back over migrated data.
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        install:
          remediation:
            retries: 3
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
  - path: external-placement.yaml
    target:
      kind: HelmRelease
      name: (aiometadata|aiostreams|cliproxyapi|redlib)
  - path: external-ingress.yaml
    target:
      kind: HelmRelease
      name: (aiometadata|aiostreams|redlib)
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: _
        annotations:
          kustomize.toolkit.fluxcd.io/substitute: disabled
    target:
      kind: ConfigMap
  - path: actual-budget.yaml
  - path: atvloadly.yaml
  - path: beszel-agent.yaml
  - path: homepage.yaml
  - path: minilab.yaml
  - path: syncthing.yaml
# Reapply hostname consumers after cluster settings resolve the private alias.
transformers:
  - ../../base/actual-up/routing
  - ../../base/homepage/routing
replacements:
  - source:
      kind: HTTPRoute
      name: openspeedtest-hsp
      namespace: openspeedtest
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: openspeedtest-hsp
          namespace: openspeedtest
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: openspeedtest-kimbap
      namespace: openspeedtest
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: openspeedtest-kimbap
          namespace: openspeedtest
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
  - source:
      kind: HelmRelease
      name: redlib
      namespace: redlib
      fieldPath: spec.values.route.public.hostnames.0
    targets:
      - select:
          kind: Kustomization
          name: minilab
          namespace: flux-system
        fieldPaths:
          - spec.postBuild.substitute.REDLIB_URL
        options:
          delimiter: /
          index: 2
  - source:
      kind: HelmRelease
      name: bookorbit
      namespace: bookorbit
      fieldPath: spec.values.route.public.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: shelfmark
          namespace: shelfmark
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.CALIBRE_WEB_URL
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: librechat
      namespace: librechat
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: Deployment
          name: librechat-admin
          namespace: librechat-admin
        fieldPaths:
          - spec.template.spec.containers.[name=admin].env.[name=VITE_API_BASE_URL].value
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: librechat-admin
      namespace: librechat-admin
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: librechat
          namespace: librechat
        fieldPaths:
          - spec.values.librechat.adminPanelUrl
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: immich
      namespace: immich
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: immich-private
        fieldPaths:
          - spec.hostnames.0
  # Cluster settings resolve before this overlay's patches add these fields.
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.atvloadly_gateway_host
    targets:
      - select:
          kind: HelmRelease
          name: atvloadly
          namespace: atvloadly
        fieldPaths:
          - spec.values.controllers.main.containers.proxy.env.GATEWAY_HOST
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.pod_subnet
    targets:
      - select:
          kind: HelmRelease
          name: atvloadly
          namespace: atvloadly
        fieldPaths:
          - spec.values.controllers.main.containers.proxy.env.POD_SUBNET
  - source:
      kind: ConfigMap
      name: cluster-settings
      fieldPath: data.storage_node
    targets:
      - select:
          kind: HelmRelease
          name: syncthing
          namespace: syncthing
        fieldPaths:
          - spec.values.defaultPodOptions.nodeSelector.[kubernetes.io/hostname]
  # Studio accepts its resolved private alias and serves result links on LiteLLM's host.
  - source:
      kind: HelmRelease
      name: studio
      namespace: studio
      fieldPath: spec.values.route.private.hostnames.1
    targets:
      - select:
          kind: HelmRelease
          name: studio
          namespace: studio
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.ROUTE_ALIAS_HOST
  - source:
      kind: HTTPRoute
      name: litellm
      namespace: litellm
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: studio
          namespace: studio
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.LITELLM_HOST
  # The cluster's Syncthing item is named for its host.
  - source:
      kind: HelmRelease
      name: syncthing
      namespace: syncthing
      fieldPath: spec.values.route.private.annotations.[onepassword.excloo.dev/item]
    targets:
      - select:
          kind: ExternalSecret
          name: syncthing
          namespace: syncthing
        fieldPaths:
          - spec.data.*.remoteRef.key
components:
  - ../../../clusters/syd/settings
