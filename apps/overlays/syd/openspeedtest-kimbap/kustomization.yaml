apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-release.yaml
components:
  - ../../../base/openspeedtest/instance
patches:
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: openspeedtest-kimbap
        namespace: openspeedtest
        annotations:
          gethomepage.dev/name: OpenSpeedTest (syd/kimbap)
