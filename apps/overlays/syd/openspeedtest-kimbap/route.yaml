apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openspeedtest-kimbap
  namespace: openspeedtest
  annotations:
    gethomepage.dev/description: Network Speed Test
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Operations
    gethomepage.dev/href: https://openspeedtest-kimbap.syd.excloo.dev
    gethomepage.dev/icon: sh-openspeedtest
    gethomepage.dev/name: OpenSpeedTest (syd/kimbap)
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=openspeedtest-kimbap
    monitoring.excloo.dev/enabled: "true"
  labels:
    app.kubernetes.io/name: openspeedtest-kimbap
spec:
  hostnames:
    - openspeedtest-kimbap.syd.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: openspeedtest-kimbap
          port: 80
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: openspeedtest-buffering
