apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: atvloadly
  namespace: atvloadly
spec:
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: kimbap
    controllers:
      main:
        containers:
          proxy:
            env:
              GATEWAY_HOST: gateway.invalid
              POD_SUBNET: pod-subnet.invalid
