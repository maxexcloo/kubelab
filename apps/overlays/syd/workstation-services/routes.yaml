apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent-browser-mars
spec:
  hostnames:
    - agent-browser-mars.${public_domain}
    - agent-browser-mars.${cluster_name}.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: mars
          port: 9222
---
apiVersion: gateway.networking.k8s.io/v1
