apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workstation-services
resources:
  - dns.yaml
  - endpoints.yaml
  - namespace.yaml
  - routes.yaml
  - services.yaml
replacements:
  - source:
      kind: HTTPRoute
      name: agent-browser-mars
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: PrivateDNSRecord
          name: agent-browser-mars
        fieldPaths:
          - spec.hostname
  - source:
      kind: HTTPRoute
      name: agent-browser-mercury
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: PrivateDNSRecord
          name: agent-browser-mercury
        fieldPaths:
          - spec.hostname
  - source:
      kind: HTTPRoute
      name: syncthing-mars
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: PrivateDNSRecord
          name: syncthing-mars
        fieldPaths:
          - spec.hostname
  - source:
      kind: HTTPRoute
      name: syncthing-mercury
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: PrivateDNSRecord
          name: syncthing-mercury
        fieldPaths:
          - spec.hostname
