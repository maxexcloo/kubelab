apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openspeedtest-neptune-public
  namespace: openspeedtest
  annotations:
    # Bypass Cloudflare so tests measure the internet path to Neptune itself.
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    gethomepage.dev/description: Network Speed Test
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Operations
    gethomepage.dev/href: https://app.invalid
    gethomepage.dev/icon: sh-openspeedtest
    gethomepage.dev/name: OpenSpeedTest (Neptune) (External)
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=openspeedtest-neptune
    monitoring.excloo.dev/enabled: "true"
  labels:
    app.kubernetes.io/name: openspeedtest-neptune
    gateway.excloo.dev/public-access: "true"
spec:
  hostnames:
    - openspeedtest-neptune.excloo.com
  parentRefs:
    - name: public-direct
      namespace: networking
  rules:
    - backendRefs:
        - name: openspeedtest-neptune
          port: 80
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: openspeedtest-buffering
