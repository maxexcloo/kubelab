apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-release.yaml
  - route.yaml
components:
  - ../../../base/openspeedtest/chart
patches:
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: openspeedtest-internal
      spec:
        values:
          nodeSelector:
            node.excloo.dev/network: internal
    target:
      kind: HelmRelease
