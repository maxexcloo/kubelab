apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          oauth2-proxy:
            env:
              OAUTH2_PROXY_REDIRECT_URL: https://syncthing-saturn.${cluster_name}.excloo.dev/oauth2/callback
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: saturn
    persistence:
      ai:
        hostPath: ${dataset_root}/truenas/ai
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/ai
      backups:
        hostPath: ${dataset_root}/truenas/backups
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/backups
      documents:
        hostPath: ${dataset_root}/truenas/documents
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/documents
      games:
        hostPath: ${dataset_root}/truenas/games
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/games
      projects:
        hostPath: ${dataset_root}/truenas/projects
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/projects
      scratch:
        hostPath: ${dataset_root}/truenas/scratch
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/scratch
    route:
      private:
        annotations:
          gethomepage.dev/href: https://syncthing-saturn.${cluster_name}.excloo.dev
          gethomepage.dev/name: Syncthing (Saturn)
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_SYNCTHING_SATURN_API_KEY}}" }}'
          gethomepage.dev/widget.url: https://syncthing-saturn.${cluster_name}.excloo.dev
          onepassword.excloo.dev/item: Syncthing (Saturn)
        hostnames:
          - syncthing-saturn.${cluster_name}.excloo.dev
