apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: saturn
    persistence:
      ai:
        hostPath: ${dataset_root}/truenas/ai
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/ai
      backups:
        hostPath: ${dataset_root}/truenas/backups
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/backups
      documents:
        hostPath: ${dataset_root}/truenas/documents
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/documents
      games:
        hostPath: ${dataset_root}/truenas/games
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/games
      projects:
        hostPath: ${dataset_root}/truenas/projects
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/projects
      public:
        hostPath: ${dataset_root}/truenas/public
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/public
    route:
      private:
        annotations:
          gethomepage.dev/name: Syncthing (Saturn)
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_SYNCTHING_SATURN_API_KEY}}" }}'
          onepassword.excloo.dev/item: Syncthing (Saturn)
        hostnames:
          - syncthing-saturn.${cluster_name}.excloo.dev
