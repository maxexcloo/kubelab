apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: syncthing
spec:
  values:
    defaultPodOptions:
      # Synced folders are mounted from kimbap's TrueNAS datasets.
      nodeSelector:
        kubernetes.io/hostname: storage-node.invalid
    route:
      private:
        annotations:
          gethomepage.dev/name: Syncthing
          # The item names the synced host; the card's location tag already shows it.
          onepassword.excloo.dev/item: Syncthing (mbk-kimbap)
