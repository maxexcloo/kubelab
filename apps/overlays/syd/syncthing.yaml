apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: syncthing
spec:
  values:
    defaultPodOptions:
      # Synced folders are mounted from kimbap's TrueNAS datasets.
      nodeSelector:
        kubernetes.io/hostname: kimbap
    route:
      private:
        annotations:
          gethomepage.dev/name: &title Syncthing (Kimbap)
          onepassword.excloo.dev/item: *title
