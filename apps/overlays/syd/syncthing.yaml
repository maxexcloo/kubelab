apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: syncthing
spec:
  values:
    defaultPodOptions:
      # Synced folders are mounted from the storage node's TrueNAS datasets.
      nodeSelector:
        kubernetes.io/hostname: ${storage_node}
    route:
      private:
        annotations:
          # The item names the synced host; the card's location tag already shows it.
          onepassword.excloo.dev/item: Syncthing (mbk-kimbap)
