apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: actual-budget
  namespace: actual-budget
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: actual-budget-mcp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: actual-budget-mcp
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: actual-up
          podSelector:
            matchLabels:
              app.kubernetes.io/name: actual-up
      ports:
        - port: 5006
          protocol: TCP
