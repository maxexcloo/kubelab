apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openspeedtest
  namespace: openspeedtest
  annotations:
    gethomepage.dev/description: HSP Network Speed Test
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Servers
    gethomepage.dev/href: https://app.invalid
    gethomepage.dev/icon: sh-openspeedtest
    gethomepage.dev/name: OpenSpeedTest HSP
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=openspeedtest
    monitoring.excloo.dev/enabled: "true"
  labels:
    app.kubernetes.io/name: openspeedtest
    gateway.excloo.dev/internal-alias: "true"
spec:
  hostnames:
    - speed.syd.excloo.dev
    - openspeedtest.cluster.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: openspeedtest
          port: 80
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: openspeedtest-buffering
