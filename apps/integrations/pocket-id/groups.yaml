apiVersion: http.m.crossplane.io/v1alpha2
kind: Request
metadata:
  name: pocket-id-group-all-services
  namespace: pocket-id
spec:
  managementPolicies: [Create, LateInitialize, Observe, Update]
  forProvider:
    expectedResponseCheck:
      logic: .payload.body as $wanted | ((.response.body.name == $wanted.name and .response.body.friendlyName == $wanted.friendlyName) or any(.response.body.data[]?; .name == $wanted.name and .friendlyName == $wanted.friendlyName))
      type: CUSTOM
    headers:
      Content-Type: [application/json]
      User-Agent: [kubelab-crossplane/1.0]
      X-API-Key: ["{{ pocket-id:pocket-id:static-api-key }}"]
    mappings:
      - action: CREATE
        body: .payload.body
        url: .payload.baseUrl
      - action: OBSERVE
        url: .payload.baseUrl + "?pagination%5Blimit%5D=100"
      - action: UPDATE
        body: .payload.body
        method: POST
        url: .payload.baseUrl
    payload:
      baseUrl: http://pocket-id.pocket-id.svc.cluster.local:1411/api/user-groups
      body: '{"friendlyName":"All Services","name":"all_services"}'
    secretInjectionConfigs:
      - keyMappings:
          - missingFieldStrategy: preserve
            responseJQ: if .body.id then .body.id else first(.body.data[]? | select(.name == "all_services") | .id) end
            secretKey: id
        secretRef:
          name: pocket-id-group-all-services
          namespace: pocket-id
  providerConfigRef:
    kind: ClusterProviderConfig
    name: pocket-id
---
apiVersion: http.m.crossplane.io/v1alpha2
kind: Request
metadata:
  name: pocket-id-group-all-services-details
  namespace: pocket-id
spec:
  managementPolicies: [LateInitialize, Observe, Update]
  forProvider:
    expectedResponseCheck:
      logic: .payload.body as $wanted | ((.response.body.name == $wanted.name and .response.body.friendlyName == $wanted.friendlyName) or any(.response.body.data[]?; .name == $wanted.name and .friendlyName == $wanted.friendlyName))
      type: CUSTOM
    headers:
      Content-Type: [application/json]
      User-Agent: [kubelab-crossplane/1.0]
      X-API-Key: ["{{ pocket-id:pocket-id:static-api-key }}"]
    mappings:
      - action: OBSERVE
        url: .payload.baseUrl + "?pagination%5Blimit%5D=100"
      - action: UPDATE
        body: .payload.body | del(.id)
        method: PUT
        url: .payload.baseUrl + "/" + .payload.body.id
    payload:
      baseUrl: http://pocket-id.pocket-id.svc.cluster.local:1411/api/user-groups
      body: '{"friendlyName":"All Services","id":"{{ pocket-id-group-all-services:pocket-id:id }}","name":"all_services"}'
  providerConfigRef:
    kind: ClusterProviderConfig
    name: pocket-id
