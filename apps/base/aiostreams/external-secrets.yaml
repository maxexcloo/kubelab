apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/defaults: '{"username":"max@excloo.com"}'
    onepassword.excloo.dev/generate-fields: password,secret-key
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: AIOStreams
        property: oidc-client-id
      secretKey: AIOSTREAMS_OIDC_CLIENT_ID
    - remoteRef:
        key: AIOStreams
        property: oidc-client-secret
      secretKey: AIOSTREAMS_OIDC_CLIENT_SECRET
    - remoteRef:
        key: AIOStreams
        property: password
      secretKey: PASSWORD
    - remoteRef:
        key: AIOStreams
        property: secret-key
      secretKey: SECRET_KEY
    - remoteRef:
        key: AIOStreams
        property: username
      secretKey: USERNAME
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
    template:
      data:
        AIOSTREAMS_AUTH: "{{ .USERNAME }}:{{ .PASSWORD }}"
        AIOSTREAMS_OIDC_CLIENT_ID: "{{ .AIOSTREAMS_OIDC_CLIENT_ID }}"
        AIOSTREAMS_OIDC_CLIENT_SECRET: "{{ .AIOSTREAMS_OIDC_CLIENT_SECRET }}"
        SECRET_KEY: "{{ .SECRET_KEY }}"
