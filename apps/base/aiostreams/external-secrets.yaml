apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiostreams
  annotations:
    onepassword.excloo.dev/generate-fields: password,secret-key
    onepassword.excloo.dev/owner-email-fields: username
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item AIOStreams
        property: oidc-client-id
      secretKey: AIOSTREAMS_OIDC_CLIENT_ID
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: AIOSTREAMS_OIDC_CLIENT_SECRET
    - remoteRef:
        key: *item
        property: password
      secretKey: PASSWORD
    - remoteRef:
        key: *item
        property: provider-publicmetadb-api-key
      secretKey: JELLYFIN_SEGMENTS_PMDB_API_KEY
    - remoteRef:
        key: *item
        property: provider-tmdb-access-token
      secretKey: TMDB_ACCESS_TOKEN
    - remoteRef:
        key: *item
        property: provider-tmdb-api-key
      secretKey: TMDB_API_KEY
    - remoteRef:
        key: *item
        property: provider-trakt-client-id
      secretKey: TRAKT_CLIENT_ID
    - remoteRef:
        key: *item
        property: provider-tvdb-api-key
      secretKey: TVDB_API_KEY
    - remoteRef:
        key: *item
        property: secret-key
      secretKey: SECRET_KEY
    - remoteRef:
        key: *item
        property: username
      secretKey: USERNAME
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: aiostreams
    template:
      data:
        AIOSTREAMS_AUTH: "{{ .USERNAME }}:{{ .PASSWORD }}"
        AIOSTREAMS_OIDC_CLIENT_ID: "{{ .AIOSTREAMS_OIDC_CLIENT_ID }}"
        AIOSTREAMS_OIDC_CLIENT_SECRET: "{{ .AIOSTREAMS_OIDC_CLIENT_SECRET }}"
        JELLYFIN_SEGMENTS_PMDB_API_KEY: "{{ .JELLYFIN_SEGMENTS_PMDB_API_KEY }}"
        SECRET_KEY: "{{ .SECRET_KEY }}"
        TMDB_ACCESS_TOKEN: "{{ .TMDB_ACCESS_TOKEN }}"
        TMDB_API_KEY: "{{ .TMDB_API_KEY }}"
        TRAKT_CLIENT_ID: "{{ .TRAKT_CLIENT_ID }}"
        TVDB_API_KEY: "{{ .TVDB_API_KEY }}"
