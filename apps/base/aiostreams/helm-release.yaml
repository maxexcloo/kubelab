apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aiostreams
  namespace: aiostreams
spec:
  interval: 30m
  releaseName: aiostreams
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  values:
    controllers:
      aiostreams:
        strategy: Recreate
        containers:
          aiostreams:
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/viren070/aiostreams
              tag: v2.36.0@sha256:83893d1c37eaaaf9ad1e9286bd857220a6b8f042a4f1eac3fa7356017aa2b184
            envFrom:
              - secretRef:
                  name: aiostreams
            probes:
              liveness:
                enabled: true
                path: /api/v1/health
                port: 30375
                type: HTTP
              readiness:
                enabled: true
                path: /api/v1/health
                port: 30375
                type: HTTP
              startup:
                enabled: true
                path: /api/v1/health
                port: 30375
                type: HTTP
                spec:
                  failureThreshold: 24
                  periodSeconds: 5
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsGroup: 568
              runAsNonRoot: true
              runAsUser: 568
              capabilities:
                drop:
                  - ALL
            env:
              AIOSTREAMS_OIDC_ISSUER: https://identity.invalid
              BASE_URL: https://app.invalid
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: aiostreams
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /app/data
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        annotations:
          gethomepage.dev/href: https://app.invalid
        labels:
          app.kubernetes.io/name: aiostreams
        parentRefs:
          - name: private
            namespace: networking
    service:
      aiostreams:
        controller: aiostreams
        ports:
          http:
            port: 30375
            protocol: HTTP
