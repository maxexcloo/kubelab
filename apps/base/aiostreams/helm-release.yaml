apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              AIOSTREAMS_AUTH_REQUIRED: "true"
              AIOSTREAMS_OIDC_ALLOW_LOCAL_LOGIN: "true"
              AIOSTREAMS_OIDC_AUTO_REDIRECT: "false"
              AIOSTREAMS_OIDC_ENABLED: "true"
              AIOSTREAMS_OIDC_GROUP_PERMISSIONS: all_services=admin
              AIOSTREAMS_OIDC_ISSUER: https://identity.invalid
              AIOSTREAMS_OIDC_SCOPES: openid profile email groups
              BASE_URL: https://app.invalid
              DATABASE_URI: sqlite://./data/db.sqlite
              FEATURED_TEMPLATE_IDS: tamtaro.complete,Vidhin05.english-template
              PORT: "30375"
              SEL_SYNC_ACCESS: all
              TEMPLATE_REFRESH_INTERVAL: "0"
              TEMPLATE_URLS: '["https://raw.githubusercontent.com/Tam-Taro/SEL-Filtering-and-Sorting/5953c6bc6035ff3e21c49da62697cf0ce022eb5e/Tamtaro-All-Templates-for-AIOStreams.json", "https://raw.githubusercontent.com/Vidhin05/Releases-Regex/b75a607fbb96fee63a44c30f403d1e6399d9c8fe/all-templates.json"]'
              WHITELISTED_SYNC_REFRESH_INTERVAL: "3600"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/viren070/aiostreams
              tag: v2.36.0@sha256:83893d1c37eaaaf9ad1e9286bd857220a6b8f042a4f1eac3fa7356017aa2b184
            probes:
              liveness: &health
                path: /api/v1/health
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 256Mi
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /app/data
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
      public:
        forceRename: "{{ .Release.Name }}"
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: Stremio Aggregator
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-aiostreams
          gethomepage.dev/name: AIOStreams
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /api/v1/health
          onepassword.excloo.dev/item: AIOStreams
        hostnames:
          - aiostreams.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 30375
