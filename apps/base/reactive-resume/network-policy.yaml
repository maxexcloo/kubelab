apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application
  labels:
    app.kubernetes.io/name: application
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/controller: reactive-resume
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reactive-resume-database
  labels:
    app.kubernetes.io/name: application
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/controller: reactive-resume
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
  podSelector:
    matchLabels:
      cnpg.io/cluster: reactive-resume-database
  policyTypes:
    - Ingress
