apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reactive-resume
spec:
  ingress:
    - from:
        # Bifrost's MCP gateway serves the app's /mcp endpoint.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bifrost
        # LibreChat connects each user with their own API key.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: librechat
          podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/controller: reactive-resume
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reactive-resume-database
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/controller: reactive-resume
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
  podSelector:
    matchLabels:
      cnpg.io/cluster: reactive-resume-database
  policyTypes:
    - Ingress
