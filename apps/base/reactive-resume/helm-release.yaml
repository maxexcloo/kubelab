apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              APP_URL: https://app.invalid
              OAUTH_DISCOVERY_URL: https://identity.invalid/.well-known/openid-configuration
              OAUTH_PROVIDER_NAME: Pocket ID
              REDIS_URL: redis://localhost:6379
              SMTP_FROM: reactive-resume@mail-domain.invalid
              SMTP_HOST: smtp.resend.com
              SMTP_PORT: "465"
              SMTP_SECURE: "true"
              SMTP_USER: resend
              # Keep the health storage check inside the 5-second probe timeout.
              STORAGE_HEALTHCHECK_TIMEOUT_MS: "4000"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/reactive-resume/reactive-resume
              tag: v6.0.4
            # Upstream omits liveness because restarts cannot fix database or storage outages.
            probes:
              liveness: null
              readiness: &health
                path: /api/health
              startup: *health
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 512Mi
          # Holds only resumable assistant streams, rate limits and live updates.
          valkey:
            args:
              - valkey-server
              - --appendonly
              - "no"
              - --save
              - ""
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/valkey/valkey
              tag: 9.1.2
            probes:
              liveness: &valkey-health
                enabled: true
                port: 6379
                spec:
                  timeoutSeconds: 5
              readiness: *valkey-health
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
              - path: /app/data
      valkey:
        type: emptyDir
        advancedMounts:
          main:
            valkey:
              - path: /data
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 3000
      public:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: Resume Builder
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-reactive-resume
          gethomepage.dev/name: &title Reactive Resume
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: *title
        hostnames:
          - resume.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 3000
    service:
      main:
        ports:
          http:
            port: 3000
