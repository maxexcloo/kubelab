apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              APP_URL: https://resume.excloo.com
              # Accounts come from Pocket ID; this also closes password sign-ups.
              FLAG_DISABLE_EMAIL_AUTH: "true"
              OAUTH_DISCOVERY_URL: https://${identity_host}/.well-known/openid-configuration
              OAUTH_PROVIDER_NAME: Excloo ID
              REDIS_URL: redis://localhost:6379
              SMTP_FROM: reactive-resume@${mail_domain}
              SMTP_HOST: smtp.resend.com
              SMTP_PORT: "465"
              SMTP_SECURE: "true"
              SMTP_USER: resend
              # Keep the health storage check inside the 5-second probe timeout.
              STORAGE_HEALTHCHECK_TIMEOUT_MS: "4000"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              repository: ghcr.io/reactive-resume/reactive-resume
              tag: v6.1.1
            # Upstream omits liveness because restarts cannot fix database or storage outages.
            probes:
              liveness: null
              readiness: &health
                path: /api/health
              startup: *health
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 512Mi
          # Holds only resumable assistant streams, rate limits and live updates.
          valkey:
            args:
              - valkey-server
              - --appendonly
              - "no"
              - --save
              - ""
            image:
              repository: docker.io/valkey/valkey
              tag: 9.1.3
            probes:
              liveness: &valkey-health
                enabled: true
                port: 6379
                spec:
                  timeoutSeconds: 5
              readiness: *valkey-health
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 32Mi
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
              - path: /app/data
      valkey:
        type: emptyDir
        advancedMounts:
          main:
            valkey:
              - path: /data
    route:
      private:
        hostnames:
          - resume.excloo.com
          - reactive-resume.${cluster_name}.excloo.dev
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 3000
      public:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: Resume Builder
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://resume.excloo.com
          gethomepage.dev/icon: sh-reactive-resume-light
          gethomepage.dev/name: &title Reactive Resume
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: *title
        hostnames:
          - resume.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 3000
    service:
      main:
        ports:
          http:
            port: 3000
