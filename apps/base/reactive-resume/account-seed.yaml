apiVersion: batch/v1
kind: Job
metadata:
  name: account-seed
  annotations:
    # Recreate the completed Job when its script or image changes.
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: account-seed
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: ghcr.io/reactive-resume/reactive-resume:tag.invalid
          command:
            - node
            - /scripts/seed-account.mjs
          env:
            - name: APP_URL
              value: https://app.invalid
            - name: BASE_URL
              value: http://reactive-resume:3000
          envFrom:
            - secretRef:
                name: account-seed
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      securityContext:
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: script
          configMap:
            name: account-seed
