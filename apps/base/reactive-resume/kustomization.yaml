apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reactive-resume
resources:
  - cloudflare-access.yaml
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - private-dns.yaml
  - resend.yaml
  - storage.yaml
components:
  - ../../../platform/databases/postgres-minimal
  - ../../components/application
  - ../../components/default-deny
  - ../../components/database-colocation
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
transformers:
  - ../../transformers/cluster-scoped
  - ../../transformers/pocket-id-icon-public
