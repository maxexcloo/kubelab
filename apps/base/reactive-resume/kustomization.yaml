apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reactive-resume
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - resend.yaml
  - storage.yaml
components:
  - ../../../platform/databases/postgres-minimal
  - ../../components/application
  - ../../components/database-colocation
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
  - ../../components/private-dns-control-d-only
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.public.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.APP_URL
        options:
          delimiter: /
          index: 2
transformers:
  - ../../transformers/route-public
