apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - account-seed.yaml
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - resend.yaml
  - storage.yaml
components:
  - ../../../platform/databases/postgres-minimal
  - ../../components/application
  - ../../components/database-colocation
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
  - ../../components/private-dns-control-d-only
  - ../../components/app-namespace
configMapGenerator:
  - name: account-seed
    files:
      - seed-account.mjs
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.public.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.APP_URL
          - spec.values.route.public.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
      - select:
          kind: Job
          name: account-seed
        fieldPaths:
          - spec.template.spec.containers.[name=seed].env.[name=APP_URL].value
        options:
          delimiter: /
          index: 2
  - source:
      kind: HelmRelease
      fieldPath: spec.values.controllers.main.containers.main.image.tag
    targets:
      - select:
          kind: Job
          name: account-seed
        fieldPaths:
          - spec.template.spec.containers.[name=seed].image
        options:
          delimiter: ":"
          index: 1
transformers:
  - ../../transformers/route-public
