apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"reactive-resume"}'
    onepassword.excloo.dev/defaults: '{"provider-openrouter-api-key":""}'
    onepassword.excloo.dev/generate-fields: auth-secret,database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Reactive Resume
        property: auth-secret
      secretKey: AUTH_SECRET
    - remoteRef:
        key: *item
        property: database-password
      secretKey: database-password
    - remoteRef:
        key: *item
        property: database-username
      secretKey: database-username
    - remoteRef:
        key: *item
        property: oidc-client-id
      secretKey: OAUTH_CLIENT_ID
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: OAUTH_CLIENT_SECRET
    - remoteRef:
        key: *item
        property: provider-openrouter-api-key
      secretKey: AI_API_KEY
    - remoteRef:
        key: *item
        property: provider-resend-api-key
      secretKey: SMTP_PASS
    # LiteLLM owns the shared search credentials.
    - remoteRef:
        key: LiteLLM
        property: provider-tavily-api-key
      secretKey: WEB_ACCESS_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: application
    template:
      engineVersion: v2
      data:
        # Server AI and web access refuse to start unless each provider has its key.
        AI_API_KEY: "{{ .AI_API_KEY }}"
        AI_MODEL: "{{ if .AI_API_KEY }}openrouter/auto{{ end }}"
        AI_PROVIDER: "{{ if .AI_API_KEY }}openrouter{{ end }}"
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        DATABASE_URL: postgresql://{{ index . "database-username" | urlquery }}:{{ index . "database-password" | urlquery }}@reactive-resume-database-rw:5432/reactive-resume?sslmode=require&uselibpqcompat=true
        OAUTH_CLIENT_ID: "{{ .OAUTH_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
        SMTP_PASS: "{{ .SMTP_PASS }}"
        WEB_ACCESS_API_KEY: "{{ .WEB_ACCESS_API_KEY }}"
        WEB_ACCESS_PROVIDER: "{{ if .WEB_ACCESS_API_KEY }}tavily{{ end }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: account-seed
  annotations:
    onepassword.excloo.dev/generate-fields: password
    onepassword.excloo.dev/owner-email-fields: username
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Reactive Resume
        property: password
      secretKey: PASSWORD
    - remoteRef:
        key: *item
        property: username
      secretKey: EMAIL
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: account-seed
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactive-resume-database
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"reactive-resume"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Reactive Resume
        property: database-password
      secretKey: password
    - remoteRef:
        key: *item
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: reactive-resume-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
