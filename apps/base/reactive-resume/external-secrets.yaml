apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactive-resume
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"reactive-resume"}'
    onepassword.excloo.dev/generate-fields: auth-secret,database-password,password
    onepassword.excloo.dev/owner-email-fields: username
spec:
  data:
    - remoteRef:
        key: &item Reactive Resume
        property: auth-secret
      secretKey: AUTH_SECRET
    - remoteRef:
        key: *item
        property: database-password
      secretKey: database-password
    - remoteRef:
        key: *item
        property: database-username
      secretKey: database-username
    - remoteRef:
        key: *item
        property: oidc-client-id
      secretKey: OAUTH_CLIENT_ID
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: OAUTH_CLIENT_SECRET
    - remoteRef:
        key: *item
        property: provider-resend-api-key
      secretKey: SMTP_PASS
    # Bifrost issues the AI key and owns the shared search credentials.
    - remoteRef:
        key: &bifrost Bifrost
        property: virtual-key-reactive-resume
      secretKey: AI_API_KEY
    - remoteRef:
        key: *bifrost
        property: provider-tavily-api-key
      secretKey: WEB_ACCESS_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: reactive-resume
    template:
      data:
        AI_API_KEY: "{{ .AI_API_KEY }}"
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        DATABASE_URL: postgresql://{{ index . "database-username" | urlquery }}:{{ index . "database-password" | urlquery }}@reactive-resume-database-rw:5432/reactive-resume?sslmode=require&uselibpqcompat=true
        OAUTH_CLIENT_ID: "{{ .OAUTH_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
        SMTP_PASS: "{{ .SMTP_PASS }}"
        # Web access refuses to start unless its provider has its key.
        WEB_ACCESS_API_KEY: "{{ .WEB_ACCESS_API_KEY }}"
        WEB_ACCESS_PROVIDER: "{{ if .WEB_ACCESS_API_KEY }}tavily{{ end }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactive-resume-database
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"reactive-resume"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  data:
    - remoteRef:
        key: &item Reactive Resume
        property: database-password
      secretKey: password
    - remoteRef:
        key: *item
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: reactive-resume-database
    template:
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
