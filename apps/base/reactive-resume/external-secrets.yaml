apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"reactive-resume"}'
    onepassword.excloo.dev/generate-fields: auth-secret,database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Reactive Resume
        property: auth-secret
      secretKey: AUTH_SECRET
    - remoteRef:
        key: *item
        property: database-password
      secretKey: database-password
    - remoteRef:
        key: *item
        property: database-username
      secretKey: database-username
    - remoteRef:
        key: *item
        property: oidc-client-id
      secretKey: OAUTH_CLIENT_ID
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: OAUTH_CLIENT_SECRET
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: application
    template:
      engineVersion: v2
      data:
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        DATABASE_URL: postgresql://{{ index . "database-username" | urlquery }}:{{ index . "database-password" | urlquery }}@reactive-resume-database-rw:5432/reactive-resume?sslmode=require
        OAUTH_CLIENT_ID: "{{ .OAUTH_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reactive-resume-database
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"reactive-resume"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Reactive Resume
        property: database-password
      secretKey: password
    - remoteRef:
        key: *item
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: reactive-resume-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
