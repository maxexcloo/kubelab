apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../components/app-namespace
configurations:
  - kustomizeconfig.yaml
configMapGenerator:
  - name: actual-up-config
    files:
      - config.yaml
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.ACTUAL_UP_PUBLIC_URL
          - spec.values.route.private.annotations.[gethomepage.dev/href]
          - spec.values.route.private.annotations.[gethomepage.dev/siteMonitor]
        options:
          delimiter: /
          index: 2
