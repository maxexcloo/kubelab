apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
  - ../../components/app-namespace
configurations:
  - kustomizeconfig.yaml
configMapGenerator:
  - name: actual-up-config
    files:
      - config.yaml
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
transformers:
  - routing
