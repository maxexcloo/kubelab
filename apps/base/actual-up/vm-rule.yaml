apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: actual-up
spec:
  groups:
    - name: actual-up
      rules:
        - alert: ActualUpSyncStale
          expr: |-
            time() - max(actual_up_last_success_timestamp_seconds{trigger=~"schedule|automatic-backfill"}) > 3600
            or absent(actual_up_last_success_timestamp_seconds{trigger=~"schedule|automatic-backfill"})
          for: 15m
          labels:
            namespace: actual-up
            severity: warning
          annotations:
            summary: Actual Up has no recent unattended sync
            description: No successful scheduled sync has been reported for over an hour, or unattended sync telemetry is missing. Check Actual Up run results, mappings and connectivity.
