apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    groupPattern: "1000"
    permPattern: "0700"
    userPattern: "1000"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
