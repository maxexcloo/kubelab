apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actual-up
  namespace: actual-up
spec:
  interval: 30m
  releaseName: actual-up
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  values:
    controllers:
      actual-up:
        replicas: 1
        strategy: Recreate
        containers:
          actual-up:
            env:
              ACTUAL_UP_CONFIG: /config/config.yaml
              ACTUAL_UP_PUBLIC_URL: https://app.invalid
              TZ: Australia/Sydney
            envFrom:
              - secretRef:
                  name: actual-up
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/maxexcloo/actual-up
              tag: sha-b3bba36c3d25f53b29b8905f86f3ec0208a64b95@sha256:2a17667ec3b0916d06861c76f0391c60e7ddac0256bc057beee99551dc024566
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /livez
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  httpGet:
                    path: /readyz
                    port: 3000
                  periodSeconds: 5
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 25m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: actual-up
    persistence:
      cache:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
      configuration:
        name: actual-up-config
        type: configMap
        globalMounts:
          - path: /config
            readOnly: true
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        annotations:
          gethomepage.dev/description: Up to Actual Sync
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-actual-budget
          gethomepage.dev/name: Actual Up
          gethomepage.dev/siteMonitor: https://app.invalid/livez
          onepassword.excloo.dev/item: Actual Up
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: actual-up
        parentRefs:
          - name: private
            namespace: networking
    service:
      actual-up:
        controller: actual-up
        ports:
          http:
            port: 3000
            protocol: HTTP
