apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              ACTUAL_UP_PUBLIC_URL: https://app.invalid
              TZ: ${time_zone}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/maxexcloo/actual-up
              tag: 0.5.0
            probes:
              liveness:
                path: /livez
              readiness: &ready
                path: /readyz
              startup: *ready
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 25m
                memory: 512Mi
    defaultPodOptions:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
    persistence:
      cache:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
      configuration:
        name: actual-up-config
        type: configMap
        globalMounts:
          - path: /config
            readOnly: true
    route:
      private:
        annotations:
          gethomepage.dev/description: Up to Actual Sync
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-actual-budget
          gethomepage.dev/name: &title Actual Up
          gethomepage.dev/siteMonitor: https://app.invalid/livez
          onepassword.excloo.dev/item: *title
        hostnames:
          - actual-up.${cluster_name}.excloo.dev
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 3000
