apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/defaults: '{"username":"max@excloo.com"}'
    onepassword.excloo.dev/generate-fields: encryption-key,password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: 6ckeqicrsz42u6ryn2hqfyveky
        property: password
      secretKey: ACTUAL_UP_PASSWORD
    - remoteRef:
        key: 6ckeqicrsz42u6ryn2hqfyveky
        property: username
      secretKey: ACTUAL_UP_USERNAME
    - remoteRef:
        key: 6ckeqicrsz42u6ryn2hqfyveky
        property: encryption-key
      secretKey: ACTUAL_UP_ENCRYPTION_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
