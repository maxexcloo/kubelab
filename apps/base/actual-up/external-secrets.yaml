apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/generate-fields: encryption-key,password
    onepassword.excloo.dev/owner-email-fields: username
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Actual Up
        property: password
      secretKey: ACTUAL_UP_PASSWORD
    - remoteRef:
        key: *item
        property: username
      secretKey: ACTUAL_UP_USERNAME
    - remoteRef:
        key: *item
        property: encryption-key
      secretKey: ACTUAL_UP_ENCRYPTION_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: application
