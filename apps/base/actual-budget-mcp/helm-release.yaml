apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            # --sse serves streamable HTTP at /mcp alongside legacy SSE.
            args:
              - --enable-write
              - --sse
            env:
              # The server's default passes a file ID where Actual expects this
              # budget sync ID (Settings, Advanced).
              ACTUAL_BUDGET_SYNC_ID: 4f158c40-49ff-4f8a-95e5-1b17f198bd4d
              ACTUAL_DATA_DIR: /data
              ACTUAL_SERVER_URL: http://actual-budget.actual-budget.svc.cluster.local:5006
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/sstefanov/actual-mcp
              tag: v1.15.1
            # The server has no health endpoint.
            probes:
              liveness: &health
                type: TCP
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 10m
                memory: 128Mi
    # The budget is downloaded again on start.
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /data
    service:
      main:
        ports:
          http:
            port: 3000
