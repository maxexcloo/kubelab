apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-budget-mcp
spec:
  refreshInterval: 1h
  # LiteLLM's item holds the gateway's provider credentials. Actual signs in
  # through Pocket ID, so the server uses a non-expiring Actual session token.
  data:
    - remoteRef:
        key: LiteLLM
        property: provider-actual-budget-session-token
      secretKey: ACTUAL_SESSION_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: actual-budget-mcp
