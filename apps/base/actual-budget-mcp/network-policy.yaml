apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application
  labels:
    app.kubernetes.io/name: application
spec:
  # The MCP endpoint has no caller authentication; LiteLLM is its only client.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 3000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: actual-budget-mcp
  policyTypes:
    - Ingress
