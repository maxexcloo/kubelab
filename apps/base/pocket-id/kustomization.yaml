apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pocket-id
resources:
  - external-secrets.yaml
  - groups.yaml
  - namespace.yaml
  - network-policy.yaml
  - private-dns.yaml
  - resend.yaml
components:
  - ../../../platform/databases/postgres
  - ../../components/application
  - ../../components/default-deny
  - ../../components/database-colocation
  - ../../../platform/backups/credentials
patches:
  - path: database.yaml
    target:
      kind: Cluster
  - path: helm-release.yaml
    target:
      kind: HelmRelease
transformers:
  - ../../transformers/cluster-scoped
