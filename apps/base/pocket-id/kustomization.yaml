apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pocket-id
resources:
  - external-secrets.yaml
  - groups.yaml
  - namespace.yaml
  - network-policy.yaml
  - resend.yaml
components:
  - ../../../platform/databases/postgres
  - ../../components/application
  - ../../components/default-deny
  - ../../components/database-colocation
  - ../../../platform/backups/credentials
  - ../../components/private-dns-control-d-only
configMapGenerator:
  - name: pocket-id-database-check
    files:
      - wait-for-database.sh
configurations:
  - name-reference.yaml
patches:
  - path: database.yaml
    target:
      kind: Cluster
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: Cluster
      fieldPath: spec.imageName
      options:
        delimiter: ":"
        index: 0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.initContainers.wait-for-database.image.repository
  - source:
      kind: Cluster
      fieldPath: spec.imageName
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.initContainers.wait-for-database.image.tag
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.public.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.APP_URL
        options:
          delimiter: /
          index: 2
transformers:
  - ../../transformers/route-public
