apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
  namespace: pocket-id
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"pocket-id"}'
    onepassword.excloo.dev/generate-fields: database-password,encryption-key,static-api-key
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: Excloo ID
        property: api-key-resend
      secretKey: api-key-resend
    - remoteRef:
        key: Excloo ID
        property: database-password
      secretKey: database-password
    - remoteRef:
        key: Excloo ID
        property: database-username
      secretKey: database-username
    - remoteRef:
        key: Excloo ID
        property: encryption-key
      secretKey: encryption-key
    - remoteRef:
        key: Excloo ID
        property: static-api-key
      secretKey: static-api-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: pocket-id
    template:
      engineVersion: v2
      data:
        DB_CONNECTION_STRING: 'postgresql://{{ index . "database-username" | urlquery }}:{{ index . "database-password" | urlquery }}@pocket-id-database-rw:5432/pocket-id?sslmode=require'
        ENCRYPTION_KEY: '{{ index . "encryption-key" }}'
        SMTP_PASSWORD: '{{ index . "api-key-resend" }}'
        STATIC_API_KEY: '{{ index . "static-api-key" }}'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-database
  namespace: pocket-id
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"pocket-id"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: Excloo ID
        property: database-password
      secretKey: password
    - remoteRef:
        key: Excloo ID
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: pocket-id-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
---
apiVersion: v1
kind: Namespace
metadata:
  name: pocket-id
  labels:
    app.kubernetes.io/name: pocket-id
    gateway.excloo.dev/public-access: "true"
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pocket-id
  namespace: pocket-id
  labels:
    app.kubernetes.io/name: pocket-id
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: crossplane-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 1411
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/controller: pocket-id
      app.kubernetes.io/instance: pocket-id
      app.kubernetes.io/name: pocket-id
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pocket-id-database
  namespace: pocket-id
  labels:
    app.kubernetes.io/name: pocket-id
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backup
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: restore
        - podSelector:
            matchLabels:
              app.kubernetes.io/controller: pocket-id
              app.kubernetes.io/instance: pocket-id
              app.kubernetes.io/name: pocket-id
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
  podSelector:
    matchLabels:
      cnpg.io/cluster: pocket-id-database
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup
  namespace: pocket-id
  annotations:
    k8s-sigs.io/nfs-directory-gid: "568"
    k8s-sigs.io/nfs-directory-mode: "0770"
    k8s-sigs.io/nfs-directory-uid: "568"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: truenas-nfs
---
apiVersion: automation.excloo.dev/v1alpha1
kind: ResendKey
metadata:
  name: resend
  namespace: pocket-id
spec:
  displayName: Excloo ID
