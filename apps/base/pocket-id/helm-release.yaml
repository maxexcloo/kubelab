apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              ALLOW_OWN_ACCOUNT_EDIT: "true"
              ANALYTICS_DISABLED: "true"
              APP_NAME: Pocket ID
              APP_URL: https://app.invalid
              # PocketIDClient compositions create each client's secret.
              AUTO_CREATE_OIDC_CLIENT_SECRET: "false"
              EMAILS_VERIFIED: "true"
              FILE_BACKEND: database
              REQUIRE_USER_EMAIL: "true"
              SMTP_FROM: pocket-id@${mail_domain}
              SMTP_HOST: smtp.resend.com
              SMTP_PORT: "465"
              SMTP_TLS: tls
              SMTP_USER: resend
              TRUST_PROXY: "true"
              UI_CONFIG_DISABLED: "true"
              VERSION_CHECK_DISABLED: "true"
              WEBAUTHN_ALLOW_SYNCED_PASSKEYS: "true"
              WEBAUTHN_USER_VERIFICATION: required
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/pocket-id/pocket-id
              tag: v2.19.1
            probes:
              liveness: &health
                type: COMMAND
                command:
                  - /app/pocket-id
                  - healthcheck
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 20m
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        fsGroup: null
        fsGroupChangePolicy: null
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 1411
      public:
        forceRename: "{{ .Release.Name }}"
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: OIDC Provider
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-pocket-id
          gethomepage.dev/name: &title Pocket ID
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: *title
        hostnames:
          - ${identity_host}
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 1411
