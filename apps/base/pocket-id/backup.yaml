apiVersion: batch/v1
kind: CronJob
metadata:
  name: pocket-id-database-backup
  namespace: pocket-id
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: pocket-id
spec:
  schedule: "0 3 * * *"
  timeZone: Australia/Sydney
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
            app.kubernetes.io/name: pocket-id
        spec:
          automountServiceAccountToken: false
          containers:
            - name: backup
              image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:e5e820a9083134141caac23cad1d6affd39101a9fefe7bf6cc07738a3fa89452
              imagePullPolicy: IfNotPresent
              command:
                - /usr/bin/sh
                - -c
                - |-
                  set -eu
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  target="/backup/pocket-id-${timestamp}.dump"
                  pg_dump --file="$target" --format=custom --no-owner --no-privileges
                  pg_restore --list "$target" >/dev/null
                  find /backup -type f -name 'pocket-id-*.dump' -mtime +27 -delete
              env:
                - name: PGDATABASE
                  value: pocket-id
                - name: PGHOST
                  value: pocket-id-database-rw
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: pocket-id-database
                - name: PGSSLMODE
                  value: require
                - name: PGUSER
                  value: pocket-id
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 20m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
          restartPolicy: Never
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 26
            runAsNonRoot: true
            runAsUser: 26
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pocket-id-export
  namespace: pocket-id
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: pocket-id
spec:
  schedule: "30 3 * * *"
  timeZone: Australia/Sydney
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
            app.kubernetes.io/name: pocket-id
        spec:
          automountServiceAccountToken: false
          containers:
            - name: export
              image: ghcr.io/pocket-id/pocket-id:v2.14.0@sha256:01540977dcf4c7b41b1159f34d68e4632f2658d62790e460ca65a42722b13c4a
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |-
                  set -eu
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  partial="/backup/.pocket-id-${timestamp}.zip.partial"
                  target="/backup/pocket-id-${timestamp}.zip"
                  trap 'rm -f "$partial"' EXIT
                  /app/pocket-id export --path "$partial"
                  unzip -t "$partial" >/dev/null
                  mv "$partial" "$target"
                  trap - EXIT
                  find /backup -type f -name 'pocket-id-*.zip' -mtime +27 -delete
              env:
                - name: APP_URL
                  value: https://id.excloo.com
                - name: FILE_BACKEND
                  value: database
              envFrom:
                - secretRef:
                    name: pocket-id
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 20m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: temporary
                  mountPath: /tmp
          restartPolicy: Never
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup
            - name: temporary
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pocket-id-restore
  namespace: pocket-id
  labels:
    app.kubernetes.io/component: restore
    app.kubernetes.io/name: pocket-id
spec:
  schedule: "0 0 1 1 *"
  timeZone: Australia/Sydney
  suspend: true
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/component: restore
            app.kubernetes.io/name: pocket-id
        spec:
          automountServiceAccountToken: false
          containers:
            - name: restore
              image: ghcr.io/pocket-id/pocket-id:v2.14.0@sha256:01540977dcf4c7b41b1159f34d68e4632f2658d62790e460ca65a42722b13c4a
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |-
                  set -eu
                  : "${RESTORE_ARCHIVE:?set RESTORE_ARCHIVE to an exact /backup/pocket-id-*.zip path}"
                  : "${RESTORE_SHA256:?set RESTORE_SHA256 to the reviewed archive digest}"
                  case "$RESTORE_ARCHIVE" in
                    /backup/pocket-id-*.zip) ;;
                    *) echo "restore archive is outside the guarded backup path" >&2; exit 1 ;;
                  esac
                  test -f "$RESTORE_ARCHIVE"
                  printf '%s  %s\n' "$RESTORE_SHA256" "$RESTORE_ARCHIVE" | sha256sum -c -
                  unzip -t "$RESTORE_ARCHIVE" >/dev/null
                  /app/pocket-id import --yes --path "$RESTORE_ARCHIVE"
                  /app/pocket-id export --path /tmp/restored.zip
                  unzip -t /tmp/restored.zip >/dev/null
              env:
                - name: APP_URL
                  value: https://id.excloo.com
                - name: FILE_BACKEND
                  value: database
                - name: RESTORE_ARCHIVE
                  value: ""
                - name: RESTORE_SHA256
                  value: ""
              envFrom:
                - secretRef:
                    name: pocket-id
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 20m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: temporary
                  mountPath: /tmp
          restartPolicy: Never
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup
            - name: temporary
              emptyDir: {}
