apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  releaseName: immich
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: immich
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            env:
              IMMICH_LOG_FORMAT: json
              TZ: ${time_zone}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            # Keep upstream checks and the longer machine-learning startup budget.
            probes:
              liveness:
                spec:
                  timeoutSeconds: 5
              readiness:
                spec:
                  timeoutSeconds: 5
              startup:
                spec:
                  timeoutSeconds: 5
    defaultPodOptions:
      automountServiceAccountToken: false
      nodeSelector:
        node.excloo.dev/network: internal
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        supplementalGroups:
          - 3000
        seccompProfile:
          type: RuntimeDefault
    immich:
      # The file makes these settings read-only in the UI; valuesFrom adds the credentials.
      configuration:
        job:
          thumbnailGeneration:
            concurrency: 1
        newVersionCheck:
          enabled: false
        notifications:
          smtp:
            enabled: true
            from: Immich <immich@${mail_domain}>
            transport:
              host: smtp.resend.com
              port: 465
              secure: true
              username: resend
        oauth:
          autoLaunch: true
          buttonText: Login with Excloo ID
          enabled: true
          issuerUrl: https://${identity_host}
        server:
          externalDomain: https://app.invalid
      configurationKind: Secret
      persistence:
        library:
          existingClaim: &library-claim library
    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: &version v3.4.2
              resources:
                limits:
                  memory: 4Gi
                requests:
                  cpu: 100m
                  memory: 1Gi
      persistence:
        cache:
          accessMode: ReadWriteOnce
          size: 10Gi
          storageClass: local-path
          type: persistentVolumeClaim
    server:
      controllers:
        main:
          initContainers:
            wait-for-database:
              command:
                - sh
                - /checks/wait-for-database.sh
              env:
                PGHOST: "{{ .Release.Name }}-database-rw"
              image:
                repository: image.invalid
                tag: tag
              resources:
                limits:
                  memory: 64Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            main:
              env:
                DB_DATABASE_NAME: immich
                DB_HOSTNAME: immich-database-rw
                DB_PORT: "5432"
                DB_SSL_MODE: require
                DB_VECTOR_EXTENSION: vectorchord
                IMMICH_TELEMETRY_INCLUDE: all
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: immich-database
                DB_USERNAME:
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: immich-database
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: *version
              resources:
                limits:
                  memory: 8Gi
                requests:
                  cpu: 500m
                  memory: 3Gi
      persistence:
        cli:
          enabled: true
          type: emptyDir
          advancedMounts:
            main:
              main:
                - path: /.config
        config:
          name: "{{ .Release.Name }}-immich-config"
          type: secret
          advancedMounts:
            main:
              main:
                - path: /config
        data:
          existingClaim: *library-claim
          advancedMounts:
            main:
              main:
                - path: /data
        database-check:
          name: database-check
          type: configMap
          advancedMounts:
            main:
              wait-for-database:
                - path: /checks
                  readOnly: true
        icloud-photos:
          enabled: true
          existingClaim: icloud-photos
          type: persistentVolumeClaim
          advancedMounts:
            main:
              main:
                - path: /icloud-photos
                  readOnly: true
        temporary:
          enabled: true
          type: emptyDir
          advancedMounts:
            main:
              main:
                - path: /tmp
      # The chart's metrics switch also renders a Prometheus Operator ServiceMonitor, so expose the ports here.
      service:
        main:
          ports:
            metrics-api:
              enabled: true
              port: 8081
              targetPort: 8081
            metrics-ms:
              enabled: true
              port: 8082
              targetPort: 8082
    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              args:
                - --appendfsync
                - everysec
                - --appendonly
                - "yes"
              image:
                repository: docker.io/valkey/valkey
                tag: 9.2.0
              resources:
                limits:
                  memory: 2Gi
                requests:
                  cpu: 100m
                  memory: 512Mi
      persistence:
        data:
          existingClaim: valkey-data
          type: persistentVolumeClaim
  valuesFrom:
    - kind: Secret
      name: immich-config
      targetPath: immich.configuration.notifications.smtp.transport.password
      valuesKey: smtp-password
    - kind: Secret
      name: immich-config
      targetPath: immich.configuration.oauth.clientId
      valuesKey: oidc-client-id
    - kind: Secret
      name: immich-config
      targetPath: immich.configuration.oauth.clientSecret
      valuesKey: oidc-client-secret
