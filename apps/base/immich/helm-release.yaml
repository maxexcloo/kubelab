apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  releaseName: immich
  chartRef:
    kind: OCIRepository
    name: immich
    namespace: flux-system
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              kind: Deployment
              name: immich-server
              version: v1
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/readinessProbe
                value:
                  exec:
                    command:
                      - node
                      - /health/readiness.cjs
                  failureThreshold: 3
                  periodSeconds: 10
                  timeoutSeconds: 5
  values:
    controllers:
      main:
        containers:
          main:
            env:
              IMMICH_LOG_FORMAT: json
              TZ: Australia/Sydney
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        supplementalGroups:
          - 3000
        seccompProfile:
          type: RuntimeDefault
    immich:
      persistence:
        library:
          existingClaim: library
    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: v3.3.1@sha256:513c831cfb010ad319341a0c86b42c575a0d5b688d3e8cae346ee624074a58ed
              resources:
                limits:
                  memory: 4Gi
                requests:
                  cpu: 100m
                  memory: 1Gi
      persistence:
        cache:
          accessMode: ReadWriteOnce
          size: 10Gi
          storageClass: local-path
          type: persistentVolumeClaim
    server:
      controllers:
        main:
          containers:
            main:
              env:
                DB_DATABASE_NAME: immich
                DB_HOSTNAME: immich-database-rw
                DB_PORT: "5432"
                DB_SSL_MODE: require
                DB_VECTOR_EXTENSION: vectorchord
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: immich-database
                DB_USERNAME:
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: immich-database
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: v3.3.1@sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1
              resources:
                limits:
                  memory: 8Gi
                requests:
                  cpu: 500m
                  memory: 3Gi
      persistence:
        cli:
          enabled: true
          type: emptyDir
          globalMounts:
            - path: /.config
        health:
          enabled: true
          name: immich-health
          type: configMap
          globalMounts:
            - path: /health
              readOnly: true
        icloud-photos:
          enabled: true
          existingClaim: icloud-photos
          type: persistentVolumeClaim
          globalMounts:
            - path: /icloud-photos
              readOnly: true
        temporary:
          enabled: true
          type: emptyDir
          globalMounts:
            - path: /tmp
    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              args:
                - --appendfsync
                - everysec
                - --appendonly
                - "yes"
              image:
                repository: docker.io/valkey/valkey
                tag: 9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
              resources:
                limits:
                  memory: 2Gi
                requests:
                  cpu: 100m
                  memory: 512Mi
      persistence:
        data:
          existingClaim: valkey-data
          type: persistentVolumeClaim
