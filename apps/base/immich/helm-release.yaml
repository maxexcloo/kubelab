apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  releaseName: immich
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: immich
    namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            env:
              IMMICH_LOG_FORMAT: json
              TZ: ${time_zone}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            # Keep upstream checks and the longer machine-learning startup budget.
            probes:
              liveness:
                spec:
                  timeoutSeconds: 5
              readiness:
                spec:
                  timeoutSeconds: 5
              startup:
                spec:
                  timeoutSeconds: 5
    defaultPodOptions:
      automountServiceAccountToken: false
      nodeSelector:
        node.excloo.dev/network: internal
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        supplementalGroups:
          - 3000
        seccompProfile:
          type: RuntimeDefault
    immich:
      persistence:
        library:
          existingClaim: library
    machine-learning:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                tag: &version v3.3.5
              resources:
                limits:
                  memory: 4Gi
                requests:
                  cpu: 100m
                  memory: 1Gi
      persistence:
        cache:
          accessMode: ReadWriteOnce
          size: 10Gi
          storageClass: local-path
          type: persistentVolumeClaim
    server:
      controllers:
        main:
          containers:
            main:
              env:
                DB_DATABASE_NAME: immich
                DB_HOSTNAME: immich-database-rw
                DB_PORT: "5432"
                DB_SSL_MODE: require
                DB_VECTOR_EXTENSION: vectorchord
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: immich-database
                DB_USERNAME:
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: immich-database
              image:
                repository: ghcr.io/immich-app/immich-server
                tag: *version
              resources:
                limits:
                  memory: 8Gi
                requests:
                  cpu: 500m
                  memory: 3Gi
      persistence:
        cli:
          enabled: true
          type: emptyDir
          globalMounts:
            - path: /.config
        icloud-photos:
          enabled: true
          existingClaim: icloud-photos
          type: persistentVolumeClaim
          globalMounts:
            - path: /icloud-photos
              readOnly: true
        temporary:
          enabled: true
          type: emptyDir
          globalMounts:
            - path: /tmp
    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              args:
                - --appendfsync
                - everysec
                - --appendonly
                - "yes"
              image:
                repository: docker.io/valkey/valkey
                tag: 9.1.3
              resources:
                limits:
                  memory: 2Gi
                requests:
                  cpu: 100m
                  memory: 512Mi
      persistence:
        data:
          existingClaim: valkey-data
          type: persistentVolumeClaim
