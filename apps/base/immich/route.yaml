apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: application
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    gethomepage.dev/description: Photo Manager
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/href: https://app.invalid
    gethomepage.dev/icon: sh-immich
    gethomepage.dev/name: &title Immich
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=immich,app.kubernetes.io/name=server
    gethomepage.dev/widget.fields: '["photos", "videos", "storage"]'
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
    gethomepage.dev/widget.type: immich
    gethomepage.dev/widget.url: https://app.invalid
    gethomepage.dev/widget.version: "2"
    monitoring.excloo.dev/enabled: "true"
    onepassword.excloo.dev/item: *title
  labels:
    app.kubernetes.io/name: application
    gateway.excloo.dev/public-access: "true"
spec:
  hostnames:
    - photos.excloo.com
  parentRefs:
    - name: public-tunnel
      namespace: networking
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
