apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - database-extension.yaml
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - resend.yaml
  - route.yaml
  - source.yaml
  - storage.yaml
replacements:
  # The chart source lives in the namespace the release references.
  - source:
      kind: HelmRelease
      fieldPath: spec.chartRef.namespace
    targets:
      - select:
          kind: OCIRepository
        fieldPaths:
          - metadata.namespace
  - source:
      kind: HTTPRoute
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
          - metadata.annotations.[gethomepage.dev/widget.url]
        options:
          delimiter: /
          index: 2
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.hostname
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.callbackURLs.1
          - spec.client.callbackURLs.2
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
components:
  - ../../../platform/databases/postgres
  - ../../../platform/backups/credentials
  - ../../components/database-colocation
  - ../../components/private-dns-control-d-only
patches:
  - path: database.yaml
    target:
      kind: Cluster
transformers:
  - ../../transformers/cluster-scoped
