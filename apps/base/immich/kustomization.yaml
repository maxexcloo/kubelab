apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - cloudflare-access.yaml
  - database-extension.yaml
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - private-dns.yaml
  - resend.yaml
  - route.yaml
  - source.yaml
  - storage.yaml
replacements:
  # The chart source lives in the namespace the release references.
  - source:
      kind: HelmRelease
      fieldPath: spec.chartRef.namespace
    targets:
      - select:
          kind: OCIRepository
        fieldPaths:
          - metadata.namespace
  # The Pocket ID client's logo follows the app's Homepage icon.
  - source:
      kind: HTTPRoute
      name: immich
      fieldPath: metadata.annotations.[gethomepage.dev/icon]
    targets:
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.icon
        options:
          create: true
components:
  - ../../../platform/databases/postgres
  - ../../../platform/backups/credentials
  - ../../components/database-colocation
  - ../../components/default-deny
patches:
  - path: database.yaml
    target:
      kind: Cluster
transformers:
  - ../../transformers/cluster-scoped
