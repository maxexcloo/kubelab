apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - database-extension.yaml
  - database.yaml
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - private-dns.yaml
  - resend.yaml
  - route.yaml
  - source.yaml
  - storage.yaml
replacements:
  - source:
      kind: HTTPRoute
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
          - metadata.annotations.[gethomepage.dev/widget.url]
        options:
          delimiter: /
          index: 2
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.hostname
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.callbackURLs.1
          - spec.client.callbackURLs.2
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
components:
  - ../../../platform/backups/credentials
  - ../../../platform/backups/postgres
  - ../../components/app-namespace
patches: []
