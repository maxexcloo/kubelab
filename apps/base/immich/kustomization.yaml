apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - cloudflare-access.yaml
  - database-extension.yaml
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - resend.yaml
  - route.yaml
  - source.yaml
  - storage.yaml
replacements:
  # The chart source lives in the namespace the release references.
  - source:
      kind: HelmRelease
      fieldPath: spec.chartRef.namespace
    targets:
      - select:
          kind: OCIRepository
        fieldPaths:
          - metadata.namespace
  - source:
      kind: HTTPRoute
      name: immich
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: immich
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.immich.configuration.server.externalDomain
        options:
          delimiter: /
          index: 2
      - select:
          kind: HTTPRoute
          name: immich-private
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: CloudflareAccessApplication
        fieldPaths:
          - spec.hostname
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.hostname
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.callbackURLs.1
          - spec.client.callbackURLs.2
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
  # The Pocket ID client's logo follows the app's Homepage icon.
  - source:
      kind: HTTPRoute
      name: immich
      fieldPath: metadata.annotations.[gethomepage.dev/icon]
    targets:
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.icon
        options:
          create: true
components:
  - ../../../platform/databases/postgres
  - ../../../platform/backups/credentials
  - ../../components/database-colocation
  - ../../components/private-dns-control-d-only
  - ../../components/default-deny
patches:
  - path: database.yaml
    target:
      kind: Cluster
transformers:
  - ../../transformers/cluster-scoped
