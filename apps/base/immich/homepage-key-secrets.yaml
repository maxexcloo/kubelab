apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-homepage-key-existing
spec:
  data:
    - remoteRef:
        key: Homepage
        property: provider-immich-api-key
      secretKey: token
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-homepage-key-existing
---
apiVersion: v1
kind: Secret
metadata:
  name: immich-homepage-key
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: immich-homepage-key
spec:
  data:
    - match:
        secretKey: token
        remoteRef:
          property: provider-immich-api-key
          remoteKey: Homepage
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          tags: [Kubelab]
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: immich-homepage-key
