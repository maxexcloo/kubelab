apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-database
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"immich"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Immich
        property: database-password
      secretKey: password
    - remoteRef:
        key: *item
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: immich-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-login
  annotations:
    onepassword.excloo.dev/defaults: '{"username":"owner@example.invalid"}'
    onepassword.excloo.dev/generate-fields: password
spec:
  data:
    - remoteRef:
        key: &item Immich
        property: username
      secretKey: username
    - remoteRef:
        key: *item
        property: password
      secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: immich-login
