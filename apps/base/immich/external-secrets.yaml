apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-database
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"immich"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Immich
        property: database-password
      secretKey: password
    - remoteRef:
        key: *item
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
  annotations:
    onepassword.excloo.dev/generate-fields: password
    onepassword.excloo.dev/owner-email-fields: username
spec:
  data:
    - remoteRef:
        key: &item Immich
        property: oidc-client-id
      secretKey: oidc-client-id
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: oidc-client-secret
    - remoteRef:
        key: *item
        property: provider-resend-api-key
      secretKey: smtp-password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-config
