apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: icloud-photos
  namespace: immich
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: ""
  volumeName: immich-icloud-photos
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4Ti
  storageClassName: ""
  volumeName: immich-library
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-icloud-photos
  labels:
    app.kubernetes.io/name: immich
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 50Gi
  mountOptions:
    - nfsvers=4.2
  nfs:
    path: /mnt/truenas/icloud-photos
    server: storage.invalid
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
  labels:
    app.kubernetes.io/name: immich
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 4Ti
  mountOptions:
    - nfsvers=4.2
  nfs:
    path: /mnt/truenas-nvme/immich
    server: storage.invalid
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
