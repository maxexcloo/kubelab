apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-icloud-photos
  labels:
    app.kubernetes.io/name: immich
spec:
  accessModes:
    - ReadOnlyMany
  capacity:
    storage: 50Gi
  mountOptions:
    - nfsvers=4.2
  nfs:
    path: /mnt/truenas/icloud-photos
    server: 10.4.0.3
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
  labels:
    app.kubernetes.io/name: immich
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 4Ti
  mountOptions:
    - nfsvers=4.2
  nfs:
    path: /mnt/truenas-nvme/immich
    server: 10.4.0.3
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
