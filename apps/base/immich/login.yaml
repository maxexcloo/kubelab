apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-login
  namespace: immich
  annotations:
    onepassword.excloo.dev/defaults: '{"username":"admin@excloo.com"}'
    onepassword.excloo.dev/generate-fields: password
spec:
  data:
    - remoteRef:
        key: Immich
        property: username
      secretKey: username
    - remoteRef:
        key: Immich
        property: password
      secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: immich-login
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-bootstrap
  namespace: immich
data:
  bootstrap.py: |
    import json
    import os
    import urllib.error
    import urllib.request

    base_url = "http://immich-server:2283/api"
    try:
        with urllib.request.urlopen(f"{base_url}/server/config", timeout=10) as response:
            if json.load(response)["isInitialized"]:
                print("Immich is already initialised")
                raise SystemExit
    except urllib.error.URLError:
        print("Immich is not available; bootstrap deferred")
        raise SystemExit

    body = json.dumps(
        {
            "email": os.environ["USERNAME"],
            "name": "Admin",
            "password": os.environ["PASSWORD"],
        }
    ).encode()
    request = urllib.request.Request(
        f"{base_url}/auth/admin-sign-up",
        data=body,
        headers={"Content-Type": "application/json"},
        method="POST",
    )
    with urllib.request.urlopen(request, timeout=30):
        print("Created Immich administrator")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-bootstrap
  namespace: immich
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  schedule: "29 * * * *"
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/component: bootstrap
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: bootstrap
              image: docker.io/library/python:3.14.0-alpine3.22@sha256:8373231e1e906ddfb457748bfc032c4c06ada8c759b7b62d9c73ec2a3c56e710
              command: [python, /app/bootstrap.py]
              env:
                - name: PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: immich-login
                - name: USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: immich-login
              resources:
                limits:
                  memory: 64Mi
                requests:
                  cpu: 10m
                  memory: 16Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - mountPath: /app
                  name: script
                  readOnly: true
                - mountPath: /tmp
                  name: temporary
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - configMap:
                name: immich-bootstrap
              name: script
            - emptyDir: {}
              name: temporary
