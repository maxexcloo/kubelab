apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-mcp
spec:
  releaseName: kubernetes-mcp
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kubernetes-mcp
    namespace: flux-system
  values:
    config:
      read_only: true
      toolsets: ["core"]
    fullnameOverride: kubernetes-mcp
    image:
      version: v0.1.2
    ingress:
      enabled: false
    rbac:
      extraClusterRoleBindings:
        - name: view
          roleRef:
            external: true
            name: view
