apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubernetes-mcp
resources:
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - source.yaml
replacements:
  # The chart source lives in the namespace the release references.
  - source:
      kind: HelmRelease
      fieldPath: spec.chartRef.namespace
    targets:
      - select:
          kind: OCIRepository
        fieldPaths:
          - metadata.namespace
components:
  - ../../components/default-deny
