apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  # GPU workloads stay stopped until started with kubectl scale; any upgrade of
  # the release stops them again.
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              - op: add
                path: /spec/replicas
                value: 0
            target:
              kind: Deployment
  values:
    controllers:
      main:
        strategy: Recreate
        annotations:
          studio.excloo.dev/capabilities: image,upscale,models
          studio.excloo.dev/label: Image
          studio.excloo.dev/worker: primary
        labels:
          studio.excloo.dev/kind: image
        containers:
          main: &container
            env:
              CLI_ARGS: --enable-assets --use-ck-attention --force-non-blocking --disable-pinned-memory --disable-mmap
              HSA_OVERRIDE_GFX_VERSION: 12.0.1
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/maxexcloo/studio-worker
              tag: 2026.10.30.1
            # Readiness only, as under Docker: loading never restarts the worker.
            probes:
              readiness:
                enabled: true
                path: /system_stats
                port: 8188
                type: HTTP
                spec:
                  timeoutSeconds: 5
            resources:
              claims:
                - name: gpu
            securityContext:
              capabilities:
                add:
                  - SYS_PTRACE
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: gpu-1
    defaultPodOptions:
      nodeSelector:
        node.excloo.dev/dedicated: gpu
      securityContext:
        seccompProfile:
          type: Unconfined
      tolerations:
        - key: node.excloo.dev/dedicated
          operator: Equal
          value: gpu
    # Studio is the shared worker client: it fetches outputs and the worker node
    # deletes ComfyUI's copies.
    persistence:
      data:
        hostPath: ${dataset_root}/ai/comfyui-image/data
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /root/.cache
            subPath: cache
          - path: /root/.config
            subPath: config
          - path: /root/ComfyUI/input
            subPath: input
          - path: /root/ComfyUI/output
            subPath: output
          - path: /root/ComfyUI/user
            subPath: user
      models:
        hostPath: ${dataset_root}/ai/models
        hostPathType: Directory
        type: hostPath
        globalMounts:
          # Writable only here: Studio's model downloads land in this worker.
          - path: /root/ComfyUI/models
            subPath: comfyui
          - path: /models/radiance-image
            readOnly: true
            subPath: radiance
      shm:
        medium: Memory
        type: emptyDir
        globalMounts:
          - path: /dev/shm
    route:
      private:
        annotations:
          gethomepage.dev/description: Image Workflows
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-comfyui
          gethomepage.dev/name: ComfyUI Image
        hostnames:
          - comfy.excloo.com
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        controller: main
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            port: 8188
            protocol: HTTP
