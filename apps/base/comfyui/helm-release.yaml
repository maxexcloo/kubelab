apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  # kubectl scale switches GPU workloads, so the chart never sets replicas and
  # upgrades do not wait: a new Deployment starts with one replica, and its GPU
  # may be busy.
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              - op: remove
                path: /spec/replicas
            target:
              kind: Deployment
  upgrade:
    disableWait: true
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            env:
              CLI_ARGS: --enable-assets --use-ck-attention --force-non-blocking --disable-pinned-memory --disable-mmap
              CLIPROXYAPI_KEY: ""
              CLIPROXYAPI_URL: ""
              HSA_OVERRIDE_GFX_VERSION: 12.0.1
              PATH: /root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              # Keep the tested Studio SDK; the core version tag can also advance its SDK.
              repository: ghcr.io/maxexcloo/comfyui-radiance
              tag: sha-4c33f505b56c4927d5fe6df3c10a2962e3d48048
            # Readiness only, as under Docker: loading never restarts the worker.
            probes:
              readiness:
                enabled: true
                path: /system_stats
                type: HTTP
                spec:
                  timeoutSeconds: 5
            resources:
              claims:
                - name: gpu
            securityContext:
              capabilities:
                add:
                  - SYS_PTRACE
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: gpu-1
    defaultPodOptions:
      nodeSelector:
        node.excloo.dev/dedicated: gpu
      securityContext:
        seccompProfile:
          type: Unconfined
      tolerations:
        - key: node.excloo.dev/dedicated
          operator: Equal
          value: gpu
    # Studio is the shared worker client: it fetches outputs and the worker node
    # deletes ComfyUI's copies.
    persistence:
      data:
        hostPath: ${dataset_root}/ai/comfyui-image/data
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /root/.cache
            subPath: cache
          - path: /root/.config
            subPath: config
          - path: /root/ComfyUI/input
            subPath: input
          - path: /root/ComfyUI/output
            subPath: output
          - path: /root/ComfyUI/user
            subPath: user
      models:
        hostPath: ${dataset_root}/ai/models
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /root/ComfyUI/models
            subPath: comfyui
          - path: /models/radiance-image
            readOnly: true
            subPath: radiance
      shm:
        medium: Memory
        type: emptyDir
        globalMounts:
          - path: /dev/shm
    route:
      private:
        annotations:
          gethomepage.dev/description: Image Workflows
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-comfyui
          gethomepage.dev/name: ComfyUI Image
        hostnames:
          - comfy.excloo.com
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        controller: main
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            port: 8188
            protocol: HTTP
