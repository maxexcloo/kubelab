apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  # GPU workloads stay stopped until started with kubectl scale; any upgrade of
  # the release stops them again.
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              - op: add
                path: /spec/replicas
                value: 0
            target:
              kind: Deployment
              labelSelector: studio.excloo.dev/kind
  values:
    # A pool of one-GPU workers that each run images and video; Studio routes work to
    # whichever is free and holds the model.
    controllers:
      main:
        strategy: Recreate
        annotations:
          studio.excloo.dev/capabilities: image,video,upscale,models
          studio.excloo.dev/label: ComfyUI Primary
          studio.excloo.dev/worker: primary
        labels:
          studio.excloo.dev/kind: image
        containers:
          main: &container
            env:
              CLI_ARGS: --disable-mmap --disable-pinned-memory --force-non-blocking --use-ck-attention
              HSA_OVERRIDE_GFX_VERSION: 12.0.1
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image: &image
              repository: ghcr.io/maxexcloo/studio-worker
              tag: 2026.11.20.1
            # Readiness only, as under Docker: loading never restarts the worker.
            probes:
              readiness:
                enabled: true
                path: /system_stats
                port: 8188
                type: HTTP
                spec: &readiness
                  timeoutSeconds: 5
            resources:
              claims:
                - name: gpu
            securityContext:
              capabilities:
                add:
                  - SYS_PTRACE
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: gpu-1
      secondary:
        strategy: Recreate
        annotations:
          studio.excloo.dev/capabilities: image,video,upscale
          studio.excloo.dev/label: ComfyUI Secondary
          studio.excloo.dev/worker: secondary
        labels:
          studio.excloo.dev/kind: image
        containers:
          main: *container
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: gpu-1
      model-library:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            args:
              - --model-library
            env:
              HF_HOME: /tmp/huggingface
              STUDIO_MODEL_LIBRARY_DIR: /models
              STUDIO_WORKER_TOKEN:
                valueFrom:
                  secretKeyRef:
                    key: STUDIO_WORKER_TOKEN
                    name: "{{ .Release.Name }}"
            image: *image
            probes:
              readiness:
                enabled: true
                path: /studio/worker
                port: 8188
                type: HTTP
                spec: *readiness
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - DAC_OVERRIDE
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              runAsUser: 0
        pod:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
      prepull:
        serviceAccount:
          name: default
        containers:
          main:
            image: *image
    defaultPodOptions:
      nodeSelector:
        node.excloo.dev/dedicated: gpu
      securityContext:
        seccompProfile:
          type: Unconfined
      tolerations:
        - key: node.excloo.dev/dedicated
          operator: Equal
          value: gpu
    # Studio is the shared worker client: it fetches outputs and the worker node
    # deletes ComfyUI's copies.
    persistence:
      # Each worker keeps its own cache, config, output and user folders; both share the
      # primary's input folder, so Studio stages inputs once.
      data:
        hostPath: ${dataset_root}/ai/comfyui-image/data
        hostPathType: Directory
        type: hostPath
        advancedMounts:
          main:
            main:
              - path: /root/.cache
                subPath: cache
              - path: /root/.config
                subPath: config
              - &input
                path: /root/ComfyUI/input
                subPath: input
              - path: /root/ComfyUI/output
                subPath: output
              - path: /root/ComfyUI/user
                subPath: user
          secondary:
            main:
              - *input
      models:
        hostPath: ${dataset_root}/ai/models
        hostPathType: Directory
        type: hostPath
        advancedMounts:
          main:
            main:
              # The worker's built-in storage endpoint remains available for local operations.
              - path: /root/ComfyUI/models
                subPath: comfyui
              # Writable here too: Library › Convert to Radiance installs .rad packages here.
              - path: /models/radiance-image
                subPath: radiance
              # Radiance H3 video profiles load their .rad packages from here.
              - &radiance-video
                path: /models/radiance-video
                readOnly: true
                subPath: radiance
          secondary:
            main:
              - path: /root/ComfyUI/models
                readOnly: true
                subPath: comfyui
              - path: /models/radiance-image
                readOnly: true
                subPath: radiance
              - *radiance-video
          model-library:
            main:
              - path: /models
                subPath: comfyui
      secondary-data:
        hostPath: ${dataset_root}/ai/comfyui-video/data
        hostPathType: Directory
        type: hostPath
        advancedMounts:
          secondary:
            main:
              - path: /root/.cache
                subPath: cache
              - path: /root/.config
                subPath: config
              - path: /root/ComfyUI/output
                subPath: output
              - path: /root/ComfyUI/user
                subPath: user
      shm:
        medium: Memory
        type: emptyDir
        advancedMounts:
          main:
            main:
              - &shm
                path: /dev/shm
          secondary:
            main:
              - *shm
          prepull:
            main:
              - *shm
      model-library-temporary:
        type: emptyDir
        advancedMounts:
          model-library:
            main:
              - path: /tmp
    route:
      private:
        annotations:
          gethomepage.dev/description: Media Workflows
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-comfyui
          gethomepage.dev/name: ComfyUI
        hostnames:
          - comfyui.${cluster_name}.excloo.dev
        parentRefs:
          - name: private
            namespace: networking
        # The editor opens on the primary worker.
        rules:
          - backendRefs:
              - identifier: main
                port: 8188
    service:
      main:
        controller: main
        forceRename: "{{ .Release.Name }}"
        ports:
          http: &http
            port: 8188
            protocol: HTTP
      secondary:
        controller: secondary
        ports:
          http: *http
      model-library:
        controller: model-library
        ports:
          http: *http
