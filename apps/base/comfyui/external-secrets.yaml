apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: comfyui
spec:
  refreshInterval: 1h
  # Studio owns the worker token and the model download credentials.
  data:
    - remoteRef:
        key: &item Studio
        property: civitai-api-token
      secretKey: CIVITAI_API_TOKEN
    - remoteRef:
        key: *item
        property: hf-token
      secretKey: HF_TOKEN
    - remoteRef:
        key: *item
        property: worker-token
      secretKey: STUDIO_WORKER_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
