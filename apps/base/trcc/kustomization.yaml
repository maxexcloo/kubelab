apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trcc
resources:
  - namespace.yaml
components:
  - ../../components/default-deny
  - ../../components/workload
configMapGenerator:
  - name: trcc
    files:
      - trcc.json
configurations:
  - name-reference.yaml
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
