dashboard:
  font: system-sans
  theme: mono-large
display:
  skin: mono
model:
  api_key: ${OPENAI_API_KEY}
  base_url: ${OPENAI_BASE_URL}
  default: cli-proxy-api/openai/gpt-6.1-sol
  provider: custom:litellm
providers:
  litellm:
    name: LiteLLM
    api_key_env: OPENAI_API_KEY
    base_url: ${OPENAI_BASE_URL}
terminal:
  backend: local
  cwd: /opt/data/workspace
  home_mode: profile
