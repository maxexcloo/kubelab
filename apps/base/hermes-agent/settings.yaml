apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  values:
    route:
      private:
        hostnames:
          - hermes.excloo.com
        annotations:
          gethomepage.dev/description: Personal AI Agent
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/icon: https://github.com/NousResearch.png
          gethomepage.dev/name: Hermes Agent
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /api/status
