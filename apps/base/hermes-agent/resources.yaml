apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent
  namespace: hermes-agent
  annotations:
    onepassword.excloo.dev/defaults: '{"api-key":"","username":"max@excloo.com"}'
    onepassword.excloo.dev/generate-fields: api-server-key,password,session-secret
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: Hermes Agent
        property: api-key
      secretKey: OPENAI_API_KEY
    - remoteRef:
        key: Hermes Agent
        property: api-server-key
      secretKey: API_SERVER_KEY
    - remoteRef:
        key: Hermes Agent
        property: password
      secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
    - remoteRef:
        key: Hermes Agent
        property: session-secret
      secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
    - remoteRef:
        key: Hermes Agent
        property: username
      secretKey: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: hermes-agent
---
apiVersion: v1
kind: Namespace
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    gateway.excloo.dev/private-access: "true"
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-agent
  namespace: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 9119
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: hermes-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
