apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-release.yaml
  - private-dns.yaml
  - resources.yaml
patches:
  - path: settings.yaml
configMapGenerator:
  - name: hermes-agent
    namespace: hermes-agent
    files:
      - config.yaml
      - initialise.py
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: HelmRelease
      name: hermes-agent
      namespace: hermes-agent
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: PrivateDNSRecord
          name: hermes-agent
          namespace: hermes-agent
        fieldPaths:
          - spec.hostname
      - select:
          kind: HelmRelease
          name: hermes-agent
          namespace: hermes-agent
        fieldPaths:
          - spec.values.route.private.annotations.[gethomepage.dev/href]
          - spec.values.controllers.hermes-agent.containers.dashboard.env.HERMES_DASHBOARD_PUBLIC_URL
        options:
          delimiter: /
          index: 2
