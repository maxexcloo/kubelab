apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: karakeep
spec:
  endpoints:
    - path: /api/metrics
      port: http
      bearerTokenSecret:
        key: PROMETHEUS_AUTH_TOKEN
        name: karakeep
  selector:
    matchLabels:
      app.kubernetes.io/service: karakeep
