apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep
  annotations:
    onepassword.excloo.dev/generate-fields: meili-master-key,nextauth-secret,password
    onepassword.excloo.dev/owner-email-fields: username
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Karakeep
        property: meili-master-key
      secretKey: MEILI_MASTER_KEY
    - remoteRef:
        key: *item
        property: nextauth-secret
      secretKey: NEXTAUTH_SECRET
    - remoteRef:
        key: *item
        property: oidc-client-id
      secretKey: OAUTH_CLIENT_ID
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: OAUTH_CLIENT_SECRET
    - remoteRef:
        key: *item
        property: provider-openrouter-api-key
      secretKey: OPENAI_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: karakeep
