apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: karakeep
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/controller: karakeep
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: karakeep-chrome
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/controller: karakeep
      ports:
        - port: 9222
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/controller: chrome
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: karakeep-meilisearch
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/controller: karakeep
      ports:
        - port: 7700
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/controller: meilisearch
  policyTypes:
    - Ingress
