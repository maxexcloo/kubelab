apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              BROWSER_WEB_URL: "http://{{ .Release.Name }}-chrome:9222"
              CRAWLER_FULL_PAGE_ARCHIVE: "true"
              DATA_DIR: /data
              DISABLE_NEW_RELEASE_CHECK: "true"
              DISABLE_PASSWORD_AUTH: "true"
              INFERENCE_IMAGE_MODEL: openrouter/auto
              # OpenRouter's automatic routing may pick models without structured output support.
              INFERENCE_OUTPUT_SCHEMA: json
              INFERENCE_TEXT_MODEL: openrouter/auto
              MEILI_ADDR: "http://{{ .Release.Name }}-meilisearch:7700"
              NEXTAUTH_URL: https://app.invalid
              OAUTH_AUTO_REDIRECT: "true"
              OAUTH_PROVIDER_NAME: Pocket ID
              OAUTH_WELLKNOWN_URL: https://${identity_host}/.well-known/openid-configuration
              OPENAI_BASE_URL: https://openrouter.ai/api/v1
              TZ: ${time_zone}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.34.1
            probes:
              liveness: &health
                path: /api/health
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 25m
                memory: 384Mi
            # s6-overlay needs the image's /run, which is writable only by its node user.
            securityContext:
              readOnlyRootFilesystem: null
      chrome:
        containers:
          chrome:
            args:
              - --disable-gpu
              - --disable-dev-shm-usage
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: 156.0.8078.47-r1
            probes:
              readiness:
                enabled: true
                type: TCP
                spec:
                  timeoutSeconds: 5
              startup:
                enabled: true
                type: TCP
                spec:
                  failureThreshold: 30
                  timeoutSeconds: 5
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 10m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      meilisearch:
        strategy: Recreate
        containers:
          meilisearch:
            env:
              MEILI_HTTP_ADDR: 0.0.0.0:7700
              MEILI_NO_ANALYTICS: "true"
              MEILI_SERVER_PROVIDER: docker
              MEILI_UPGRADE_DB: "true"
              TZ: ${time_zone}
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    key: MEILI_MASTER_KEY
                    name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/getmeili/meilisearch
              tag: v1.55.0
            probes:
              readiness:
                enabled: true
                path: /health
                type: HTTP
                spec:
                  timeoutSeconds: 5
              startup:
                enabled: true
                path: /health
                type: HTTP
                spec:
                  failureThreshold: 30
                  timeoutSeconds: 5
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 20m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
              - path: /data
      meilisearch:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: local-path
        type: persistentVolumeClaim
        advancedMounts:
          meilisearch:
            meilisearch:
              - path: /meili_data
    route:
      private:
        annotations:
          gethomepage.dev/description: Bookmark Manager
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-karakeep
          gethomepage.dev/name: &title Karakeep
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: *title
        hostnames:
          - karakeep.${cluster_name}.excloo.dev
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 3000
    service:
      main:
        ports:
          http:
            port: 3000
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
            protocol: TCP
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
            protocol: HTTP
