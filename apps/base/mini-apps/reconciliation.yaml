apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mini-apps
  namespace: flux-system
spec:
  interval: 1m
  path: ./clusters/cluster
  # Temporary: keep Minilab's resources while this Kustomization is renamed.
  deletionPolicy: Orphan
  prune: false
  timeout: 5m
  wait: true
  dependsOn:
    - name: automation
  sourceRef:
    kind: GitRepository
    name: mini-apps
