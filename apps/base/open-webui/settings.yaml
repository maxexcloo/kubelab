apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  values:
    route:
      hostnames:
        - chat.excloo.com
      annotations:
        gethomepage.dev/description: AI Chat
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Artificial Intelligence
        gethomepage.dev/icon: sh-open-webui
        gethomepage.dev/name: Open WebUI
        monitoring.excloo.dev/enabled: "true"
