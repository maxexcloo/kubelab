apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - private-dns.yaml
  - service-account.yaml
  - source.yaml
  - storage.yaml
configurations:
  - name-reference.yaml
configMapGenerator:
  - name: open-webui-tool-images
    files:
      - tool-images.py
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.hostnames.0
    targets:
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.hostname
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.extraEnvVars.12.value
          - spec.values.extraEnvVars.5.value
          - spec.values.route.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
components:
  - ../../../platform/backups/destination
  - ../../../platform/backups/files
  - ../../components/app-namespace
