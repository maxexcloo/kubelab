apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 30m
  releaseName: open-webui
  suspend: true
  chart:
    spec:
      chart: open-webui
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
      version: 16.1.0
  values:
    enableOpenaiApi: false
    fullnameOverride: open-webui
    openaiApiKey: ""
    replicaCount: 1
    revisionHistoryLimit: 3
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsGroup: 568
      runAsNonRoot: true
      runAsUser: 568
      capabilities:
        drop:
          - ALL
    copyAppData:
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 64Mi
    extraEnvVars:
      - name: DEFAULT_USER_ROLE
        value: user
      - name: ENABLE_OAUTH_ID_TOKEN_COOKIE
        value: "False"
      - name: ENABLE_SIGNUP
        value: "False"
      - name: HOME
        value: /app/backend/data
      - name: OAUTH_CODE_CHALLENGE_METHOD
        value: S256
      - name: OPENID_REDIRECT_URI
        value: https://chat.excloo.com/oauth/oidc/callback
      - name: PYTHONDONTWRITEBYTECODE
        value: "1"
      - name: TZ
        value: Australia/Sydney
      - name: WEBUI_ADMIN_EMAIL
        valueFrom:
          secretKeyRef:
            key: WEBUI_ADMIN_EMAIL
            name: open-webui
      - name: WEBUI_ADMIN_NAME
        valueFrom:
          secretKeyRef:
            key: WEBUI_ADMIN_NAME
            name: open-webui
      - name: WEBUI_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            key: WEBUI_ADMIN_PASSWORD
            name: open-webui
      - name: WEBUI_SECRET_KEY
        valueFrom:
          secretKeyRef:
            key: WEBUI_SECRET_KEY
            name: open-webui
      - name: WEBUI_URL
        value: https://chat.excloo.com
    image:
      pullPolicy: IfNotPresent
      repository: ghcr.io/open-webui/open-webui
      tag: v0.11.1@sha256:6bb1fbe8ab0a3e0456067f493044ffb66a30a65a34be47f6a5862176a370dd16
    livenessProbe:
      failureThreshold: 3
      httpGet:
        path: /health
        port: http
      periodSeconds: 30
      timeoutSeconds: 5
    ollama:
      enabled: false
    persistence:
      enabled: true
      existingClaim: data
    pipelines:
      enabled: false
    podSecurityContext:
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 568
      runAsNonRoot: true
      runAsUser: 568
      seccompProfile:
        type: RuntimeDefault
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /health/db
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: 100m
        memory: 1Gi
    route:
      apiVersion: gateway.networking.k8s.io/v1
      enabled: true
      hostnames:
        - chat.excloo.com
      annotations:
        gethomepage.dev/description: AI Chat
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Artificial Intelligence
        gethomepage.dev/href: https://chat.excloo.com
        gethomepage.dev/icon: sh-open-webui
        gethomepage.dev/name: Open WebUI
      parentRefs:
        - name: private
          namespace: networking
    sso:
      enabled: true
      enableSignup: true
      oidc:
        clientExistingSecret: open-webui
        clientExistingSecretKey: OAUTH_CLIENT_SECRET
        clientIdExistingSecretKey: OAUTH_CLIENT_ID
        enabled: true
        providerName: Excloo ID
        providerUrl: https://id.excloo.com/.well-known/openid-configuration
        scopes: openid email profile
    startupProbe:
      failureThreshold: 30
      httpGet:
        path: /health
        port: http
      periodSeconds: 5
      timeoutSeconds: 5
    strategy:
      type: Recreate
    terminals:
      enabled: false
    tika:
      enabled: false
    volumeMounts:
      container:
        - mountPath: /tmp
          name: temporary
      initContainer:
        - mountPath: /tmp
          name: temporary
    volumes:
      - name: temporary
        emptyDir: {}
    websocket:
      enabled: true
      manager: redis
      redis:
        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
              - ALL
        image:
          pullPolicy: IfNotPresent
          repository: docker.io/valkey/valkey
          tag: 9.1.1@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
        podSecurityContext:
          fsGroup: 999
          fsGroupChangePolicy: OnRootMismatch
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
          seccompProfile:
            type: RuntimeDefault
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 20m
            memory: 128Mi
    workload:
      kind: Deployment
