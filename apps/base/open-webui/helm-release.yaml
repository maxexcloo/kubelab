apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  interval: 30m
  chart:
    spec:
      chart: open-webui
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
      version: 17.0.0
  values:
    enableOpenaiApi: false
    fullnameOverride: open-webui
    openaiApiKey: ""
    revisionHistoryLimit: 3
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    copyAppData:
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 64Mi
    extraInitContainers:
      - name: prepare-tool-images
        image: ghcr.io/open-webui/open-webui:v0.12.2@sha256:10e6a78ba2d172493460a9e8a92c496aaa7a64dc4d26d622a2e95e0c736081c9
        command:
          - python
          - /patch/tool-images.py
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: tool-image-patch
            mountPath: /patch
            readOnly: true
          - name: tool-image-runtime
            mountPath: /patched
    extraEnvVars:
      - name: DEFAULT_USER_ROLE
        value: user
      - name: ENABLE_OAUTH_ID_TOKEN_COOKIE
        value: "False"
      - name: ENABLE_SIGNUP
        value: "False"
      - name: HOME
        value: /app/backend/data
      - name: OAUTH_CODE_CHALLENGE_METHOD
        value: S256
      - name: OPENID_REDIRECT_URI
        value: https://app.invalid/oauth/oidc/callback
      - name: PYTHONDONTWRITEBYTECODE
        value: "1"
      - name: TZ
        value: Australia/Sydney
      - name: WEBUI_ADMIN_EMAIL
        valueFrom:
          secretKeyRef:
            key: WEBUI_ADMIN_EMAIL
            name: open-webui
      - name: WEBUI_ADMIN_NAME
        valueFrom:
          secretKeyRef:
            key: WEBUI_ADMIN_NAME
            name: open-webui
      - name: WEBUI_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            key: WEBUI_ADMIN_PASSWORD
            name: open-webui
      - name: WEBUI_SECRET_KEY
        valueFrom:
          secretKeyRef:
            key: WEBUI_SECRET_KEY
            name: open-webui
      - name: WEBUI_URL
        value: https://app.invalid
    image:
      pullPolicy: IfNotPresent
      repository: ghcr.io/open-webui/open-webui
      tag: v0.12.2@sha256:10e6a78ba2d172493460a9e8a92c496aaa7a64dc4d26d622a2e95e0c736081c9
    livenessProbe: &health
      httpGet:
        path: /health
        port: http
      timeoutSeconds: 5
    ollama:
      enabled: false
    persistence:
      enabled: true
      existingClaim: data
    pipelines:
      enabled: false
    podSecurityContext:
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 568
      runAsNonRoot: true
      runAsUser: 568
      seccompProfile:
        type: RuntimeDefault
    readinessProbe:
      <<: *health
      httpGet:
        path: /health/db
        port: http
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: 100m
        memory: 2Gi
    route:
      apiVersion: gateway.networking.k8s.io/v1
      enabled: true
      annotations:
        gethomepage.dev/description: AI Chat
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Artificial Intelligence
        gethomepage.dev/href: https://app.invalid
        gethomepage.dev/icon: sh-open-webui
        gethomepage.dev/name: Open WebUI
        monitoring.excloo.dev/enabled: "true"
        onepassword.excloo.dev/item: Open WebUI
      hostnames:
        - chat.excloo.com
      parentRefs:
        - name: private
          namespace: networking
    sso:
      enabled: true
      enableSignup: true
      oidc:
        clientExistingSecret: open-webui
        clientExistingSecretKey: OAUTH_CLIENT_SECRET
        clientIdExistingSecretKey: OAUTH_CLIENT_ID
        enabled: true
        providerName: Pocket ID
        providerUrl: https://identity.invalid/.well-known/openid-configuration
        scopes: openid email profile
    startupProbe:
      <<: *health
      failureThreshold: 30
    strategy:
      type: Recreate
    terminals:
      enabled: false
    tika:
      enabled: false
    volumeMounts:
      container:
        - mountPath: /app/backend/open_webui/utils/middleware.py
          name: tool-image-runtime
          readOnly: true
          subPath: middleware.py
        - mountPath: /tmp
          name: temporary
      initContainer:
        - mountPath: /tmp
          name: temporary
    volumes:
      - name: tool-image-patch
        configMap:
          name: open-webui-tool-images
      - name: tool-image-runtime
        emptyDir: {}
      - name: temporary
        emptyDir: {}
    websocket:
      enabled: true
      manager: redis
      redis:
        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        image:
          pullPolicy: IfNotPresent
          repository: docker.io/valkey/valkey
          tag: 9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
        podSecurityContext:
          fsGroup: 999
          fsGroupChangePolicy: OnRootMismatch
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
          seccompProfile:
            type: RuntimeDefault
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 20m
            memory: 128Mi
    workload:
      kind: Deployment
