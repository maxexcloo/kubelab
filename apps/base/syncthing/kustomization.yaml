apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: syncthing
resources:
  - external-secrets.yaml
  - namespace.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../components/private-dns
configMapGenerator:
  - name: syncthing-auth
    files:
      - configure_auth.sh
configurations:
  - name-reference.yaml
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.annotations.[gethomepage.dev/widget.url]
        options:
          delimiter: /
          index: 2
transformers:
  - ../../transformers/route-private
