apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: syncthing
resources:
  - external-secrets.yaml
  - namespace.yaml
  - pocket-id.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../components/oauth2-proxy
configMapGenerator:
  - name: syncthing-auth
    files:
      - configure_auth.sh
configurations:
  - name-reference.yaml
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.containers.oauth2-proxy.env.OAUTH2_PROXY_REDIRECT_URL
          - spec.values.route.private.annotations.[gethomepage.dev/href]
          - spec.values.route.private.annotations.[gethomepage.dev/widget.url]
        options:
          delimiter: /
          index: 2
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
transformers:
  - ../../transformers/cluster-scoped
  - ../../transformers/pocket-id-icon-private
