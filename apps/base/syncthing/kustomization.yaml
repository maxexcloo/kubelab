apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - private-dns.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../components/app-namespace
configMapGenerator:
  - name: syncthing-auth
    files:
      - configure_auth.sh
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.hostname
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
