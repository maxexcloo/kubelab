apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - external-secrets.yaml
  - namespace.yaml
  - pocket-id.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../components/oauth2-proxy
configMapGenerator:
  - name: syncthing-auth
    files:
      - configure_auth.sh
configurations:
  - name-reference.yaml
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
transformers:
  - ../../transformers/pocket-id-icon-private
