apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/defaults: '{"username":"max@excloo.com"}'
    onepassword.excloo.dev/generate-fields: password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item ekuczjex5kp6fhopu44flqdu3y
        property: password
      secretKey: password
    - remoteRef:
        key: *item
        property: username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
