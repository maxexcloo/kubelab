apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: syncthing
  annotations:
    onepassword.excloo.dev/generate-fields: password
    onepassword.excloo.dev/owner-email-fields: username
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Syncthing
        property: password
      secretKey: password
    - remoteRef:
        key: *item
        property: username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: syncthing
    template:
      engineVersion: v2
      mergePolicy: Merge
      # oauth2-proxy signs browsers in to the GUI with the owner's login.
      data:
        authorization: 'Basic {{ printf "%s:%s" .username .password | b64enc }}'
