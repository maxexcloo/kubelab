apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retained-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ""
  volumeName: syncthing-data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: syncthing-data
  labels:
    app.kubernetes.io/name: application
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 5Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/mnt/datasets/truenas-nvme/syncthing
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - kimbap
