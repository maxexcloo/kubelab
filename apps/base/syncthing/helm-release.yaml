apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            args:
              - serve
              - --no-browser
              - --no-restart
              - --no-upgrade
            env:
              HOME: /var/syncthing
              STGUIADDRESS: http://0.0.0.0:8384
              STHOMEDIR: /var/syncthing/config
              TZ: Australia/Sydney
            image: &syncthing-image
              pullPolicy: IfNotPresent
              repository: docker.io/syncthing/syncthing
              tag: 2.1.6@sha256:4d0281bdcb4ed9baf503d251d0544ddd856f49fce3f114056257ae172b7fb670
            probes:
              liveness: &health
                path: /rest/noauth/health
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi
        initContainers:
          authentication:
            command:
              - /bin/sh
              - /scripts/configure_auth.sh
            env:
              HOME: /var/syncthing
              STHOMEDIR: /var/syncthing/config
            image: *syncthing-image
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
    persistence:
      auth-script:
        name: syncthing-auth
        type: configMap
        advancedMounts:
          main:
            authentication:
              - path: /scripts
                readOnly: true
      credentials:
        name: "{{ .Release.Name }}"
        type: secret
        advancedMounts:
          main:
            authentication:
              - path: /credentials
                readOnly: true
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /var/syncthing
      files:
        hostPath: /var/mnt/datasets/truenas
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas
    route:
      private:
        annotations:
          gethomepage.dev/description: File Synchronisation
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-syncthing
          gethomepage.dev/name: Syncthing
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /rest/noauth/health
          onepassword.excloo.dev/item: Syncthing
        hostnames:
          - syncthing.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 8384
