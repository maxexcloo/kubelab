apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            args:
              - serve
              - --no-browser
              - --no-restart
              - --no-upgrade
            env:
              HOME: /var/syncthing
              STGUIADDRESS: http://0.0.0.0:8384
              STHOMEDIR: /var/syncthing/config
              TZ: ${time_zone}
            image: &syncthing-image
              pullPolicy: IfNotPresent
              repository: docker.io/syncthing/syncthing
              tag: 2.1.7
            probes:
              liveness: &health
                path: /rest/noauth/health
                port: 8384
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi
          oauth2-proxy:
            env:
              OAUTH2_PROXY_REDIRECT_URL: https://app.invalid/oauth2/callback
              UPSTREAM_AUTHORIZATION:
                valueFrom:
                  secretKeyRef:
                    key: authorization
                    name: "{{ .Release.Name }}"
              UPSTREAM_REQUEST_HEADERS: "[{name: Authorization, values: [{secretSource: {fromEnv: UPSTREAM_AUTHORIZATION}}]}]"
              UPSTREAM_URI: http://127.0.0.1:8384
        initContainers:
          authentication:
            command:
              - /bin/sh
              - /scripts/configure_auth.sh
            env:
              HOME: /var/syncthing
              STHOMEDIR: /var/syncthing/config
            image: *syncthing-image
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
    persistence:
      auth-script:
        name: syncthing-auth
        type: configMap
        advancedMounts:
          main:
            authentication:
              - path: /scripts
                readOnly: true
      backups:
        hostPath: ${dataset_root}/truenas/backups
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/backups
      credentials:
        name: "{{ .Release.Name }}"
        type: secret
        advancedMounts:
          main:
            authentication:
              - path: /credentials
                readOnly: true
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /var/syncthing
      documents:
        hostPath: ${dataset_root}/truenas/documents
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/documents
      games:
        hostPath: ${dataset_root}/truenas/games
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/games
      projects:
        hostPath: ${dataset_root}/truenas/projects
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/projects
      public:
        hostPath: ${dataset_root}/truenas/public
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /mnt/truenas/public
    route:
      private:
        annotations:
          gethomepage.dev/description: File Synchronisation
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-syncthing
          gethomepage.dev/name: &title Syncthing
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_SYNCTHING_API_KEY}}" }}'
          gethomepage.dev/widget.type: syncthing
          gethomepage.dev/widget.url: https://app.invalid
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /rest/noauth/health
          onepassword.excloo.dev/item: *title
        hostnames:
          - syncthing.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
        # The proxy injects the owner's GUI login, so API-key clients such as the
        # Homepage widget and the health check reach the GUI port directly.
        rules:
          - backendRefs:
              - identifier: main
                port: 8384
            matches:
              - path:
                  type: PathPrefix
                  value: /rest/noauth/
              - headers:
                  - name: X-API-Key
                    type: RegularExpression
                    value: .+
          - backendRefs:
              - identifier: main
                port: 4180
    service:
      main:
        ports:
          gui:
            port: 8384
