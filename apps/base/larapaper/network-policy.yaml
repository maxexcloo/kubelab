apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: larapaper
spec:
  ingress:
    - from:
        # Bifrost's MCP gateway serves the app's /mcp endpoint.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bifrost
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: larapaper
  policyTypes:
    - Ingress
