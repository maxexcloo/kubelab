apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              APP_TIMEZONE: Australia/Sydney
              APP_URL: https://app.invalid
              DB_DATABASE: database/storage/database.sqlite
              FORCE_HTTPS: "1"
              OIDC_ENABLED: "true"
              OIDC_ENDPOINT: https://identity.invalid
              PHP_OPCACHE_ENABLE: "1"
              REGISTRATION_ENABLED: "0"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/usetrmnl/larapaper
              tag: 0.44.0@sha256:48dd819a87aa42abf1ae9eb4ee9b1fad3080c8844a3057443a69dee7c213d0a2
            probes:
              liveness: null
              readiness: &ready
                path: /up
              startup: *ready
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 50m
                memory: 1Gi
            securityContext:
              readOnlyRootFilesystem: null
    defaultPodOptions:
      securityContext:
        fsGroup: 82
        runAsGroup: 82
        runAsUser: 82
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
              - path: /var/www/html/database/storage
                subPath: database
              - path: /var/www/html/storage/app/public/images/generated
                subPath: images
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 8080
      public:
        forceRename: "{{ .Release.Name }}"
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: TRMNL Server
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-trmnl
          gethomepage.dev/name: &title LaraPaper
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: qprahdzfh7qp5hdvxwwcjjnqqa
          onepassword.excloo.dev/title: *title
        hostnames:
          - larapaper.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 8080
