apiVersion: automation.excloo.dev/v1alpha1
kind: CloudflareAccessApplication
metadata:
  name: larapaper
spec:
  hostname: larapaper.excloo.com
  name: LaraPaper
---
apiVersion: automation.excloo.dev/v1alpha1
kind: CloudflareAccessApplication
metadata:
  name: larapaper-devices
spec:
  hostname: larapaper.excloo.com
  name: "LaraPaper: Devices"
  # TRMNL devices authenticate with their MAC address and access token.
  paths:
    - api/current_screen
    - api/display
    - api/log
    - api/screens
    - api/setup
    - storage/firmwares
    - storage/images/generated
