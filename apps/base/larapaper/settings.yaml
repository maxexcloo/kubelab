apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: larapaper
  namespace: larapaper
spec:
  values:
    route:
      public:
        hostnames:
          - larapaper.excloo.com
        annotations:
          gethomepage.dev/description: TRMNL Server
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/icon: sh-trmnl
          gethomepage.dev/name: LaraPaper
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: LaraPaper
    controllers:
      larapaper:
        containers:
          larapaper:
            env:
              APP_TIMEZONE: Australia/Sydney
              DB_DATABASE: database/storage/database.sqlite
              FORCE_HTTPS: "1"
              OIDC_ENABLED: "true"
              PHP_OPCACHE_ENABLE: "1"
              REGISTRATION_ENABLED: "0"
