apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/field-formats: '{"app-key":"laravel"}'
    onepassword.excloo.dev/generate-fields: app-key
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item qprahdzfh7qp5hdvxwwcjjnqqa
        property: app-key
      secretKey: APP_KEY
    - remoteRef:
        key: *item
        property: oidc-client-id
      secretKey: OIDC_CLIENT_ID
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: OIDC_CLIENT_SECRET
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
