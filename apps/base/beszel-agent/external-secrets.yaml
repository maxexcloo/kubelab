apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beszel-agent
  annotations:
    onepassword.excloo.dev/item: &item Beszel Agent
spec:
  data:
    - remoteRef:
        key: *item
        property: agent-token
      secretKey: token
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: beszel-agent
