apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/item: &item Beszel Agent
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: *item
        property: agent-token
      secretKey: token
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: application
