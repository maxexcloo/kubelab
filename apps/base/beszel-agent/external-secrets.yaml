apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/item: &item kqj7fgfs3qs2k523g24rc7htca
    onepassword.excloo.dev/title: Beszel Agent
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: *item
        property: agent-token
      secretKey: token
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: application
