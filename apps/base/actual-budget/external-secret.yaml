apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-budget
  namespace: actual-budget
  annotations:
    onepassword.excloo.dev/migrate-fields: '{"password":"oidc-client-secret","username":"oidc-client-id"}'
    onepassword.excloo.dev/remove-fields: password,username
spec:
  data:
    - remoteRef:
        key: Actual Budget
        property: oidc-client-id
      secretKey: ACTUAL_OPENID_CLIENT_ID
    - remoteRef:
        key: Actual Budget
        property: oidc-client-secret
      secretKey: ACTUAL_OPENID_CLIENT_SECRET
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: actual-budget
