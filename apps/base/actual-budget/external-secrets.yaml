apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: nrb2ibt7eu6lvwykuvl3pjzolq
        property: oidc-client-id
      secretKey: ACTUAL_OPENID_CLIENT_ID
    - remoteRef:
        key: nrb2ibt7eu6lvwykuvl3pjzolq
        property: oidc-client-secret
      secretKey: ACTUAL_OPENID_CLIENT_SECRET
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
