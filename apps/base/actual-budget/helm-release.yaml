apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              ACTUAL_HOSTNAME: 0.0.0.0
              ACTUAL_OPENID_DISCOVERY_URL: https://identity.invalid/.well-known/openid-configuration
              ACTUAL_OPENID_SERVER_HOSTNAME: https://app.invalid
              ACTUAL_PORT: "5006"
              ACTUAL_SERVER_FILES: /data/server-files
              ACTUAL_USER_CREATION_MODE: login
              ACTUAL_USER_FILES: /data/user-files
              TZ: Australia/Sydney
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/actualbudget/actual-server
              tag: 26.10.0
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 20m
                memory: 256Mi
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
    route:
      private:
        annotations:
          gethomepage.dev/description: Personal Finance
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-actual-budget
          gethomepage.dev/name: &title Actual Budget
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: nrb2ibt7eu6lvwykuvl3pjzolq
          onepassword.excloo.dev/title: *title
        hostnames:
          - budget.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 5006
