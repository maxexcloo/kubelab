apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-mcp
spec:
  # Bifrost's item holds the gateway's provider credentials.
  data:
    - remoteRef:
        key: Bifrost
        property: provider-home-assistant-access-token
      secretKey: HOMEASSISTANT_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant-mcp
