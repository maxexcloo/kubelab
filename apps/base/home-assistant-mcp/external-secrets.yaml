apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-mcp
spec:
  refreshInterval: 1h
  # LiteLLM's item holds the gateway's provider credentials.
  data:
    - remoteRef:
        key: LiteLLM
        property: provider-home-assistant-access-token
      secretKey: HOMEASSISTANT_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: home-assistant-mcp
