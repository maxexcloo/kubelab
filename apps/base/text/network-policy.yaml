apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: text
spec:
  ingress:
    - from:
        # Bifrost serves the models; Studio checks each model's /health.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bifrost
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: studio
          podSelector:
            matchLabels:
              app.kubernetes.io/name: studio
      ports:
        - port: 8000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: text
  policyTypes:
    - Ingress
