# One Service per model. Bifrost's router lists the running ones as ai/<name they report>
# and tries them in priority order for local/auto.
apiVersion: v1
kind: Service
metadata:
  name: gemma
  annotations:
    text.excloo.dev/priority: "5"
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
  selector:
    text.excloo.dev/model: gemma
---
