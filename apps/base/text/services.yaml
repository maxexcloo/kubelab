# One Service per model. Bifrost's router lists the running ones as local/<name they report>
# and tries them in priority order for local/auto, and the uncensored ones for local/uncensored.
apiVersion: v1
kind: Service
metadata:
  name: gemma
  annotations:
    text.excloo.dev/priority: "5"
    text.excloo.dev/uncensored: "true"
spec:
  ports:
    - name: http
      port: 8000
  selector:
    text.excloo.dev/model: gemma
---
