# One Service per model, annotated with the name it serves. Bifrost's router lists each as
# ai/<name> and tries the running ones in priority order for local/auto.
apiVersion: v1
kind: Service
metadata:
  name: gemma
  annotations:
    text.excloo.dev/name: gemma-4-31b-heretic
    text.excloo.dev/priority: "5"
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
  selector:
    text.excloo.dev/model: gemma
---
apiVersion: v1
kind: Service
metadata:
