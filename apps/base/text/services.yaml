# One Service per model; Bifrost's router tries them in order for local/text.
apiVersion: v1
kind: Service
metadata:
  name: gemma
spec:
  ports:
    - name: http
      port: 8000
      protocol: TCP
  selector:
    text.excloo.dev/model: gemma
---
