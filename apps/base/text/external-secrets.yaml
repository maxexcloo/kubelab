apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: text
spec:
  refreshInterval: 1h
  data:
    # Bifrost owns the key it presents to the local text models.
    - remoteRef:
        key: Bifrost
        property: provider-ai-api-key
      secretKey: API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
