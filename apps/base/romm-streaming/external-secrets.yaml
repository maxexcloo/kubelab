apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm-streaming
spec:
  # RomM owns the broker secret.
  data:
    - remoteRef:
        key: RoMM
        property: streaming-broker-secret
      secretKey: BROKER_SECRET
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
