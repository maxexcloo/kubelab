apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: romm-streaming
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    # Sessions only open from RomM, so this route has no Homepage card.
    gethomepage.dev/href: https://app.invalid
    onepassword.excloo.dev/item: RoMM
  labels:
    app.kubernetes.io/name: romm-streaming
    gateway.excloo.dev/public-access: "true"
spec:
  hostnames:
    - games-streaming.excloo.com
  parentRefs:
    - name: public-tunnel
      namespace: networking
  rules:
    - backendRefs:
        - name: romm-streaming
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: romm-streaming-private
  labels:
    app.kubernetes.io/name: romm-streaming
spec:
  hostnames:
    - app.invalid
    - romm-streaming.${cluster_name}.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: romm-streaming
          port: 3000
