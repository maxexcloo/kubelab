apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            env:
              # Only RomM may frame the room; the broker mints each session's token.
              BROKER_CSP_ENFORCE: "true"
              BROKER_FRAME_ANCESTORS: https://app.invalid
              # Mandu's owner, who owns the private ROM folder.
              PGID: "1000"
              PUID: "1000"
              TZ: ${time_zone}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: lscr.io/linuxserver/webstation
              tag: romm-v0.15.3-ls42
            probes:
              liveness: &health
                enabled: true
                port: 3000
                type: TCP
                spec:
                  timeoutSeconds: 5
              readiness: *health
              startup:
                <<: *health
                spec:
                  failureThreshold: 30
                  timeoutSeconds: 5
            resources:
              claims:
                - name: gpu
              limits:
                memory: 16Gi
              requests:
                cpu: 500m
                memory: 2Gi
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: gpu-1
    defaultPodOptions:
      nodeSelector:
        node.excloo.dev/dedicated: gaming
      tolerations:
        - key: node.excloo.dev/dedicated
          operator: Equal
          value: gaming
    persistence:
      # Syncthing keeps Mandu's RetroDECK BIOS folder, RetroArch's shared system
      # directory; standalone emulators are pointed at its subfolders once.
      bios:
        existingClaim: bios
        type: persistentVolumeClaim
        globalMounts:
          - path: /config/.config/retroarch/system
            readOnly: true
      config:
        existingClaim: config
        type: persistentVolumeClaim
        globalMounts:
          - path: /config
      # Syncthing keeps Mandu's copy of RomM's ROM library, at the path RomM sees.
      roms:
        existingClaim: roms
        type: persistentVolumeClaim
        globalMounts:
          - path: /romm/library/roms
            readOnly: true
      shm:
        medium: Memory
        sizeLimit: 1Gi
        type: emptyDir
        globalMounts:
          - path: /dev/shm
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 3000
      public:
        forceRename: "{{ .Release.Name }}"
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          # No Homepage card: sessions only open from RomM.
          gethomepage.dev/href: https://app.invalid
        hostnames:
          - streaming.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 3000
    service:
      main:
        controller: main
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            port: 3000
            protocol: HTTP
