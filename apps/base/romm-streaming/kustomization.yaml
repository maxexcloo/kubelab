apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romm-streaming
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - storage.yaml
components:
  - ../../components/gpu
  - ../../components/private-dns-control-d-only
  - ../../components/workload
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
transformers:
  - ../../transformers/route-public
