apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romm-streaming
resources:
  - namespace.yaml
  - route.yaml
  - service.yaml
  - storage.yaml
components:
  - ../../components/private-dns-control-d-only
replacements:
  - source:
      kind: HTTPRoute
      name: romm-streaming
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: romm-streaming
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HTTPRoute
          name: romm-streaming-private
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.hostname
transformers:
  - ../../transformers/cluster-scoped
