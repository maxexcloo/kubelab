apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: comfy-control
  namespace: comfy-control
spec:
  interval: 30m
  releaseName: comfy-control
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.2.1
  values:
    controllers:
      comfy-control:
        strategy: Recreate
        containers:
          comfy-control:
            envFrom:
              - secretRef:
                  name: comfy-control
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/maxexcloo/comfy-control
              tag: sha-19f9314-control@sha256:0d1033e859fdc7201e4b18d02e92400174e1aafcc5e5bd30f8a257b0b1ee85f5
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /health/live
                    port: 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 30
                  httpGet:
                    path: /health/ready
                    port: 8000
                  periodSeconds: 2
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 20m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: comfy-control
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        annotations:
          gethomepage.dev/href: https://app.invalid
        labels:
          app.kubernetes.io/name: comfy-control
        parentRefs:
          - name: private
            namespace: networking
    service:
      comfy-control:
        controller: comfy-control
        ports:
          http:
            port: 8000
            protocol: HTTP
