apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: comfy-control
  namespace: comfy-control
spec:
  values:
    route:
      private:
        hostnames:
          - comfy-control.excloo.com
        annotations:
          gethomepage.dev/description: ComfyUI Control & Proxy
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/icon: comfyui
          gethomepage.dev/name: Comfy Control
          monitoring.excloo.dev/enabled: "true"
    controllers:
      comfy-control:
        containers:
          comfy-control:
            env:
              CLIPROXY_URL: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317
              CONTROL_DATABASE: /data/comfy-control.db
              HOME: /tmp
              PYTHONDONTWRITEBYTECODE: "1"
              TZ: Australia/Sydney
              WORKER_IMAGE: ghcr.io/maxexcloo/comfy-control:sha-30be5d7-worker@sha256:8f8cdcd2f5a2d0d5206c75d3333d92dd5a1ef3c3f748f0c5a2ad3f70c146d3d7
