apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: comfy-control
  namespace: comfy-control
spec:
  values:
    route:
      private:
        hostnames:
          - comfy-control.excloo.com
        annotations:
          gethomepage.dev/description: ComfyUI Control & Proxy
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/icon: comfyui
          gethomepage.dev/name: Comfy Control
          monitoring.excloo.dev/enabled: "true"
    controllers:
      comfy-control:
        containers:
          comfy-control:
            env:
              CLIPROXY_URL: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317
              CONTROL_DATABASE: /data/comfy-control.db
              HOME: /tmp
              PYTHONDONTWRITEBYTECODE: "1"
              TZ: Australia/Sydney
              WORKER_IMAGE: ghcr.io/maxexcloo/comfy-control:sha-e86e503-worker@sha256:eed7a4f5d2ccea4d9f0bbef54981cf1d5e21d5faa89bcf2c6113278d87d44fb7
