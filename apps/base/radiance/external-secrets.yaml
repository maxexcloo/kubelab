apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radiance
spec:
  data:
    - remoteRef:
        key: Bifrost
        property: provider-ai-api-key
      secretKey: api-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: radiance
    template:
      data:
        API_KEY: '{{ index . "api-key" }}'
        authorization: 'Bearer {{ index . "api-key" }}'
