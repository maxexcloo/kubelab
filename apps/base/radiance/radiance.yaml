# One process serves every model and moves them between the cards, host memory and disk as
# requests name them (Radiance's docs/MULTIMODEL.md). An entry's name is the model id. The
# container appends Studio's converted fine-tunes (start.sh), so models stays last.
server:
  api-key-env: API_KEY
  host: "::"
  port: 8000
# host-headroom-mib matches the 8 GiB a load or park always leaves free. host-mib caps what parks may
# pin. Parked copies are driver (GTT) memory, which amdgpu caps at ttm.pages_limit (half of venus's
# RAM, 30.92 GiB) and the pod's cgroup does not count, so host-mib stays under that cap.
memory:
  gpu-headroom-mib: 192
  host-headroom-mib: 8192
  host-mib: 30720
scheduler:
  # Long runs (FLUX.3 Base, bf16 with LoRAs) finish before another model takes the cards.
  drain-timeout: 120s
  # H3 reads about 64 GiB from disk on a cold load.
  load-timeout: 600s
  warm-up: false
defaults:
  # Requests name any LoRA under this folder in their loras field.
  lora-dir: /models/comfyui/loras
models:
  # The H3 models take both cards. FastH3's extra attention projection leaves no room for a LoRA
  # slot; H3 has room for one at rank 16, which holds stacked adapters as their best rank-16 fit
  # (Radiance GUIDE §4.9.1-2).
  fasth3-8-step-v2-i8:
    lora-dir: ""
    model: /models/radiance/.v2/fasth3-8-step-v2-i8.rad
    tp: 2
    vision-tower-placement: ram
  flux-3-image-klein-base-iq8r:
    model: /models/radiance/.v2/flux-3-image-klein-base-iq8r.rad
    tp: 1
  flux-3-image-klein-base-iq8r-fast:
    model: /models/radiance/.v2/flux-3-image-klein-base-iq8r.rad
    tp: 2
    tp-wire: wht6
  flux-3-image-klein-iq8r:
    model: /models/radiance/.v2/flux-3-image-klein-iq8r.rad
    tp: 1
  flux-3-image-klein-iq8r-fast:
    model: /models/radiance/.v2/flux-3-image-klein-iq8r.rad
    tp: 2
    tp-wire: wht6
  # BFL's FLUX.3 prompt upsampler, which Bifrost serves as local/flux-pup outside local/auto.
  flux-3-image-klein-pup:
    lora-dir: ""
    model: /models/radiance/flux-3-image-klein-pup
    aliases: [flux-pup]
    tp: 1
    chat-template-kwargs: { "enable_thinking": false }
    kv-cache-dtype: i8
    max-model-len: 16384
    max-num-seqs: 2
    vision-tower-placement: ram
  # Text models, which Bifrost serves as local/<name> (apps/base/bifrost/router.py).
  # mixed-step-target-ms keeps streaming answers moving while another request's prompt is read.
  # The LoRA folder is ComfyUI's, for image and video; a text model given it does not load.
  gemma-4-31b-heretic:
    lora-dir: ""
    model: /models/radiance/.v2/gemma4-31b-heretic-ara-a4.rad
    tp: 1
    kv-cache-dtype: i8
    max-model-len: 169328
    max-num-seqs: 2
    num-speculative-tokens: 3
    vision-tower-placement: ram
  gemma-4-31b-heretic-i8g:
    lora-dir: ""
    model: /models/radiance/gemma4-31b-heretic-ara-i8g.rad
    tp: 2
    kv-cache-dtype: i8
    max-model-len: 262144
    max-num-seqs: 2
    num-speculative-tokens: 3
    vision-tower-placement: ram
  krea-2-turbo-iq8r:
    model: /models/radiance/.v2/krea-2-turbo-iq8r.rad
    tp: 1
  krea-2-turbo-iq8r-fast:
    model: /models/radiance/.v2/krea-2-turbo-iq8r.rad
    tp: 2
    tp-wire: wht6
  # LTX-2.5 takes one card, its Gemma 4 text encoder held in host memory, with room for one LoRA
  # slot at rank 16 (Radiance README).
  ltx-2.5-distilled-iq8r:
    model: /models/radiance/ltx-2.5-distilled-iq8r.rad
    tp: 1
    max-lora-rank: 16
    max-loras: 1
    vision-tower-placement: ram
  ltx-2.5-iq8r:
    model: /models/radiance/ltx-2.5-iq8r.rad
    tp: 1
    max-lora-rank: 16
    max-loras: 1
    vision-tower-placement: ram
  minimax-h3-i8:
    model: /models/radiance/.v2/minimax-h3-i8.rad
    tp: 2
    max-lora-rank: 16
    max-loras: 1
    vision-tower-placement: ram
  # A Qwen-Image request holds two sequences of max-model-len tokens, and the model's own 33600
  # is more than the cards. 8192 on one card holds three references with their prompt; Studio sends
  # four to the -refs entry, whose 20480 on two cards holds four.
  noctq-v4-iq8r:
    model: /models/radiance/.v2/noctq-v4-iq8r.rad
    tp: 1
    max-model-len: 8192
  noctq-v4-iq8r-refs:
    model: /models/radiance/.v2/noctq-v4-iq8r.rad
    tp: 2
    max-model-len: 20480
    tp-wire: wht6
  qwen-image-2.1-iq8r:
    model: /models/radiance/.v2/qwen-image-2.1-iq8r.rad
    tp: 1
    max-model-len: 8192
  qwen-image-2.1-iq8r-refs:
    model: /models/radiance/.v2/qwen-image-2.1-iq8r.rad
    tp: 2
    max-model-len: 20480
    tp-wire: wht6
  qwen-image-2.1-turbo-iq8r:
    model: /models/radiance/.v2/qwen-image-2.1-turbo-iq8r.rad
    tp: 1
    max-model-len: 8192
  qwen-image-2.1-turbo-iq8r-refs:
    model: /models/radiance/.v2/qwen-image-2.1-turbo-iq8r.rad
    tp: 2
    max-model-len: 20480
    tp-wire: wht6
  qwen3.8-27b-iq4r:
    lora-dir: ""
    model: /models/radiance/qwen3.8-27b-uncensored-iq4r-v4.rad
    tp: 1
    kv-cache-dtype: i8
    max-model-len: 262144
    max-num-seqs: 8
    mixed-step-target-ms: 150
    prefix-cache-mib: 4096
    reasoning-effort-map: high=xhigh
  qwen3.8-27b-uncensored:
    lora-dir: ""
    model: /models/radiance/.v2/qwen3.8-27b-uncensored-iq8r.rad
    tp: 2
    kv-cache-dtype: i8
    max-model-len: 262144
    max-num-seqs: 8
    mixed-step-target-ms: 150
    prefix-cache-mib: 8192
    reasoning-effort-map: high=xhigh
  # Its experts do not fit the cards: the hottest stay there and the rest stream from host memory.
  qwen3.8-flash-next:
    lora-dir: ""
    model: /models/radiance/qwen3.8-next-flash-uncensored-iqr-v4.rad
    tp: 2
    draft-coupling: "on"
    draft-depth: adaptive
    draft-depth-load: "on"
    draft-suffix: "on"
    draft-verify: traversal
    host-pool-mib: 12288
    kv-cache-dtype: i8
    max-model-len: 200000
    max-num-seqs: 8
    mixed-step-target-ms: 150
    num-speculative-tokens: 5
    placement: expert_tiered
    prefix-cache-mib: 4096
    reasoning-effort-map: high=xhigh
    tp-wire: wht6
