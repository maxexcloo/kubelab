apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: radiance
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
components:
  - ../../components/workload
  - ../../components/gpu
  - ../../components/default-deny
  - ../../components/oauth2-proxy-config
configurations:
  - name-reference.yaml
configMapGenerator:
  - name: radiance
    files:
      - radiance.yaml
      - start.sh
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
transformers:
  - ../../transformers/cluster-scoped
  - ../../transformers/pocket-id-icon-private
  - ../../transformers/route-private/hostname.yaml
