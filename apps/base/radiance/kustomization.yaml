apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: radiance
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - rbac.yaml
components:
  - ../../components/workload
  - ../../components/gpu
  - ../../components/default-deny
  - ../../components/oauth2-proxy
configurations:
  - name-reference.yaml
configMapGenerator:
  - name: radiance
    files:
      - radiance.yaml
      - start.sh
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.containers.oauth2-proxy.env.OAUTH2_PROXY_REDIRECT_URL
        options:
          delimiter: /
          index: 2
transformers:
  - ../../transformers/cluster-scoped
  - ../../transformers/pocket-id-icon-private
  - ../../transformers/route-private/hostname.yaml
