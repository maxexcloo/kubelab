apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: radiance
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bifrost
      ports:
        - port: 8000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: radiance
  policyTypes:
    - Ingress
