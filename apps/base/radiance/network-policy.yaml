apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: radiance
spec:
  ingress:
    # Studio uses the API; Traefik serves the UI.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: studio
          podSelector:
            matchLabels:
              app.kubernetes.io/name: studio
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8000
  podSelector:
    matchLabels:
      app.kubernetes.io/name: radiance
  policyTypes:
    - Ingress
