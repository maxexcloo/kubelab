apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: radiance
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: studio
          podSelector:
            matchLabels:
              app.kubernetes.io/name: studio
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 4180
  podSelector:
    matchLabels:
      app.kubernetes.io/name: radiance
  policyTypes:
    - Ingress
