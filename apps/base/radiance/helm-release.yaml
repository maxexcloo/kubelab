apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        annotations:
          studio.excloo.dev/backend: radiance
          studio.excloo.dev/capabilities: image,text,video
          studio.excloo.dev/label: Radiance
          studio.excloo.dev/vision: "true"
          studio.excloo.dev/worker: radiance
        labels:
          studio.excloo.dev/kind: image
        strategy: Recreate
        containers:
          main:
            command:
              - /bin/sh
              - /etc/radiance/start.sh
            env:
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    key: API_KEY
                    name: radiance
            image: &image
              repository: docker.io/stilldeadcode/radiance
              tag: 2.1.0
            # Readiness only: /health answers once the listener is open, and models load on
            # request.
            probes:
              readiness:
                enabled: true
                path: /health
                port: 8000
                type: HTTP
                spec:
                  timeoutSeconds: 5
            # H3 and FastH3 pin about 42.5 GiB of host memory to load, and Radiance keeps 8 GiB
            # of the limit free beside it (radiance.yaml). Venus has 64 GiB.
            resources:
              limits:
                memory: 58Gi
              requests:
                cpu: 100m
                memory: 1Gi
              claims:
                - name: gpu
          oauth2-proxy:
            env:
              OAUTH2_PROXY_REDIRECT_URL: https://app.invalid/oauth2/callback
              UPSTREAM_AUTHORIZATION:
                valueFrom:
                  secretKeyRef:
                    key: authorization
                    name: radiance
              UPSTREAM_REQUEST_HEADERS: "[{name: Authorization, values: [{secretSource: {fromEnv: UPSTREAM_AUTHORIZATION}}]}]"
              UPSTREAM_URI: http://127.0.0.1:8000
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: gpu-2
      prepull:
        # The release ServiceAccount is created after pre-install hooks.
        serviceAccount:
          name: default
        containers:
          main:
            image: *image
    defaultPodOptions:
      nodeSelector:
        node.excloo.dev/dedicated: gpu
      securityContext:
        seccompProfile:
          type: Unconfined
      terminationGracePeriodSeconds: 60
      tolerations:
        - key: node.excloo.dev/dedicated
          operator: Equal
          value: gpu
    persistence:
      config:
        name: radiance
        type: configMap
        globalMounts:
          - path: /etc/radiance
            readOnly: true
      data:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /data
      models:
        hostPath: ${dataset_root}/ai/models
        hostPathType: Directory
        type: hostPath
        advancedMounts:
          main:
            main:
              - path: /models
                readOnly: true
    route:
      private:
        annotations:
          gethomepage.dev/description: AI Inference
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: https://codeberg.org/StillDeadcode/radiance/raw/branch/main/dashboard/logo/radiance-mark.svg
          gethomepage.dev/name: &title Radiance
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /ping
          onepassword.excloo.dev/item: *title
        hostnames:
          - radiance.${cluster_name}.excloo.dev
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - identifier: main
                port: 4180
    service:
      main:
        controller: main
        ports:
          http:
            port: 8000
          oauth2-proxy:
            port: 4180
