# Studio benchmarks Radiance's text model with a BetterBench Job (Settings › Workers) and reads its
# pod's log; it reads pods and their logs through studio-runtime (apps/components/gpu).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: studio-benchmark
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: studio-benchmark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: studio-benchmark
subjects:
  - kind: ServiceAccount
    name: studio
    namespace: studio
