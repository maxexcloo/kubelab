apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: byparr
  namespace: byparr
spec:
  interval: 30m
  releaseName: byparr
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.1.0
  values:
    controllers:
      byparr:
        strategy: Recreate
        containers:
          byparr:
            stdin: true
            tty: true
            env:
              MOZ_DISABLE_CONTENT_SANDBOX: "1"
              TZ: Australia/Sydney
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/thephaseless/byparr
              tag: latest@sha256:874f719518f617d03a60e03411fc5d090647e1a877041e81f8dc965927c7deb6
            probes:
              liveness:
                enabled: true
                path: /docs
                port: 8191
                type: HTTP
              readiness:
                enabled: true
                path: /docs
                port: 8191
                type: HTTP
              startup:
                enabled: true
                path: /docs
                port: 8191
                type: HTTP
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 250m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      annotations:
        kubectl.kubernetes.io/default-container: byparr
        kubectl.kubernetes.io/restartedAt: "2026-08-24T10:08:00+10:00"
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: byparr
    persistence:
      cache:
        type: emptyDir
        globalMounts:
          - path: /cache
      downloads:
        type: emptyDir
        globalMounts:
          - path: /app/downloaded_files
      screenshots:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: local-path
        type: persistentVolumeClaim
        globalMounts:
          - path: /app/screenshots
      shared-memory:
        medium: Memory
        sizeLimit: 512Mi
        type: emptyDir
        globalMounts:
          - path: /dev/shm
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      byparr:
        controller: byparr
        annotations:
          gethomepage.dev/description: Anti-Bot Challenge Solver
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/icon: byparr
          gethomepage.dev/name: Byparr
        ports:
          http:
            port: 8191
            protocol: HTTP
