apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cliproxyapi
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../components/default-deny
  - ../../components/oauth2-proxy
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
  - ../../components/private-dns
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
transformers:
  - ../../transformers/pocket-id-icon-private
  - ../../transformers/route-private
  - callback-alias.yaml
