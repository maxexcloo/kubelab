apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi
  namespace: cliproxyapi
  annotations:
    onepassword.excloo.dev/generate-fields: api-key,management-key
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: CLIProxyAPI
        property: api-key
      secretKey: apiKey
    - remoteRef:
        key: CLIProxyAPI
        property: management-key
      secretKey: managementKey
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: cliproxyapi
    template:
      engineVersion: v2
      data:
        config.yaml: |
          port: 8317
          auth-dir: /data
          api-keys:
            - "{{ .apiKey }}"
          remote-management:
            allow-remote: true
            secret-key: "{{ .managementKey }}"
          usage-statistics-enabled: true
