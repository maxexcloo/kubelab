apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cliproxyapi-private
spec:
  hostnames:
    - cliproxyapi.${cluster_name}.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
      sectionName: websecure
  rules:
    # OpenUsage sends the management key for these calls without a browser session.
    - backendRefs:
        - name: cliproxyapi
          port: 8317
      matches:
        - method: GET
          path:
            type: Exact
            value: /v0/management/auth-files
        - method: POST
          path:
            type: Exact
            value: /v0/management/api-call
