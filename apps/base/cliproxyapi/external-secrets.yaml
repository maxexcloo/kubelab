apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/generate-fields: password,virtual-key-librechat,virtual-key-litellm
    onepassword.excloo.dev/remove-fields: master-key
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item 7affbypxjhmx2jkwpvhbhfr6lq
        property: virtual-key-librechat
      secretKey: apiKey
    - remoteRef:
        key: *item
        property: virtual-key-litellm
      secretKey: litellmApiKey
    - remoteRef:
        key: *item
        property: password
      secretKey: managementKey
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
    template:
      engineVersion: v2
      data:
        config.yaml: |
          port: 8317
          auth-dir: /data
          api-keys:
            - "{{ .apiKey }}"
            - "{{ .litellmApiKey }}"
          remote-management:
            allow-remote: true
            secret-key: "{{ .managementKey }}"
          usage-statistics-enabled: true
