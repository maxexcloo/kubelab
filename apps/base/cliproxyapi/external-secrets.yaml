apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi
  annotations:
    onepassword.excloo.dev/generate-fields: password,virtual-key-bifrost,virtual-key-librechat
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item CLI Proxy API
        property: virtual-key-librechat
      secretKey: apiKey
    - remoteRef:
        key: *item
        property: virtual-key-bifrost
      secretKey: bifrostApiKey
    - remoteRef:
        key: *item
        property: password
      secretKey: managementKey
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cliproxyapi
    template:
      engineVersion: v2
      data:
        config.yaml: |
          port: 8317
          auth-dir: /data
          api-keys:
            - "{{ .apiKey }}"
            - "{{ .bifrostApiKey }}"
          remote-management:
            allow-remote: true
            secret-key: "{{ .managementKey }}"
          usage-statistics-enabled: true
