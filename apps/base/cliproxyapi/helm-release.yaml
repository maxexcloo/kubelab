apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              TZ: Australia/Sydney
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/eceasy/cli-proxy-api
              tag: v8.0.33
            probes:
              liveness: &health
                path: /
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 32Mi
    persistence:
      config:
        name: "{{ .Release.Name }}"
        type: secret
        advancedMounts:
          main:
            main:
              - path: /CLIProxyAPI/config.yaml
                readOnly: true
                subPath: config.yaml
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
      static:
        type: emptyDir
        globalMounts:
          - path: /CLIProxyAPI/static
    route:
      private:
        annotations:
          gethomepage.dev/description: Subscription Proxy
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/href: https://app.invalid/management.html
          gethomepage.dev/icon: mdi-api-#ffffff
          gethomepage.dev/name: &title CLI Proxy API
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /management.html
          onepassword.excloo.dev/item: *title
        hostnames:
          - cliproxy.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 8317
