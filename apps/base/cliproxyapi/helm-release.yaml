apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              TZ: ${time_zone}
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/eceasy/cli-proxy-api
              tag: v8.0.45
            probes:
              liveness: &health
                path: /
                port: 8317
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 32Mi
          oauth2-proxy:
            env:
              OAUTH2_PROXY_REDIRECT_URL: https://app.invalid/oauth2/callback
              UPSTREAM_AUTHORIZATION:
                valueFrom:
                  secretKeyRef:
                    key: authorization
                    name: "{{ .Release.Name }}"
              UPSTREAM_REQUEST_HEADERS: "[{name: Authorization, values: [{secretSource: {fromEnv: UPSTREAM_AUTHORIZATION}}]}]"
              UPSTREAM_URI: http://127.0.0.1:8317
    persistence:
      config:
        name: "{{ .Release.Name }}"
        type: secret
        advancedMounts:
          main:
            main:
              - path: /CLIProxyAPI/config.yaml
                readOnly: true
                subPath: config.yaml
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
      static:
        type: emptyDir
        globalMounts:
          - path: /CLIProxyAPI/static
    route:
      private:
        annotations:
          gethomepage.dev/description: Subscription Proxy
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/href: https://app.invalid/management.html
          gethomepage.dev/icon: mdi-api-#ffffff
          gethomepage.dev/name: &title CLI Proxy API
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /healthz
          onepassword.excloo.dev/item: *title
        hostnames:
          - cliproxy.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
        # The proxy injects the management key, so client APIs, which carry their own
        # keys, and the health check reach the app directly.
        rules:
          - backendRefs:
              - identifier: main
                port: 8317
            matches:
              - path:
                  type: PathPrefix
                  value: /backend-api/codex
              - path:
                  type: Exact
                  value: /healthz
              - path:
                  type: PathPrefix
                  value: /openai/v1
              - path:
                  type: PathPrefix
                  value: /v1
              - path:
                  type: PathPrefix
                  value: /v1beta
          - backendRefs:
              - identifier: main
                port: 4180
    service:
      main:
        ports:
          app:
            port: 8317
