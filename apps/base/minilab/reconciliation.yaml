apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minilab
  namespace: flux-system
spec:
  interval: 1m
  path: ./clusters/${cluster_name}
  prune: true
  serviceAccountName: minilab
  timeout: 5m
  wait: true
  dependsOn:
    - name: automation
  sourceRef:
    kind: GitRepository
    name: minilab
