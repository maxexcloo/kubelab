apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: signtools
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - private-dns.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../components/default-deny
  - ../../components/oauth2-proxy
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
configMapGenerator:
  - name: signtools-listing
    files:
      - index.cgi
configurations:
  - name-reference.yaml
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
transformers:
  - ../../transformers/cluster-scoped
  - ../../transformers/pocket-id-icon-public
