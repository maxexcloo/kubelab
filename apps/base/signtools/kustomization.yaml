apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - helm-release.yaml
  - private-dns.yaml
  - resources.yaml
patches:
  - path: settings.yaml
replacements:
  - source:
      kind: HelmRelease
      name: signtools
      namespace: signtools
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: PrivateDNSRecord
          name: signtools
          namespace: signtools
        fieldPaths:
          - spec.hostname
      - select:
          kind: HelmRelease
          name: signtools
          namespace: signtools
        fieldPaths:
          - spec.values.controllers.signtools.containers.signtools.env.SERVER_URL
          - spec.values.route.private.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
