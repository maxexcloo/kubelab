apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application
  labels:
    app.kubernetes.io/name: application
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: signtools
  policyTypes:
    - Ingress
