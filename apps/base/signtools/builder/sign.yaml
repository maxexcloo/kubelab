name: Sign
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: signing
  cancel-in-progress: false
jobs:
  sign:
    # The bundled injection helper is an Intel binary.
    runs-on: macos-26-intel
    timeout-minutes: 30
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SECRET_URL: ${{ secrets.SECRET_URL }}
    steps:
      - name: Check Out Builder Configuration
        uses: actions/checkout@v7
        with:
          path: builder
          persist-credentials: false
      - name: Connect To Tailscale
        uses: tailscale/github-action@v4
        with:
          audience: ${{ secrets.TS_AUDIENCE }}
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tags: tag:ephemeral
          version: 1.104.1
      - name: Check Private Connection
        run: curl --fail --show-error --silent "$SECRET_URL" >/dev/null
      - name: Check Out Signing Tools
        uses: actions/checkout@v7
        with:
          path: signer
          persist-credentials: false
          ref: 8790863e64148768be9e8320c361411580d52554
          repository: SignTools/SignTools-CI
      - name: Check Dependencies
        working-directory: signer
        run: |
          command -v codesign fastlane node python3
          xcrun lipo -verify_arch x86_64 insert_dylib
      - name: Sign App
        working-directory: signer
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 ../builder/run_signer.py
