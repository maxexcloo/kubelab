apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            args:
              - -config
              - /tmp/signer-cfg.yaml
            env:
              BASIC_AUTH_ENABLE: "false"
              BUILDER_GITHUB_ENABLE: "true"
              BUILDER_GITHUB_ORG_NAME: maxexcloo
              BUILDER_GITHUB_REF: main
              BUILDER_GITHUB_REPO_NAME: signtools-builder
              BUILDER_GITHUB_WORKFLOW_FILE_NAME: sign.yaml
              REDIRECT_HTTPS: "false"
              SAVE_DIR: /data
              SERVER_URL: https://app.invalid
              SIGN_TIMEOUT_MINS: "30"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/signtools/signtools
              tag: 3.0.12
            probes:
              liveness: &health
                type: TCP
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 20m
                memory: 128Mi
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
      profile:
        name: signtools-profile
        type: secret
        globalMounts:
          - path: /data/profiles/developer
            readOnly: true
      temporary:
        medium: Memory
    route:
      private:
        annotations:
          gethomepage.dev/description: iOS App Signing & Installation
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: mdi-apple-#ffffff
          gethomepage.dev/name: &title SignTools
          onepassword.excloo.dev/item: ssfpxdcvrsrvveyfa5aksoptva
          onepassword.excloo.dev/title: *title
        hostnames:
          - signtools.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 8080
