apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            # SignTools writes this configuration, including the GitHub token, at
            # startup; restart the workload after credential changes.
            args:
              - -config
              - /tmp/signer-cfg.yaml
            env:
              # oauth2-proxy signs browsers in with Pocket ID; worker endpoints keep
              # SignTools' generated bearer key.
              BASIC_AUTH_ENABLE: "false"
              BUILDER_GITHUB_ENABLE: "true"
              BUILDER_GITHUB_ORG_NAME: maxexcloo
              BUILDER_GITHUB_REF: main
              BUILDER_GITHUB_REPO_NAME: signtools-builder
              BUILDER_GITHUB_WORKFLOW_FILE_NAME: sign.yaml
              REDIRECT_HTTPS: "false"
              SAVE_DIR: /data
              SERVER_URL: https://app.invalid
              SIGN_TIMEOUT_MINS: "30"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/signtools/signtools
              tag: 3.0.12
            probes:
              liveness: &health
                port: 8080
                type: TCP
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 20m
                memory: 128Mi
          oauth2-proxy:
            env:
              OAUTH2_PROXY_REDIRECT_URL: https://app.invalid/oauth2/callback
              # Over-the-air installs, signed files and the builder work without a
              # browser session (SignTools INSTALL.md, Reverse proxy).
              OAUTH2_PROXY_SKIP_AUTH_ROUTES: ^/apps/[^/]+/,^/files/,^/jobs(/|$)
              OAUTH2_PROXY_UPSTREAMS: http://127.0.0.1:8080
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
      profile:
        name: signtools-profile
        type: secret
        globalMounts:
          # A stable profile ID keeps saved apps associated across restarts.
          - path: /data/profiles/developer
            readOnly: true
      temporary:
        medium: Memory
    route:
      private:
        annotations:
          gethomepage.dev/description: iOS App Signing & Installation
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: mdi-apple-#ffffff
          gethomepage.dev/name: &title SignTools
          monitoring.excloo.dev/enabled: "true"
          # oauth2-proxy answers /ping without a session.
          monitoring.excloo.dev/path: /ping
          onepassword.excloo.dev/item: *title
        hostnames:
          - signtools.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
