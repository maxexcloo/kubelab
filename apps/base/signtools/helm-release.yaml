apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: signtools
  namespace: signtools
spec:
  interval: 30m
  releaseName: signtools
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  values:
    controllers:
      signtools:
        replicas: 1
        strategy: Recreate
        containers:
          signtools:
            args:
              - -config
              - /tmp/signer-cfg.yaml
            envFrom:
              - secretRef:
                  name: signtools
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/signtools/signtools
              tag: 3.0.12@sha256:7d0110b6138ca7d3ae3b4e5d303dc53fa20f6d803faf3ce29ff38f062cd8c8bb
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                custom: true
                enabled: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  tcpSocket:
                    port: 8080
                  periodSeconds: 5
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 20m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: signtools
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
      profile:
        name: signtools-profile
        type: secret
        globalMounts:
          - path: /data/profiles/developer
            readOnly: true
      temporary:
        medium: Memory
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        annotations:
          gethomepage.dev/href: https://app.invalid
        labels:
          app.kubernetes.io/name: signtools
        parentRefs:
          - name: private
            namespace: networking
    service:
      signtools:
        controller: signtools
        ports:
          http:
            port: 8080
            protocol: HTTP
