apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          listing:
            args:
              - httpd
              - -f
              - -h
              - /www
              - -p
              - "8090"
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0
            probes:
              liveness: &listing-health
                enabled: true
                port: 8090
                type: TCP
                spec:
                  timeoutSeconds: 5
              readiness: *listing-health
              startup:
                <<: *listing-health
                spec:
                  failureThreshold: 30
                  timeoutSeconds: 5
            resources:
              limits:
                memory: 32Mi
              requests:
                cpu: 5m
                memory: 8Mi
          main:
            # SignTools writes this configuration, including the GitHub token, at
            # startup; restart the workload after credential changes.
            args:
              - -config
              - /tmp/signer-cfg.yaml
            env:
              # oauth2-proxy signs browsers in with Pocket ID; worker endpoints keep
              # SignTools' generated bearer key.
              BASIC_AUTH_ENABLE: "false"
              BUILDER_GITHUB_ENABLE: "true"
              BUILDER_GITHUB_ORG_NAME: maxexcloo
              BUILDER_GITHUB_REF: main
              BUILDER_GITHUB_REPO_NAME: signtools-builder
              BUILDER_GITHUB_WORKFLOW_FILE_NAME: sign.yaml
              REDIRECT_HTTPS: "false"
              SAVE_DIR: /data
              # SignTools gives this address to the Tailscale-connected builder; install
              # links follow the request host.
              SERVER_URL: https://signtools.${cluster_name}.excloo.dev
              SIGN_TIMEOUT_MINS: "30"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              repository: docker.io/signtools/signtools
              tag: 3.1.0
            probes:
              liveness: &health
                port: 8080
                type: TCP
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 20m
                memory: 128Mi
          oauth2-proxy:
            env:
              OAUTH2_PROXY_REDIRECT_URL: https://apps.excloo.com/oauth2/callback
              # Over-the-air installs and the builder work without a browser session
              # (SignTools INSTALL.md, Reverse proxy); other app paths change state.
              OAUTH2_PROXY_SKIP_AUTH_ROUTES: ^/apps/[^/]+/(install|manifest|signed)$,^/files/,^/jobs(/|$)
              UPSTREAM_URI: http://127.0.0.1:8080
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
      listing:
        # Busybox httpd runs only executable CGI scripts (0555).
        defaultMode: 365
        name: signtools-listing
        type: configMap
        advancedMounts:
          main:
            listing:
              - path: /www/cgi-bin
                readOnly: true
      profile:
        name: signtools-profile
        type: secret
        globalMounts:
          # A stable profile ID keeps saved apps associated across restarts.
          - path: /data/profiles/developer
            readOnly: true
      temporary:
        medium: Memory
    route:
      private:
        hostnames:
          - apps.excloo.com
          - signtools.${cluster_name}.excloo.dev
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
      # Publicly, only the app listing and install paths exist; the private route
      # keeps the SignTools interface on the same hostname.
      public:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: iOS App Signing & Installation
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://apps.excloo.com
          gethomepage.dev/icon: mdi-apple-#ffffff
          gethomepage.dev/name: &title SignTools
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: *title
        hostnames:
          - apps.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
        rules:
          - backendRefs:
              - identifier: main
                port: 8090
            matches:
              - path:
                  type: Exact
                  value: /
          - backendRefs:
              - identifier: main
                port: 4180
            matches:
              - path:
                  type: RegularExpression
                  value: ^/apps/[^/]+/(install|manifest|signed)$
    service:
      main:
        ports:
          listing:
            port: 8090
