apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signtools
  namespace: signtools
  annotations:
    onepassword.excloo.dev/defaults: '{"username":"max@excloo.com"}'
    onepassword.excloo.dev/generate-fields: password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: SignTools
        property: github-token
      secretKey: BUILDER_GITHUB_TOKEN
    - remoteRef:
        key: SignTools
        property: password
      secretKey: BASIC_AUTH_PASSWORD
    - remoteRef:
        key: SignTools
        property: username
      secretKey: BASIC_AUTH_USERNAME
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: signtools
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signtools-profile
  namespace: signtools
  annotations:
    onepassword.excloo.dev/item: SignTools
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: SignTools
        property: apple-account-name
      secretKey: account_name.txt
    - remoteRef:
        key: SignTools
        property: apple-account-password
      secretKey: account_pass.txt
    - remoteRef:
        decodingStrategy: Base64
        key: SignTools
        property: certificate-base64
      secretKey: cert.p12
    - remoteRef:
        key: SignTools
        property: certificate-password
      secretKey: cert_pass.txt
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: signtools-profile
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        name.txt: Apple Developer
