apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: ssfpxdcvrsrvveyfa5aksoptva
        property: provider-github-access-token
      secretKey: BUILDER_GITHUB_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signtools-profile
  annotations:
    onepassword.excloo.dev/item: &item ssfpxdcvrsrvveyfa5aksoptva
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: *item
        property: apple-account-name
      secretKey: account_name.txt
    - remoteRef:
        key: *item
        property: apple-account-password
      secretKey: account_pass.txt
    - remoteRef:
        decodingStrategy: Base64
        key: *item
        property: certificate-base64
      secretKey: cert.p12
    - remoteRef:
        key: *item
        property: certificate-password
      secretKey: cert_pass.txt
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: signtools-profile
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        name.txt: Apple Developer
