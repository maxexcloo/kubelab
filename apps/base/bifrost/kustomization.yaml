apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bifrost
resources:
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - route.yaml
  - source.yaml
  - storage.yaml
replacements:
  # The chart source lives in the namespace the release references.
  - source:
      kind: HelmRelease
      fieldPath: spec.chart.spec.sourceRef.namespace
    targets:
      - select:
          kind: HelmRepository
        fieldPaths:
          - metadata.namespace
  - source:
      kind: HTTPRoute
      name: bifrost
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: bifrost
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.hostname
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.bifrost.client.allowedOrigins.0
        options:
          delimiter: /
          index: 2
components:
  - ../../components/oauth2-proxy-config
  - ../../components/private-dns
transformers:
  - ../../transformers/cluster-scoped
