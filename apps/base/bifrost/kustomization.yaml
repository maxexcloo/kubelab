apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bifrost
resources:
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - private-dns.yaml
  - route.yaml
  - service.yaml
  - source.yaml
  - storage.yaml
configMapGenerator:
  - name: router
    files:
      - router.py
replacements:
  # The chart source lives in the namespace the release references.
  - source:
      kind: HelmRelease
      fieldPath: spec.chart.spec.sourceRef.namespace
    targets:
      - select:
          kind: HelmRepository
        fieldPaths:
          - metadata.namespace
components:
  - ../../components/oauth2-proxy-config
  - ../../components/default-deny
transformers:
  - ../../transformers/cluster-scoped
