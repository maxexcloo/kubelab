apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bifrost
  annotations:
    gethomepage.dev/description: AI Gateway
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Artificial Intelligence
    gethomepage.dev/href: https://app.invalid
    gethomepage.dev/icon: mdi-bridge-#ffffff
    gethomepage.dev/name: &title Bifrost
    monitoring.excloo.dev/enabled: "true"
    monitoring.excloo.dev/path: /health
    onepassword.excloo.dev/item: *title
  labels:
    app.kubernetes.io/name: bifrost
spec:
  hostnames:
    - bifrost.excloo.com
    - bifrost.${cluster_name}.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: studio
          namespace: studio
          port: 8787
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp/results
      matches:
        - path:
            type: PathPrefix
            value: /studio/mcp/results
    # Dashboard pages and their admin API sign in with Pocket ID through oauth2-proxy.
    # Everything else, including inference, MCP and its OAuth endpoints, carries its own
    # keys and reaches Bifrost directly; an /api call that bypassed the proxy would still
    # be refused without the setup token.
    - backendRefs:
        - name: bifrost-oauth2-proxy
          port: 4180
      matches:
        - path:
            type: Exact
            value: /
        - path:
            type: PathPrefix
            value: /agent
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /login
        - path:
            type: PathPrefix
            value: /oauth
        - path:
            type: PathPrefix
            value: /oauth2-proxy
        - path:
            type: PathPrefix
            value: /pprof
        - path:
            type: PathPrefix
            value: /workspace
        - path:
            type: PathPrefix
            value: /ws
    - backendRefs:
        - name: bifrost
          port: 8080
