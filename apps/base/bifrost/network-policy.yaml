apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bifrost
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: librechat
          podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat
        # Studio writes chat prompts with its own virtual key.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: studio
          podSelector:
            matchLabels:
              app.kubernetes.io/name: studio
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bifrost
  policyTypes:
    - Ingress
