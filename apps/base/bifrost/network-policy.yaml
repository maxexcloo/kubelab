apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bifrost
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: karakeep
          podSelector:
            matchLabels:
              app.kubernetes.io/controller: karakeep
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: librechat
          podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: papra
          podSelector:
            matchLabels:
              app.kubernetes.io/controller: papra
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: reactive-resume
          podSelector:
            matchLabels:
              app.kubernetes.io/controller: reactive-resume
        # Studio writes prompts and chats with its own virtual key.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: studio
          podSelector:
            matchLabels:
              app.kubernetes.io/name: studio
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 4180
        - port: 8080
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bifrost
  policyTypes:
    - Ingress
