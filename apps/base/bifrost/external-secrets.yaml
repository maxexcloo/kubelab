apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost
  annotations:
    onepassword.excloo.dev/field-formats: '{"encryption-key":"alphanumeric","setup-token":"alphanumeric","virtual-key-claude":"bifrost","virtual-key-codex":"bifrost","virtual-key-librechat":"bifrost","virtual-key-opencode":"bifrost","virtual-key-owner":"bifrost","virtual-key-pi":"bifrost","virtual-key-studio":"bifrost"}'
    onepassword.excloo.dev/generate-fields: encryption-key,password,setup-token,virtual-key-claude,virtual-key-codex,virtual-key-librechat,virtual-key-opencode,virtual-key-owner,virtual-key-pi,virtual-key-studio
    onepassword.excloo.dev/owner-email-fields: username
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Bifrost
        property: provider-ai-api-key
      secretKey: AI_API_KEY
    - remoteRef:
        key: *item
        property: provider-abliteration-api-key
      secretKey: ABLITERATION_API_KEY
    - remoteRef:
        key: *item
        property: provider-deepseek-api-key
      secretKey: DEEPSEEK_API_KEY
    - remoteRef:
        key: *item
        property: encryption-key
      secretKey: BIFROST_ENCRYPTION_KEY
    - remoteRef:
        key: *item
        property: provider-opencode-1-api-key
      secretKey: OPENCODE_API_KEY_1
    - remoteRef:
        key: *item
        property: provider-opencode-2-api-key
      secretKey: OPENCODE_API_KEY_2
    - remoteRef:
        key: *item
        property: provider-openrouter-api-key
      secretKey: OPENROUTER_API_KEY
    - remoteRef:
        key: *item
        property: password
      secretKey: password
    - remoteRef:
        key: *item
        property: provider-reactive-resume-api-key
      secretKey: REACTIVE_RESUME_API_KEY
    - remoteRef:
        key: *item
        property: provider-refuseless-api-key
      secretKey: REFUSELESS_API_KEY
    # oauth2-proxy sends this to unlock /api while dashboard auth is off.
    - remoteRef:
        key: *item
        property: setup-token
      secretKey: BIFROST_SETUP_TOKEN
    # CLI Proxy API and Studio own their credentials.
    - remoteRef:
        key: CLI Proxy API
        property: virtual-key-bifrost
      secretKey: CLIPROXY_API_KEY
    - remoteRef:
        key: Studio
        property: mcp-api-key
      secretKey: STUDIO_MCP_API_KEY
    - remoteRef:
        key: *item
        property: username
      secretKey: username
    - remoteRef:
        key: *item
        property: virtual-key-claude
      secretKey: VIRTUAL_KEY_CLAUDE
    - remoteRef:
        key: *item
        property: virtual-key-codex
      secretKey: VIRTUAL_KEY_CODEX
    - remoteRef:
        key: *item
        property: virtual-key-librechat
      secretKey: VIRTUAL_KEY_LIBRECHAT
    - remoteRef:
        key: *item
        property: virtual-key-opencode
      secretKey: VIRTUAL_KEY_OPENCODE
    - remoteRef:
        key: *item
        property: virtual-key-owner
      secretKey: VIRTUAL_KEY_OWNER
    - remoteRef:
        key: *item
        property: virtual-key-pi
      secretKey: VIRTUAL_KEY_PI
    - remoteRef:
        key: *item
        property: virtual-key-studio
      secretKey: VIRTUAL_KEY_STUDIO
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bifrost
    template:
      engineVersion: v2
      mergePolicy: Merge
      # Bifrost resolves env references only as whole values, so headers carry their scheme here.
      data:
        STUDIO_MCP_AUTHORIZATION: Bearer {{ .STUDIO_MCP_API_KEY }}
