apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bifrost
  namespace: bifrost
spec:
  interval: 30m
  releaseName: bifrost
  chart:
    spec:
      chart: bifrost
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bifrost
        namespace: flux-system
      version: 2.1.38
  values:
    fullnameOverride: bifrost
    image:
      pullPolicy: IfNotPresent
      repository: docker.io/maximhq/bifrost
      tag: v1.6.9
    bifrost:
      authConfig:
        existingSecret: bifrost
        isEnabled: true
      encryptionKeySecret:
        key: encryption-key
        name: bifrost
      providers:
        comfy-control:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: comfy-control
              models: ["*"]
              value: env.COMFY_CONTROL_API_KEY
              weight: 1
          network_config:
            allow_private_network: true
            base_url: http://comfy-control.comfy-control.svc.cluster.local:8000
            default_request_timeout_in_seconds: 1200
    env:
      - name: BIFROST_API_KEY
        valueFrom:
          secretKeyRef:
            key: BIFROST_API_KEY
            name: bifrost
      - name: CLIPROXY_API_KEY
        valueFrom:
          secretKeyRef:
            key: CLIPROXY_API_KEY
            name: bifrost
      - name: COMFY_CONTROL_API_KEY
        valueFrom:
          secretKeyRef:
            key: COMFY_CONTROL_API_KEY
            name: bifrost
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 20m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
          - ALL
    serviceAccount:
      automount: false
      create: true
    storage:
      mode: sqlite
      persistence:
        enabled: true
        existingClaim: data
