apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bifrost
spec:
  releaseName: bifrost
  interval: 30m
  chart:
    spec:
      chart: bifrost
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bifrost
        namespace: flux-system
      version: 2.1.47
  values:
    fullnameOverride: bifrost
    envFrom:
      - secretRef:
          name: bifrost
    extraEnv:
      TZ: ${time_zone}
    # The chart has no app-template values, so this repeats the oauth2-proxy component's
    # container. Bifrost serves its own MCP OAuth endpoints under /oauth2.
    extraContainers:
      - name: oauth2-proxy
        args:
          - --alpha-config=/config/oauth2-proxy.yaml
          - --email-domain=*
          - --reverse-proxy=true
          - --silence-ping-logging=true
          - --skip-provider-button=true
        env:
          - name: OAUTH2_PROXY_PROXY_PREFIX
            value: /oauth2-proxy
          - name: OAUTH2_PROXY_REDIRECT_URL
            value: https://app.invalid/oauth2-proxy/callback
          - name: OIDC_ISSUER_URL
            value: https://${identity_host}
          - name: UPSTREAM_REQUEST_HEADERS
            value: "[{name: X-Bifrost-Setup-Token, values: [{secretSource: {fromEnv: UPSTREAM_SETUP_TOKEN}}]}]"
          - name: UPSTREAM_SETUP_TOKEN
            valueFrom:
              secretKeyRef:
                key: BIFROST_SETUP_TOKEN
                name: bifrost
          - name: UPSTREAM_URI
            value: http://127.0.0.1:8080
        envFrom:
          - secretRef:
              name: bifrost-oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
        imagePullPolicy: IfNotPresent
        livenessProbe: &proxy-probe
          httpGet:
            path: /ping
            port: proxy
          periodSeconds: 10
          timeoutSeconds: 5
        ports:
          - name: proxy
            containerPort: 4180
        readinessProbe: *proxy-probe
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        startupProbe:
          <<: *proxy-probe
          failureThreshold: 30
        volumeMounts:
          - name: oauth2-proxy
            mountPath: /config
            readOnly: true
      # Serves the text models as local/; see router.py.
      - name: router
        command:
          - python
          - /app/router.py
        env:
          - name: NAMESPACE
            value: text
          - name: PORT
            value: "8090"
        image: docker.io/library/python:3.15.2-alpine3.24
        imagePullPolicy: IfNotPresent
        livenessProbe: &router-probe
          httpGet:
            path: /healthz
            port: router
          periodSeconds: 10
          timeoutSeconds: 5
        ports:
          - name: router
            containerPort: 8090
        readinessProbe: *router-probe
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        startupProbe:
          <<: *router-probe
          failureThreshold: 30
        volumeMounts:
          - name: router
            mountPath: /app
            readOnly: true
          - name: router-token
            mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            readOnly: true
    image:
      pullPolicy: IfNotPresent
      repository: docker.io/maximhq/bifrost
      tag: v2.4.0
    nodeSelector:
      node.excloo.dev/network: internal
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    rbac:
      podDiscovery:
        enabled: false
    resources:
      limits:
        cpu: null
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
          - ALL
    serviceAccount:
      automount: false
      create: true
    strategy:
      type: Recreate
    volumeMounts:
      - name: temporary
        mountPath: /tmp
    volumes:
      - name: oauth2-proxy
        configMap:
          name: oauth2-proxy
      - name: router
        configMap:
          name: router
      # Only the router reads the Kubernetes API (apps/base/text/rbac.yaml).
      - name: router-token
        projected:
          sources:
            - serviceAccountToken:
                path: token
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: ca.crt
      - name: temporary
        emptyDir:
          sizeLimit: 1Gi
    # The startup probe replaces the chart's initial delays.
    livenessProbe: &probe
      httpGet:
        path: /health
        port: http
      failureThreshold: 3
      initialDelaySeconds: null
      periodSeconds: 10
      timeoutSeconds: 5
    readinessProbe: *probe
    startupProbe:
      httpGet:
        path: /health
        port: http
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 5
    bifrost:
      # Helm owns providers, virtual keys, MCP and routing rules. Split mode, the
      # default, keeps dashboard edits to everything else (budgets, pricing
      # overrides, teams) across restarts; changing a section here replaces it.
      # The SQLite store still backs MCP grants.
      client:
        allowedOrigins:
          - https://app.invalid
        disableDbPingsInHealth: true
        logRetentionDays: 30
        # Chat requests carry only the tools their client sends; MCP stays on /mcp.
        mcpDisableAutoToolInject: true
      governance:
        # oauth2-proxy signs the dashboard in with Pocket ID and sends the setup token,
        # which unlocks /api while dashboard auth is off. The credentials keep the
        # disabled setting in config.json; virtual keys still guard inference.
        authConfig:
          existingSecret: bifrost
          isEnabled: false
        # Each cloud/ alias serves one model, falling back in order to the same model
        # elsewhere. The uncensored aliases name the model they abliterate.
        routingRules:
          - id: cloud-deepseek-flash
            name: Cloud DeepSeek Flash
            cel_expression: "provider == 'cloud' && model in ['auto', 'deepseek-flash']"
            enabled: true
            fallbacks:
              - model: deepseek-flash
                provider: deepseek
              - model: deepseek-v4.1-flash
                provider: opencode-go
              - model: deepseek-v4.1-flash
                provider: opencode-zen
              - model: deepseek/deepseek-v4.1-flash-1017
                provider: openrouter
            priority: 4
            scope: global
            targets:
              - provider: deploy
                model: deepseek-ai/deepseek-v4.1-flash-1017
                weight: 1.0
          - id: cloud-deepseek-flash-uncensored
            name: Cloud DeepSeek Flash Uncensored
            cel_expression: "provider == 'cloud' && model == 'deepseek-flash-uncensored'"
            enabled: true
            fallbacks:
              - model: abliterated-model-large-flash
                provider: abliteration
            priority: 5
            scope: global
            targets:
              - provider: refuseless
                model: deepseek-v4.1-flash-abliterated
                weight: 1.0
          - id: cloud-glm
            name: Cloud GLM
            cel_expression: "provider == 'cloud' && model == 'glm'"
            enabled: true
            fallbacks:
              - model: glm-5.3
                provider: opencode-zen
              - model: z-ai/glm-5.3
                provider: openrouter
            priority: 6
            scope: global
            targets:
              - provider: opencode-go
                model: glm-5.3
                weight: 1.0
          - id: cloud-glm-flash
            name: Cloud GLM Flash
            cel_expression: "provider == 'cloud' && model == 'glm-flash'"
            enabled: true
            fallbacks:
              - model: glm-5.3-flash
                provider: opencode-go
              - model: glm-5.3-flash
                provider: opencode-zen
              - model: z-ai/glm-5.3-flash
                provider: openrouter
            priority: 7
            scope: global
            targets:
              - provider: deploy
                model: zai-org/glm-5.3-flash
                weight: 1.0
          - id: cloud-glm-flash-uncensored
            name: Cloud GLM Flash Uncensored
            cel_expression: "provider == 'cloud' && model == 'glm-flash-uncensored'"
            enabled: true
            priority: 8
            scope: global
            targets:
              - provider: refuseless
                model: glm-5.3-flash-abliterated
                weight: 1.0
          - id: cloud-glm-uncensored
            name: Cloud GLM Uncensored
            cel_expression: "provider == 'cloud' && model == 'glm-uncensored'"
            enabled: true
            fallbacks:
              - model: abliterated-model-large-v2
                provider: abliteration
            priority: 9
            scope: global
            targets:
              - provider: refuseless
                model: glm-5.3-abliterated
                weight: 1.0
        virtualKeys:
          - id: claude
            name: Claude
            value: env.VIRTUAL_KEY_CLAUDE
            mcp_configs: &agent-mcp
              - mcp_client_name: actual_budget
                tools_to_execute: ["*"]
              - mcp_client_name: home_assistant
                tools_to_execute: ["*"]
              - mcp_client_name: immich
                tools_to_execute: ["*"]
              - mcp_client_name: karakeep
                tools_to_execute: ["*"]
              - mcp_client_name: larapaper
                tools_to_execute: ["*"]
              - mcp_client_name: reactive_resume
                tools_to_execute: ["*"]
              - mcp_client_name: unifi_network
                tools_to_execute: ["*"]
          - id: codex
            name: Codex
            value: env.VIRTUAL_KEY_CODEX
            mcp_configs: *agent-mcp
          # LibreChat offers a section per provider.
          - id: librechat
            name: LibreChat
            allow_all_providers: true
            value: env.VIRTUAL_KEY_LIBRECHAT
            # Studio trusts the forwarded user headers, so only LibreChat may call it.
            mcp_configs:
              - mcp_client_name: studio
                tools_to_execute: ["*"]
            provider_configs:
              - provider: local
                allowed_models: ["*"]
                key_ids: ["*"]
          - id: opencode
            name: OpenCode
            value: env.VIRTUAL_KEY_OPENCODE
            mcp_configs: *agent-mcp
            # Agents reach the models themselves; cloud/auto is for chat.
            provider_configs: &agent-models
              - provider: abliteration
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: cloud
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: deepseek
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: deploy
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: local
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: opencode-go
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: opencode-zen
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: refuseless
                allowed_models: ["*"]
                key_ids: ["*"]
          # The owner's personal key for LibreChat's restricted MCP servers.
          - id: owner
            name: Owner
            allow_all_providers: true
            value: env.VIRTUAL_KEY_OWNER
            mcp_configs: *agent-mcp
          - id: pi
            name: Pi
            value: env.VIRTUAL_KEY_PI
            mcp_configs: *agent-mcp
            provider_configs: *agent-models
          - id: studio
            name: Studio
            value: env.VIRTUAL_KEY_STUDIO
            # The cloud rules' targets and fallbacks need their own provider too.
            provider_configs:
              - provider: cloud
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: deepseek
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: deploy
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: local
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: opencode-go
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: opencode-zen
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: refuseless
                allowed_models: ["*"]
                key_ids: ["*"]
      # Each server is served at /mcp/<endpointSlug>. Servers without headers accept
      # only this pod through their network policies.
      mcp:
        enabled: true
        # Code Mode exposes each agent server through four discovery and execution
        # meta-tools, so clients load tool definitions on demand instead of all 500+
        # up front. Studio stays direct: LibreChat's Studio tools need their native
        # names and the set is small.
        clientConfigs:
          - name: actual_budget
            isCodeModeClient: true
            authType: none
            httpConfig:
              url: http://actual-budget-mcp.actual-budget-mcp.svc.cluster.local:3000/mcp
            connectionType: http
            endpointSlug: actual-budget
            toolsToExecute: ["*"]
          - name: home_assistant
            isCodeModeClient: true
            authType: none
            httpConfig:
              url: http://home-assistant-mcp.home-assistant-mcp.svc.cluster.local:8086/mcp
            connectionType: http
            endpointSlug: home-assistant
            toolsToExecute: ["*"]
          - name: immich
            isCodeModeClient: true
            authType: none
            httpConfig:
              url: http://immich-mcp.immich-mcp.svc.cluster.local:5000/mcp
            connectionType: http
            endpointSlug: immich
            toolsToExecute: ["*"]
          - name: karakeep
            isCodeModeClient: true
            authType: none
            httpConfig:
              url: http://karakeep-mcp.karakeep-mcp.svc.cluster.local:8000/mcp
            connectionType: http
            endpointSlug: karakeep
            toolsToExecute: ["*"]
          - name: larapaper
            isCodeModeClient: true
            authType: headers
            httpConfig:
              url: http://larapaper.larapaper.svc.cluster.local:8080/mcp
            connectionType: http
            endpointSlug: larapaper
            headers:
              Authorization: env.LARAPAPER_MCP_AUTHORIZATION
            toolsToExecute: ["*"]
          - name: reactive_resume
            isCodeModeClient: true
            authType: headers
            httpConfig:
              url: http://reactive-resume.reactive-resume.svc.cluster.local:3000/mcp
            connectionType: http
            endpointSlug: reactive-resume
            headers:
              X-API-Key: env.REACTIVE_RESUME_API_KEY
            toolsToExecute: ["*"]
          # Studio maps the forwarded user and conversation headers to its own accounts.
          - name: studio
            allowedExtraHeaders:
              - X-AI-User-Email
              - X-AI-User-Id
              - X-Studio-Conversation-Id
            authType: headers
            httpConfig:
              url: http://studio.studio.svc.cluster.local:8787/mcp
            connectionType: http
            endpointSlug: studio
            headers:
              Authorization: env.STUDIO_MCP_AUTHORIZATION
            # Studio waits up to 31 minutes for generation results.
            toolExecutionTimeout: 1860
            toolsToExecute:
              - Cancel
              - Generate
              - Handover
              - Models
              - Result
              - Reuse
              - Review
              - Upload
          - name: unifi_network
            isCodeModeClient: true
            authType: none
            httpConfig:
              url: http://unifi-network-mcp.unifi-network-mcp.svc.cluster.local:3000/mcp
            connectionType: http
            endpointSlug: unifi-network
            toolsToExecute: ["*"]
        # Clients discover tools through /mcp, so injecting them into inference requests
        # only duplicates them and adds every server's tool definitions to each prompt.
        toolManagerConfig:
          disableAutoToolInject: true
      providers:
        abliteration:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: abliteration
              models: ["*"]
              value: env.ABLITERATION_API_KEY
          network_config:
            base_url: https://api.abliteration.ai
        cliproxyapi:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: cliproxyapi
              models: ["*"]
              value: env.CLIPROXY_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317
        # CLIProxyAPI merges every upstream's model names into one list, so each
        # sibling shares its endpoint and key but lists a single prefix. The original
        # provider keeps the full set for explicit provider/model IDs.
        cliproxy-claude:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: cliproxy-claude
              models: ["regex:^claude-.*"]
              value: env.CLIPROXY_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317
        cliproxy-gemini:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: cliproxy-gemini
              models: ["regex:^gemini-.*"]
              value: env.CLIPROXY_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317
        cliproxy-gpt:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: cliproxy-gpt
              models: ["regex:^(gpt|codex)-.*"]
              value: env.CLIPROXY_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317
        cliproxy-grok:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: cliproxy-grok
              models: ["regex:^grok-.*"]
              value: env.CLIPROXY_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317
        # Only lists the cloud/ aliases, which the cloud routing rules send on.
        cloud:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: cloud
              models: ["*"]
              value: env.AI_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://127.0.0.1:8090/cloud
        deepseek:
          keys:
            - name: deepseek
              models: ["*"]
              value: env.DEEPSEEK_API_KEY
        deploy:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: deploy
              models: ["*"]
              value: env.DEPLOY_API_KEY
          network_config:
            base_url: https://api.deploy.com/api
        # The router sends local/auto and local/uncensored to the first running local text
        # model that suits, and local/<name> to the model that reports that name.
        local:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: local
              models: ["*"]
              value: env.AI_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://127.0.0.1:8090/local
        opencode-go:
          keys:
            - name: opencode-go-1
              models: ["*"]
              value: env.OPENCODE_API_KEY_1
            - name: opencode-go-2
              models: ["*"]
              value: env.OPENCODE_API_KEY_2
        opencode-zen:
          keys:
            - name: opencode-zen-1
              models: ["*"]
              value: env.OPENCODE_API_KEY_1
            - name: opencode-zen-2
              models: ["*"]
              value: env.OPENCODE_API_KEY_2
        openrouter:
          keys:
            - name: openrouter
              models: ["*"]
              value: env.OPENROUTER_API_KEY
        refuseless:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: refuseless
              models: ["*"]
              value: env.REFUSELESS_API_KEY
          network_config:
            base_url: https://api.refuseless.com
    storage:
      persistence:
        existingClaim: data
