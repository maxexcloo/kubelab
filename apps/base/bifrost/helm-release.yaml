apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bifrost
spec:
  releaseName: bifrost
  interval: 30m
  chart:
    spec:
      chart: bifrost
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bifrost
        namespace: flux-system
      version: 2.1.45
  values:
    fullnameOverride: bifrost
    envFrom:
      - secretRef:
          name: bifrost
    extraEnv:
      TZ: ${time_zone}
    # The chart has no app-template values, so this repeats the oauth2-proxy component's
    # container. Bifrost serves its own MCP OAuth endpoints under /oauth2.
    extraContainers:
      - name: oauth2-proxy
        args:
          - --alpha-config=/config/oauth2-proxy.yaml
          - --email-domain=*
          - --reverse-proxy=true
          - --silence-ping-logging=true
          - --skip-provider-button=true
        env:
          - name: OAUTH2_PROXY_PROXY_PREFIX
            value: /oauth2-proxy
          - name: OAUTH2_PROXY_REDIRECT_URL
            value: https://app.invalid/oauth2-proxy/callback
          - name: OIDC_ISSUER_URL
            value: https://${identity_host}
          - name: UPSTREAM_REQUEST_HEADERS
            value: "[{name: X-Bifrost-Setup-Token, values: [{secretSource: {fromEnv: UPSTREAM_SETUP_TOKEN}}]}]"
          - name: UPSTREAM_SETUP_TOKEN
            valueFrom:
              secretKeyRef:
                key: BIFROST_SETUP_TOKEN
                name: bifrost
          - name: UPSTREAM_URI
            value: http://127.0.0.1:8080
        envFrom:
          - secretRef:
              name: bifrost-oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
        imagePullPolicy: IfNotPresent
        livenessProbe: &proxy-probe
          httpGet:
            path: /ping
            port: proxy
          periodSeconds: 10
          timeoutSeconds: 5
        ports:
          - name: proxy
            containerPort: 4180
        readinessProbe: *proxy-probe
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        startupProbe:
          <<: *proxy-probe
          failureThreshold: 30
        volumeMounts:
          - name: oauth2-proxy
            mountPath: /config
            readOnly: true
      # Routes local/ models to the local text models and cloud/ to Abliteration; see router.py.
      - name: router
        command:
          - python
          - /app/router.py
        env:
          - name: CLOUD_MODEL
            value: abliterated-model-large-flash
          - name: CLOUD_URL
            value: https://api.abliteration.ai
          - name: PORT
            value: "8090"
          - name: UPSTREAM
            value: "{}.text.svc.cluster.local:8000"
        image: docker.io/library/python:3.15.2-alpine3.24
        imagePullPolicy: IfNotPresent
        livenessProbe: &router-probe
          httpGet:
            path: /healthz
            port: router
          periodSeconds: 10
          timeoutSeconds: 5
        ports:
          - name: router
            containerPort: 8090
        readinessProbe: *router-probe
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        startupProbe:
          <<: *router-probe
          failureThreshold: 30
        volumeMounts:
          - name: router
            mountPath: /app
            readOnly: true
    image:
      pullPolicy: IfNotPresent
      repository: docker.io/maximhq/bifrost
      tag: v2.3.2
    nodeSelector:
      node.excloo.dev/network: internal
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    rbac:
      podDiscovery:
        enabled: false
    resources:
      limits:
        cpu: null
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
          - ALL
    serviceAccount:
      automount: false
      create: true
    strategy:
      type: Recreate
    volumeMounts:
      - name: temporary
        mountPath: /tmp
    volumes:
      - name: oauth2-proxy
        configMap:
          name: oauth2-proxy
      - name: router
        configMap:
          name: router
      - name: temporary
        emptyDir:
          sizeLimit: 1Gi
    # The startup probe replaces the chart's initial delays.
    livenessProbe: &probe
      httpGet:
        path: /health
        port: http
      failureThreshold: 3
      initialDelaySeconds: null
      periodSeconds: 10
      timeoutSeconds: 5
    readinessProbe: *probe
    startupProbe:
      httpGet:
        path: /health
        port: http
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 5
    bifrost:
      # config.json is authoritative: each restart reverts dashboard edits and prunes
      # entries removed here. The SQLite store still backs MCP grants.
      sourceOfTruth: config.json
      client:
        allowedOrigins:
          - https://app.invalid
        disableDbPingsInHealth: true
        logRetentionDays: 30
        # Chat requests carry only the tools their client sends; MCP stays on /mcp.
        mcpDisableAutoToolInject: true
      governance:
        # oauth2-proxy signs the dashboard in with Pocket ID and sends the setup token,
        # which unlocks /api while dashboard auth is off. The credentials keep the
        # disabled setting in config.json; virtual keys still guard inference.
        authConfig:
          existingSecret: bifrost
          isEnabled: false
        virtualKeys:
          - id: claude
            name: Claude
            value: env.VIRTUAL_KEY_CLAUDE
            mcp_configs: &agent-mcp
              - mcp_client_name: actual_budget
                tools_to_execute: ["*"]
              - mcp_client_name: home_assistant
                tools_to_execute: ["*"]
              - mcp_client_name: reactive_resume
                tools_to_execute: ["*"]
              - mcp_client_name: unifi_network
                tools_to_execute: ["*"]
          - id: codex
            name: Codex
            value: env.VIRTUAL_KEY_CODEX
            mcp_configs: *agent-mcp
          - id: librechat
            name: LibreChat
            value: env.VIRTUAL_KEY_LIBRECHAT
            # Studio trusts the forwarded user headers, so only LibreChat may call it.
            mcp_configs:
              - mcp_client_name: studio
                tools_to_execute: ["*"]
            # local/ names only; an explicit pattern lets requests for a stopped model reach
            # the router, which "*" would reject once the model drops out of the list.
            provider_configs: &local-text
              - provider: local
                allowed_models: ["regex:.*"]
                key_ids: ["*"]
          - id: opencode
            name: OpenCode
            value: env.VIRTUAL_KEY_OPENCODE
            mcp_configs: *agent-mcp
            provider_configs: *local-text
          # The owner's personal key for LibreChat's restricted MCP servers.
          - id: owner
            name: Owner
            allow_all_providers: true
            value: env.VIRTUAL_KEY_OWNER
            mcp_configs: *agent-mcp
          - id: pi
            name: Pi
            value: env.VIRTUAL_KEY_PI
            mcp_configs: *agent-mcp
            # Pi calls the local text model only; cloud plans keep their own keys.
            provider_configs: *local-text
          - id: studio
            name: Studio
            value: env.VIRTUAL_KEY_STUDIO
            # Studio alone also reaches cloud/, for when no local model runs.
            provider_configs:
              - provider: cloud
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: local
                allowed_models: ["regex:.*"]
                key_ids: ["*"]
      # Each server is served at /mcp/<endpointSlug>. Servers without headers accept
      # only this pod through their network policies.
      mcp:
        enabled: true
        clientConfigs:
          - name: actual_budget
            authType: none
            httpConfig:
              url: http://actual-budget-mcp.actual-budget-mcp.svc.cluster.local:3000/mcp
            connectionType: http
            endpointSlug: actual-budget
            toolsToExecute: ["*"]
          - name: home_assistant
            authType: none
            httpConfig:
              url: http://home-assistant-mcp.home-assistant-mcp.svc.cluster.local:8086/mcp
            connectionType: http
            endpointSlug: home-assistant
            toolsToExecute: ["*"]
          - name: reactive_resume
            authType: headers
            httpConfig:
              url: http://reactive-resume.reactive-resume.svc.cluster.local:3000/mcp
            connectionType: http
            endpointSlug: reactive-resume
            headers:
              X-API-Key: env.REACTIVE_RESUME_API_KEY
            toolsToExecute: ["*"]
          # Studio maps the forwarded user and conversation headers to its own accounts.
          - name: studio
            allowedExtraHeaders:
              - X-AI-User-Email
              - X-AI-User-Id
              - X-Studio-Conversation-Id
            authType: headers
            httpConfig:
              url: http://studio.studio.svc.cluster.local:8787/mcp
            connectionType: http
            endpointSlug: studio
            headers:
              Authorization: env.STUDIO_MCP_AUTHORIZATION
            # Studio waits up to 31 minutes for generation results.
            toolExecutionTimeout: 1860
            toolsToExecute:
              - Cancel
              - Generate
              - Handover
              - Models
              - Result
              - Reuse
              - Review
              - Upload
          - name: unifi_network
            authType: none
            httpConfig:
              url: http://unifi-network-mcp.unifi-network-mcp.svc.cluster.local:3000/mcp
            connectionType: http
            endpointSlug: unifi-network
            toolsToExecute: ["*"]
      providers:
        cliproxyapi:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: cliproxyapi
              models: ["*"]
              value: env.CLIPROXY_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317
        # Abliteration through the router, which applies the shared level names.
        cloud:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: cloud
              models: ["*"]
              value: env.ABLITERATION_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://127.0.0.1:8090/cloud
        deepseek:
          keys:
            - name: deepseek
              models: ["*"]
              value: env.DEEPSEEK_API_KEY
        # The router sidecar serves the local text models and lists only those running;
        # a named key model would be listed regardless.
        local:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: local
              models: ["*"]
              value: env.AI_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://127.0.0.1:8090
        opencode-go:
          keys:
            - name: opencode-go-1
              models: ["*"]
              value: env.OPENCODE_API_KEY_1
            - name: opencode-go-2
              models: ["*"]
              value: env.OPENCODE_API_KEY_2
        opencode-zen:
          keys:
            - name: opencode-zen-1
              models: ["*"]
              value: env.OPENCODE_API_KEY_1
            - name: opencode-zen-2
              models: ["*"]
              value: env.OPENCODE_API_KEY_2
        openrouter:
          keys:
            - name: openrouter
              models: ["*"]
              value: env.OPENROUTER_API_KEY
    storage:
      persistence:
        existingClaim: data
