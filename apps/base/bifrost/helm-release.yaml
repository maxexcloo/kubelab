apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bifrost
  namespace: bifrost
spec:
  interval: 30m
  releaseName: bifrost
  chart:
    spec:
      chart: bifrost
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bifrost
        namespace: flux-system
      version: 2.1.43
  values:
    fullnameOverride: bifrost
    bifrost:
      authConfig:
        existingSecret: bifrost
        isEnabled: true
      encryptionKeySecret:
        key: encryption-key
        name: bifrost
    env:
      - name: BIFROST_API_KEY
        valueFrom:
          secretKeyRef:
            key: BIFROST_API_KEY
            name: bifrost
      - name: CLIPROXY_API_KEY
        valueFrom:
          secretKeyRef:
            key: CLIPROXY_API_KEY
            name: bifrost
      - name: COMFY_CONTROL_API_KEY
        valueFrom:
          secretKeyRef:
            key: COMFY_CONTROL_API_KEY
            name: bifrost
      - name: PATH
        value: /opt/mcp:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - name: UV_CACHE_DIR
        value: /app/data/uv-cache
      - name: UV_LINK_MODE
        value: copy
      - name: UV_PYTHON
        value: 3.13.16
      - name: UV_PYTHON_DOWNLOADS
        value: never
      - name: UV_PYTHON_INSTALL_DIR
        value: /opt/mcp/python
    image:
      pullPolicy: IfNotPresent
      repository: docker.io/maximhq/bifrost
      tag: v2.2.6
    initContainers:
      - name: install-uv
        image: ghcr.io/astral-sh/uv:0.12.24-alpine3.23
        command:
          - cp
        args:
          - /usr/local/bin/uv
          - /usr/local/bin/uvx
          - /opt/mcp/
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: mcp-runtime
            mountPath: /opt/mcp
      - name: install-python
        image: ghcr.io/astral-sh/uv:0.12.24-alpine3.23
        command:
          - uv
        args:
          - python
          - install
          - --install-dir
          - /opt/mcp/python
          - 3.13.16
        env:
          - name: UV_CACHE_DIR
            value: /tmp/uv-cache
          - name: UV_PYTHON_BIN_DIR
            value: /opt/mcp
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: mcp-runtime
            mountPath: /opt/mcp
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    resources:
      limits:
        cpu: null
        memory: 1Gi
      requests:
        cpu: 20m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
          - ALL
    serviceAccount:
      automount: false
      create: true
    storage:
      mode: sqlite
      persistence:
        enabled: true
        existingClaim: data
    volumeMounts:
      - name: mcp-runtime
        mountPath: /opt/mcp
    volumes:
      - name: mcp-runtime
        emptyDir:
          sizeLimit: 512Mi
