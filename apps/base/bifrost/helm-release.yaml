apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bifrost
spec:
  releaseName: bifrost
  interval: 30m
  chart:
    spec:
      chart: bifrost
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bifrost
        namespace: flux-system
      version: 2.1.45
  values:
    fullnameOverride: bifrost
    envFrom:
      - secretRef:
          name: bifrost
    extraEnv:
      TZ: ${time_zone}
    # The chart has no app-template values, so this repeats the oauth2-proxy component's
    # container. Bifrost serves its own MCP OAuth endpoints under /oauth2.
    extraContainers:
      - name: oauth2-proxy
        args:
          - --alpha-config=/config/oauth2-proxy.yaml
          - --email-domain=*
          - --reverse-proxy=true
          - --silence-ping-logging=true
          - --skip-provider-button=true
        env:
          - name: OAUTH2_PROXY_PROXY_PREFIX
            value: /oauth2-proxy
          - name: OAUTH2_PROXY_REDIRECT_URL
            value: https://app.invalid/oauth2-proxy/callback
          - name: OIDC_ISSUER_URL
            value: https://${identity_host}
          - name: UPSTREAM_REQUEST_HEADERS
            value: "[{name: X-Bifrost-Setup-Token, values: [{secretSource: {fromEnv: UPSTREAM_SETUP_TOKEN}}]}]"
          - name: UPSTREAM_SETUP_TOKEN
            valueFrom:
              secretKeyRef:
                key: BIFROST_SETUP_TOKEN
                name: bifrost
          - name: UPSTREAM_URI
            value: http://127.0.0.1:8080
        envFrom:
          - secretRef:
              name: bifrost-oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
        imagePullPolicy: IfNotPresent
        livenessProbe: &proxy-probe
          httpGet:
            path: /ping
            port: proxy
          periodSeconds: 10
          timeoutSeconds: 5
        ports:
          - name: proxy
            containerPort: 4180
        readinessProbe: *proxy-probe
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        startupProbe:
          <<: *proxy-probe
          failureThreshold: 30
        volumeMounts:
          - name: oauth2-proxy
            mountPath: /config
            readOnly: true
    image:
      pullPolicy: IfNotPresent
      repository: docker.io/maximhq/bifrost
      tag: v2.3.2
    nodeSelector:
      node.excloo.dev/network: internal
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    rbac:
      podDiscovery:
        enabled: false
    resources:
      limits:
        cpu: null
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
          - ALL
    serviceAccount:
      automount: false
      create: true
    strategy:
      type: Recreate
    volumeMounts:
      - name: temporary
        mountPath: /tmp
    volumes:
      - name: oauth2-proxy
        configMap:
          name: oauth2-proxy
      - name: temporary
        emptyDir:
          sizeLimit: 1Gi
    # The startup probe replaces the chart's initial delays.
    livenessProbe: &probe
      httpGet:
        path: /health
        port: http
      failureThreshold: 3
      initialDelaySeconds: null
      periodSeconds: 10
      timeoutSeconds: 5
    readinessProbe: *probe
    startupProbe:
      httpGet:
        path: /health
        port: http
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 5
    bifrost:
      # config.json is authoritative: each restart reverts dashboard edits and prunes
      # entries removed here. The SQLite store still backs MCP grants.
      sourceOfTruth: config.json
      client:
        allowedOrigins:
          - https://app.invalid
        disableDbPingsInHealth: true
        logRetentionDays: 30
        # Chat requests carry only the tools their client sends; MCP stays on /mcp.
        mcpDisableAutoToolInject: true
      governance:
        # oauth2-proxy signs the dashboard in with Pocket ID and sends the setup token,
        # which unlocks /api while dashboard auth is off. The credentials keep the
        # disabled setting in config.json; virtual keys still guard inference.
        authConfig:
          existingSecret: bifrost
          isEnabled: false
        virtualKeys:
          - id: claude
            name: Claude
            value: env.VIRTUAL_KEY_CLAUDE
            mcp_configs: &agent-mcp
              - mcp_client_name: actual_budget
                tools_to_execute: ["*"]
              - mcp_client_name: home_assistant
                tools_to_execute: ["*"]
              - mcp_client_name: reactive_resume
                tools_to_execute: ["*"]
              - mcp_client_name: unifi_network
                tools_to_execute: ["*"]
          - id: codex
            name: Codex
            value: env.VIRTUAL_KEY_CODEX
            mcp_configs: *agent-mcp
          - id: librechat
            name: LibreChat
            value: env.VIRTUAL_KEY_LIBRECHAT
            # Studio trusts the forwarded user headers, so only LibreChat may call it.
            mcp_configs:
              - mcp_client_name: studio
                tools_to_execute: ["*"]
            provider_configs: &local-text
              - provider: ai
                allowed_models: ["text"]
                key_ids: ["*"]
              - provider: gemma
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: gemma-26b
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: maya
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: qwen-35b
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: qwen-flash-next
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: qwen-fp8
                allowed_models: ["*"]
                key_ids: ["*"]
              - provider: qwen-mxfp4
                allowed_models: ["*"]
                key_ids: ["*"]
          - id: opencode
            name: OpenCode
            value: env.VIRTUAL_KEY_OPENCODE
            mcp_configs: *agent-mcp
            provider_configs: *local-text
          # The owner's personal key for LibreChat's restricted MCP servers.
          - id: owner
            name: Owner
            allow_all_providers: true
            value: env.VIRTUAL_KEY_OWNER
            mcp_configs: *agent-mcp
          - id: pi
            name: Pi
            value: env.VIRTUAL_KEY_PI
            mcp_configs: *agent-mcp
            # Pi calls the local text model only; cloud plans keep their own keys.
            provider_configs: *local-text
          - id: studio
            name: Studio
            value: env.VIRTUAL_KEY_STUDIO
            provider_configs: *local-text
      # Each server is served at /mcp/<endpointSlug>. Servers without headers accept
      # only this pod through their network policies.
      mcp:
        enabled: true
        clientConfigs:
          - name: actual_budget
            authType: none
            httpConfig:
              url: http://actual-budget-mcp.actual-budget-mcp.svc.cluster.local:3000/mcp
            connectionType: http
            endpointSlug: actual-budget
            toolsToExecute: ["*"]
          - name: home_assistant
            authType: none
            httpConfig:
              url: http://home-assistant-mcp.home-assistant-mcp.svc.cluster.local:8086/mcp
            connectionType: http
            endpointSlug: home-assistant
            toolsToExecute: ["*"]
          - name: reactive_resume
            authType: headers
            httpConfig:
              url: http://reactive-resume.reactive-resume.svc.cluster.local:3000/mcp
            connectionType: http
            endpointSlug: reactive-resume
            headers:
              X-API-Key: env.REACTIVE_RESUME_API_KEY
            toolsToExecute: ["*"]
          # Studio maps the forwarded user and conversation headers to its own accounts.
          - name: studio
            allowedExtraHeaders:
              - X-AI-User-Email
              - X-AI-User-Id
              - X-Studio-Conversation-Id
            authType: headers
            httpConfig:
              url: http://studio.studio.svc.cluster.local:8787/mcp
            connectionType: http
            endpointSlug: studio
            headers:
              Authorization: env.STUDIO_MCP_AUTHORIZATION
            # Studio waits up to 31 minutes for generation results.
            toolExecutionTimeout: 1860
            toolsToExecute:
              - Cancel
              - Generate
              - Handover
              - Models
              - Result
              - Reuse
              - Review
              - Upload
          - name: unifi_network
            authType: none
            httpConfig:
              url: http://unifi-network-mcp.unifi-network-mcp.svc.cluster.local:3000/mcp
            connectionType: http
            endpointSlug: unifi-network
            toolsToExecute: ["*"]
      providers:
        # "text" reaches whichever local text models are running; each also has its own
        # provider. They serve any model name but list only their own, and Bifrost
        # resolves "*" against listed models, so every provider names its model.
        ai:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: ai
              models: ["text"]
              value: env.AI_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://text.text.svc.cluster.local:8000
        cliproxyapi:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: cliproxyapi
              models: ["*"]
              value: env.CLIPROXY_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317
        deepseek:
          keys:
            - name: deepseek
              models: ["*"]
              value: env.DEEPSEEK_API_KEY
        gemma:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: gemma
              models: ["gemma-4-31b-heretic"]
              value: env.AI_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://gemma.text.svc.cluster.local:8000
        gemma-26b:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: gemma-26b
              models: ["gemma-4-26b-a4b"]
              value: env.AI_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://gemma-26b.text.svc.cluster.local:8000
        maya:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: maya
              models: ["glm-5.3-flash"]
              value: env.AI_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://maya.text.svc.cluster.local:8000
        opencode-go:
          keys:
            - name: opencode-go-1
              models: ["*"]
              value: env.OPENCODE_API_KEY_1
            - name: opencode-go-2
              models: ["*"]
              value: env.OPENCODE_API_KEY_2
        opencode-zen:
          keys:
            - name: opencode-zen-1
              models: ["*"]
              value: env.OPENCODE_API_KEY_1
            - name: opencode-zen-2
              models: ["*"]
              value: env.OPENCODE_API_KEY_2
        openrouter:
          keys:
            - name: openrouter
              models: ["*"]
              value: env.OPENROUTER_API_KEY
        qwen-35b:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: qwen-35b
              models: ["qwen3.6-35b-a3b"]
              value: env.AI_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://qwen-35b.text.svc.cluster.local:8000
        qwen-flash-next:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: qwen-flash-next
              models: ["qwen3.8-flash-next"]
              value: env.AI_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://qwen-flash-next.text.svc.cluster.local:8000
        qwen-fp8:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: qwen-fp8
              models: ["qwen3.8-27b-uncensored-fp8"]
              value: env.AI_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://qwen-fp8.text.svc.cluster.local:8000
        qwen-mxfp4:
          custom_provider_config:
            base_provider_type: openai
          keys:
            - name: qwen-mxfp4
              models: ["qwen3.8-27b-uncensored-mxfp4"]
              value: env.AI_API_KEY
          network_config:
            allow_private_network: true
            base_url: http://qwen-mxfp4.text.svc.cluster.local:8000
    storage:
      persistence:
        existingClaim: data
