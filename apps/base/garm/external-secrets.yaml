apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garm-runtime
spec:
  data:
    - remoteRef:
        key: &item GARM
        property: database-passphrase
      secretKey: database-passphrase
    - remoteRef:
        key: *item
        property: jwt-secret
      secretKey: jwt-secret
    - remoteRef:
        key: *item
        property: incus-client-certificate
      secretKey: incus-client-certificate
    - remoteRef:
        key: *item
        property: incus-client-key
      secretKey: incus-client-key
    - remoteRef:
        key: *item
        property: incus-server-certificate
      secretKey: incus-server-certificate
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: garm-runtime
    template:
      data:
        config.toml: |
          [logging]
          log_format = "json"
          log_level = "info"
          [jwt_auth]
          secret = {{ index . "jwt-secret" | toJson }}
          time_to_live = "1h"
          [apiserver]
          bind = "0.0.0.0"
          port = 9997
          use_tls = false
          [apiserver.webui]
          enable = true
          [database]
          backend = "sqlite3"
          passphrase = {{ index . "database-passphrase" | toJson }}
          [database.sqlite3]
          db_file = "/data/garm.db"
          busy_timeout_seconds = 5
          [[provider]]
          name = "mercury"
          description = "Mercury Incus VMs"
          provider_type = "external"
          [provider.external]
          provider_executable = "/opt/garm/providers.d/garm-provider-incus"
          config_file = "/etc/garm/provider/incus.toml"
        incus-client.crt: '{{ index . "incus-client-certificate" }}'
        incus-client.key: '{{ index . "incus-client-key" }}'
        incus-server.crt: '{{ index . "incus-server-certificate" }}'
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garm-enrolment
spec:
  data:
    - remoteRef:
        key: &item GARM
        property: github-app-id
      secretKey: app-id
    - remoteRef:
        key: *item
        property: github-app-installation-id
      secretKey: installation-id
    - remoteRef:
        key: *item
        property: github-app-private-key
      secretKey: app-private-key
    - remoteRef:
        key: *item
        property: username
      secretKey: username
    - remoteRef:
        key: *item
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: garm-enrolment
