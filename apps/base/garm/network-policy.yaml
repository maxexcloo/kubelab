apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garm
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garm-enrolment
      ports:
        - port: 9997
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garm
  policyTypes:
    - Ingress
