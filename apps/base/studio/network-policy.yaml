apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: studio
spec:
  ingress:
    - from:
        # Bifrost calls the MCP endpoint; Traefik serves the studio and result links.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bifrost
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8787
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: studio
  policyTypes:
    - Ingress
