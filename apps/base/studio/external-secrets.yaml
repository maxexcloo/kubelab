apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio
  annotations:
    onepassword.excloo.dev/defaults: '{"civitai-api-token":"","hf-token":""}'
    onepassword.excloo.dev/field-formats: '{"mcp-api-key":"alphanumeric","mcp-signing-key":"alphanumeric","setup-token":"alphanumeric","worker-token":"alphanumeric"}'
    onepassword.excloo.dev/generate-fields: mcp-api-key,mcp-signing-key,setup-token,worker-token
    onepassword.excloo.dev/item: &item Studio
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: *item
        property: civitai-api-token
      secretKey: CIVITAI_API_TOKEN
    - remoteRef:
        key: *item
        property: hf-token
      secretKey: HF_TOKEN
    - remoteRef:
        key: *item
        property: mcp-api-key
      secretKey: STUDIO_MCP_API_KEY
    - remoteRef:
        key: *item
        property: mcp-signing-key
      secretKey: MCP_SIGNING_KEY
    - remoteRef:
        key: *item
        property: setup-token
      secretKey: STUDIO_SETUP_TOKEN
    - remoteRef:
        key: *item
        property: worker-token
      secretKey: STUDIO_WORKER_TOKEN
    # Bifrost issues Studio's prompt-writing key for ai/text.
    - remoteRef:
        key: Bifrost
        property: virtual-key-studio
      secretKey: STUDIO_PROMPT_WRITER_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: studio
    template:
      engineVersion: v2
      data:
        CIVITAI_API_TOKEN: "{{ .CIVITAI_API_TOKEN }}"
        STUDIO_MCP_API_KEY: "{{ .STUDIO_MCP_API_KEY }}"
        STUDIO_PROMPT_WRITER_KEY: "{{ .STUDIO_PROMPT_WRITER_KEY }}"
        STUDIO_SETUP_TOKEN: "{{ .STUDIO_SETUP_TOKEN }}"
        STUDIO_WORKER_TOKEN: "{{ .STUDIO_WORKER_TOKEN }}"
        HF_TOKEN: "{{ .HF_TOKEN }}"
        MCP_SIGNING_KEY: "{{ .MCP_SIGNING_KEY }}"
