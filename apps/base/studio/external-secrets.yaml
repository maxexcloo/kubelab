apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio
  annotations:
    onepassword.excloo.dev/defaults: '{"civitai-api-token":"","hf-token":""}'
    onepassword.excloo.dev/field-formats: '{"mcp-api-key":"alphanumeric","mcp-signing-key":"alphanumeric","worker-token":"alphanumeric"}'
    onepassword.excloo.dev/generate-fields: mcp-api-key,mcp-signing-key,worker-token
    onepassword.excloo.dev/item: &item Studio
spec:
  data:
    - remoteRef:
        key: *item
        property: civitai-api-token
      secretKey: CIVITAI_API_TOKEN
    - remoteRef:
        key: *item
        property: hf-token
      secretKey: HF_TOKEN
    - remoteRef:
        key: *item
        property: mcp-api-key
      secretKey: STUDIO_MCP_API_KEY
    - remoteRef:
        key: *item
        property: mcp-signing-key
      secretKey: STUDIO_MCP_SIGNING_KEY
    - remoteRef:
        key: *item
        property: worker-token
      secretKey: STUDIO_WORKER_TOKEN
    # Bifrost issues Studio's key for prompt writing and the Chat tab.
    - remoteRef:
        key: Bifrost
        property: virtual-key-studio
      secretKey: STUDIO_ASSISTANT_KEY
    # The text runtimes' own key, for asking them directly (apps/base/text).
    - remoteRef:
        key: Bifrost
        property: provider-ai-api-key
      secretKey: STUDIO_TEXT_KEY
    # CLIProxyAPI accepts Studio's own key for Grok media.
    - remoteRef:
        key: CLI Proxy API
        property: virtual-key-studio
      secretKey: STUDIO_CLIPROXYAPI_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: studio
    template:
      data:
        CIVITAI_API_TOKEN: "{{ .CIVITAI_API_TOKEN }}"
        STUDIO_ASSISTANT_KEY: "{{ .STUDIO_ASSISTANT_KEY }}"
        STUDIO_CLIPROXYAPI_KEY: "{{ .STUDIO_CLIPROXYAPI_KEY }}"
        STUDIO_MCP_API_KEY: "{{ .STUDIO_MCP_API_KEY }}"
        STUDIO_MCP_SIGNING_KEY: "{{ .STUDIO_MCP_SIGNING_KEY }}"
        STUDIO_TEXT_KEY: "{{ .STUDIO_TEXT_KEY }}"
        STUDIO_WORKER_TOKEN: "{{ .STUDIO_WORKER_TOKEN }}"
        HF_TOKEN: "{{ .HF_TOKEN }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: studio-ctrld
  annotations:
    # The resolver ID grants use of Studio's Control D profile.
    onepassword.excloo.dev/concealed-fields: resolver-id-control-d
    onepassword.excloo.dev/item: &item Studio
spec:
  data:
    - remoteRef:
        key: *item
        property: resolver-id-control-d
      secretKey: resolverID
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: studio-ctrld
    template:
      data:
        # Only Civitai goes through Control D, whose profile proxies it past Civitai's refusal
        # of the cluster's egress (HTTP 451); everything else goes to kube-dns.
        ctrld.toml: |
          [listener.0]
          ip = "127.0.0.1"
          port = 53

          [listener.0.policy]
          name = "Civitai"
          rules = [
            {"civitai.com" = ["upstream.1"]},
            {"*.civitai.com" = ["upstream.1"]},
            {"civitai.red" = ["upstream.1"]},
            {"*.civitai.red" = ["upstream.1"]},
            {"*.r2.cloudflarestorage.com" = ["upstream.1"]},
          ]

          [upstream.0]
          endpoint = "10.100.4.10:53"
          type = "legacy"

          [upstream.1]
          endpoint = "https://dns.controld.com/{{ .resolverID }}"
          type = "doh"
