apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          # Civitai refuses the cluster's egress (HTTP 451); ctrld resolves only Civitai's names
          # through Control D, which proxies them (external-secrets.yaml).
          ctrld:
            workingDir: /etc/controld
            args:
              - --config=/etc/ctrld/ctrld.toml
            command:
              - /ctrld
              - run
            image:
              repository: controldns/ctrld
              tag: 1.5.9
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              runAsGroup: 65534
              runAsUser: 65534
              capabilities:
                add:
                  - NET_BIND_SERVICE
          main:
            env:
              STUDIO_ALLOWED_HOSTS:
                dependsOn:
                  - ROUTE_ALIAS_HOST
                  - ROUTE_HOST
                value: $(ROUTE_HOST),$(ROUTE_ALIAS_HOST),studio.studio.svc.cluster.local
              # The Chat tab uses the assistant's gateway with these models.
              STUDIO_CHAT_MODELS: local/auto,local/uncensored,cloud/auto,cloud/deepseek-flash,cloud/deepseek-flash-uncensored,cloud/glm,cloud/glm-flash,cloud/glm-flash-uncensored,cloud/glm-uncensored,cloud/mimo,cloud/mimo-flash
              # Grok media goes straight to CLIProxyAPI with Studio's key (external-secrets.yaml).
              STUDIO_CLIPROXYAPI_URL: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317
              STUDIO_ENABLE_PRESETS: "1"
              # Studio scales these GPU deployments (apps/components/gpu/studio-runtime.yaml).
              # Pools: the GPU node's two GPUs.
              STUDIO_KUBERNETES_GPUS: '{"gpu": 2}'
              # Studio finds its workloads from the studio.excloo.dev labels on the GPU
              # Deployments in these namespaces; text ones serve local/auto.
              STUDIO_KUBERNETES_NAMESPACES: comfyui-image,comfyui-video,text
              STUDIO_LOCAL_TEXT_MODEL: local/auto
              # Result links and Grok's /mcp/<token> URL bypass Access (cloudflare-access.yaml).
              STUDIO_MCP_PUBLIC_URL:
                dependsOn: ROUTE_HOST
                value: https://$(ROUTE_HOST)
              STUDIO_MODEL_MANIFEST_PREFIX: models/comfyui/
              STUDIO_MULTI_USER: "1"
              STUDIO_OIDC_CLIENT_ID: client.invalid
              STUDIO_OIDC_ISSUER: https://${identity_host}
              STUDIO_OIDC_LABEL: Excloo ID
              STUDIO_OIDC_REDIRECT_URI: https://app.invalid/api/accounts/oidc/callback
              # Studio's assistant writes through Bifrost with its own key (external-secrets.yaml).
              STUDIO_ASSISTANT_CLOUD_MODEL: cloud/auto
              STUDIO_ASSISTANT_URL: http://bifrost.bifrost.svc.cluster.local:8080
              HOST: 0.0.0.0
              PORT: "8787"
              ROUTE_ALIAS_HOST: studio.${cluster_name}.excloo.dev
              ROUTE_HOST: app.invalid
              TZ: ${time_zone}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              repository: ghcr.io/maxexcloo/studio
              tag: 2026.11.10.1
            probes:
              liveness:
                path: /api/ping
              readiness: &ready
                path: /api/ready
              startup: *ready
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 100m
                memory: 512Mi
        defaultContainerOptions:
          securityContext:
            runAsNonRoot: true
    defaultPodOptions:
      # kubectl exec and logs reach Studio, not the ctrld sidecar listed before it.
      annotations:
        kubectl.kubernetes.io/default-container: studio
      # Studio's service account scales the GPU workloads.
      automountServiceAccountToken: true
      # ctrld answers first and sends all but Civitai's names to kube-dns (Homelab's service
      # subnet), listed after it as the fallback.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
          - 10.100.4.10
      # Studio drains in-flight requests for up to 30 s on SIGTERM (backend/shutdown.js); leave it room.
      terminationGracePeriodSeconds: 45
      # Files on the TrueNAS datasets belong to the image's node user.
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
    persistence:
      controld:
        type: emptyDir
        advancedMounts:
          main:
            ctrld:
              - path: /etc/controld
      ctrld:
        name: "{{ .Release.Name }}-ctrld"
        type: secret
        advancedMounts:
          main:
            ctrld:
              - path: /etc/ctrld
                readOnly: true
      data:
        existingClaim: data
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
              - path: /data
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
      public:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: Image & Video Studio
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: mdi-image-#ffffff
          gethomepage.dev/name: &title Studio
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /api/ping
          onepassword.excloo.dev/item: *title
        hostnames:
          - studio.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 8787
