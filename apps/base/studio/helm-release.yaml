apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              STUDIO_ALLOWED_HOSTS:
                dependsOn:
                  - BIFROST_HOST
                  - ROUTE_ALIAS_HOST
                  - ROUTE_HOST
                value: $(ROUTE_HOST),$(ROUTE_ALIAS_HOST),$(BIFROST_HOST),studio.studio.svc.cluster.local
              # The Chat tab talks to the local text models through Bifrost with the prompt
              # writer's key (external-secrets.yaml).
              STUDIO_CHAT_GATEWAY_MODELS: ai/*
              STUDIO_CHAT_GATEWAY_URL:
                dependsOn: STUDIO_PROMPT_WRITER_URL
                value: $(STUDIO_PROMPT_WRITER_URL)
              # Grok media goes straight to CLIProxyAPI with Studio's key (external-secrets.yaml).
              STUDIO_CLIPROXYAPI_URL: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317
              STUDIO_ENABLE_PRESETS: "1"
              # Studio scales these GPU deployments (apps/components/gpu/studio-runtime.yaml).
              # Pools: the GPU node's two GPUs and the gaming node's one.
              STUDIO_KUBERNETES_GPUS: '{"gpu": 2, "gaming": 1}'
              # Each image and video address is one Studio worker; its ids primary and video
              # keep recorded jobs on their worker. Text workloads take the text runtimes' key
              # (external-secrets.yaml), so Studio can ask the running one whether it reads images.
              STUDIO_KUBERNETES_WORKLOADS: >-
                {
                "comfyui": {"kind": "image", "label": "Image", "namespace": "comfyui", "deployment": "comfyui", "pool": "gpu", "gpus": 1, "url": "http://comfyui.comfyui.svc.cluster.local:8188", "worker": "primary", "capabilities": ["image", "upscale", "models"]},
                "comfyui-video": {"kind": "video", "label": "Video", "namespace": "comfyui-video", "deployment": "comfyui-video", "pool": "gpu", "gpus": 1, "url": "http://comfyui-video.comfyui-video.svc.cluster.local:8188", "worker": "video"},
                "comfyui-video-tp2": {"kind": "video", "label": "Video · 2 GPUs", "namespace": "comfyui-video", "deployment": "comfyui-video-tp2", "pool": "gpu", "gpus": 2, "url": "http://comfyui-video.comfyui-video.svc.cluster.local:8188"},
                "text-gemma": {"kind": "text", "label": "Gemma 4 31B", "namespace": "text", "deployment": "text-gemma", "pool": "gpu", "gpus": 1, "url": "http://gemma.text.svc.cluster.local:8000", "apiKeyEnv": "STUDIO_TEXT_KEY"},
                "text-gemma-tp2": {"kind": "text", "label": "Gemma 4 31B · 2 GPUs", "namespace": "text", "deployment": "text-gemma-tp2", "pool": "gpu", "gpus": 2, "url": "http://gemma.text.svc.cluster.local:8000", "apiKeyEnv": "STUDIO_TEXT_KEY"},
                "text-gemma-26b": {"kind": "text", "label": "Gemma 26B · Gaming", "namespace": "text", "deployment": "text-gemma-26b", "pool": "gaming", "gpus": 1, "url": "http://gemma-26b.text.svc.cluster.local:8000", "apiKeyEnv": "STUDIO_TEXT_KEY"},
                "text-maya": {"kind": "text", "label": "Maya · 2 GPUs", "namespace": "text", "deployment": "text-maya", "pool": "gpu", "gpus": 2, "url": "http://maya.text.svc.cluster.local:8000", "apiKeyEnv": "STUDIO_TEXT_KEY"},
                "text-qwen-35b": {"kind": "text", "label": "Qwen 35B · Gaming", "namespace": "text", "deployment": "text-qwen-35b", "pool": "gaming", "gpus": 1, "url": "http://qwen-35b.text.svc.cluster.local:8000", "apiKeyEnv": "STUDIO_TEXT_KEY"},
                "text-qwen-flash-next": {"kind": "text", "label": "Qwen Flash Next · 2 GPUs", "namespace": "text", "deployment": "text-qwen-flash-next", "pool": "gpu", "gpus": 2, "url": "http://qwen-flash-next.text.svc.cluster.local:8000", "apiKeyEnv": "STUDIO_TEXT_KEY"},
                "text-qwen-fp8": {"kind": "text", "label": "Qwen FP8", "namespace": "text", "deployment": "text-qwen-fp8", "pool": "gpu", "gpus": 1, "url": "http://qwen-fp8.text.svc.cluster.local:8000", "apiKeyEnv": "STUDIO_TEXT_KEY"},
                "text-qwen-fp8-tp2": {"kind": "text", "label": "Qwen FP8 · 2 GPUs", "namespace": "text", "deployment": "text-qwen-fp8-tp2", "pool": "gpu", "gpus": 2, "url": "http://qwen-fp8.text.svc.cluster.local:8000", "apiKeyEnv": "STUDIO_TEXT_KEY"},
                "text-qwen-mxfp4": {"kind": "text", "label": "Qwen MXFP4", "namespace": "text", "deployment": "text-qwen-mxfp4", "pool": "gpu", "gpus": 1, "url": "http://qwen-mxfp4.text.svc.cluster.local:8000", "apiKeyEnv": "STUDIO_TEXT_KEY"}
                }
              STUDIO_MCP_PROMPTING_PATH: /data/config/prompting.json
              STUDIO_MCP_PUBLIC_URL:
                dependsOn: BIFROST_HOST
                value: https://$(BIFROST_HOST)/studio
              STUDIO_MODEL_MANIFEST: /data/config/models.json
              STUDIO_MODEL_MANIFEST_PREFIX: models/comfyui/
              STUDIO_MODEL_STORAGE: worker
              STUDIO_MULTI_USER: "1"
              STUDIO_OIDC_CLIENT_ID: client.invalid
              STUDIO_OIDC_ISSUER: https://${identity_host}
              STUDIO_OIDC_LABEL: Pocket ID
              STUDIO_OIDC_REDIRECT_URI: https://app.invalid/api/accounts/oidc/callback
              # Studio writes chat prompts through Bifrost with its own key (external-secrets.yaml).
              STUDIO_PROMPT_WRITER_MODEL: ai/text
              STUDIO_PROMPT_WRITER_URL: http://bifrost.bifrost.svc.cluster.local:8080
              # Automatic control starts and stops image and video workloads; text
              # workloads change only from Settings › Workers (Bifrost calls them directly).
              STUDIO_RUNTIME_AUTOMATIC: "1"
              BIFROST_HOST: bifrost.invalid
              HOST: 0.0.0.0
              PORT: "8787"
              ROUTE_ALIAS_HOST: studio.${cluster_name}.excloo.dev
              ROUTE_HOST: app.invalid
              TZ: ${time_zone}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/maxexcloo/studio
              tag: 2026.10.28.26
            probes:
              liveness:
                path: /api/ping
              readiness: &ready
                path: /api/ready
              startup: *ready
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 100m
                memory: 512Mi
    defaultPodOptions:
      # Studio's service account scales the GPU workloads.
      automountServiceAccountToken: true
      # Studio drains in-flight requests for up to 30 s on SIGTERM (backend/shutdown.js); leave it room.
      terminationGracePeriodSeconds: 45
      # Files on the TrueNAS datasets belong to the image's node user.
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
    route:
      private:
        annotations:
          gethomepage.dev/description: Image & Video Studio
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: mdi-image-#ffffff
          gethomepage.dev/name: &title Studio
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /api/ping
          onepassword.excloo.dev/item: *title
        hostnames:
          - studio.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 8787
