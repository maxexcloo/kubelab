apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              STUDIO_ALLOWED_HOSTS:
                dependsOn:
                  - BIFROST_HOST
                  - ROUTE_ALIAS_HOST
                  - ROUTE_HOST
                value: $(ROUTE_HOST),$(ROUTE_ALIAS_HOST),$(BIFROST_HOST),studio.studio.svc.cluster.local
              # The Chat tab talks to the local and cloud text models through Bifrost with
              # the prompt writer's key (external-secrets.yaml).
              STUDIO_CHAT_GATEWAY_MODELS: local/auto,cloud/auto
              STUDIO_CHAT_GATEWAY_URL:
                dependsOn: STUDIO_PROMPT_WRITER_URL
                value: $(STUDIO_PROMPT_WRITER_URL)
              # Grok media goes straight to CLIProxyAPI with Studio's key (external-secrets.yaml).
              STUDIO_CLIPROXYAPI_URL: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317
              STUDIO_ENABLE_PRESETS: "1"
              # Studio scales these GPU deployments (apps/components/gpu/studio-runtime.yaml).
              # Pools: the GPU node's two GPUs and the gaming node's one.
              STUDIO_KUBERNETES_GPUS: '{"gpu": 2, "gaming": 1}'
              # Studio finds its workloads from the studio.excloo.dev labels on the GPU
              # Deployments in these namespaces; text ones serve local/auto.
              STUDIO_KUBERNETES_NAMESPACES: comfyui,comfyui-video,text
              STUDIO_LOCAL_TEXT_MODEL: local/auto
              STUDIO_MCP_PROMPTING_PATH: /data/config/prompting.json
              STUDIO_MCP_PUBLIC_URL:
                dependsOn: BIFROST_HOST
                value: https://$(BIFROST_HOST)/studio
              STUDIO_MODEL_MANIFEST: /data/config/models.json
              STUDIO_MODEL_MANIFEST_PREFIX: models/comfyui/
              STUDIO_MULTI_USER: "1"
              STUDIO_OIDC_CLIENT_ID: client.invalid
              STUDIO_OIDC_ISSUER: https://${identity_host}
              STUDIO_OIDC_LABEL: Pocket ID
              STUDIO_OIDC_REDIRECT_URI: https://app.invalid/api/accounts/oidc/callback
              # Studio writes chat prompts through Bifrost with its own key (external-secrets.yaml).
              STUDIO_PROMPT_WRITER_MODEL: cloud/auto
              STUDIO_PROMPT_WRITER_URL: http://bifrost.bifrost.svc.cluster.local:8080
              # Automatic control starts and stops image and video workloads; text
              # workloads change only from Settings › Workers (Bifrost calls them directly).
              STUDIO_RUNTIME_AUTOMATIC: "1"
              BIFROST_HOST: bifrost.invalid
              HOST: 0.0.0.0
              PORT: "8787"
              ROUTE_ALIAS_HOST: studio.${cluster_name}.excloo.dev
              ROUTE_HOST: app.invalid
              TZ: ${time_zone}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/maxexcloo/studio
              tag: 2026.10.31.5
            probes:
              liveness:
                path: /api/ping
              readiness: &ready
                path: /api/ready
              startup: *ready
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 100m
                memory: 512Mi
    defaultPodOptions:
      # Studio's service account scales the GPU workloads.
      automountServiceAccountToken: true
      # Studio drains in-flight requests for up to 30 s on SIGTERM (backend/shutdown.js); leave it room.
      terminationGracePeriodSeconds: 45
      # Files on the TrueNAS datasets belong to the image's node user.
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
    route:
      private:
        annotations:
          gethomepage.dev/description: Image & Video Studio
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: mdi-image-#ffffff
          gethomepage.dev/name: &title Studio
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /api/ping
          onepassword.excloo.dev/item: *title
        hostnames:
          - studio.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 8787
