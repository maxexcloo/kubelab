apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              # Address parts compose the URLs below; Studio ignores them.
              AI_ADDRESS: ${bento_address}
              COMFY_URL:
                dependsOn: AI_ADDRESS
                value: http://$(AI_ADDRESS):8190
              COMFY_VIDEO_URL:
                dependsOn: AI_ADDRESS
                value: http://$(AI_ADDRESS):8191
              # A chat call queues up to ten images at once.
              STUDIO_ACCOUNT_MAX_OUTSTANDING_JOBS: "10"
              STUDIO_ALLOWED_HOSTS:
                dependsOn:
                  - BIFROST_HOST
                  - ROUTE_ALIAS_HOST
                  - ROUTE_HOST
                value: $(ROUTE_HOST),$(ROUTE_ALIAS_HOST),$(BIFROST_HOST),studio.studio.svc.cluster.local
              STUDIO_ENABLE_BUILTIN_PROFILES: "0"
              STUDIO_ENABLE_PRESETS: "1"
              STUDIO_MODEL_MANIFEST: /data/config/models.json
              STUDIO_MODEL_MANIFEST_PREFIX: models/comfyui/
              STUDIO_MODEL_STORAGE: worker
              STUDIO_MULTI_USER: "1"
              STUDIO_OIDC_CLIENT_ID: client.invalid
              STUDIO_OIDC_ISSUER: https://${identity_host}
              STUDIO_OIDC_LABEL: Pocket ID
              STUDIO_OIDC_REDIRECT_URI: https://app.invalid/api/accounts/oidc/callback
              # Studio writes chat prompts through Bifrost with its own key (external-secrets.yaml).
              STUDIO_PROMPT_WRITER_MODEL: local/text
              STUDIO_PROMPT_WRITER_URL: http://bifrost.bifrost.svc.cluster.local:8080
              BIFROST_HOST: bifrost.invalid
              # Refine in Chat opens LibreChat with the prompt filled in (?prompt=).
              CHAT_HOST: chat.invalid
              STUDIO_CHAT_URL:
                dependsOn: CHAT_HOST
                value: https://$(CHAT_HOST)
              HOST: 0.0.0.0
              MCP_PROMPTING_PATH: /data/config/prompting.json
              MCP_PUBLIC_URL:
                dependsOn: BIFROST_HOST
                value: https://$(BIFROST_HOST)/studio
              PORT: "8787"
              ROUTE_ALIAS_HOST: studio.${cluster_name}.excloo.dev
              ROUTE_HOST: app.invalid
              TZ: ${time_zone}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/maxexcloo/studio
              tag: 0.51.0
            probes:
              liveness:
                path: /api/ping
              readiness: &ready
                path: /api/ready
              startup: *ready
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 100m
                memory: 512Mi
    # Files on the TrueNAS datasets belong to the image's node user.
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
    route:
      private:
        annotations:
          gethomepage.dev/description: Image & Video Studio
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: mdi-image-#ffffff
          gethomepage.dev/name: &title Studio
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /api/ping
          onepassword.excloo.dev/item: *title
        hostnames:
          - studio.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 8787
