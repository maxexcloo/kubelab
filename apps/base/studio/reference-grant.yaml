apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: bifrost-results
spec:
  # Bifrost's route serve signed MCP result links from the studio.
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: bifrost
  to:
    - group: ""
      kind: Service
      name: studio
