apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: litellm-results
spec:
  # LiteLLM's routes serve signed MCP result links from the studio.
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: litellm
  to:
    - group: ""
      kind: Service
      name: studio
