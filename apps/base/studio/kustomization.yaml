apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: studio
resources:
  - cloudflare-access.yaml
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - private-dns.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../components/default-deny
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: PocketIDClient
      fieldPath: spec.client.id
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.STUDIO_OIDC_CLIENT_ID
transformers:
  - ../../transformers/cluster-scoped
  - ../../transformers/pocket-id-icon-public
