apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
  storageClassName: ""
  volumeName: studio-data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: studio-data
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Ti
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: ${dataset_root}/truenas-nvme/studio
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ${storage_node}
