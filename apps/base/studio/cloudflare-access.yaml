apiVersion: automation.excloo.dev/v1alpha1
kind: CloudflareAccessApplication
metadata:
  name: studio
spec:
  hostname: studio.excloo.com
  name: Studio
---
apiVersion: automation.excloo.dev/v1alpha1
kind: CloudflareAccessApplication
metadata:
  name: studio-mcp
spec:
  hostname: studio.excloo.com
  name: "Studio: MCP"
  # MCP takes a personal token, which a Grok connector puts in the path, and result links
  # are signed. OAuth discovery reaches Studio's plain 404 rather than the login page.
  paths:
    - .well-known/oauth-authorization-server
    - .well-known/oauth-protected-resource
    - mcp
