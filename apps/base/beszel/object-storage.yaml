apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beszel-object-storage
  annotations:
    onepassword.excloo.dev/defaults: '{"object-storage-bucket":"excloo-syd-beszel"}'
    onepassword.excloo.dev/values: '{"object-storage-access-key-id":"b2-application-key/access-key-id","object-storage-endpoint":"b2-application-key/endpoint","object-storage-secret-access-key":"b2-application-key/secret-access-key"}'
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: l6ndlsmefn6gafyr7cfk3u24gm
        property: object-storage-bucket
      secretKey: bucket
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: beszel-object-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: onepassword-items
rules:
  - apiGroups: [""]
    resourceNames: [b2-application-key]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: onepassword-items
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: onepassword-items
subjects:
  - kind: ServiceAccount
    name: onepassword-items
    namespace: external-secrets
---
apiVersion: automation.excloo.dev/v1alpha1
kind: B2ObjectStorage
metadata:
  name: application
spec:
  displayName: Beszel
  keyName: kubelab-syd-beszel
  secretRef:
    name: beszel-object-storage
