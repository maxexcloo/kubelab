apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - object-storage.yaml
  - pocket-id.yaml
  - private-dns.yaml
  - resend.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../components/app-namespace
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
