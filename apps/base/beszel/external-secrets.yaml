apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beszel
  annotations:
    onepassword.excloo.dev/generate-fields: password
    onepassword.excloo.dev/owner-email-fields: username
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Beszel
        property: username
      secretKey: USER_EMAIL
    - remoteRef:
        key: *item
        property: password
      secretKey: USER_PASSWORD
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: beszel
