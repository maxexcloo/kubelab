apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: beszel-object-storage
  namespace: beszel
  annotations:
    onepassword.excloo.dev/adopt-titles: Beszel (beszel)
    onepassword.excloo.dev/migrate-fields: '{"object_storage_access_key_id_ro":"object-storage-access-key-id","object_storage_bucket_ro":"object-storage-bucket","object_storage_endpoint_ro":"object-storage-endpoint","object_storage_secret_access_key_ro":"object-storage-secret-access-key"}'
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: Beszel
        property: object-storage-access-key-id
      secretKey: access-key-id
    - remoteRef:
        key: Beszel
        property: object-storage-bucket
      secretKey: bucket
    - remoteRef:
        key: Beszel
        property: object-storage-endpoint
      secretKey: endpoint
    - remoteRef:
        key: Beszel
        property: object-storage-secret-access-key
      secretKey: secret-access-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: beszel-object-storage
