apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application
  labels:
    app.kubernetes.io/name: application
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8090
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: beszel
  policyTypes:
    - Ingress
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: beszel-agents
  namespace: beszel
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: beszel
  ingress:
    # Host-network agents have node identities rather than pod identities.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8090"
              protocol: TCP
