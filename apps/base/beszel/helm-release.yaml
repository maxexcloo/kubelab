apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              APP_URL: https://app.invalid
              TZ: Australia/Sydney
              USER_CREATION: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/henrygd/beszel/beszel
              tag: 0.21.0@sha256:020d80f5974e66356e6d6440736952edc9b9ea59978ac9f98418b5fb643dc0e2
            probes:
              liveness: &health
                type: COMMAND
                command:
                  - /beszel
                  - health
                  - --url
                  - http://127.0.0.1:8090
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 20m
                memory: 64Mi
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /beszel_data
    route:
      private:
        annotations:
          gethomepage.dev/description: System Monitoring
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Operations
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-beszel
          gethomepage.dev/name: Beszel
          gethomepage.dev/widget.password: '{{ "{{HOMEPAGE_FILE_BESZEL_PASSWORD}}" }}'
          gethomepage.dev/widget.type: beszel
          gethomepage.dev/widget.url: https://app.invalid
          gethomepage.dev/widget.username: '{{ "{{HOMEPAGE_FILE_BESZEL_USERNAME}}" }}'
          gethomepage.dev/widget.version: "2"
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: Beszel
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 8090
