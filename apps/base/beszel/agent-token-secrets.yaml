apiVersion: v1
kind: Secret
metadata:
  name: beszel-agent-token
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: beszel-agent-token
spec:
  data:
    - match:
        secretKey: token
        remoteRef:
          property: agent-token
          remoteKey: Beszel Agent
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          tags: [Kubelab]
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: beszel-agent-token
