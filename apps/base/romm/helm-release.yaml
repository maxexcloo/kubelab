apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              # Retain audit events and avoid automatic cleanup jobs.
              AUDIT_LOG_RETENTION_DAYS: "0"
              CSDB_API_ENABLED: "true"
              DB_HOST: "{{ .Release.Name }}-database-rw"
              DB_PORT: "5432"
              DB_QUERY_JSON: '{"sslmode":"require"}'
              DEMOZOO_API_ENABLED: "true"
              DEVICE_INSTALL_REQUEST_TTL_DAYS: "0"
              ENABLE_SCHEDULED_CLEANUP_NETPLAY: "false"
              ENABLE_SCHEDULED_CLEANUP_SYNC_SESSIONS: "false"
              ENABLE_SCHEDULED_CLEANUP_UPLOAD_TMP: "false"
              ENABLE_SCHEDULED_CLEANUP_ZIP_CACHE: "false"
              FLASHPOINT_API_ENABLED: "true"
              HASHEOUS_API_ENABLED: "true"
              HLTB_API_ENABLED: "true"
              LAUNCHBOX_API_ENABLED: "true"
              OIDC_ENABLED: "true"
              OIDC_PROVIDER: Pocket ID
              OIDC_REDIRECT_URI: https://app.invalid/api/oauth/openid
              OIDC_SERVER_APPLICATION_URL: https://identity.invalid
              OIDC_SERVER_METADATA_URL: https://identity.invalid/.well-known/openid-configuration
              PLAYMATCH_API_ENABLED: "true"
              POUET_API_ENABLED: "true"
              REDIS_HOST: localhost
              ROMM_BASE_URL: https://app.invalid
              ROMM_DB_DRIVER: postgresql
              # Large library metadata scans exceed 24 hours even with four workers.
              SCAN_TIMEOUT: "259200"
              SCAN_WORKERS: "4"
              SMTP_FROM: romm@excloo.dev
              SMTP_HOST: smtp.resend.com
              SMTP_PORT: "465"
              SMTP_SECURITY: tls
              SMTP_USERNAME: resend
              STEAM_API_ENABLED: "true"
              TGDB_API_ENABLED: "true"
              TZ: Australia/Sydney
              DB_PASSWD:
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: "{{ .Release.Name }}-database"
              DB_USER:
                valueFrom:
                  secretKeyRef:
                    key: username
                    name: "{{ .Release.Name }}-database"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/rommapp/romm
              tag: 5.4.0
            probes:
              liveness: &health
                path: /api/heartbeat
                port: 8080
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 100m
                memory: 1Gi
          valkey:
            args:
              - valkey-server
              - --appendonly
              - "no"
              - --save
              - ""
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/valkey/valkey
              tag: 9.1.2
            probes:
              liveness: &valkey-health
                enabled: true
                port: 6379
                spec:
                  timeoutSeconds: 5
              readiness: *valkey-health
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 20m
                memory: 128Mi
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
              - path: /romm/assets
                subPath: assets
              - path: /romm/config
                subPath: config
              - path: /romm/resources
                subPath: resources
      games:
        existingClaim: games
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
              - path: /romm/library/roms
                subPath: roms
              - path: /romm/library/bios
                subPath: bios
      nginx-configuration:
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /etc/nginx/conf.d
      valkey:
        type: emptyDir
        advancedMounts:
          main:
            valkey:
              - path: /data
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 8080
      public:
        forceRename: "{{ .Release.Name }}"
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: Game & ROM Library
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-romm
          gethomepage.dev/name: &title RoMM
          gethomepage.dev/widget.type: romm
          gethomepage.dev/widget.url: https://app.invalid
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: qkrf4jrzlqslswzcqjcsm3u4xe
          onepassword.excloo.dev/title: *title
        hostnames:
          - games.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 8080
