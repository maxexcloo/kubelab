apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: romm-database
  namespace: romm
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:e5e820a9083134141caac23cad1d6affd39101a9fefe7bf6cc07738a3fa89452
  instances: 1
  bootstrap:
    initdb:
      database: romm
      owner: romm
      secret:
        name: romm-database
  storage:
    size: 10Gi
    storageClass: local-path
