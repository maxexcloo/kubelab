apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: romm-database
  namespace: romm
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:79be0d10e78b7ac4520cf6c5db199a8bb7f6de53b3229f47e90cab5865528a0d
  instances: 1
  bootstrap:
    initdb:
      database: romm
      owner: romm
      secret:
        name: romm-database
  storage:
    size: 10Gi
    storageClass: local-path
