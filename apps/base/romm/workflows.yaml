apiVersion: batch/v1
kind: CronJob
metadata:
  name: romm-workflows
  namespace: romm
  labels:
    app.kubernetes.io/component: workflows
    app.kubernetes.io/name: romm
spec:
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  suspend: true
  jobTemplate:
    spec:
      activeDeadlineSeconds: 86400
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/component: workflows
            app.kubernetes.io/name: romm
        spec:
          automountServiceAccountToken: false
          containers:
            - name: workflow
              image: docker.io/library/python:3.14.5-alpine3.23@sha256:5a824eb82cc75361f98611f3cfc5091ea33f10a6ccea4d4ebdabbc523b9a1614
              imagePullPolicy: IfNotPresent
              command: [python, /app/workflow.py]
              env:
                - name: BATCH
                  value: ""
                - name: CONFIRMATION
                  value: ""
                - name: MODE
                  value: inventory
                - name: RUN_ID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
              resources:
                limits:
                  memory: 4Gi
                requests:
                  cpu: 100m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: configuration
                  mountPath: /app
                  readOnly: true
                - name: games
                  mountPath: /games
                - name: romm
                  mountPath: /romm
                  readOnly: true
                  subPath: library
                - name: temporary
                  mountPath: /tmp
          restartPolicy: Never
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: configuration
              configMap:
                name: romm-workflows
            - name: games
              persistentVolumeClaim:
                claimName: games
            - name: romm
              persistentVolumeClaim:
                claimName: data
            - name: temporary
              emptyDir: {}
