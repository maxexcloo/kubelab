apiVersion: v1
kind: Service
metadata:
  name: webstation
spec:
  ports:
    - name: http
      port: 3000
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: webstation
  labels:
    endpointslice.kubernetes.io/managed-by: kubelab
    kubernetes.io/service-name: webstation
addressType: IPv4
endpoints:
  - addresses:
      - 100.87.73.3
    conditions:
      ready: true
ports:
  - name: http
    port: 3000
    protocol: TCP
