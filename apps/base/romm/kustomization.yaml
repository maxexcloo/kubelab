apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romm
resources:
  - cloudflare-access.yaml
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - private-dns.yaml
  - resend.yaml
  - storage.yaml
  - webstation.yaml
components:
  - ../../../platform/databases/postgres
  - ../../components/application
  - ../../components/default-deny
  - ../../components/database-colocation
  - ../../../platform/backups/credentials
configurations:
  - name-reference.yaml
configMapGenerator:
  - name: romm-config
    files:
      - config.yml=config.yaml
patches:
  - path: database.yaml
    target:
      kind: Cluster
  - path: helm-release.yaml
    target:
      kind: HelmRelease
transformers:
  - ../../transformers/cluster-scoped
  - ../../transformers/pocket-id-icon-public
