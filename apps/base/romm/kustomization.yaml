apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - resend.yaml
  - storage.yaml
components:
  - ../../../platform/databases/postgres
  - ../../components/application
  - ../../components/database-colocation
  - ../../../platform/backups/credentials
  - ../../components/private-dns-control-d-only
  - ../../components/app-namespace
patches:
  - path: database.yaml
    target:
      kind: Cluster
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.public.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.OIDC_REDIRECT_URI
          - spec.values.controllers.main.containers.main.env.ROMM_BASE_URL
          - spec.values.route.public.annotations.[gethomepage.dev/href]
          - spec.values.route.public.annotations.[gethomepage.dev/widget.url]
        options:
          delimiter: /
          index: 2
transformers:
  - ../../transformers/route-public
