apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: romm
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Ti
  storageClassName: ""
  volumeName: romm-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: games
  namespace: romm
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4Ti
  storageClassName: ""
  volumeName: romm-games
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: romm-data
  labels:
    app.kubernetes.io/name: romm
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 2Ti
  mountOptions:
    - nfsvers=4.2
  nfs:
    path: /mnt/truenas-nvme/romm
    server: storage.invalid
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: romm-games
  labels:
    app.kubernetes.io/name: romm
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 4Ti
  mountOptions:
    - nfsvers=4.2
  nfs:
    path: /mnt/truenas/games
    server: storage.invalid
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
