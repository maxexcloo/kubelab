apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Ti
  storageClassName: ""
  volumeName: romm-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: games
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Ti
  storageClassName: ""
  volumeName: romm-games
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: romm-data
  labels:
    app.kubernetes.io/name: application
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 2Ti
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/mnt/datasets/truenas-nvme/romm
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - kimbap
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: romm-games
  labels:
    app.kubernetes.io/name: application
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 4Ti
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/mnt/datasets/truenas/games
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - kimbap
