apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm
  namespace: romm
spec:
  values:
    route:
      public:
        hostnames:
          - games.excloo.com
        annotations:
          gethomepage.dev/description: Game & ROM Library
          gethomepage.dev/enabled: "true"
          monitoring.excloo.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/icon: romm
          gethomepage.dev/name: RoMM
    controllers:
      romm:
        containers:
          romm:
            env:
              DB_HOST: romm-database-rw
              DB_PORT: "5432"
              DB_QUERY_JSON: '{"sslmode":"require"}'
              HASHEOUS_API_ENABLED: "true"
              OIDC_ENABLED: "true"
              OIDC_PROVIDER: Pocket ID
              PLAYMATCH_API_ENABLED: "true"
              REDIS_HOST: localhost
              ROMM_DB_DRIVER: postgresql
              SCAN_TIMEOUT: "86400"
              TZ: Australia/Sydney
