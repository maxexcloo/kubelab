apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: romm
  namespace: romm
spec:
  values:
    route:
      public:
        hostnames:
          - games.excloo.com
        annotations:
          gethomepage.dev/description: Game & ROM Library
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/icon: sh-romm
          gethomepage.dev/name: RoMM
          monitoring.excloo.dev/enabled: "true"
    controllers:
      romm:
        containers:
          romm:
            env:
              # Retain audit events and avoid automatic cleanup jobs.
              AUDIT_LOG_RETENTION_DAYS: "0"
              CSDB_API_ENABLED: "true"
              DB_HOST: romm-database-rw
              DB_PORT: "5432"
              DB_QUERY_JSON: '{"sslmode":"require"}'
              DEMOZOO_API_ENABLED: "true"
              DEVICE_INSTALL_REQUEST_TTL_DAYS: "0"
              ENABLE_SCHEDULED_CLEANUP_NETPLAY: "false"
              ENABLE_SCHEDULED_CLEANUP_SYNC_SESSIONS: "false"
              ENABLE_SCHEDULED_CLEANUP_UPLOAD_TMP: "false"
              ENABLE_SCHEDULED_CLEANUP_ZIP_CACHE: "false"
              FLASHPOINT_API_ENABLED: "true"
              HASHEOUS_API_ENABLED: "true"
              HLTB_API_ENABLED: "true"
              LAUNCHBOX_API_ENABLED: "true"
              OIDC_ENABLED: "true"
              OIDC_PROVIDER: Pocket ID
              PLAYMATCH_API_ENABLED: "true"
              POUET_API_ENABLED: "true"
              REDIS_HOST: localhost
              ROMM_DB_DRIVER: postgresql
              # Large library metadata scans exceed 24 hours even with four workers.
              SCAN_TIMEOUT: "259200"
              SMTP_FROM: romm@excloo.dev
              SMTP_HOST: smtp.resend.com
              SMTP_PORT: "465"
              SMTP_SECURITY: tls
              SMTP_USERNAME: resend
              STEAM_API_ENABLED: "true"
              TGDB_API_ENABLED: "true"
              TZ: Australia/Sydney
