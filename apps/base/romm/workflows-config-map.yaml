      ],
      "tools": {
        "fresh1g1r": {
          "archive_sha256": "907c80726847636263a126673675e214492502f24570a823a58a99046bb85e77",
          "archive_url": "https://codeload.github.com/UnluckyForSome/Fresh1G1R/tar.gz/5b8f9e0ebb0c34573805c337a375bbe3ee8fbec1",
          "revision": "5b8f9e0ebb0c34573805c337a375bbe3ee8fbec1"
        },
        "igir": {
          "archive_sha256": "67912875159036a2f381806a6fbf10a941f30d859c967c1772566f35cf110d0d",
          "archive_url": "https://github.com/emmercm/igir/releases/download/v5.0.2/igir-5.0.2-Linux-amd64.tar.gz",
          "binary_sha256": "47c534db3316282f43b257798d3cd39768f6138b2ae62a7d85e59a4b51d4113e",
