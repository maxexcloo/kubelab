apiVersion: batch/v1
kind: CronJob
metadata:
  name: state-backup
spec:
  schedule: 39 3 * * *
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              # Fetched artwork in resources can be regenerated by a rescan.
              volumeMounts:
                - mountPath: /sources/data
                  $patch: delete
                - name: data
                  mountPath: /sources/assets
                  readOnly: true
                  subPath: assets
                - name: data
                  mountPath: /sources/config
                  readOnly: true
                  subPath: config
