apiVersion: batch/v1
kind: CronJob
metadata:
  name: romm-backup
  namespace: romm
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/name: romm
spec:
  schedule: "30 3 * * *"
  timeZone: Australia/Sydney
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
            app.kubernetes.io/name: romm
        spec:
          automountServiceAccountToken: false
          containers:
            - name: backup
              image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:58d19a1edb30d42fc2be3470ac7719caa496a4f3a7f1289472d6c3f6b04c8fd1
              imagePullPolicy: IfNotPresent
              command:
                - /usr/bin/sh
                - -c
                - |-
                  set -eu
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  target="/backup/romm-${timestamp}.dump"
                  pg_dump --file="$target" --format=custom --no-owner --no-privileges
                  pg_restore --list "$target" >/dev/null
                  find /backup -type f -name 'romm-*.dump' -mtime +27 -delete
              env:
                - name: PGDATABASE
                  value: romm
                - name: PGHOST
                  value: romm-database-rw
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: romm-database
                - name: PGSSLMODE
                  value: require
                - name: PGUSER
                  value: romm
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 20m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
          restartPolicy: Never
          securityContext:
            fsGroup: 26
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 26
            runAsNonRoot: true
            runAsUser: 26
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup
