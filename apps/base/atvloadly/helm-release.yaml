apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            nameOverride: "{{ .Release.Name }}"
            env:
              # Host networking exposes every node interface; listen only on the
              # Tailscale address the gateway reaches, keeping the LAN out.
              LISTEN_ADDR:
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
              SERVICE_PORT: "5533"
              TZ: ${time_zone}
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/maxexcloo/atvloadly
              tag: sha-625ce66b7ff565470d8bd58f938b3a83709b68dc
            probes:
              liveness: &health
                custom: true
                enabled: true
                spec: &health-spec
                  httpGet:
                    path: /
                    port: 5533
                  timeoutSeconds: 5
              readiness: *health
              startup:
                <<: *health
                spec: { <<: *health-spec, failureThreshold: 30 }
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 20m
                memory: 128Mi
            securityContext:
              seccompProfile:
                type: Unconfined
    defaultPodOptions:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
              - path: /data
    route:
      private:
        annotations:
          gethomepage.dev/description: Apple TV App Installation & Refresh
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: mdi-apple-#ffffff
          gethomepage.dev/name: ATVLoadly
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /
        hostnames:
          - atvloadly.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        controller: main
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            port: 5533
            protocol: HTTP
