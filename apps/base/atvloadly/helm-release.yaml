apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            nameOverride: "{{ .Release.Name }}"
            env:
              SERVICE_PORT: "5533"
              TZ: ${time_zone}
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/maxexcloo/atvloadly
              tag: sha-0e8fa65d87697598dbb745f1f083dfcb7632b1a9
            probes:
              liveness: &health
                custom: true
                enabled: true
                spec: &health-spec
                  httpGet:
                    host: 127.0.0.1
                    path: /
                    port: 5533
                  timeoutSeconds: 5
              readiness: *health
              startup:
                <<: *health
                spec: { <<: *health-spec, failureThreshold: 30 }
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 20m
                memory: 128Mi
            securityContext:
              seccompProfile:
                type: Unconfined
          proxy:
            args:
              - nginx
              - -c
              - /tmp/nginx.conf
              - -g
              - daemon off;
            env:
              NGINX_ENVSUBST_OUTPUT_DIR: /tmp
              NODE_IP:
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/library/nginx
              tag: 1.31.8-alpine
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 5m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsGroup: 568
              runAsNonRoot: true
              runAsUser: 568
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
              - path: /data
      proxy-config:
        name: atvloadly-proxy
        type: configMap
        advancedMounts:
          main:
            proxy:
              - path: /etc/nginx/templates/nginx.conf.template
                readOnly: true
                subPath: nginx.conf.template
      proxy-temporary:
        type: emptyDir
        advancedMounts:
          main:
            proxy:
              - path: /tmp
    route:
      private:
        annotations:
          gethomepage.dev/description: Apple TV App Installation & Refresh
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: mdi-apple-#ffffff
          gethomepage.dev/name: ATVLoadly
          monitoring.excloo.dev/enabled: "true"
          monitoring.excloo.dev/path: /
        hostnames:
          - atvloadly.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        controller: main
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            port: 5534
            protocol: HTTP
