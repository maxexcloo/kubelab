apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atvloadly
resources:
  - namespace.yaml
  - storage.yaml
configMapGenerator:
  - name: atvloadly-proxy
    files:
      - nginx.conf.template=proxy.conf.template
      - proxy-gateway.envsh
configurations:
  - name-reference.yaml
components:
  - ../../components/workload
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
  - ../../components/private-dns
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
transformers:
  - ../../transformers/route-private
