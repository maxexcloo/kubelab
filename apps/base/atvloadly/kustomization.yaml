apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - storage.yaml
configMapGenerator:
  - name: atvloadly-proxy
    files:
      - nginx.conf.template=proxy.conf.template
configurations:
  - name-reference.yaml
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
components:
  - ../../components/workload
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
  - ../../components/private-dns
  - ../../components/app-namespace
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
transformers:
  - ../../transformers/route-private
