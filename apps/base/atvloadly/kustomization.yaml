apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - private-dns.yaml
  - storage.yaml
configMapGenerator:
  - name: atvloadly-proxy
    files:
      - nginx.conf.template=proxy.conf.template
configurations:
  - name-reference.yaml
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.hostname
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
components:
  - ../../components/workload
  - ../../../platform/backups/destination
  - ../../../platform/backups/files
  - ../../components/app-namespace
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: file-backup.yaml
    target:
      kind: CronJob
      name: file-backup
