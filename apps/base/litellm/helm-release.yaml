apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  interval: 30m
  chart:
    spec:
      chart: litellm-helm
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: flux-system
      version: 1.106.0
  values:
    fullnameOverride: litellm
    masterkeySecretKey: LITELLM_MASTER_KEY
    masterkeySecretName: litellm
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cnpg.io/instanceRole: primary
            topologyKey: kubernetes.io/hostname
    db:
      database: litellm
      deployStandalone: false
      endpoint: litellm-database-rw
      url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)?sslmode=require
      useExisting: true
      secret:
        name: litellm-database
        passwordKey: password
        usernameKey: username
    environmentSecrets:
      - litellm
    envVars:
      GENERIC_AUTHORIZATION_ENDPOINT: https://identity.invalid/authorize
      GENERIC_CLIENT_USE_PKCE: "true"
      GENERIC_TOKEN_ENDPOINT: https://identity.invalid/api/oidc/token
      GENERIC_USERINFO_ENDPOINT: https://identity.invalid/api/oidc/userinfo
      GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
      GENERIC_USER_FIRST_NAME_ATTRIBUTE: given_name
      GENERIC_USER_ID_ATTRIBUTE: sub
      GENERIC_USER_LAST_NAME_ATTRIBUTE: family_name
      HOME: /tmp
      PROXY_BASE_URL: https://app.invalid
      # Provider discovery uses the shared HTTP client; chat requests use the deployment timeout.
      REQUEST_TIMEOUT: "5"
      STORE_MODEL_IN_DB: "True"
      TZ: time-zone.invalid
    image:
      pullPolicy: IfNotPresent
      repository: ghcr.io/berriai/litellm
      tag: v1.106.0
    migrationJob:
      hooks:
        argocd:
          enabled: false
        helm:
          enabled: true
      resources:
        limits:
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 512Mi
    nodeSelector:
      node.excloo.dev/network: internal
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    proxy_config:
      general_settings:
        disable_env_credential_login: true
        master_key: os.environ/LITELLM_MASTER_KEY
        # Models are registered in the UI and read provider keys from this pod
        # as os.environ/<NAME>.
        require_key_mcp_access_defined: true
      litellm_settings:
        check_provider_endpoint: true
      # Key grants in the UI name these pinned server IDs. Servers without an
      # auth_type accept only this pod through their network policies.
      mcp_servers:
        actual_budget:
          alias: actual_budget
          description: Review and manage accounts, transactions, budgets and spending in Actual Budget.
          server_id: actual-budget
          transport: http
          url: http://actual-budget-mcp.actual-budget-mcp.svc.cluster.local:3000/mcp
        ai_control:
          alias: ai_control
          auth_type: bearer_token
          authentication_token: os.environ/AI_CONTROL_API_KEY
          description: Manage AI workloads and preview GPU allocation changes.
          server_id: ai-control
          transport: http
          url: http://studio.studio.svc.cluster.local:8787/mcp
        home_assistant:
          alias: home_assistant
          description: Inspect and control home devices, automations and dashboards.
          server_id: home-assistant
          transport: http
          url: http://home-assistant-mcp.home-assistant-mcp.svc.cluster.local:8086/mcp
        reactive_resume:
          alias: reactive_resume
          auth_type: api_key
          authentication_token: os.environ/REACTIVE_RESUME_API_KEY
          description: Read and edit resumes, cover letters and job applications in Reactive Resume.
          server_id: reactive-resume
          transport: http
          url: http://reactive-resume.reactive-resume.svc.cluster.local:3000/mcp
        studio:
          alias: studio
          allow_all_keys: true
          auth_type: bearer_token
          authentication_token: os.environ/STUDIO_MCP_API_KEY
          description: Create and manage images and videos in Studio.
          server_id: studio
          # Studio waits up to 31 minutes for generation results.
          timeout: 1860
          transport: http
          url: http://studio.studio.svc.cluster.local:8787/mcp
          allowed_tools:
            - Cancel
            - Generate
            - Models
            - Result
            - Reuse
            - Review
            - Upload
          extra_headers:
            - X-AI-User-Email
            - X-AI-User-Id
            - X-Studio-Conversation-Id
        unifi_network:
          alias: unifi_network
          description: Inspect and manage UniFi networks, devices and clients.
          server_id: unifi-network
          transport: http
          url: http://unifi-network-mcp.unifi-network-mcp.svc.cluster.local:3000/mcp
      # Other models live in the UI. Radiance answers with whichever text model AI Control
      # has loaded, under any name, and fails fast while its text runtime is off.
      # ai/studio plans Studio's tool calls with low reasoning, whatever the client sends.
      # ai/text-quick has no reasoning, for short helper calls such as titles.
      model_list:
        - model_name: ai/studio
          litellm_params:
            api_base: http://host.invalid:8000/v1
            api_key: os.environ/AI_API_KEY
            max_retries: 0
            model: openai/text
            num_retries: 0
            reasoning_effort: low
            timeout: 300
          model_info:
            max_input_tokens: 262144
            supports_vision: true
        - model_name: ai/text
          litellm_params:
            api_base: http://host.invalid:8000/v1
            api_key: os.environ/AI_API_KEY
            max_retries: 0
            model: openai/text
            num_retries: 0
            timeout: 300
          model_info:
            max_input_tokens: 262144
            supports_vision: true
        - model_name: ai/text-quick
          litellm_params:
            api_base: http://host.invalid:8000/v1
            api_key: os.environ/AI_API_KEY
            max_retries: 0
            model: openai/text
            num_retries: 0
            reasoning_effort: none
            timeout: 60
      # No fallbacks: Grok is disabled (2026-10-21) until its CLIProxyAPI access works again.
      # UI-registered search tools cannot read os.environ/ keys, so these stay here.
      # Keenable, LibreChat's default search provider, has no LiteLLM integration.
      search_tools:
        - search_tool_name: firecrawl
          litellm_params:
            api_key: os.environ/FIRECRAWL_API_KEY
            search_provider: firecrawl
        - search_tool_name: serper
          litellm_params:
            api_key: os.environ/SERPER_API_KEY
            search_provider: serper
        - search_tool_name: tavily
          litellm_params:
            api_key: os.environ/TAVILY_API_KEY
            search_provider: tavily
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    serviceAccount:
      automount: false
      create: true
    strategy:
      type: Recreate
    volumeMounts:
      - name: temporary
        mountPath: /tmp
    volumes:
      - name: temporary
        emptyDir:
          sizeLimit: 1Gi
    livenessProbe:
      failureThreshold: 3
      periodSeconds: 10
