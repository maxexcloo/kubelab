apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  interval: 30m
  chart:
    spec:
      chart: litellm-helm
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: flux-system
      version: 1.106.0
  values:
    fullnameOverride: litellm
    masterkeySecretKey: LITELLM_MASTER_KEY
    masterkeySecretName: litellm
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cnpg.io/instanceRole: primary
            topologyKey: kubernetes.io/hostname
    db:
      database: litellm
      deployStandalone: false
      endpoint: litellm-database-rw
      url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)?sslmode=require
      useExisting: true
      secret:
        name: litellm-database
        passwordKey: password
        usernameKey: username
    environmentSecrets:
      - litellm
    envVars:
      GENERIC_AUTHORIZATION_ENDPOINT: https://identity.invalid/authorize
      GENERIC_CLIENT_USE_PKCE: "true"
      GENERIC_TOKEN_ENDPOINT: https://identity.invalid/api/oidc/token
      GENERIC_USERINFO_ENDPOINT: https://identity.invalid/api/oidc/userinfo
      GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
      GENERIC_USER_FIRST_NAME_ATTRIBUTE: given_name
      GENERIC_USER_ID_ATTRIBUTE: sub
      GENERIC_USER_LAST_NAME_ATTRIBUTE: family_name
      HOME: /tmp
      PROXY_BASE_URL: https://app.invalid
      # Provider discovery uses the shared HTTP client; chat requests use the deployment timeout.
      REQUEST_TIMEOUT: "5"
      STORE_MODEL_IN_DB: "True"
      TZ: time-zone.invalid
    image:
      pullPolicy: IfNotPresent
      repository: ghcr.io/berriai/litellm
      tag: v1.106.0
    migrationJob:
      hooks:
        argocd:
          enabled: false
        helm:
          enabled: true
      resources:
        limits:
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 512Mi
    nodeSelector:
      node.excloo.dev/network: internal
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    proxy_config:
      general_settings:
        disable_env_credential_login: true
        master_key: os.environ/LITELLM_MASTER_KEY
        require_key_mcp_access_defined: true
      litellm_settings:
        check_provider_endpoint: true
      # Servers registered in the UI join these; LibreChat discovers both through /mcp.
      mcp_servers:
        AI_Control:
          alias: ai_control
          allow_all_keys: false
          auth_type: bearer_token
          auth_value: os.environ/CONTROL_MCP_API_KEY
          server_id: ai-control
          transport: http
          url: http://studio.studio.svc.cluster.local:8787/mcp
          mcp_info:
            description: Manage AI workloads and preview GPU allocation changes.
        Studio:
          alias: studio
          allow_all_keys: true
          auth_type: bearer_token
          auth_value: os.environ/STUDIO_MCP_API_KEY
          server_id: studio
          timeout: 1860
          transport: http
          url: http://studio.studio.svc.cluster.local:8787/mcp
          extra_headers:
            - X-AI-User-Id
          mcp_info:
            description: Create and manage images and videos in Studio.
      model_list:
        - model_name: ai/*
          litellm_params:
            api_base: http://host.invalid:8000/v1
            api_key: os.environ/BENTO_API_KEY
            max_parallel_requests: 8
            model: openai/*
            timeout: &generation-timeout 300
          model_info:
            input_cost_per_token: 0
            output_cost_per_token: 0
        - model_name: cli-proxy-api/*
          litellm_params:
            api_base: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317/v1
            api_key: os.environ/CLIPROXY_API_KEY
            model: openai/*
            timeout: *generation-timeout
        - model_name: deepseek/*
          litellm_params:
            api_base: https://api.deepseek.com/v1
            api_key: os.environ/DEEPSEEK_API_KEY
            model: deepseek/*
            timeout: *generation-timeout
        - model_name: opencode-go/*
          litellm_params:
            api_base: https://opencode.ai/zen/go/v1
            api_key: os.environ/OPENCODE_GO_API_KEY_1
            model: openai/*
            timeout: *generation-timeout
        - model_name: opencode-go/*
          litellm_params:
            api_base: https://opencode.ai/zen/go/v1
            api_key: os.environ/OPENCODE_GO_API_KEY_2
            model: openai/*
            timeout: *generation-timeout
        - model_name: opencode-zen/*
          litellm_params:
            api_base: https://opencode.ai/zen/v1
            api_key: os.environ/OPENCODE_ZEN_API_KEY_1
            model: openai/*
            timeout: *generation-timeout
        - model_name: opencode-zen/*
          litellm_params:
            api_base: https://opencode.ai/zen/v1
            api_key: os.environ/OPENCODE_ZEN_API_KEY_2
            model: openai/*
            timeout: *generation-timeout
        # LiteLLM pauses blocked deployments and hides them from model lists.
        - model_name: openrouter/*
          litellm_params:
            api_key: os.environ/OPENROUTER_API_KEY
            model: openrouter/*
            timeout: *generation-timeout
          model_info:
            blocked: true
      # Keenable, LibreChat's default search provider, has no LiteLLM integration.
      search_tools:
        - search_tool_name: firecrawl
          litellm_params:
            api_key: os.environ/FIRECRAWL_API_KEY
            search_provider: firecrawl
        - search_tool_name: serper
          litellm_params:
            api_key: os.environ/SERPER_API_KEY
            search_provider: serper
        - search_tool_name: tavily
          litellm_params:
            api_key: os.environ/TAVILY_API_KEY
            search_provider: tavily
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    serviceAccount:
      automount: false
      create: true
    strategy:
      type: Recreate
    volumeMounts:
      - name: temporary
        mountPath: /tmp
    volumes:
      - name: temporary
        emptyDir:
          sizeLimit: 1Gi
    livenessProbe:
      failureThreshold: 3
      periodSeconds: 10
