apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: litellm
spec:
  interval: 30m
  releaseName: litellm
  chart:
    spec:
      chart: litellm-helm
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: flux-system
      version: 1.105.0
  values:
    fullnameOverride: litellm
    masterkeySecretKey: LITELLM_MASTER_KEY
    masterkeySecretName: litellm
    replicaCount: 1
    db:
      database: litellm
      deployStandalone: false
      endpoint: litellm-database-rw
      url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)?sslmode=require
      useExisting: true
      secret:
        name: litellm-database
        passwordKey: password
        usernameKey: username
    environmentSecrets:
      - litellm
    envVars:
      GENERIC_AUTHORIZATION_ENDPOINT: https://identity.invalid/authorize
      GENERIC_CLIENT_USE_PKCE: "true"
      GENERIC_TOKEN_ENDPOINT: https://identity.invalid/api/oidc/token
      GENERIC_USERINFO_ENDPOINT: https://identity.invalid/api/oidc/userinfo
      GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
      GENERIC_USER_FIRST_NAME_ATTRIBUTE: given_name
      GENERIC_USER_ID_ATTRIBUTE: sub
      GENERIC_USER_LAST_NAME_ATTRIBUTE: family_name
      HOME: /tmp
      LITELLM_ENABLE_MCP_STDIO: "true"
      LITELLM_WORKER_STARTUP_HOOKS: hooks:install
      PATH: /opt/mcp:/app/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PROXY_BASE_URL: https://app.invalid
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /etc/litellm/extensions
      STORE_MODEL_IN_DB: "True"
      TZ: Australia/Sydney
      UNIFI_NETWORK_HOST: host.invalid
      UV_CACHE_DIR: /tmp/uv-cache
      UV_LINK_MODE: copy
      UV_PYTHON: /app/.venv/bin/python
      UV_PYTHON_DOWNLOADS: never
    extraInitContainers:
      - name: install-uv
        image: ghcr.io/astral-sh/uv:0.13.1-alpine3.23
        command:
          - cp
        args:
          - /usr/local/bin/uv
          - /usr/local/bin/uvx
          - /opt/mcp/
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: mcp-runtime
            mountPath: /opt/mcp
    image:
      pullPolicy: IfNotPresent
      repository: ghcr.io/berriai/litellm
      tag: v1.105.0
    migrationJob:
      hooks:
        argocd:
          enabled: false
        helm:
          enabled: true
      resources:
        limits:
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 512Mi
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    proxy_config:
      general_settings:
        disable_env_credential_login: true
        master_key: os.environ/LITELLM_MASTER_KEY
        require_key_mcp_access_defined: true
      litellm_settings:
        callbacks:
          - hooks.callback
        request_timeout: 300
      mcp_servers:
        heiss:
          allow_all_keys: true
          auth_type: bearer_token
          auth_value: os.environ/HEISS_MCP_API_KEY
          server_id: heiss
          transport: http
          url: http://heiss-mcp:1338/mcp
          extra_headers:
            - X-Bento-User-Id
        heiss_x:
          allow_all_keys: false
          auth_type: bearer_token
          auth_value: os.environ/HEISS_X_MCP_API_KEY
          server_id: heiss-x
          transport: http
          url: http://heiss-mcp:1338/mcp
          extra_headers:
            - X-Bento-User-Id
        home_assistant:
          server_id: home-assistant
          transport: http
          url: os.environ/HOME_ASSISTANT_MCP_URL
        unifi_network:
          command: /opt/mcp/uvx
          server_id: unifi-network
          transport: stdio
          args:
            - unifi-network-mcp==0.36.5
          env:
            HOME: os.environ/HOME
            PATH: os.environ/PATH
            UNIFI_NETWORK_API_KEY: os.environ/UNIFI_NETWORK_API_KEY
            UNIFI_NETWORK_HOST: os.environ/UNIFI_NETWORK_HOST
            UNIFI_NETWORK_VERIFY_SSL: "true"
            UV_CACHE_DIR: os.environ/UV_CACHE_DIR
            UV_LINK_MODE: os.environ/UV_LINK_MODE
            UV_PYTHON: os.environ/UV_PYTHON
            UV_PYTHON_DOWNLOADS: os.environ/UV_PYTHON_DOWNLOADS
      model_list:
        - model_name: bento/qwen3.8-27b-fp8
          litellm_params:
            api_base: http://host.invalid:8000/v1
            api_key: os.environ/BENTO_API_KEY
            model: openai/qwen3.8-27b-fp8
            max_parallel_requests: 8
          model_info:
            input_cost_per_token: 0
            output_cost_per_token: 0
        - model_name: cli-proxy-api/*
          litellm_params:
            api_base: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317/v1
            api_key: os.environ/CLIPROXY_API_KEY
            model: openai/*
        - model_name: deepseek/*
          litellm_params:
            api_base: https://api.deepseek.com/v1
            api_key: os.environ/DEEPSEEK_API_KEY
            model: deepseek/*
        - model_name: gemini/*
          litellm_params:
            api_base: https://generativelanguage.googleapis.com/v1beta
            api_key: os.environ/GEMINI_API_KEY
            model: gemini/*
        - model_name: opencode-go/*
          litellm_params:
            api_base: https://opencode.ai/zen/go/v1
            api_key: os.environ/OPENCODE_GO_API_KEY_1
            model: openai/*
        - model_name: opencode-go/*
          litellm_params:
            api_base: https://opencode.ai/zen/go/v1
            api_key: os.environ/OPENCODE_GO_API_KEY_2
            model: openai/*
        - model_name: opencode-zen/*
          litellm_params:
            api_base: https://opencode.ai/zen/v1
            api_key: os.environ/OPENCODE_ZEN_API_KEY_1
            model: openai/*
        - model_name: opencode-zen/*
          litellm_params:
            api_base: https://opencode.ai/zen/v1
            api_key: os.environ/OPENCODE_ZEN_API_KEY_2
            model: openai/*
        - model_name: xiaomi-mimo/*
          litellm_params:
            api_base: https://api.xiaomimimo.com/v1
            api_key: os.environ/MIMO_API_KEY
            model: xiaomi_mimo/*
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    serviceAccount:
      automount: false
      create: true
    startupProbe:
      failureThreshold: 60
    strategy:
      type: Recreate
    volumeMounts:
      - name: extensions
        mountPath: /etc/litellm/extensions
        readOnly: true
      - name: mcp-runtime
        mountPath: /opt/mcp
      - name: temporary
        mountPath: /tmp
    volumes:
      - name: extensions
        configMap:
          name: litellm-extensions
      - name: mcp-runtime
        emptyDir:
          sizeLimit: 64Mi
      - name: temporary
        emptyDir:
          sizeLimit: 1Gi
