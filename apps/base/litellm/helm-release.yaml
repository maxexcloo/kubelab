apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  interval: 30m
  chart:
    spec:
      chart: litellm-helm
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: flux-system
      version: 1.106.0
  values:
    fullnameOverride: litellm
    masterkeySecretKey: LITELLM_MASTER_KEY
    masterkeySecretName: litellm
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                cnpg.io/instanceRole: primary
            topologyKey: kubernetes.io/hostname
    db:
      database: litellm
      deployStandalone: false
      endpoint: litellm-database-rw
      url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):5432/$(DATABASE_NAME)?sslmode=require
      useExisting: true
      secret:
        name: litellm-database
        passwordKey: password
        usernameKey: username
    environmentSecrets:
      - litellm
    envVars:
      GENERIC_AUTHORIZATION_ENDPOINT: https://identity.invalid/authorize
      GENERIC_CLIENT_USE_PKCE: "true"
      GENERIC_TOKEN_ENDPOINT: https://identity.invalid/api/oidc/token
      GENERIC_USERINFO_ENDPOINT: https://identity.invalid/api/oidc/userinfo
      GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: name
      GENERIC_USER_FIRST_NAME_ATTRIBUTE: given_name
      GENERIC_USER_ID_ATTRIBUTE: sub
      GENERIC_USER_LAST_NAME_ATTRIBUTE: family_name
      HOME: /tmp
      PROXY_BASE_URL: https://app.invalid
      # Provider discovery uses the shared HTTP client; chat requests use the deployment timeout.
      REQUEST_TIMEOUT: "5"
      STORE_MODEL_IN_DB: "True"
      TZ: time-zone.invalid
    image:
      pullPolicy: IfNotPresent
      repository: ghcr.io/berriai/litellm
      tag: v1.106.0
    migrationJob:
      hooks:
        argocd:
          enabled: false
        helm:
          enabled: true
      resources:
        limits:
          memory: 2Gi
        requests:
          cpu: 100m
          memory: 512Mi
    nodeSelector:
      node.excloo.dev/network: internal
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    proxy_config:
      general_settings:
        disable_env_credential_login: true
        master_key: os.environ/LITELLM_MASTER_KEY
        # Models and MCP servers are registered in the UI. Models read provider
        # keys from this pod as os.environ/<NAME>; MCP servers keep copies of
        # Studio's mcp-api-key and this item's provider-ai-control-api-key, so
        # update them there after rotating either.
        require_key_mcp_access_defined: true
      litellm_settings:
        check_provider_endpoint: true
      # Other models live in the UI. Radiance answers with its loaded model under
      # any name and fails fast when its text runtime is off, so chat falls back
      # to Grok through the UI-registered CLIProxyAPI models. ai/text-quick is
      # the same deployment without reasoning, for short helper calls such as
      # titles; it has no fallback.
      model_list:
        - model_name: ai/text
          litellm_params:
            api_base: http://host.invalid:8000/v1
            api_key: os.environ/BENTO_API_KEY
            max_retries: 0
            model: openai/text
            num_retries: 0
            timeout: 300
        - model_name: ai/text-quick
          litellm_params:
            api_base: http://host.invalid:8000/v1
            api_key: os.environ/BENTO_API_KEY
            max_retries: 0
            model: openai/text
            num_retries: 0
            reasoning_effort: none
            timeout: 60
      router_settings:
        fallbacks:
          - ai/text:
              - cli-proxy-api/grok-4.7
      # UI-registered search tools cannot read os.environ/ keys, so these stay here.
      # Keenable, LibreChat's default search provider, has no LiteLLM integration.
      search_tools:
        - search_tool_name: firecrawl
          litellm_params:
            api_key: os.environ/FIRECRAWL_API_KEY
            search_provider: firecrawl
        - search_tool_name: serper
          litellm_params:
            api_key: os.environ/SERPER_API_KEY
            search_provider: serper
        - search_tool_name: tavily
          litellm_params:
            api_key: os.environ/TAVILY_API_KEY
            search_provider: tavily
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
    serviceAccount:
      automount: false
      create: true
    strategy:
      type: Recreate
    volumeMounts:
      - name: temporary
        mountPath: /tmp
    volumes:
      - name: temporary
        emptyDir:
          sizeLimit: 1Gi
    livenessProbe:
      failureThreshold: 3
      periodSeconds: 10
