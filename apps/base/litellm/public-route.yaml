apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-public
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
  labels:
    app.kubernetes.io/name: application
    gateway.excloo.dev/public-access: "true"
spec:
  hostnames:
    - app.invalid
  parentRefs:
    - name: public-tunnel
      namespace: networking
  rules:
    - backendRefs:
        - name: heiss-mcp
          port: 8788
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp/results
      matches:
        - path:
            type: PathPrefix
            value: /heiss/mcp/results
    - backendRefs:
        - name: heiss-x-mcp
          port: 8787
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp/results
      matches:
        - path:
            type: PathPrefix
            value: /heiss-x/mcp/results
    - backendRefs:
        - name: litellm
          port: 4000
