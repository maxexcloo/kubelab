apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
  namespace: litellm
  annotations:
    gethomepage.dev/description: LLM & MCP Gateway
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Artificial Intelligence
    gethomepage.dev/href: https://app.invalid/ui/
    gethomepage.dev/icon: sh-litellm-light
    gethomepage.dev/name: LiteLLM
    monitoring.excloo.dev/enabled: "true"
    monitoring.excloo.dev/path: /health/liveliness
  labels:
    app.kubernetes.io/name: litellm
spec:
  hostnames:
    - litellm.excloo.com
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: heiss-mcp
          port: 1338
      matches:
        - path:
            type: PathPrefix
            value: /results
    - backendRefs:
        - name: litellm
          port: 4000
