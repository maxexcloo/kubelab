apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: application
  annotations:
    gethomepage.dev/description: MCP Gateway
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Artificial Intelligence
    gethomepage.dev/href: https://app.invalid/ui/
    gethomepage.dev/icon: sh-litellm
    gethomepage.dev/name: &title LiteLLM
    monitoring.excloo.dev/enabled: "true"
    monitoring.excloo.dev/path: /health/liveliness
    onepassword.excloo.dev/item: *title
  labels:
    app.kubernetes.io/name: application
    gateway.excloo.dev/internal-alias: "true"
spec:
  hostnames:
    - litellm.excloo.com
    - litellm.cluster.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: heiss-mcp
          port: 8788
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp/results
      matches:
        - path:
            type: PathPrefix
            value: /heiss/mcp/results
    - backendRefs:
        - name: heiss-x-mcp
          port: 8787
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp/results
      matches:
        - path:
            type: PathPrefix
            value: /heiss-x/mcp/results
    - backendRefs:
        - name: litellm
          port: 4000
