apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - route.yaml
  - source.yaml
replacements:
  # The chart source lives in the namespace the release references.
  - source:
      kind: HelmRelease
      fieldPath: spec.chart.spec.sourceRef.namespace
    targets:
      - select:
          kind: HelmRepository
        fieldPaths:
          - metadata.namespace
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: HTTPRoute
          name: litellm
        fieldPaths:
          - spec.hostnames.1
        options:
          delimiter: .
          index: 0
  - source:
      kind: HTTPRoute
      name: litellm
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: litellm
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.hostname
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.envVars.PROXY_BASE_URL
        options:
          delimiter: /
          index: 2
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
components:
  - ../../../platform/databases/postgres
  - ../../../platform/backups/credentials
  - ../../components/private-dns
patches:
  - path: database.yaml
    target:
      kind: Cluster
transformers:
  - ../../transformers/cluster-scoped
