apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - database.yaml
  - external-secrets.yaml
  - helm-release.yaml
  - pocket-id.yaml
  - private-dns.yaml
  - resources.yaml
  - route.yaml
  - source.yaml
configurations:
  - name-reference.yaml
configMapGenerator:
  - name: litellm-extensions
    namespace: litellm
    files:
      - catalogue.py
      - hooks.py
replacements:
  - source:
      kind: HTTPRoute
      name: litellm
      namespace: litellm
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: litellm
          namespace: litellm
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
          - metadata.annotations.[gethomepage.dev/icon]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: litellm
          namespace: litellm
        fieldPaths:
          - spec.values.envVars.PROXY_BASE_URL
        options:
          delimiter: /
          index: 2
      - select:
          kind: PocketIDClient
          name: litellm
          namespace: litellm
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
      - select:
          kind: PrivateDNSRecord
          name: litellm
          namespace: litellm
        fieldPaths:
          - spec.hostname
