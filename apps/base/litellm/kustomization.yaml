apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - heiss-mcp.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - public-route.yaml
  - route.yaml
  - source.yaml
configurations:
  - name-reference.yaml
configMapGenerator:
  - name: litellm-extensions
    files:
      - catalogue.py
      - hooks.py
replacements:
  - source:
      kind: HTTPRoute
      name: litellm
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: litellm
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
          - metadata.annotations.[onepassword.excloo.dev/url]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HTTPRoute
          name: litellm-public
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.envVars.PROXY_BASE_URL
        options:
          delimiter: /
          index: 2
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
components:
  - ../../../platform/databases/postgres
  - ../../../platform/backups/credentials
  - ../../../platform/backups/postgres
  - ../../components/app-namespace
patches:
  - path: database.yaml
    target:
      kind: Cluster
