apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - public-route.yaml
  - route.yaml
  - source.yaml
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: HTTPRoute
          name: application
        fieldPaths:
          - spec.hostnames.1
        options:
          delimiter: .
          index: 0
  - source:
      kind: HTTPRoute
      name: litellm
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HTTPRoute
          name: litellm
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HTTPRoute
          name: litellm-public
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.hostname
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.envVars.PROXY_BASE_URL
        options:
          delimiter: /
          index: 2
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
components:
  - ../../../platform/databases/postgres
  - ../../../platform/backups/credentials
  - ../../../platform/backups/postgres
  - ../../components/private-dns-control-d-only
  - ../../components/app-namespace
patches:
  - path: database.yaml
    target:
      kind: Cluster
