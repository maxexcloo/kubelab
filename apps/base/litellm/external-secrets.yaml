apiVersion: external-secrets.io/v1
kind: ExternalSecret
# After credential sync, run kubectl rollout restart deployment/litellm -n litellm.
metadata:
  name: application
  annotations:
    # The MCP URL embeds Home Assistant's access token.
    onepassword.excloo.dev/concealed-fields: provider-home-assistant-url
    onepassword.excloo.dev/constants: '{"database-username":"litellm"}'
    # Client-issued MCP tokens stay in 1Password without being imported into the pod.
    onepassword.excloo.dev/defaults: '{"provider-ai-control-api-key":"","provider-bento-api-key":"","provider-cliproxyapi-api-key":"","provider-deepseek-api-key":"","provider-opencode-1-api-key":"","provider-opencode-2-api-key":"","username":"max@excloo.com","virtual-key-claude":"","virtual-key-home-assistant":"","virtual-key-pi":"","virtual-key-unifi-network":""}'
    onepassword.excloo.dev/generate-fields: database-password,master-key,password,salt-key
    onepassword.excloo.dev/remove-fields: api-key-gemini,api-key-mimo,api-key-venice,virtual-key-heiss,virtual-key-heiss-x
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item a7lyhpxy7g2wf2lbmtba2lbdiy
        property: provider-bento-api-key
      secretKey: BENTO_API_KEY
    - remoteRef:
        key: *item
        property: provider-cliproxyapi-api-key
      secretKey: CLIPROXY_API_KEY
    - remoteRef:
        key: *item
        property: provider-ai-control-api-key
      secretKey: CONTROL_MCP_API_KEY
    - remoteRef:
        key: *item
        property: provider-deepseek-api-key
      secretKey: DEEPSEEK_API_KEY
    - remoteRef:
        key: *item
        property: master-key
      secretKey: api-key
    - remoteRef:
        key: *item
        property: provider-firecrawl-api-key
      secretKey: FIRECRAWL_API_KEY
    - remoteRef:
        key: *item
        property: provider-heiss-api-key
      secretKey: HEISS_MCP_API_KEY
    - remoteRef:
        key: *item
        property: provider-heiss-x-api-key
      secretKey: HEISS_X_MCP_API_KEY
    - remoteRef:
        key: *item
        property: provider-home-assistant-url
      secretKey: HOME_ASSISTANT_MCP_URL
    - remoteRef:
        key: *item
        property: oidc-client-id
      secretKey: GENERIC_CLIENT_ID
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: GENERIC_CLIENT_SECRET
    - remoteRef:
        key: *item
        property: provider-opencode-1-api-key
      secretKey: OPENCODE_GO_API_KEY_1
    - remoteRef:
        key: *item
        property: provider-opencode-2-api-key
      secretKey: OPENCODE_GO_API_KEY_2
    - remoteRef:
        key: *item
        property: provider-opencode-1-api-key
      secretKey: OPENCODE_ZEN_API_KEY_1
    - remoteRef:
        key: *item
        property: provider-opencode-2-api-key
      secretKey: OPENCODE_ZEN_API_KEY_2
    - remoteRef:
        key: *item
        property: provider-openrouter-api-key
      secretKey: OPENROUTER_API_KEY
    - remoteRef:
        key: *item
        property: salt-key
      secretKey: salt-key
    - remoteRef:
        key: *item
        property: provider-serper-api-key
      secretKey: SERPER_API_KEY
    - remoteRef:
        key: *item
        property: provider-tavily-api-key
      secretKey: TAVILY_API_KEY
    - remoteRef:
        key: *item
        property: provider-unifi-api-key
      secretKey: UNIFI_NETWORK_API_KEY
    - remoteRef:
        key: *item
        property: provider-unifi-password
      secretKey: UNIFI_NETWORK_PASSWORD
    - remoteRef:
        key: *item
        property: provider-unifi-username
      secretKey: UNIFI_NETWORK_USERNAME
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        LITELLM_MASTER_KEY: sk-{{ index . "api-key" }}
        LITELLM_SALT_KEY: sk-{{ index . "salt-key" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-database
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"litellm"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item a7lyhpxy7g2wf2lbmtba2lbdiy
        property: database-password
      secretKey: password
    - remoteRef:
        key: *item
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: litellm-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
