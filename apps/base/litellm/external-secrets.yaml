apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"litellm"}'
    onepassword.excloo.dev/generate-fields: database-password,master-key,password,salt-key
    onepassword.excloo.dev/owner-email-fields: username
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item LiteLLM
        property: provider-ai-control-api-key
      secretKey: AI_CONTROL_API_KEY
    - remoteRef:
        key: *item
        property: provider-ai-api-key
      secretKey: AI_API_KEY
    - remoteRef:
        key: *item
        property: provider-cliproxyapi-api-key
      secretKey: CLIPROXY_API_KEY
    - remoteRef:
        key: *item
        property: provider-deepseek-api-key
      secretKey: DEEPSEEK_API_KEY
    - remoteRef:
        key: *item
        property: master-key
      secretKey: api-key
    - remoteRef:
        key: *item
        property: provider-firecrawl-api-key
      secretKey: FIRECRAWL_API_KEY
    - remoteRef:
        key: *item
        property: oidc-client-id
      secretKey: GENERIC_CLIENT_ID
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: GENERIC_CLIENT_SECRET
    - remoteRef:
        key: *item
        property: provider-opencode-1-api-key
      secretKey: OPENCODE_GO_API_KEY_1
    - remoteRef:
        key: *item
        property: provider-opencode-2-api-key
      secretKey: OPENCODE_GO_API_KEY_2
    - remoteRef:
        key: *item
        property: provider-opencode-1-api-key
      secretKey: OPENCODE_ZEN_API_KEY_1
    - remoteRef:
        key: *item
        property: provider-opencode-2-api-key
      secretKey: OPENCODE_ZEN_API_KEY_2
    - remoteRef:
        key: *item
        property: provider-openrouter-api-key
      secretKey: OPENROUTER_API_KEY
    - remoteRef:
        key: *item
        property: provider-reactive-resume-api-key
      secretKey: REACTIVE_RESUME_API_KEY
    - remoteRef:
        key: *item
        property: salt-key
      secretKey: salt-key
    - remoteRef:
        key: *item
        property: provider-serper-api-key
      secretKey: SERPER_API_KEY
    # Studio owns its MCP credential.
    - remoteRef:
        key: Studio
        property: mcp-api-key
      secretKey: STUDIO_MCP_API_KEY
    - remoteRef:
        key: *item
        property: provider-tavily-api-key
      secretKey: TAVILY_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        LITELLM_MASTER_KEY: sk-{{ index . "api-key" }}
        LITELLM_SALT_KEY: sk-{{ index . "salt-key" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-database
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"litellm"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item LiteLLM
        property: database-password
      secretKey: password
    - remoteRef:
        key: *item
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
