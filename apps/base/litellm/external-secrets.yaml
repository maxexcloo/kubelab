apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
  namespace: litellm
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"litellm"}'
    onepassword.excloo.dev/defaults: '{"username":"max@excloo.com"}'
    onepassword.excloo.dev/generate-fields: api-key,database-password,password,salt-key
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: LiteLLM
        property: api-key
      secretKey: api-key
    - remoteRef:
        key: LiteLLM
        property: api-key-bento
      secretKey: BENTO_API_KEY
    - remoteRef:
        key: CLI Proxy API
        property: api-key
      secretKey: CLIPROXY_API_KEY
    - remoteRef:
        key: LiteLLM
        property: api-key-deepseek
      secretKey: DEEPSEEK_API_KEY
    - remoteRef:
        key: LiteLLM
        property: api-key-gemini
      secretKey: GEMINI_API_KEY
    - remoteRef:
        key: LiteLLM
        property: mcp-url-home-assistant
      secretKey: HOME_ASSISTANT_MCP_URL
    - remoteRef:
        key: LiteLLM
        property: api-key-mimo
      secretKey: MIMO_API_KEY
    - remoteRef:
        key: LiteLLM
        property: api-key-opencode-go-1
      secretKey: OPENCODE_GO_API_KEY_1
    - remoteRef:
        key: LiteLLM
        property: api-key-opencode-go-2
      secretKey: OPENCODE_GO_API_KEY_2
    - remoteRef:
        key: LiteLLM
        property: api-key-opencode-zen-1
      secretKey: OPENCODE_ZEN_API_KEY_1
    - remoteRef:
        key: LiteLLM
        property: api-key-opencode-zen-2
      secretKey: OPENCODE_ZEN_API_KEY_2
    - remoteRef:
        key: LiteLLM
        property: password
      secretKey: UI_PASSWORD
    - remoteRef:
        key: LiteLLM
        property: salt-key
      secretKey: salt-key
    - remoteRef:
        key: LiteLLM
        property: api-key-unifi
      secretKey: UNIFI_NETWORK_API_KEY
    - remoteRef:
        key: LiteLLM
        property: username
      secretKey: UI_USERNAME
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: litellm
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        LITELLM_MASTER_KEY: sk-{{ index . "api-key" }}
        LITELLM_SALT_KEY: sk-{{ index . "salt-key" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-database
  namespace: litellm
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"litellm"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: LiteLLM
        property: database-password
      secretKey: password
    - remoteRef:
        key: LiteLLM
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: litellm-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
