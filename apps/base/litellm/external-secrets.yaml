apiVersion: external-secrets.io/v1
kind: ExternalSecret
# After credential sync, run kubectl rollout restart deployment/litellm -n litellm.
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"litellm"}'
    # Client-issued MCP tokens stay in 1Password without being imported into the pod.
    onepassword.excloo.dev/defaults: '{"mcp-home-assistant-api-key":"","mcp-unifi-network-api-key":"","username":"max@excloo.com"}'
    onepassword.excloo.dev/generate-fields: api-key,database-password,password,salt-key
    onepassword.excloo.dev/remove-fields: api-key-gemini,api-key-mimo,api-key-venice
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: LiteLLM
        property: api-key
      secretKey: api-key
    - remoteRef:
        key: LiteLLM
        property: api-key-bento
      secretKey: BENTO_API_KEY
    - remoteRef:
        key: CLI Proxy API
        property: api-key
      secretKey: CLIPROXY_API_KEY
    - remoteRef:
        key: LiteLLM
        property: api-key-deepseek
      secretKey: DEEPSEEK_API_KEY
    - remoteRef:
        key: LiteLLM
        property: mcp-api-key-heiss
      secretKey: HEISS_MCP_API_KEY
    - remoteRef:
        key: LiteLLM
        property: mcp-api-key-heiss-x
      secretKey: HEISS_X_MCP_API_KEY
    - remoteRef:
        key: LiteLLM
        property: mcp-url-home-assistant
      secretKey: HOME_ASSISTANT_MCP_URL
    - remoteRef:
        key: LiteLLM
        property: api-key-opencode-go-1
      secretKey: OPENCODE_GO_API_KEY_1
    - remoteRef:
        key: LiteLLM
        property: api-key-opencode-go-2
      secretKey: OPENCODE_GO_API_KEY_2
    - remoteRef:
        key: LiteLLM
        property: api-key-opencode-zen-1
      secretKey: OPENCODE_ZEN_API_KEY_1
    - remoteRef:
        key: LiteLLM
        property: api-key-opencode-zen-2
      secretKey: OPENCODE_ZEN_API_KEY_2
    - remoteRef:
        key: LiteLLM
        property: oidc-client-id
      secretKey: GENERIC_CLIENT_ID
    - remoteRef:
        key: LiteLLM
        property: oidc-client-secret
      secretKey: GENERIC_CLIENT_SECRET
    - remoteRef:
        key: LiteLLM
        property: salt-key
      secretKey: salt-key
    - remoteRef:
        key: LiteLLM
        property: api-key-unifi
      secretKey: UNIFI_NETWORK_API_KEY
    - remoteRef:
        key: LiteLLM
        property: unifi-password
      secretKey: UNIFI_NETWORK_PASSWORD
    - remoteRef:
        key: LiteLLM
        property: unifi-username
      secretKey: UNIFI_NETWORK_USERNAME
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        LITELLM_MASTER_KEY: sk-{{ index . "api-key" }}
        LITELLM_SALT_KEY: sk-{{ index . "salt-key" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-database
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"litellm"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: LiteLLM
        property: database-password
      secretKey: password
    - remoteRef:
        key: LiteLLM
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: litellm-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
