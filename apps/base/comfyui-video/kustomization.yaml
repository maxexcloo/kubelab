apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: comfyui-video
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
components:
  - ../../components/workload
  - ../../components/gpu
  - ../../components/default-deny
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
