apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  # GPU workloads stay stopped until started with kubectl scale; any upgrade of
  # the release stops them again.
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              - op: add
                path: /spec/replicas
                value: 0
            target:
              kind: Deployment
  values:
    controllers:
      main:
        annotations:
          studio.excloo.dev/label: Video
          studio.excloo.dev/worker: video
        labels:
          studio.excloo.dev/kind: video
        strategy: Recreate
        containers:
          main: &container
            env:
              CLI_ARGS: --cache-classic --disable-mmap --disable-pinned-memory --enable-assets --force-non-blocking --use-ck-attention
              HSA_OVERRIDE_GFX_VERSION: 12.0.1
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/maxexcloo/studio-worker
              tag: 2026.10.31.2
            # Readiness only, as under Docker: loading never restarts the worker.
            probes:
              readiness:
                enabled: true
                path: /system_stats
                port: 8188
                type: HTTP
                spec:
                  timeoutSeconds: 5
            resources:
              claims:
                - name: gpu
            securityContext:
              capabilities:
                add:
                  - SYS_PTRACE
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: gpu-1
      # Radiance H3 profiles split across both GPUs.
      tp2:
        annotations:
          studio.excloo.dev/label: Video · 2 GPUs
        labels:
          studio.excloo.dev/kind: video
        strategy: Recreate
        containers:
          main: *container
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: gpu-2
    defaultPodOptions:
      nodeSelector:
        node.excloo.dev/dedicated: gpu
      securityContext:
        seccompProfile:
          type: Unconfined
      tolerations:
        - key: node.excloo.dev/dedicated
          operator: Equal
          value: gpu
    persistence:
      data:
        hostPath: ${dataset_root}/ai/comfyui-video/data
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /root/.cache
            subPath: cache
          - path: /root/.config
            subPath: config
          - path: /root/ComfyUI/output
            subPath: output
          - path: /root/ComfyUI/user
            subPath: user
      # Video reads the image worker's uploads, so Studio stages inputs once.
      input:
        hostPath: ${dataset_root}/ai/comfyui-image/data/input
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /root/ComfyUI/input
      models:
        hostPath: ${dataset_root}/ai/models
        hostPathType: Directory
        type: hostPath
        globalMounts:
          - path: /root/ComfyUI/models
            readOnly: true
            subPath: comfyui
          # Radiance H3 profiles load their .rad packages from here.
          - path: /models/radiance-video
            readOnly: true
            subPath: radiance
      shm:
        medium: Memory
        type: emptyDir
        globalMounts:
          - path: /dev/shm
    route:
      private:
        annotations:
          gethomepage.dev/description: Video Workflows
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-comfyui
          gethomepage.dev/name: ComfyUI Video
        hostnames:
          - comfy-video.excloo.com
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: comfyui-video
                port: 8188
