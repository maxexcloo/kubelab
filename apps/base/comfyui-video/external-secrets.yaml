apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: comfyui-video
spec:
  refreshInterval: 1h
  data:
    # Studio owns the worker token.
    - remoteRef:
        key: Studio
        property: worker-token
      secretKey: STUDIO_WORKER_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
