apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shelfmark
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
  - ../../components/private-dns-control-d-only
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
transformers:
  - ../../transformers/route-public
