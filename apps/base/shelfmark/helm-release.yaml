apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
  namespace: shelfmark
spec:
  interval: 30m
  releaseName: shelfmark
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.2.1
  values:
    controllers:
      shelfmark:
        strategy: Recreate
        containers:
          shelfmark:
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.3.15@sha256:9602290324993c801b319d3166b202b96bd9039af2416f0916dae03a5bdca815
            env:
              AA_BASE_URL: auto
              AA_MIRROR_URLS: https://annas-archive.pk,https://annas-archive.gd,https://annas-archive.gl
              AUTH_METHOD: oidc
              BOOKS_OUTPUT_MODE: folder
              CALIBRE_WEB_URL: https://books.excloo.com
              CONFIG_DIR: /config
              DIRECT_DOWNLOAD_ENABLED: "true"
              DIRECT_DOWNLOAD_LANGUAGE_FROM_PATH: "true"
              EXT_BYPASSER_URL: http://byparr.byparr.svc.cluster.local:8191
              FLASK_PORT: "3000"
              GOOGLEBOOKS_ENABLED: "true"
              HARDCOVER_ENABLED: "true"
              INGEST_DIR: /books
              LIBGEN_MIRROR_URLS: https://libgen.vg,https://libgen.la,https://libgen.bz,https://libgen.gl,https://libgen.li
              OIDC_BUTTON_LABEL: Excloo ID
              OIDC_DISCOVERY_URL: https://id.excloo.com/.well-known/openid-configuration
              OPENLIBRARY_ENABLED: "true"
              PGID: "568"
              PUID: "568"
              SESSION_COOKIE_SECURE: "true"
              TZ: Australia/Sydney
              USE_CF_BYPASS: "true"
              USING_EXTERNAL_BYPASSER: "true"
              WELIB_MIRROR_URLS: ""
              ZLIB_MIRROR_URLS: https://z-lib.sk
            envFrom:
              - secretRef:
                  name: shelfmark
            probes:
              readiness:
                custom: true
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /api/health
                    port: 3000
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /api/health
                    port: 3000
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: shelfmark
    persistence:
      books:
        existingClaim: books
        type: persistentVolumeClaim
        globalMounts:
          - path: /books
      config:
        existingClaim: config
        type: persistentVolumeClaim
        globalMounts:
          - path: /config
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/log/shelfmark
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      main:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: Book Search & Downloads
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/href: https://shelf.excloo.com
          gethomepage.dev/icon: shelfmark
          gethomepage.dev/name: Shelfmark
        hostnames:
          - shelf.excloo.com
        labels:
          app.kubernetes.io/name: shelfmark
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
    service:
      shelfmark:
        controller: shelfmark
        ports:
          http:
            port: 3000
            protocol: HTTP
