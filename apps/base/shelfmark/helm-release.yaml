apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
  namespace: shelfmark
spec:
  interval: 30m
  releaseName: shelfmark
  suspend: true
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.1.0
  values:
    controllers:
      shelfmark:
        strategy: Recreate
        containers:
          shelfmark:
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.3.12@sha256:e22413551ab647388f0279f1d7b7db3ff4a6fe1151337b5b234d3747cc09f5a3
            env:
              AA_BASE_URL: auto
              AA_MIRROR_URLS: https://annas-archive.pk,https://annas-archive.gd,https://annas-archive.gl
              AUTH_METHOD: oidc
              BOOKS_OUTPUT_MODE: folder
              CALIBRE_WEB_URL: https://books.excloo.com
              CONFIG_DIR: /config
              DIRECT_DOWNLOAD_ENABLED: "true"
              DIRECT_DOWNLOAD_LANGUAGE_FROM_PATH: "true"
              EXT_BYPASSER_URL: http://byparr.byparr.svc.cluster.local:8191
              FLASK_PORT: "3000"
              GOOGLEBOOKS_ENABLED: "true"
              HARDCOVER_ENABLED: "true"
              INGEST_DIR: /books
              LIBGEN_MIRROR_URLS: https://libgen.vg,https://libgen.la,https://libgen.bz,https://libgen.gl,https://libgen.li
              OIDC_BUTTON_LABEL: Excloo ID
              OIDC_DISCOVERY_URL: https://id.excloo.com/.well-known/openid-configuration
              OPENLIBRARY_ENABLED: "true"
              PGID: "568"
              PUID: "568"
              SESSION_COOKIE_SECURE: "true"
              TZ: Australia/Sydney
              USE_CF_BYPASS: "true"
              USING_EXTERNAL_BYPASSER: "true"
              WELIB_MIRROR_URLS: ""
              ZLIB_MIRROR_URLS: https://z-lib.sk
            envFrom:
              - secretRef:
                  name: shelfmark
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: shelfmark
    persistence:
      books:
        existingClaim: books
        type: persistentVolumeClaim
        globalMounts:
          - path: /books
      config:
        existingClaim: config
        type: persistentVolumeClaim
        globalMounts:
          - path: /config
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      shelfmark:
        controller: shelfmark
        ports:
          http:
            port: 3000
            protocol: HTTP
