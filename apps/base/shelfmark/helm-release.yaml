apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              AA_BASE_URL: auto
              AA_MIRROR_URLS: https://annas-archive.pk,https://annas-archive.gd,https://annas-archive.gl
              AUTH_METHOD: oidc
              BOOKS_OUTPUT_MODE: folder
              CALIBRE_WEB_URL: https://bookorbit.invalid
              CONFIG_DIR: /config
              DIRECT_DOWNLOAD_ENABLED: "true"
              DIRECT_DOWNLOAD_LANGUAGE_FROM_PATH: "true"
              FLASK_PORT: "3000"
              GOOGLEBOOKS_ENABLED: "true"
              HARDCOVER_ENABLED: "true"
              INGEST_DIR: /books
              LIBGEN_MIRROR_URLS: https://libgen.vg,https://libgen.la,https://libgen.bz,https://libgen.gl,https://libgen.li
              OIDC_BUTTON_LABEL: Pocket ID
              OIDC_DISCOVERY_URL: https://${identity_host}/.well-known/openid-configuration
              OPENLIBRARY_ENABLED: "true"
              PGID: "568"
              PUID: "568"
              SESSION_COOKIE_SECURE: "true"
              TZ: ${time_zone}
              USE_CF_BYPASS: "true"
              USING_EXTERNAL_BYPASSER: "false"
              WELIB_MIRROR_URLS: ""
              ZLIB_MIRROR_URLS: https://z-lib.sk
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.4.0
            probes:
              liveness: null
              readiness: &ready
                path: /api/health
              startup: *ready
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 256Mi
            securityContext:
              readOnlyRootFilesystem: null
    persistence:
      books:
        existingClaim: books
        type: persistentVolumeClaim
        globalMounts:
          - path: /books
      config:
        existingClaim: config
        type: persistentVolumeClaim
        globalMounts:
          - path: /config
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/log/shelfmark
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 3000
      public:
        forceRename: "{{ .Release.Name }}"
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: Book Search & Downloads
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-shelfmark
          gethomepage.dev/name: &title Shelfmark
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: *title
        hostnames:
          - shelf.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 3000
