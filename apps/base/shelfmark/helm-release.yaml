apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
  namespace: shelfmark
spec:
  interval: 30m
  releaseName: shelfmark
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.2.1
  values:
    controllers:
      shelfmark:
        strategy: Recreate
        containers:
          shelfmark:
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.4.0@sha256:4ef757349c3c7a7d90ba95b1e2a46ce4dd460a4776efbcf2aa1b1c476e7d5de5
            envFrom:
              - secretRef:
                  name: shelfmark
            probes:
              readiness:
                custom: true
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /api/health
                    port: 3000
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /api/health
                    port: 3000
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            env:
              OIDC_DISCOVERY_URL: https://identity.invalid/.well-known/openid-configuration
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: shelfmark
    persistence:
      books:
        existingClaim: books
        type: persistentVolumeClaim
        globalMounts:
          - path: /books
      config:
        existingClaim: config
        type: persistentVolumeClaim
        globalMounts:
          - path: /config
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/log/shelfmark
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: shelfmark
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: shelfmark
                port: 3000
      public:
        forceRename: shelfmark
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/href: https://app.invalid
        labels:
          app.kubernetes.io/name: shelfmark
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
    service:
      shelfmark:
        controller: shelfmark
        ports:
          http:
            port: 3000
            protocol: HTTP
