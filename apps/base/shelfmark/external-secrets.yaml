apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: chx5fdcskb6kst47yqawzdveka
        property: provider-googlebooks-api-key
      secretKey: GOOGLEBOOKS_API_KEY
    - remoteRef:
        key: chx5fdcskb6kst47yqawzdveka
        property: provider-hardcover-api-key
      secretKey: HARDCOVER_API_KEY
    - remoteRef:
        key: chx5fdcskb6kst47yqawzdveka
        property: oidc-client-id
      secretKey: OIDC_CLIENT_ID
    - remoteRef:
        key: chx5fdcskb6kst47yqawzdveka
        property: oidc-client-secret
      secretKey: OIDC_CLIENT_SECRET
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: application
