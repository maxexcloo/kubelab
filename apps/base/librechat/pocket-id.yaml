apiVersion: automation.excloo.dev/v1alpha1
kind: PocketIDClient
metadata:
  name: librechat
spec:
  client:
    # The admin panel reuses the LibreChat admin OAuth callback for its SSO login.
    callbackURLs:
      - https://chat.excloo.com/oauth/openid/callback
      - https://chat.excloo.com/api/admin/oauth/openid/callback
    description: AI Chat
    id: librechat
    isPublic: true
    launchURL: https://chat.excloo.com
    name: LibreChat
    pkceEnabled: true
  crossplane:
    compositionRef:
      name: pocket-id-public-client
