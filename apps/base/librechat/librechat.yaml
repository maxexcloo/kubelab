version: 1.3.17
cache: true
interface:
  defaultPinnedTools:
    - artifacts
    - mcp
    - web_search
  # File search needs the RAG API, which this deployment does not run.
  fileSearch: false
  # Expiry covers regular chats as well as temporary ones. Drop the general
  # retention deadlines before returning to the temporary-only mode.
  generalChatRetention: 8760
  retainAgentFiles: true
  retentionMode: all
  # Scheduled chats run in this single replica; Redis now holds the shared streams.
  schedules:
    create: true
    use: true
  temporaryChatRetention: 720
# LibreChat owns context usage and exposes Copy Summary; Studio supplies result handovers.
summarization:
  enabled: true
  trigger:
    type: token_ratio
    value: 0.9
registration:
  socialLogins:
    - openid
endpoints:
  agents:
    # Stop also ends ordinary background tool waits.
    backgroundTasks:
      ordinaryToolCancellation: true
    # File search, execute_code and ocr need the RAG API, the Code API and a Mistral OCR service.
    capabilities:
      - actions
      - artifacts
      - ask_user_question
      - chain
      - context
      - deferred_tools
      - memory
      - run_in_background
      - skills
      - subagents
      # Live status lines for web search, file and memory calls, and for tools a spec selects.
      - tool_intents
      - tools
      - web_search
  custom:
    # Every section reaches its provider through Bifrost, which lists that provider's models
    # for x-bf-model-provider. cloud/auto and local/auto take the first cloud or running local
    # model; set reasoning with the Reasoning Effort parameter.
    - name: AI
      apiKey: ${BIFROST_API_KEY}
      baseURL: &bifrost http://bifrost.bifrost.svc.cluster.local:8080/openai/v1
      models:
        default:
          - cloud/auto
          - local/auto
      # A live heading summarises long reasoning while it streams.
      reasoningLabel: true
      # LibreChat assumes 32k for unknown models and summarises too early; every local and cloud
      # model has at least 131k. Keys match as substrings, so this covers every name here.
      tokenConfig: &context
        /:
          prompt: 0
          completion: 0
          context: 131072
      titleConvo: true
      # Titles use the conversation's own model, so a cloud chat titles through cloud/ and a local one through local/.
      titleModel: current_model
      # A title started alongside the turn is cancelled when the turn stops or is replaced.
      titleTiming: final
    - &provider
      name: Abliteration
      apiKey: ${BIFROST_API_KEY}
      baseURL: *bifrost
      headers:
        x-bf-model-provider: abliteration
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
    - <<: *provider
      name: CLI Proxy API
      headers:
        x-bf-model-provider: cliproxyapi
    - <<: *provider
      name: DeepSeek
      headers:
        x-bf-model-provider: deepseek
    - <<: *provider
      name: Local
      headers:
        x-bf-model-provider: ai
      reasoningLabel: true
      tokenConfig: *context
    - <<: *provider
      name: OpenCode Go
      headers:
        x-bf-model-provider: opencode-go
    - <<: *provider
      name: OpenCode Zen
      headers:
        x-bf-model-provider: opencode-zen
    - <<: *provider
      name: Refuseless
      headers:
        x-bf-model-provider: refuseless
fileConfig:
  endpoints:
    agents:
      fileLimit: 20
# Agents save and delete memories through their native tools.
memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
skillSync:
  github:
    enabled: true
    intervalMinutes: 60
    runOnStartup: true
    sources:
      - id: maxexcloo-agents
        owner: maxexcloo
        ref: main
        repo: agents
        skillDiscoveryDepth: 2
        token: ${GITHUB_SKILLS_TOKEN}
        paths:
          - skills
webSearch:
  firecrawlApiKey: ${FIRECRAWL_API_KEY}
  keenableApiKey: ${KEENABLE_API_KEY}
  rerankerType: none
  scraperProvider: keenable
  searchProvider: keenable
  serperApiKey: ${SERPER_API_KEY}
  tavilyApiKey: ${TAVILY_API_KEY}
# Bifrost's MCP gateway is an internal service; exempt just that host and port.
mcpSettings:
  allowedAddresses:
    - bifrost.bifrost.svc.cluster.local:8080
# Bifrost's config declares the MCP servers and serves each at /mcp/<slug>.
# Grant keys access in Bifrost's config and add an entry here to offer a server.
mcpServers:
  actual-budget:
    type: streamable-http
    description: Review and manage accounts, transactions, budgets and spending in Actual Budget.
    requiresOAuth: false
    startup: false
    title: Actual Budget
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/actual-budget
    # The budget is personal, so it needs an individually authorised key rather than the shared chat key.
    customUserVars:
      ACTUAL_BUDGET_API_KEY:
        description: Your personal Bifrost virtual key authorised for Actual Budget. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{ACTUAL_BUDGET_API_KEY}}"
  home-assistant:
    type: streamable-http
    description: Inspect and control home devices, automations and dashboards.
    requiresOAuth: false
    startup: false
    title: Home Assistant
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/home-assistant
    # Home control needs an individually authorised key rather than the shared chat key.
    customUserVars:
      HOME_ASSISTANT_API_KEY:
        description: Your personal Bifrost virtual key authorised for Home Assistant. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{HOME_ASSISTANT_API_KEY}}"
  reactive-resume:
    type: streamable-http
    description: Read and edit resumes, cover letters and job applications in Reactive Resume.
    requiresOAuth: false
    startup: false
    title: Reactive Resume
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/reactive-resume
    # Bifrost holds the owner's Reactive Resume API key, so only authorised personal keys reach it.
    customUserVars:
      REACTIVE_RESUME_API_KEY:
        description: Your personal Bifrost virtual key authorised for Reactive Resume. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Reactive Resume API Key
    headers:
      x-bf-vk: "{{REACTIVE_RESUME_API_KEY}}"
  studio:
    type: streamable-http
    description: Create and manage images and videos in Studio.
    requiresOAuth: false
    # Studio's own instructions carry its workflow rules, the same for every client.
    serverInstructions: true
    # Studio waits up to 31 minutes for generation results.
    timeout: 1860000
    title: Studio
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/studio
    # Studio numbers results ("result 1") per conversation. Bifrost forwards these through
    # the allowed extra headers of its configured Studio server.
    headers:
      X-AI-User-Email: "{{LIBRECHAT_USER_EMAIL}}"
      X-AI-User-Id: "{{LIBRECHAT_USER_ID}}"
      X-Studio-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
      x-bf-vk: "${BIFROST_API_KEY}"
  unifi-network:
    type: streamable-http
    description: Inspect and manage UniFi networks, devices and clients.
    requiresOAuth: false
    startup: false
    title: UniFi Network
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/unifi-network
    # Network control needs an individually authorised key rather than the shared chat key.
    customUserVars:
      UNIFI_NETWORK_API_KEY:
        description: Your personal Bifrost virtual key authorised for UniFi Network. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{UNIFI_NETWORK_API_KEY}}"
