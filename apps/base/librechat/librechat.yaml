version: 1.3.17
cache: true
interface:
  defaultPinnedTools:
    - artifacts
    - mcp
    - web_search
  # File search needs the RAG API, which this deployment does not run.
  fileSearch: false
  # Expiry covers regular chats as well as temporary ones. Drop the general
  # retention deadlines before returning to the temporary-only mode.
  generalChatRetention: 8760
  # Model specs otherwise hide the endpoint picker, parameters and presets.
  modelSelect: true
  parameters: true
  presets: true
  retainAgentFiles: true
  retentionMode: all
  # Scheduled chats run in this single replica; Redis now holds the shared streams.
  schedules:
    create: true
    use: true
  temporaryChatRetention: 720
registration:
  socialLogins:
    - openid
endpoints:
  agents:
    activityLabel: false
    # Stop also ends ordinary background tool waits, such as Studio MCP Result.
    backgroundTasks:
      ordinaryToolCancellation: true
    # File search, execute_code and ocr need the RAG API, the Code API and a Mistral OCR service.
    capabilities:
      - actions
      - artifacts
      - ask_user_question
      - chain
      - context
      - deferred_tools
      - memory
      - run_in_background
      - skills
      - subagents
      - tools
      - web_search
  custom:
    - name: Bento
      apiKey: ${BENTO_API_KEY}
      baseURL: ${BENTO_API_URL}
      models:
        # LibreChat requires a fallback entry; fetched models replace this placeholder.
        default:
          - "*"
        fetch: true
        # GPU allocation changes the available models; bypass the shared two-minute model cache.
        userIdQuery: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: AI
    - name: CLI Proxy API
      apiKey: ${CLI_PROXY_API_KEY}
      baseURL: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: CLI Proxy API
    - name: DeepSeek
      apiKey: ${DEEPSEEK_API_KEY}
      baseURL: https://api.deepseek.com/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: DeepSeek
    - name: OpenCode Go
      apiKey: ${OPENCODE_GO_API_KEY_1}
      baseURL: https://opencode.ai/zen/go/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Go
    - name: OpenCode Go (Account 2)
      apiKey: ${OPENCODE_GO_API_KEY_2}
      baseURL: https://opencode.ai/zen/go/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Go (Account 2)
    - name: OpenCode Zen
      apiKey: ${OPENCODE_ZEN_API_KEY_1}
      baseURL: https://opencode.ai/zen/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Zen
    - name: OpenCode Zen (Account 2)
      apiKey: ${OPENCODE_ZEN_API_KEY_2}
      baseURL: https://opencode.ai/zen/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Zen (Account 2)
fileConfig:
  endpoints:
    agents:
      fileLimit: 20
# Agents save and delete memories through their native tools.
memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
skillSync:
  github:
    enabled: true
    intervalMinutes: 60
    runOnStartup: true
    sources:
      - id: maxexcloo-agents
        owner: maxexcloo
        ref: main
        repo: agents
        skillDiscoveryDepth: 2
        token: ${GITHUB_SKILLS_TOKEN}
        paths:
          - skills
webSearch:
  firecrawlApiKey: ${FIRECRAWL_API_KEY}
  keenableApiKey: ${KEENABLE_API_KEY}
  rerankerType: none
  scraperProvider: keenable
  searchProvider: keenable
  serperApiKey: ${SERPER_API_KEY}
  tavilyApiKey: ${TAVILY_API_KEY}
# LiteLLM's MCP gateway is an internal service; exempt just that host and port.
mcpSettings:
  allowedAddresses:
    - litellm.litellm.svc.cluster.local:4000
# MCP servers are registered in LiteLLM's UI. Its /mcp combines every server the
# shared key may use; grant the key access there to offer a server here.
mcpServers:
  ai-control:
    type: streamable-http
    description: Manage AI workloads and preview GPU allocation changes.
    requiresOAuth: false
    startup: false
    title: AI Control
    url: http://litellm.litellm.svc.cluster.local:4000/ai_control/mcp
    # Admin access stays with individually authorised keys, never the shared chat key.
    customUserVars:
      AI_CONTROL_API_KEY:
        description: Your personal LiteLLM virtual key authorised for AI Control. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Admin API Key
    headers:
      x-litellm-api-key: "Bearer {{AI_CONTROL_API_KEY}}"
  litellm:
    type: streamable-http
    description: Tools from the MCP servers LiteLLM offers to chat.
    requiresOAuth: false
    serverInstructions: true
    # Studio waits up to 31 minutes for generation results.
    timeout: 1860000
    title: LiteLLM
    url: http://litellm.litellm.svc.cluster.local:4000/mcp
    headers:
      X-AI-User-Id: "{{LIBRECHAT_USER_ID}}"
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"
  # Hidden from the chat menu; the Studio model spec pins it to keep its tool list small.
  studio:
    type: streamable-http
    chatMenu: false
    description: Create and manage images and videos in Studio.
    requiresOAuth: false
    serverInstructions: true
    timeout: 1860000
    title: Studio
    url: http://litellm.litellm.svc.cluster.local:4000/studio/mcp
    headers:
      X-AI-User-Id: "{{LIBRECHAT_USER_ID}}"
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"
# Specs build an agent per request from the preset, MCP servers and background tools.
modelSpecs:
  enforce: false
  prioritize: false
  list:
    - name: studio
      description: Studio images and videos with automatic inline results.
      label: Studio
      conversation_starters:
        - Animate my last image
        - Fast video of waves rolling onto a beach at sunset
        - Quality portrait of an old fisherman in soft window light
        - Turbo photo of a lighthouse on a stormy coast
      mcpServers:
        - studio
      preset:
        endpoint: Bento
        model: qwen3.8-27b-uncensored-fp8
        reasoning_effort: low
        temperature: 0.7
        promptPrefix: |-
          Use Studio to make the images and videos the user asks for.
          For ordinary requests, call studio-Generate directly with kind (image or video), tier and prompts; do not call studio-Models first. Map the user's wording to tier: "turbo", "super fast" or "draft" → turbo; "fast" or "quick" → fast; "best", "high quality" or "detailed" → quality; otherwise omit tier for the default. Write one clear natural-language prompt that keeps the user's subjects, framing and scene; add no extra variations. Call studio-Models only when the user names a model, asks what is available, or needs controls, LoRAs or reference images.
          If Generate returns done, reply with its markdown exactly plus at most one short sentence. If it returns queued, start one studio-Result per job with delivery=notification, wait_seconds=1500 and run_in_background=true, then end your turn; when the notification arrives, reply with its markdown exactly.
          For follow-ups on a result ("again", "more like that", "animate it"), call studio-Reuse with the result's ref instead of Models or Generate: pass the result's own kind to run it again (add prompt only to change it), or kind=video to animate an image (add tier only if the user asks).
          Never poll, call Status unprompted or resubmit. Keep replies short.
      runInBackground:
        - studio-Result_mcp_studio
