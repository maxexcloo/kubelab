version: 1.3.17
cache: true
interface:
  defaultPinnedTools:
    - artifacts
    - mcp
    - web_search
  # File search needs the RAG API, which this deployment does not run.
  fileSearch: false
  # Expiry covers regular chats as well as temporary ones. Drop the general
  # retention deadlines before returning to the temporary-only mode.
  generalChatRetention: 8760
  retainAgentFiles: true
  retentionMode: all
  # Scheduled chats run in this single replica; multi-replica writes would need shared Redis streams.
  schedules:
    create: true
    use: true
  temporaryChatRetention: 720
registration:
  socialLogins:
    - openid
endpoints:
  agents:
    activityLabel: true
    # File search, execute_code and ocr need the RAG API, the Code API and a Mistral OCR service.
    capabilities:
      - actions
      - artifacts
      - ask_user_question
      - chain
      - context
      - deferred_tools
      - memory
      - skills
      - subagents
      - tools
      - web_search
  custom:
    - name: Bento
      apiKey: ${BENTO_API_KEY}
      baseURL: ${BENTO_API_URL}
      models:
        # LibreChat requires a fallback entry; fetched models replace this placeholder.
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: Bento
    - name: CLI Proxy API
      apiKey: ${CLI_PROXY_API_KEY}
      baseURL: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: CLI Proxy API
    - name: DeepSeek
      apiKey: ${DEEPSEEK_API_KEY}
      baseURL: https://api.deepseek.com/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: DeepSeek
    - name: OpenCode Go
      apiKey: ${OPENCODE_GO_API_KEY_1}
      baseURL: https://opencode.ai/zen/go/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Go
    - name: OpenCode Go (Account 2)
      apiKey: ${OPENCODE_GO_API_KEY_2}
      baseURL: https://opencode.ai/zen/go/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Go (Account 2)
    - name: OpenCode Zen
      apiKey: ${OPENCODE_ZEN_API_KEY_1}
      baseURL: https://opencode.ai/zen/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Zen
    - name: OpenCode Zen (Account 2)
      apiKey: ${OPENCODE_ZEN_API_KEY_2}
      baseURL: https://opencode.ai/zen/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Zen (Account 2)
fileConfig:
  endpoints:
    agents:
      fileLimit: 20
# Agents save and delete memories through their native tools.
memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
webSearch:
  firecrawlApiKey: ${FIRECRAWL_API_KEY}
  keenableApiKey: ${KEENABLE_API_KEY}
  rerankerType: none
  scraperProvider: keenable
  searchProvider: keenable
  serperApiKey: ${SERPER_API_KEY}
  tavilyApiKey: ${TAVILY_API_KEY}
# LiteLLM's MCP gateway is an internal service; exempt just that host and port.
mcpSettings:
  allowedAddresses:
    - litellm.litellm.svc.cluster.local:4000
# LiteLLM fronts its MCP servers at /<server>/mcp.
mcpServers:
  heiss:
    type: streamable-http
    requiresOAuth: false
    url: http://litellm.litellm.svc.cluster.local:4000/heiss/mcp
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"
  heiss-x:
    type: streamable-http
    requiresOAuth: false
    url: http://litellm.litellm.svc.cluster.local:4000/heiss_x/mcp
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"
  home-assistant:
    type: streamable-http
    requiresOAuth: false
    url: http://litellm.litellm.svc.cluster.local:4000/home_assistant/mcp
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"
  unifi-network:
    type: streamable-http
    requiresOAuth: false
    url: http://litellm.litellm.svc.cluster.local:4000/unifi_network/mcp
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"
