version: 1.3.17
cache: true
interface:
  defaultPinnedTools:
    - artifacts
    - mcp
    - web_search
  # File search needs the RAG API, which this deployment does not run.
  fileSearch: false
  # Expiry covers regular chats as well as temporary ones. Drop the general
  # retention deadlines before returning to the temporary-only mode.
  generalChatRetention: 8760
  # Model specs otherwise hide the endpoint picker, parameters and presets.
  modelSelect: true
  parameters: true
  presets: true
  retainAgentFiles: true
  retentionMode: all
  # Scheduled chats run in this single replica; Redis now holds the shared streams.
  schedules:
    create: true
    use: true
  temporaryChatRetention: 720
registration:
  socialLogins:
    - openid
endpoints:
  agents:
    # Stop also ends ordinary background tool waits.
    backgroundTasks:
      ordinaryToolCancellation: true
    # File search, execute_code and ocr need the RAG API, the Code API and a Mistral OCR service.
    capabilities:
      - actions
      - artifacts
      - ask_user_question
      - chain
      - context
      - deferred_tools
      - memory
      - run_in_background
      - skills
      - subagents
      # Live status lines for web search, file and memory calls, and for tools a spec selects.
      - tool_intents
      - tools
      - web_search
  custom:
    # LiteLLM's ai/text uses Radiance on Bento and falls back to Grok while its text runtime is off.
    # ai/studio is the same chat without reasoning, whatever the client sends. The named Radiance
    # model has no fallback and answers with whichever workload AI Control has loaded.
    - name: AI
      apiKey: ${LITELLM_API_KEY}
      baseURL: http://litellm.litellm.svc.cluster.local:4000/v1
      models:
        default:
          - ai/text
          - ai/studio
          - gemma-4-31b-heretic
      # A live heading summarises long reasoning while it streams. Reasoning labels
      # fall back to titleModel, so both run on Radiance without thinking; Radiance
      # otherwise spends their 256-token label cap on reasoning and returns no text.
      reasoningLabel: true
      titleConvo: true
      titleModel: ai/text-quick
      # A title started alongside the turn is cancelled when the turn stops or is replaced.
      titleTiming: final
      modelDisplayLabel: AI
    - name: Bento
      apiKey: ${AI_API_KEY}
      baseURL: ${BENTO_API_URL}
      models:
        # LibreChat requires a fallback entry; fetched models replace this placeholder.
        default:
          - "*"
        fetch: true
        # GPU allocation changes the available models; bypass the shared two-minute model cache.
        userIdQuery: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: AI
    - name: CLI Proxy API
      apiKey: ${CLI_PROXY_API_KEY}
      baseURL: http://cliproxyapi.cliproxyapi.svc.cluster.local:8317/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: CLI Proxy API
    - name: DeepSeek
      apiKey: ${DEEPSEEK_API_KEY}
      baseURL: https://api.deepseek.com/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: DeepSeek
    - name: OpenCode Go
      apiKey: ${OPENCODE_GO_API_KEY_1}
      baseURL: https://opencode.ai/zen/go/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Go
    - name: OpenCode Go (Account 2)
      apiKey: ${OPENCODE_GO_API_KEY_2}
      baseURL: https://opencode.ai/zen/go/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Go (Account 2)
    - name: OpenCode Zen
      apiKey: ${OPENCODE_ZEN_API_KEY_1}
      baseURL: https://opencode.ai/zen/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Zen
    - name: OpenCode Zen (Account 2)
      apiKey: ${OPENCODE_ZEN_API_KEY_2}
      baseURL: https://opencode.ai/zen/v1
      models:
        default:
          - "*"
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenCode Zen (Account 2)
fileConfig:
  endpoints:
    agents:
      fileLimit: 20
# Agents save and delete memories through their native tools.
memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
skillSync:
  github:
    enabled: true
    intervalMinutes: 60
    runOnStartup: true
    sources:
      - id: maxexcloo-agents
        owner: maxexcloo
        ref: main
        repo: agents
        skillDiscoveryDepth: 2
        token: ${GITHUB_SKILLS_TOKEN}
        paths:
          - skills
webSearch:
  firecrawlApiKey: ${FIRECRAWL_API_KEY}
  keenableApiKey: ${KEENABLE_API_KEY}
  rerankerType: none
  scraperProvider: keenable
  searchProvider: keenable
  serperApiKey: ${SERPER_API_KEY}
  tavilyApiKey: ${TAVILY_API_KEY}
# LiteLLM's MCP gateway is an internal service; exempt just that host and port.
mcpSettings:
  allowedAddresses:
    - litellm.litellm.svc.cluster.local:4000
# LiteLLM's config declares the MCP servers and serves each at /<alias>/mcp.
# Grant keys access in LiteLLM's UI and add an entry here to offer a server.
mcpServers:
  actual-budget:
    type: streamable-http
    description: Review and manage accounts, transactions, budgets and spending in Actual Budget.
    requiresOAuth: false
    startup: false
    title: Actual Budget
    url: http://litellm.litellm.svc.cluster.local:4000/actual_budget/mcp
    # The budget is personal, so it needs an individually authorised key rather than the shared chat key.
    customUserVars:
      ACTUAL_BUDGET_API_KEY:
        description: Your personal LiteLLM virtual key authorised for Actual Budget. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-litellm-api-key: "Bearer {{ACTUAL_BUDGET_API_KEY}}"
  ai-control:
    type: streamable-http
    description: Manage AI workloads and preview GPU allocation changes.
    requiresOAuth: false
    startup: false
    title: AI Control
    url: http://litellm.litellm.svc.cluster.local:4000/ai_control/mcp
    # Admin access stays with individually authorised keys, never the shared chat key.
    customUserVars:
      AI_CONTROL_API_KEY:
        description: Your personal LiteLLM virtual key authorised for AI Control. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Admin API Key
    headers:
      x-litellm-api-key: "Bearer {{AI_CONTROL_API_KEY}}"
  home-assistant:
    type: streamable-http
    description: Inspect and control home devices, automations and dashboards.
    requiresOAuth: false
    startup: false
    title: Home Assistant
    url: http://litellm.litellm.svc.cluster.local:4000/home_assistant/mcp
    # Home control needs an individually authorised key rather than the shared chat key.
    customUserVars:
      HOME_ASSISTANT_API_KEY:
        description: Your personal LiteLLM virtual key authorised for Home Assistant. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-litellm-api-key: "Bearer {{HOME_ASSISTANT_API_KEY}}"
  reactive-resume:
    type: streamable-http
    description: Read and edit resumes, cover letters and job applications in Reactive Resume.
    requiresOAuth: false
    startup: false
    title: Reactive Resume
    url: http://litellm.litellm.svc.cluster.local:4000/reactive_resume/mcp
    # LiteLLM holds the owner's Reactive Resume API key, so only authorised personal keys reach it.
    customUserVars:
      REACTIVE_RESUME_API_KEY:
        description: Your personal LiteLLM virtual key authorised for Reactive Resume. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Reactive Resume API Key
    headers:
      x-litellm-api-key: "Bearer {{REACTIVE_RESUME_API_KEY}}"
  studio:
    type: streamable-http
    description: Create and manage images and videos in Studio.
    requiresOAuth: false
    # Studio's own instructions carry its workflow rules, the same for every client.
    serverInstructions: true
    # Studio waits up to 31 minutes for generation results.
    timeout: 1860000
    title: Studio
    url: http://litellm.litellm.svc.cluster.local:4000/studio/mcp
    # Studio numbers results ("result 1") per conversation. LiteLLM forwards these through
    # the extra_headers of its database-registered studio server.
    headers:
      X-AI-User-Email: "{{LIBRECHAT_USER_EMAIL}}"
      X-AI-User-Id: "{{LIBRECHAT_USER_ID}}"
      X-Studio-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"
  unifi-network:
    type: streamable-http
    description: Inspect and manage UniFi networks, devices and clients.
    requiresOAuth: false
    startup: false
    title: UniFi Network
    url: http://litellm.litellm.svc.cluster.local:4000/unifi_network/mcp
    # Network control needs an individually authorised key rather than the shared chat key.
    customUserVars:
      UNIFI_NETWORK_API_KEY:
        description: Your personal LiteLLM virtual key authorised for UniFi Network. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-litellm-api-key: "Bearer {{UNIFI_NETWORK_API_KEY}}"
# Specs build an agent per request from the preset and MCP servers.
modelSpecs:
  enforce: false
  prioritize: false
  list:
    - name: studio
      description: Studio images and videos, with quick images inline.
      label: Studio
      # Status lines for the calls that keep a chat waiting; each costs a short schema field.
      describeIntent:
        - studio-Generate_mcp_studio
        - studio-Models_mcp_studio
        - studio-Result_mcp_studio
        - studio-Reuse_mcp_studio
      conversation_starters:
        - Animate my last image
        - Fast video of waves rolling onto a beach at sunset
        - Quality portrait of an old fisherman in soft window light
        - Turbo photo of a lighthouse on a stormy coast
      # Queued jobs end the turn with result links; Result runs only on request, with a
      # short foreground wait, since LibreChat v0.8.8 makes the model poll
      # check_background_task until any backgrounded MCP tool completes.
      mcpServers:
        - studio
      preset:
        endpoint: AI
        # Beyond this, LibreChat summarises older messages with the chat model.
        maxContextTokens: 65536
        model: ai/studio
        # Radiance spends no reasoning tokens on Studio's single tool calls. ai/studio
        # enforces this for clients that send only the spec; the preset keeps the UI in step.
        reasoning_effort: none
        temperature: 0.7
        promptPrefix: Use the Studio tools for the images and videos the user asks for, following their instructions, and keep replies short.
