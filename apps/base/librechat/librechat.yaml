version: 1.3.17
cache: true
interface:
  defaultPinnedTools:
    - artifacts
    - mcp
    - web_search
  # File search needs the RAG API, which this deployment does not run.
  fileSearch: false
  # Expiry covers regular chats as well as temporary ones. Drop the general
  # retention deadlines before returning to the temporary-only mode.
  generalChatRetention: 8760
  modelSelect: true
  retainAgentFiles: true
  retentionMode: all
  # Scheduled chats run in this single replica; Redis holds the shared streams.
  schedules:
    create: true
    use: true
  temporaryChatRetention: 720
# LibreChat owns context usage and exposes Copy Summary; Studio supplies result handovers.
summarization:
  enabled: true
  trigger:
    type: token_ratio
    value: 0.9
registration:
  socialLogins:
    - openid
endpoints:
  agents:
    # Stop also ends ordinary background tool waits.
    backgroundTasks:
      ordinaryToolCancellation: true
    # File search, execute_code and ocr need the RAG API, the Code API and a Mistral OCR service.
    capabilities:
      - actions
      - artifacts
      - ask_user_question
      - chain
      - context
      - deferred_tools
      - memory
      - run_in_background
      - skills
      - subagents
      # Live status lines for web search, file and memory calls, and for tools a spec selects.
      - tool_intents
      - tools
      - web_search
  custom:
    # Bifrost lists models for x-bf-model-provider. Cloud and Local serve the alias
    # groups, and Claude, Gemini, GPT and Grok use CLIProxyAPI through Bifrost.
    - &defaults
      name: Cloud
      apiKey: ${BIFROST_API_KEY}
      baseURL: http://bifrost.bifrost.svc.cluster.local:8080/openai/v1
      models:
        default:
          - cloud/auto
          - cloud/deepseek-flash
          - cloud/deepseek-flash-uncensored
          - cloud/glm
          - cloud/glm-flash
          - cloud/glm-flash-uncensored
          - cloud/glm-uncensored
          - cloud/kimi
          - cloud/kimi-uncensored
          - cloud/mimo
          - cloud/mimo-flash
          - cloud/uncensored
          - local/auto
      # A live heading summarises long reasoning while it streams.
      reasoningLabel: true
      # Local ids take their context from the model's max-model-len in
      # apps/base/radiance/radiance.yaml, which tests/test_app_settings.py checks. LibreChat builds
      # no token config from Bifrost, which lists no context lengths, and Radiance reports one only
      # while a model is loaded. local/auto is the smallest of router.py's AUTO pool so a chat it
      # picks can never exceed what that model serves. The local/ key covers a model published
      # without an entry here and takes LibreChat's 32k baseline; every other name is at least 131k.
      tokenConfig:
        /:
          prompt: 0
          completion: 0
          context: 131072
        local/:
          prompt: 0
          completion: 0
          context: 32768
        local/auto:
          prompt: 0
          completion: 0
          context: 200000
        local/flux-pup:
          prompt: 0
          completion: 0
          context: 16384
        local/gemma-4-31b-heretic:
          prompt: 0
          completion: 0
          context: 169328
        local/gemma-4-31b-heretic-i8g:
          prompt: 0
          completion: 0
          context: 262144
        local/qwen3.8-27b-iq4r:
          prompt: 0
          completion: 0
          context: 262144
        local/qwen3.8-27b-uncensored:
          prompt: 0
          completion: 0
          context: 262144
        local/qwen3.8-flash-next:
          prompt: 0
          completion: 0
          context: 200000
      titleConvo: true
      # Titles use the conversation's own model, so a cloud chat titles through cloud/ and a local one through local/.
      titleModel: current_model
      # A title started alongside the turn is cancelled when the turn stops or is replaced.
      titleTiming: final
    # The provider sections share the AI section's settings and list their provider's models.
    - &provider
      <<: *defaults
      name: Abliteration
      headers:
        x-bf-model-provider: abliteration
      models:
        default:
          - "*"
        fetch: true
    - <<: *provider
      name: Claude
      headers:
        x-bf-model-provider: cliproxy-anthropic
    - <<: *provider
      name: Gemini
      headers:
        x-bf-model-provider: cliproxy-google
    - <<: *provider
      name: GPT
      headers:
        x-bf-model-provider: cliproxy-openai
    - <<: *provider
      name: OpenAI API
      headers:
        x-bf-model-provider: openai
    - <<: *provider
      name: Grok
      headers:
        x-bf-model-provider: cliproxy-grok
    - <<: *defaults
      name: OpenRouter
      # List only OpenRouter's auto model.
      models:
        default:
          - openrouter/openrouter/auto
        fetch: false
      # OpenRouter models use varied stop tokens; dropping it avoids 422s.
      dropParams:
        - stop
    - <<: *provider
      name: DeepSeek
      headers:
        x-bf-model-provider: deepseek
    - <<: *provider
      name: Deploy
      headers:
        x-bf-model-provider: deploy
    - <<: *provider
      name: Local
      headers:
        x-bf-model-provider: local
    - <<: *provider
      name: OpenCode Go
      headers:
        x-bf-model-provider: opencode-go
    - <<: *provider
      name: OpenCode Zen
      headers:
        x-bf-model-provider: opencode-zen
    - <<: *provider
      name: Refuseless
      headers:
        x-bf-model-provider: refuseless
    - <<: *provider
      name: Xiaomi
      headers:
        x-bf-model-provider: xiaomi
      # MiMo gates reasoning_content replay through tool calls on these two.
      customParams:
        reasoningFormat: reasoning_object
        reasoningKey: reasoning_content
        includeReasoningContent: true
        includeReasoningHistory: true
# Readable entries for the cloud and local aliases, listed under their section beside its raw ids.
# Each pins Studio, so its tools stay attached whatever the chat's MCP selection.
modelSpecs:
  list:
    - name: local-auto
      label: Local Auto
      description: Uncensored Qwen3.8, the one already loaded; else Flash Next while the cards are idle, else 27B on one card.
      group: Local
      mcpServers: &studio
        - studio
      preset:
        endpoint: Local
        model: local/auto
        promptPrefix: &honest >-
          Report unavailable tools and failed calls honestly.
          Studio Generate uses images attached to the current message, and keeps using them for later requests in this chat until other references are named.
          If the user asks to drop or ignore the references, pass an empty reference_asset_ids array.
          Search uploads or offer an upload link only when no image is attached and none is in use.
    - name: local-gemma-4-31b-heretic
      label: Gemma 4 31B Heretic
      description: Runs on one GPU at 4-bit precision, with refusals removed.
      group: Local
      mcpServers: *studio
      preset:
        endpoint: Local
        model: local/gemma-4-31b-heretic
        promptPrefix: *honest
    - name: local-gemma-4-31b-heretic-i8g
      label: Gemma 4 31B Heretic I8G
      description: Runs on both GPUs at 8-bit precision, with refusals removed.
      group: Local
      mcpServers: *studio
      preset:
        endpoint: Local
        model: local/gemma-4-31b-heretic-i8g
        promptPrefix: *honest
    - name: local-qwen3.8-27b-iq4r
      label: Qwen3.8 27B Uncensored IQ4R
      description: Runs on one GPU at 4-bit precision.
      group: Local
      mcpServers: *studio
      preset:
        endpoint: Local
        model: local/qwen3.8-27b-iq4r
        promptPrefix: *honest
    - name: local-qwen3.8-27b-uncensored
      label: Qwen3.8 27B Uncensored
      description: Runs on both GPUs at 8-bit precision.
      group: Local
      mcpServers: *studio
      preset:
        endpoint: Local
        model: local/qwen3.8-27b-uncensored
        promptPrefix: *honest
    - name: local-qwen3.8-flash-next
      label: Qwen3.8 Flash Next Uncensored
      description: Runs across both GPUs and partly from host memory. Slowest to load.
      group: Local
      mcpServers: *studio
      preset:
        endpoint: Local
        model: local/qwen3.8-flash-next
        promptPrefix: *honest
    - name: cloud-auto
      label: Cloud Auto
      group: Cloud
      mcpServers: *studio
      preset:
        endpoint: Cloud
        model: cloud/auto
        promptPrefix: *honest
    - name: cloud-deepseek-flash
      label: DeepSeek Flash
      group: Cloud
      mcpServers: *studio
      preset:
        endpoint: Cloud
        model: cloud/deepseek-flash
        promptPrefix: *honest
    - name: cloud-deepseek-flash-uncensored
      label: DeepSeek Flash Uncensored
      group: Cloud
      mcpServers: *studio
      preset:
        endpoint: Cloud
        model: cloud/deepseek-flash-uncensored
        promptPrefix: *honest
    - name: cloud-glm
      label: GLM
      group: Cloud
      mcpServers: *studio
      preset:
        endpoint: Cloud
        model: cloud/glm
        promptPrefix: *honest
    - name: cloud-glm-flash
      label: GLM Flash
      group: Cloud
      mcpServers: *studio
      preset:
        endpoint: Cloud
        model: cloud/glm-flash
        promptPrefix: *honest
    - name: cloud-glm-flash-uncensored
      label: GLM Flash Uncensored
      group: Cloud
      mcpServers: *studio
      preset:
        endpoint: Cloud
        model: cloud/glm-flash-uncensored
        promptPrefix: *honest
    - name: cloud-glm-uncensored
      label: GLM Uncensored
      group: Cloud
      mcpServers: *studio
      preset:
        endpoint: Cloud
        model: cloud/glm-uncensored
        promptPrefix: *honest
    - name: cloud-kimi
      label: Kimi
      group: Cloud
      mcpServers: *studio
      preset:
        endpoint: Cloud
        model: cloud/kimi
        promptPrefix: *honest
    - name: cloud-kimi-uncensored
      label: Kimi Uncensored
      group: Cloud
      mcpServers: *studio
      preset:
        endpoint: Cloud
        model: cloud/kimi-uncensored
        promptPrefix: *honest
    - name: cloud-mimo
      label: MiMo
      group: Cloud
      mcpServers: *studio
      preset:
        endpoint: Cloud
        model: cloud/mimo
        promptPrefix: *honest
    - name: cloud-mimo-flash
      label: MiMo Flash
      group: Cloud
      mcpServers: *studio
      preset:
        endpoint: Cloud
        model: cloud/mimo-flash
        promptPrefix: *honest
    - name: cloud-uncensored
      label: Cloud Uncensored
      group: Cloud
      mcpServers: *studio
      preset:
        endpoint: Cloud
        model: cloud/uncensored
        promptPrefix: *honest
fileConfig:
  endpoints:
    agents:
      fileLimit: 20
# Agents save and delete memories through their native tools.
memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
skillSync:
  github:
    enabled: true
    intervalMinutes: 60
    runOnStartup: true
    sources:
      - id: maxexcloo-agents
        owner: maxexcloo
        ref: main
        repo: agents
        skillDiscoveryDepth: 2
        token: ${GITHUB_SKILLS_TOKEN}
        paths:
          - skills
webSearch:
  firecrawlApiKey: ${FIRECRAWL_API_KEY}
  keenableApiKey: ${KEENABLE_API_KEY}
  rerankerType: none
  # Keenable's page fetch rate-limits a third of a five-link result set (HTTP 429),
  # and the results are the reason web search is on. Firecrawl scrapes reliably,
  # so search stays on Keenable's index and only the fetch moves.
  scraperProvider: firecrawl
  searchProvider: keenable
  serperApiKey: ${SERPER_API_KEY}
  tavilyApiKey: ${TAVILY_API_KEY}
# Bifrost's MCP gateway is an internal service; exempt just that host and port.
mcpSettings:
  allowedAddresses:
    - bifrost.bifrost.svc.cluster.local:8080
# Bifrost's config declares the MCP servers and serves each at /mcp/<slug>.
# Grant keys access in Bifrost's config and add an entry here to offer a server.
# The ADMIN role override in the admin panel replaces each customUserVars key with
# ${BIFROST_OWNER_API_KEY} and sets chatMenu: true, so only admins see restricted servers;
# extend it when adding a restricted server. All roles share the model catalogue above;
# MCP servers here retain their per-user credentials.
mcpServers:
  actual-budget:
    type: streamable-http
    chatMenu: false
    description: Review and manage accounts, transactions, budgets and spending in Actual Budget.
    requiresOAuth: false
    startup: false
    title: Actual Budget
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/actual-budget
    # The budget is personal, so it needs an individually authorised key rather than the shared chat key.
    customUserVars:
      ACTUAL_BUDGET_API_KEY:
        description: Your personal Bifrost virtual key authorised for Actual Budget. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{ACTUAL_BUDGET_API_KEY}}"
  home-assistant:
    type: streamable-http
    chatMenu: false
    description: Inspect and control home devices, automations and dashboards.
    requiresOAuth: false
    startup: false
    title: Home Assistant
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/home-assistant
    # Home control needs an individually authorised key rather than the shared chat key.
    customUserVars:
      HOME_ASSISTANT_API_KEY:
        description: Your personal Bifrost virtual key authorised for Home Assistant. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{HOME_ASSISTANT_API_KEY}}"
  immich:
    type: streamable-http
    chatMenu: false
    description: Search, browse and organise photos, albums and people in Immich.
    requiresOAuth: false
    startup: false
    title: Immich
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/immich
    # Bifrost's server uses the owner's Immich API key, so only authorised personal keys reach it.
    customUserVars:
      IMMICH_API_KEY:
        description: Your personal Bifrost virtual key authorised for Immich. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{IMMICH_API_KEY}}"
  karakeep:
    type: streamable-http
    chatMenu: false
    description: Search, save and organise bookmarks, lists, tags and highlights in Karakeep.
    requiresOAuth: false
    startup: false
    title: Karakeep
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/karakeep
    # Bifrost's server uses the owner's Karakeep API key, so only authorised personal keys reach it.
    customUserVars:
      KARAKEEP_API_KEY:
        description: Your personal Bifrost virtual key authorised for Karakeep. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{KARAKEEP_API_KEY}}"
  kubernetes:
    type: streamable-http
    chatMenu: false
    description: Inspect cluster workloads, events and logs read-only in Kubernetes.
    requiresOAuth: false
    startup: false
    title: Kubernetes
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/kubernetes
    # Cluster access needs an individually authorised key rather than the shared chat key.
    customUserVars:
      KUBERNETES_API_KEY:
        description: Your personal Bifrost virtual key authorised for Kubernetes. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{KUBERNETES_API_KEY}}"
  larapaper:
    type: streamable-http
    chatMenu: false
    description: Create, edit and render TRMNL recipe plugins in LaraPaper.
    requiresOAuth: false
    startup: false
    title: LaraPaper
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/larapaper
    # Bifrost holds the owner's LaraPaper MCP token, so only authorised personal keys reach it.
    customUserVars:
      LARAPAPER_API_KEY:
        description: Your personal Bifrost virtual key authorised for LaraPaper. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{LARAPAPER_API_KEY}}"
  reactive-resume:
    type: streamable-http
    description: Read and edit resumes, cover letters and job applications in Reactive Resume.
    # Reactive Resume serves MCP with OAuth, so each user connects their own account;
    # Bifrost lists a server's tools with one stored key and cannot do this. OAuth
    # requires the public URL, which names the protected resource.
    requiresOAuth: true
    startup: false
    title: Reactive Resume
    url: https://resume.excloo.com/mcp
  studio:
    type: streamable-http
    description: Create and manage images and videos in Studio.
    requiresOAuth: false
    # Studio's own instructions carry its workflow rules, the same for every client.
    serverInstructions: true
    # Studio waits up to 31 minutes for generation results.
    timeout: 1860000
    title: Studio
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/studio
    # Studio numbers results ("result 1") per conversation. Bifrost forwards these through
    # the allowed extra headers of its configured Studio server.
    headers:
      X-AI-User-Email: "{{LIBRECHAT_USER_EMAIL}}"
      X-AI-User-Id: "{{LIBRECHAT_USER_ID}}"
      X-Studio-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
      X-Studio-Turn-Id: "{{LIBRECHAT_BODY_PARENTMESSAGEID}}"
      x-bf-vk: "${BIFROST_API_KEY}"
  unifi-network:
    type: streamable-http
    chatMenu: false
    description: Inspect and manage UniFi networks, devices and clients.
    requiresOAuth: false
    startup: false
    title: UniFi Network
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/unifi-network
    # Network control needs an individually authorised key rather than the shared chat key.
    customUserVars:
      UNIFI_NETWORK_API_KEY:
        description: Your personal Bifrost virtual key authorised for UniFi Network. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{UNIFI_NETWORK_API_KEY}}"
