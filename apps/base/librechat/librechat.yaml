version: 1.3.17
cache: true
interface:
  defaultPinnedTools:
    - artifacts
    - mcp
    - web_search
  # File search needs the RAG API, which this deployment does not run.
  fileSearch: false
  # Expiry covers regular chats as well as temporary ones. Drop the general
  # retention deadlines before returning to the temporary-only mode.
  generalChatRetention: 8760
  retainAgentFiles: true
  retentionMode: all
  # Scheduled chats run in this single replica; Redis now holds the shared streams.
  schedules:
    create: true
    use: true
  temporaryChatRetention: 720
# LibreChat owns context usage and exposes Copy Summary; Studio supplies result handovers.
summarization:
  enabled: true
  trigger:
    type: token_ratio
    value: 0.9
registration:
  socialLogins:
    - openid
endpoints:
  agents:
    # Stop also ends ordinary background tool waits.
    backgroundTasks:
      ordinaryToolCancellation: true
    # File search, execute_code and ocr need the RAG API, the Code API and a Mistral OCR service.
    capabilities:
      - actions
      - artifacts
      - ask_user_question
      - chain
      - context
      - deferred_tools
      - memory
      - run_in_background
      - skills
      - subagents
      # Live status lines for web search, file and memory calls, and for tools a spec selects.
      - tool_intents
      - tools
      - web_search
  custom:
    # Every section reaches its provider through Bifrost, which lists that provider's models
    # for x-bf-model-provider. Each cloud/ alias serves one model (auto and uncensored are
    # DeepSeek's), and local/ takes the first running local model, with local/uncensored limited
    # to uncensored ones; set reasoning with the Reasoning Effort parameter.
    - &ai
      name: AI
      apiKey: ${BIFROST_API_KEY}
      baseURL: http://bifrost.bifrost.svc.cluster.local:8080/openai/v1
      models:
        default:
          - cloud/auto
          - cloud/deepseek
          - cloud/deepseek-uncensored
          - cloud/glm
          - cloud/glm-uncensored
          - cloud/uncensored
          - local/auto
          - local/uncensored
      # A live heading summarises long reasoning while it streams.
      reasoningLabel: true
      # LibreChat assumes 32k for unknown models and summarises too early. Bifrost reports no
      # context lengths, and every model here has at least 131k. Keys match as substrings, so
      # this covers every name.
      tokenConfig:
        /:
          prompt: 0
          completion: 0
          context: 131072
      titleConvo: true
      # Titles use the conversation's own model, so a cloud chat titles through cloud/ and a local one through local/.
      titleModel: current_model
      # A title started alongside the turn is cancelled when the turn stops or is replaced.
      titleTiming: final
    # The provider sections share the AI section's settings and list their provider's models.
    - &provider
      <<: *ai
      name: Abliteration
      headers:
        x-bf-model-provider: abliteration
      models:
        default:
          - "*"
        fetch: true
    - <<: *provider
      name: CLI Proxy - Claude
      headers:
        x-bf-model-provider: cliproxy-claude
    - <<: *provider
      name: CLI Proxy - Gemini
      headers:
        x-bf-model-provider: cliproxy-gemini
    - <<: *provider
      name: CLI Proxy - GPT
      headers:
        x-bf-model-provider: cliproxy-gpt
    - <<: *provider
      name: CLI Proxy - Grok
      headers:
        x-bf-model-provider: cliproxy-grok
    - <<: *provider
      name: DeepSeek
      headers:
        x-bf-model-provider: deepseek
    - <<: *provider
      name: Deploy
      headers:
        x-bf-model-provider: deploy
    - <<: *provider
      name: Local
      headers:
        x-bf-model-provider: ai
    - <<: *provider
      name: OpenCode Go
      headers:
        x-bf-model-provider: opencode-go
    - <<: *provider
      name: OpenCode Zen
      headers:
        x-bf-model-provider: opencode-zen
    - <<: *provider
      name: OpenRouter
      headers:
        x-bf-model-provider: openrouter
    - <<: *provider
      name: Refuseless
      headers:
        x-bf-model-provider: refuseless
fileConfig:
  endpoints:
    agents:
      fileLimit: 20
# Agents save and delete memories through their native tools.
memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
skillSync:
  github:
    enabled: true
    intervalMinutes: 60
    runOnStartup: true
    sources:
      - id: maxexcloo-agents
        owner: maxexcloo
        ref: main
        repo: agents
        skillDiscoveryDepth: 2
        token: ${GITHUB_SKILLS_TOKEN}
        paths:
          - skills
webSearch:
  firecrawlApiKey: ${FIRECRAWL_API_KEY}
  keenableApiKey: ${KEENABLE_API_KEY}
  rerankerType: none
  scraperProvider: keenable
  searchProvider: keenable
  serperApiKey: ${SERPER_API_KEY}
  tavilyApiKey: ${TAVILY_API_KEY}
# Bifrost's MCP gateway is an internal service; exempt just that host and port.
mcpSettings:
  allowedAddresses:
    - bifrost.bifrost.svc.cluster.local:8080
# Bifrost's config declares the MCP servers and serves each at /mcp/<slug>.
# Grant keys access in Bifrost's config and add an entry here to offer a server.
# The owner's user override in the admin panel replaces each customUserVars key with
# ${BIFROST_OWNER_API_KEY}; extend it when adding a restricted server. The USER role's
# override limits chat to the two auto models; MCP servers here are offered to every role.
mcpServers:
  actual-budget:
    type: streamable-http
    description: Review and manage accounts, transactions, budgets and spending in Actual Budget.
    requiresOAuth: false
    startup: false
    title: Actual Budget
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/actual-budget
    # The budget is personal, so it needs an individually authorised key rather than the shared chat key.
    customUserVars:
      ACTUAL_BUDGET_API_KEY:
        description: Your personal Bifrost virtual key authorised for Actual Budget. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{ACTUAL_BUDGET_API_KEY}}"
  home-assistant:
    type: streamable-http
    description: Inspect and control home devices, automations and dashboards.
    requiresOAuth: false
    startup: false
    title: Home Assistant
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/home-assistant
    # Home control needs an individually authorised key rather than the shared chat key.
    customUserVars:
      HOME_ASSISTANT_API_KEY:
        description: Your personal Bifrost virtual key authorised for Home Assistant. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{HOME_ASSISTANT_API_KEY}}"
  immich:
    type: streamable-http
    description: Search, browse and organise photos, albums and people in Immich.
    requiresOAuth: false
    startup: false
    title: Immich
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/immich
    # Bifrost's server uses the owner's Immich API key, so only authorised personal keys reach it.
    customUserVars:
      IMMICH_API_KEY:
        description: Your personal Bifrost virtual key authorised for Immich. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{IMMICH_API_KEY}}"
  karakeep:
    type: streamable-http
    description: Search, save and organise bookmarks, lists, tags and highlights in Karakeep.
    requiresOAuth: false
    startup: false
    title: Karakeep
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/karakeep
    # Bifrost's server uses the owner's Karakeep API key, so only authorised personal keys reach it.
    customUserVars:
      KARAKEEP_API_KEY:
        description: Your personal Bifrost virtual key authorised for Karakeep. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{KARAKEEP_API_KEY}}"
  larapaper:
    type: streamable-http
    description: Create, edit and render TRMNL recipe plugins in LaraPaper.
    requiresOAuth: false
    startup: false
    title: LaraPaper
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/larapaper
    # Bifrost holds the owner's LaraPaper MCP token, so only authorised personal keys reach it.
    customUserVars:
      LARAPAPER_API_KEY:
        description: Your personal Bifrost virtual key authorised for LaraPaper. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{LARAPAPER_API_KEY}}"
  reactive-resume:
    type: streamable-http
    description: Read and edit resumes, cover letters and job applications in Reactive Resume.
    # Reactive Resume serves MCP with OAuth, so each user connects their own account;
    # Bifrost lists a server's tools with one stored key and cannot do this. OAuth
    # requires the public URL, which names the protected resource.
    requiresOAuth: true
    startup: false
    title: Reactive Resume
    url: https://resume.excloo.com/mcp
  studio:
    type: streamable-http
    description: Create and manage images and videos in Studio.
    requiresOAuth: false
    # Studio's own instructions carry its workflow rules, the same for every client.
    serverInstructions: true
    # Studio waits up to 31 minutes for generation results.
    timeout: 1860000
    title: Studio
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/studio
    # Studio numbers results ("result 1") per conversation. Bifrost forwards these through
    # the allowed extra headers of its configured Studio server.
    headers:
      X-AI-User-Email: "{{LIBRECHAT_USER_EMAIL}}"
      X-AI-User-Id: "{{LIBRECHAT_USER_ID}}"
      X-Studio-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
      x-bf-vk: "${BIFROST_API_KEY}"
  unifi-network:
    type: streamable-http
    description: Inspect and manage UniFi networks, devices and clients.
    requiresOAuth: false
    startup: false
    title: UniFi Network
    url: http://bifrost.bifrost.svc.cluster.local:8080/mcp/unifi-network
    # Network control needs an individually authorised key rather than the shared chat key.
    customUserVars:
      UNIFI_NETWORK_API_KEY:
        description: Your personal Bifrost virtual key authorised for UniFi Network. Ordinary chat keys cannot access these tools.
        sensitive: true
        title: Personal API Key
    headers:
      x-bf-vk: "{{UNIFI_NETWORK_API_KEY}}"
