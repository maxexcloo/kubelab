apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librechat
spec:
  releaseName: librechat
  interval: 30m
  chart:
    spec:
      chart: librechat
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: librechat
        namespace: flux-system
      version: 3.0.0
  values:
    fullnameOverride: librechat
    global:
      librechat:
        env:
          - name: LITELLM_API_KEY
            valueFrom:
              secretKeyRef:
                key: LITELLM_API_KEY
                name: litellm
        existingSecretName: librechat
    image:
      pullPolicy: IfNotPresent
      tag: v0.8.8
    ingress:
      enabled: false
    librechat:
      adminPanelUrl: https://librechat-admin.invalid
      configEnv:
        ALLOW_REGISTRATION: "false"
        ALLOW_SOCIAL_LOGIN: "true"
        ALLOW_SOCIAL_REGISTRATION: "true"
        DOMAIN_CLIENT: https://app.invalid
        DOMAIN_SERVER: https://app.invalid
        ENDPOINTS: custom,agents
        OPENID_ADMIN_ROLE: ${owner_email}
        OPENID_ADMIN_ROLE_PARAMETER_PATH: email
        OPENID_ADMIN_ROLE_TOKEN_KIND: id
        OPENID_BUTTON_LABEL: Pocket ID
        OPENID_CALLBACK_URL: /oauth/openid/callback
        OPENID_CLIENT_ID: librechat
        OPENID_ISSUER: https://${identity_host}/.well-known/openid-configuration
        OPENID_SCOPE: openid profile email
        OPENID_USE_PKCE: "true"
        SCHEDULES_SINGLE_PROCESS: "true"
        SEARCH: "true"
        TZ: ${time_zone}
      existingConfigYaml: librechat-config
      imageVolume:
        enabled: false
    livenessProbe:
      failureThreshold: 3
      httpGet:
        path: /livez
        port: 3080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
    meilisearch:
      auth:
        existingMasterKeySecret: librechat
      enabled: true
      environment:
        MEILI_UPGRADE_DB: "true"
      fullnameOverride: meilisearch
      image:
        tag: v1.55.0
      # The subchart exposes probe periods and startup failures, but no timeouts.
      livenessProbe:
        periodSeconds: 10
      nodeSelector:
        node.excloo.dev/network: internal
      persistence:
        enabled: true
        size: 5Gi
        storageClass: local-path
      podSecurityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 20m
          memory: 128Mi
      readinessProbe:
        periodSeconds: 10
      startupProbe:
        failureThreshold: 30
        periodSeconds: 10
    mongodb:
      enabled: true
      fullnameOverride: mongodb
      livenessProbe:
        failureThreshold: 3
        periodSeconds: 10
        timeoutSeconds: 5
      nodeSelector:
        node.excloo.dev/network: internal
      persistence:
        enabled: true
        size: 5Gi
        storageClass: local-path
      podSecurityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      readinessProbe:
        failureThreshold: 3
        periodSeconds: 10
        timeoutSeconds: 5
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 256Mi
      startupProbe:
        enabled: true
        failureThreshold: 30
        periodSeconds: 10
        timeoutSeconds: 5
      # Standalone MongoDB must release its local data files before replacement.
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
    nodeSelector:
      node.excloo.dev/network: internal
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /readyz
        port: 3080
      periodSeconds: 10
      timeoutSeconds: 5
    replicaCount: 1
    # Redis keeps resumable streams, steers and background tasks across pod restarts.
    # The password comes from the managed librechat-redis secret, so upgrades never generate one.
    redis:
      enabled: true
      architecture: standalone
      auth:
        enabled: true
        existingSecret: librechat-redis
        existingSecretPasswordKey: redis-password
      master:
        nodeSelector:
          node.excloo.dev/network: internal
        persistence:
          enabled: true
          size: 1Gi
          storageClass: local-path
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 50m
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1000
    service:
      containerPort: 3080
      port: 3080
      targetPort: 3080
    serviceAccount:
      automount: false
      create: true
    updateStrategy:
      type: Recreate
    volumeMounts:
      - name: data
        mountPath: /app/client/public/images
      - name: uploads
        mountPath: /app/uploads
    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads
