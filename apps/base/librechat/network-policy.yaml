apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: librechat
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: librechat-admin
          podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-admin
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: librechat
  policyTypes:
    - Ingress
