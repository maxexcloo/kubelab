apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: librechat
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: librechat-admin
          podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat-admin
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3080
  podSelector:
    matchLabels:
      app.kubernetes.io/name: librechat
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: librechat-meilisearch
spec:
  # The bundled Meilisearch pod has no chart policy of its own.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: librechat
      ports:
        - port: 7700
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: librechat
      app.kubernetes.io/name: meilisearch
  policyTypes:
    - Ingress
