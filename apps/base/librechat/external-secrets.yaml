apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/defaults: '{"username":"max@excloo.com"}'
    onepassword.excloo.dev/generate-fields: admin-panel-session-secret,creds-iv,creds-key,jwt-refresh-secret,jwt-secret,meili-master-key,openid-session-secret,password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: LibreChat
        property: admin-panel-session-secret
      secretKey: ADMIN_PANEL_SESSION_SECRET
    - remoteRef:
        key: LibreChat
        property: creds-iv
      secretKey: CREDS_IV
    - remoteRef:
        key: LibreChat
        property: creds-key
      secretKey: CREDS_KEY
    - remoteRef:
        key: LibreChat
        property: firecrawl-api-key
      secretKey: FIRECRAWL_API_KEY
    - remoteRef:
        key: LibreChat
        property: jwt-refresh-secret
      secretKey: JWT_REFRESH_SECRET
    - remoteRef:
        key: LibreChat
        property: jwt-secret
      secretKey: JWT_SECRET
    - remoteRef:
        key: LibreChat
        property: keenable-api-key
      secretKey: KEENABLE_API_KEY
    - remoteRef:
        key: LibreChat
        property: meili-master-key
      secretKey: MEILI_MASTER_KEY
    - remoteRef:
        key: LibreChat
        property: openid-session-secret
      secretKey: OPENID_SESSION_SECRET
    - remoteRef:
        key: LibreChat
        property: serper-api-key
      secretKey: SERPER_API_KEY
    - remoteRef:
        key: LibreChat
        property: tavily-api-key
      secretKey: TAVILY_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: application
    template:
      engineVersion: v2
      # LibreChat requires a 32-byte hex key and a 16-byte hex IV.
      data:
        ADMIN_PANEL_SESSION_SECRET: "{{ .ADMIN_PANEL_SESSION_SECRET }}"
        CREDS_IV: "{{ .CREDS_IV | sha256sum | trunc 32 }}"
        CREDS_KEY: "{{ .CREDS_KEY | sha256sum }}"
        FIRECRAWL_API_KEY: "{{ .FIRECRAWL_API_KEY }}"
        JWT_REFRESH_SECRET: "{{ .JWT_REFRESH_SECRET }}"
        JWT_SECRET: "{{ .JWT_SECRET }}"
        KEENABLE_API_KEY: "{{ .KEENABLE_API_KEY }}"
        MEILI_MASTER_KEY: "{{ .MEILI_MASTER_KEY }}"
        OPENID_SESSION_SECRET: "{{ .OPENID_SESSION_SECRET }}"
        SERPER_API_KEY: "{{ .SERPER_API_KEY }}"
        TAVILY_API_KEY: "{{ .TAVILY_API_KEY }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: LiteLLM
        property: api-key-librechat
      secretKey: api_key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: litellm
    template:
      engineVersion: v2
      data:
        LITELLM_API_KEY: "{{ .api_key }}"
