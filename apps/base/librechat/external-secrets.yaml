apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat
  annotations:
    onepassword.excloo.dev/defaults: '{"provider-github-access-token":""}'
    onepassword.excloo.dev/generate-fields: admin-panel-session-secret,creds-iv,creds-key,jwt-refresh-secret,jwt-secret,meili-master-key,openid-session-secret,password,redis-password
    onepassword.excloo.dev/owner-email-fields: username
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item LibreChat
        property: admin-panel-session-secret
      secretKey: ADMIN_PANEL_SESSION_SECRET
    - remoteRef:
        key: *item
        property: provider-cliproxyapi-api-key
      secretKey: CLI_PROXY_API_KEY
    - remoteRef:
        key: *item
        property: creds-iv
      secretKey: CREDS_IV
    - remoteRef:
        key: *item
        property: creds-key
      secretKey: CREDS_KEY
    - remoteRef:
        key: *item
        property: provider-deepseek-api-key
      secretKey: DEEPSEEK_API_KEY
    # Bifrost owns the shared search credentials.
    - remoteRef:
        key: &bifrost Bifrost
        property: provider-firecrawl-api-key
      secretKey: FIRECRAWL_API_KEY
    - remoteRef:
        key: *item
        property: provider-github-access-token
      secretKey: GITHUB_SKILLS_TOKEN
    - remoteRef:
        key: *item
        property: jwt-refresh-secret
      secretKey: JWT_REFRESH_SECRET
    - remoteRef:
        key: *item
        property: jwt-secret
      secretKey: JWT_SECRET
    - remoteRef:
        key: *item
        property: provider-keenable-api-key
      secretKey: KEENABLE_API_KEY
    - remoteRef:
        key: *item
        property: meili-master-key
      secretKey: MEILI_MASTER_KEY
    - remoteRef:
        key: *item
        property: openid-session-secret
      secretKey: OPENID_SESSION_SECRET
    - remoteRef:
        key: *item
        property: provider-opencode-1-api-key
      secretKey: OPENCODE_GO_API_KEY_1
    - remoteRef:
        key: *item
        property: provider-opencode-2-api-key
      secretKey: OPENCODE_GO_API_KEY_2
    - remoteRef:
        key: *item
        property: provider-opencode-1-api-key
      secretKey: OPENCODE_ZEN_API_KEY_1
    - remoteRef:
        key: *item
        property: provider-opencode-2-api-key
      secretKey: OPENCODE_ZEN_API_KEY_2
    - remoteRef:
        key: *bifrost
        property: provider-serper-api-key
      secretKey: SERPER_API_KEY
    - remoteRef:
        key: *bifrost
        property: provider-tavily-api-key
      secretKey: TAVILY_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: librechat
    template:
      engineVersion: v2
      # LibreChat requires a 32-byte hex key and a 16-byte hex IV.
      data:
        ADMIN_PANEL_SESSION_SECRET: "{{ .ADMIN_PANEL_SESSION_SECRET }}"
        CLI_PROXY_API_KEY: "{{ .CLI_PROXY_API_KEY }}"
        CREDS_IV: "{{ .CREDS_IV | sha256sum | trunc 32 }}"
        CREDS_KEY: "{{ .CREDS_KEY | sha256sum }}"
        DEEPSEEK_API_KEY: "{{ .DEEPSEEK_API_KEY }}"
        FIRECRAWL_API_KEY: "{{ .FIRECRAWL_API_KEY }}"
        GITHUB_SKILLS_TOKEN: "{{ .GITHUB_SKILLS_TOKEN }}"
        JWT_REFRESH_SECRET: "{{ .JWT_REFRESH_SECRET }}"
        JWT_SECRET: "{{ .JWT_SECRET }}"
        KEENABLE_API_KEY: "{{ .KEENABLE_API_KEY }}"
        MEILI_MASTER_KEY: "{{ .MEILI_MASTER_KEY }}"
        OPENID_SESSION_SECRET: "{{ .OPENID_SESSION_SECRET }}"
        OPENCODE_GO_API_KEY_1: "{{ .OPENCODE_GO_API_KEY_1 }}"
        OPENCODE_GO_API_KEY_2: "{{ .OPENCODE_GO_API_KEY_2 }}"
        OPENCODE_ZEN_API_KEY_1: "{{ .OPENCODE_ZEN_API_KEY_1 }}"
        OPENCODE_ZEN_API_KEY_2: "{{ .OPENCODE_ZEN_API_KEY_2 }}"
        SERPER_API_KEY: "{{ .SERPER_API_KEY }}"
        TAVILY_API_KEY: "{{ .TAVILY_API_KEY }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: Bifrost
        property: virtual-key-librechat
      secretKey: api_key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bifrost
    template:
      engineVersion: v2
      data:
        BIFROST_API_KEY: "{{ .api_key }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
# The bundled Redis chart reads this fixed name; providing it stops the chart generating a password on upgrade.
metadata:
  name: redis
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: LibreChat
        property: redis-password
      secretKey: redis-password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: librechat-redis
