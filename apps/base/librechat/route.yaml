apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: application
  annotations:
    gethomepage.dev/description: AI Chat
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Artificial Intelligence
    gethomepage.dev/href: https://app.invalid
    gethomepage.dev/icon: sh-librechat
    gethomepage.dev/name: &title LibreChat
    monitoring.excloo.dev/enabled: "true"
    onepassword.excloo.dev/item: *title
  labels:
    app.kubernetes.io/name: application
    gateway.excloo.dev/internal-alias: "true"
spec:
  hostnames:
    - chat.excloo.com
    - app.cluster.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: librechat
          port: 3080
