apiVersion: batch/v1
kind: CronJob
metadata:
  name: state-backup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: docker.io/bitnamilegacy/mongodb:8.0.13-debian-12-r0
              env:
                - name: PATH
                  value: /tools:/opt/bitnami/mongodb/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                - name: MONGODB_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: mongodb-root-password
                      name: mongodb
              volumeMounts:
                - name: snapshot-script
                  mountPath: /hooks
                  readOnly: true
                - name: uploads
                  mountPath: /sources/uploads
                  readOnly: true
          # Run the dump in backup.sh's quiesced phase; failed init containers
          # cannot run its recovery trap.
          initContainers:
            - name: restic
              image: docker.io/restic/restic:0.19.1
              command:
                - /bin/sh
                - -ec
                - cp "$(command -v restic)" /tools/restic
              volumeMounts:
                - name: tools
                  mountPath: /tools
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
          volumes:
            - name: snapshot-script
              configMap:
                name: librechat-backup
            - name: uploads
              persistentVolumeClaim:
                claimName: uploads
                readOnly: true
  schedule: 33 3 * * *
