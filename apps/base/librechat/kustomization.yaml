apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - admin-network-policy.yaml
  - admin-panel.yaml
  - admin-private-dns.yaml
  - admin-route.yaml
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - route.yaml
  - source.yaml
  - storage.yaml
configurations:
  - name-reference.yaml
configMapGenerator:
  - name: librechat-config
    files:
      - librechat.yaml
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: HTTPRoute
          name: librechat
        fieldPaths:
          - spec.hostnames.1
        options:
          delimiter: .
          index: 0
  - source:
      kind: HTTPRoute
      name: librechat
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: PrivateDNSRecord
          name: librechat
        fieldPaths:
          - spec.hostname
      - select:
          kind: Deployment
          name: librechat-admin
        fieldPaths:
          - spec.template.spec.containers.[name=admin].env.[name=VITE_API_BASE_URL].value
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.librechat.configEnv.DOMAIN_CLIENT
          - spec.values.librechat.configEnv.DOMAIN_SERVER
        options:
          delimiter: /
          index: 2
      - select:
          kind: HTTPRoute
          name: librechat
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.callbackURLs.1
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
  - source:
      kind: HTTPRoute
      name: librechat-admin
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: PrivateDNSRecord
          name: librechat-admin
        fieldPaths:
          - spec.hostname
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.librechat.adminPanelUrl
        options:
          delimiter: /
          index: 2
  - source:
      kind: PocketIDClient
      fieldPath: spec.client.id
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.librechat.configEnv.OPENID_CLIENT_ID
components:
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
  - ../../components/private-dns
  - ../../components/app-namespace
patches:
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
