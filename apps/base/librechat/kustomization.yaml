apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: librechat
resources:
  - cloudflare-access.yaml
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - private-dns.yaml
  - route.yaml
  - source.yaml
  - storage.yaml
configurations:
  - name-reference.yaml
configMapGenerator:
  - name: librechat-backup
    files:
      - snapshot.sh
  - name: librechat-config
    files:
      - librechat.yaml
replacements:
  # The chart source lives in the namespace the release references.
  - source:
      kind: HelmRelease
      fieldPath: spec.chart.spec.sourceRef.namespace
    targets:
      - select:
          kind: HelmRepository
        fieldPaths:
          - metadata.namespace
  - source:
      kind: PocketIDClient
      fieldPath: spec.client.id
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.librechat.configEnv.OPENID_CLIENT_ID
  # The Pocket ID client's logo follows the app's Homepage icon.
  - source:
      kind: HTTPRoute
      name: librechat
      fieldPath: metadata.annotations.[gethomepage.dev/icon]
    targets:
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.icon
        options:
          create: true
components:
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
  - ../../components/default-deny
patches:
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
transformers:
  - ../../transformers/cluster-scoped
