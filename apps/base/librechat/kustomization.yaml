apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: librechat
resources:
  - cloudflare-access.yaml
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - route.yaml
  - source.yaml
  - storage.yaml
configurations:
  - name-reference.yaml
configMapGenerator:
  - name: librechat-backup
    files:
      - snapshot.sh
  - name: librechat-config
    files:
      - librechat.yaml
replacements:
  # The chart source lives in the namespace the release references.
  - source:
      kind: HelmRelease
      fieldPath: spec.chart.spec.sourceRef.namespace
    targets:
      - select:
          kind: HelmRepository
        fieldPaths:
          - metadata.namespace
  - source:
      kind: HTTPRoute
      name: librechat
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: CloudflareAccessApplication
        fieldPaths:
          - spec.hostname
      - select:
          kind: HTTPRoute
          name: librechat-private
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.hostname
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.librechat.configEnv.DOMAIN_CLIENT
          - spec.values.librechat.configEnv.DOMAIN_SERVER
        options:
          delimiter: /
          index: 2
      - select:
          kind: HTTPRoute
          name: librechat
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.callbackURLs.1
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
  - source:
      kind: PocketIDClient
      fieldPath: spec.client.id
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.librechat.configEnv.OPENID_CLIENT_ID
  # The Pocket ID client's logo follows the app's Homepage icon.
  - source:
      kind: HTTPRoute
      name: librechat
      fieldPath: metadata.annotations.[gethomepage.dev/icon]
    targets:
      - select:
          kind: PocketIDClient
        fieldPaths:
          - spec.client.icon
        options:
          create: true
components:
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
  - ../../components/private-dns-control-d-only
  - ../../components/default-deny
patches:
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
transformers:
  - ../../transformers/cluster-scoped
