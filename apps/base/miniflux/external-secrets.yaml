apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"miniflux"}'
    onepassword.excloo.dev/generate-fields: database-password,password
    onepassword.excloo.dev/owner-email-fields: username
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Miniflux
        property: database-password
      secretKey: database-password
    - remoteRef:
        key: *item
        property: database-username
      secretKey: database-username
    - remoteRef:
        key: *item
        property: oidc-client-id
      secretKey: OAUTH2_CLIENT_ID
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: OAUTH2_CLIENT_SECRET
    - remoteRef:
        key: *item
        property: password
      secretKey: password
    - remoteRef:
        key: *item
        property: username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: application
    template:
      engineVersion: v2
      data:
        ADMIN_PASSWORD: "{{ .password }}"
        ADMIN_USERNAME: "{{ .username }}"
        DATABASE_URL: postgres://{{ index . "database-username" | urlquery }}:{{ index . "database-password" | urlquery }}@miniflux-database-rw:5432/miniflux?sslmode=require
        OAUTH2_CLIENT_ID: "{{ .OAUTH2_CLIENT_ID }}"
        OAUTH2_CLIENT_SECRET: "{{ .OAUTH2_CLIENT_SECRET }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-database
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"miniflux"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Miniflux
        property: database-password
      secretKey: password
    - remoteRef:
        key: *item
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: miniflux-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
