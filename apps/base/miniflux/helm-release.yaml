apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              BASE_URL: https://app.invalid
              CREATE_ADMIN: "1"
              OAUTH2_OIDC_DISCOVERY_ENDPOINT: https://identity.invalid
              OAUTH2_OIDC_PROVIDER_NAME: Pocket ID
              OAUTH2_PROVIDER: oidc
              OAUTH2_REDIRECT_URL: https://app.invalid/oauth2/oidc/callback
              OAUTH2_USER_CREATION: "1"
              RUN_MIGRATIONS: "1"
              TZ: time-zone.invalid
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/miniflux/miniflux
              tag: 2.3.4
            probes:
              liveness: null
              readiness: &ready
                path: /healthcheck
              startup: *ready
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 20m
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        fsGroup: null
        fsGroupChangePolicy: null
    route:
      private:
        annotations:
          gethomepage.dev/description: RSS Reader
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: miniflux-light
          gethomepage.dev/name: &title Miniflux
          gethomepage.dev/widget.fields: '["unread"]'
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_MINIFLUX_API_KEY}}" }}'
          gethomepage.dev/widget.type: miniflux
          gethomepage.dev/widget.url: https://app.invalid
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: *title
        hostnames:
          - reader.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 8080
