apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miniflux
  namespace: miniflux
spec:
  interval: 30m
  releaseName: miniflux
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.2.1
  values:
    controllers:
      miniflux:
        strategy: Recreate
        containers:
          miniflux:
            envFrom:
              - secretRef:
                  name: miniflux
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/miniflux/miniflux
              tag: 2.3.3@sha256:49d7b60987616387c306a8023087b31f2c9b7b21288b523026cb04058e8b6dbb
            probes:
              readiness:
                custom: true
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /healthcheck
                    port: 8080
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /healthcheck
                    port: 8080
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 20m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            env:
              BASE_URL: https://app.invalid
              OAUTH2_OIDC_DISCOVERY_ENDPOINT: https://identity.invalid
              OAUTH2_REDIRECT_URL: https://app.invalid/oauth2/oidc/callback
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: miniflux
    persistence:
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        annotations:
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_FILE_MINIFLUX_KEY}}" }}'
          gethomepage.dev/widget.type: miniflux
          gethomepage.dev/widget.url: https://app.invalid
        labels:
          app.kubernetes.io/name: miniflux
        parentRefs:
          - name: private
            namespace: networking
    service:
      miniflux:
        controller: miniflux
        ports:
          http:
            port: 8080
            protocol: HTTP
