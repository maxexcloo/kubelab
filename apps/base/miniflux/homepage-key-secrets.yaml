apiVersion: v1
kind: Secret
metadata:
  name: miniflux-homepage-key
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: miniflux-homepage-key
spec:
  data:
    - match:
        secretKey: token
        remoteRef:
          property: provider-miniflux-api-key
          remoteKey: Homepage
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          tags: [Kubelab]
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    secret:
      name: miniflux-homepage-key
