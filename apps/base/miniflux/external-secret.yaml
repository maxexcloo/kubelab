apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux
  namespace: miniflux
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: miniflux
        property: password
      secretKey: database-password
    - remoteRef:
        key: miniflux
        property: oauth-client-id
      secretKey: OAUTH2_CLIENT_ID
    - remoteRef:
        key: miniflux
        property: oauth-client-secret
      secretKey: OAUTH2_CLIENT_SECRET
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: miniflux
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgres://miniflux:{{ index . "database-password" | urlquery }}@miniflux-database-rw:5432/miniflux?sslmode=require'
        OAUTH2_CLIENT_ID: "{{ .OAUTH2_CLIENT_ID }}"
        OAUTH2_CLIENT_SECRET: "{{ .OAUTH2_CLIENT_SECRET }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-database
  namespace: miniflux
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: miniflux
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: miniflux-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: miniflux
