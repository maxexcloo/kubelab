apiVersion: v1
kind: ServiceAccount
metadata:
  name: miniflux-homepage-key
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: miniflux-homepage-key
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [miniflux-homepage-key]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: miniflux-homepage-key
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: miniflux-homepage-key
subjects:
  - kind: ServiceAccount
    name: miniflux-homepage-key
