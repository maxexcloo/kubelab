apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: miniflux
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - private-dns.yaml
components:
  - ../../../platform/databases/postgres-minimal
  - ../../components/application
  - ../../components/default-deny
  - ../../components/database-colocation
  - ../../../platform/backups/credentials
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
transformers:
  - ../../transformers/cluster-scoped
  - ../../transformers/pocket-id-icon-private
