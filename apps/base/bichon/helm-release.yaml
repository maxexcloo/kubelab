apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              BICHON_CORS_ORIGINS: https://app.invalid
              BICHON_HTTP_PORT: "15630"
              BICHON_PUBLIC_URL: https://app.invalid
              BICHON_ROOT_DIR: /data/bichon-data
              TZ: Australia/Sydney
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/rustmailer/bichon
              tag: 2.1.1
            probes:
              liveness: &health
                path: /api/status
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 20m
                memory: 128Mi
    persistence:
      data:
        existingClaim: retained-data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data/bichon-data
    route:
      private:
        annotations:
          gethomepage.dev/description: Email Archiving
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-bichon
          gethomepage.dev/name: &title Bichon
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: k275joy34gu3qyy4zmhzpxpfui
          onepassword.excloo.dev/title: *title
        hostnames:
          - bichon.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 15630
