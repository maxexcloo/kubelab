apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retained-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ""
  volumeName: bichon-data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bichon-data
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 5Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /dataset-root.invalid/truenas-nvme/bichon
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - storage-node.invalid
