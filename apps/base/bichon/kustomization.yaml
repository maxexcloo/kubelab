apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bichon
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../components/private-dns
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.BICHON_CORS_ORIGINS
          - spec.values.controllers.main.containers.main.env.BICHON_PUBLIC_URL
        options:
          delimiter: /
          index: 2
transformers:
  - ../../transformers/route-private
