apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              # Requests must use the service address; others fail Host validation.
              UNIFI_MCP_ALLOWED_HOSTS: "{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local"
              UNIFI_MCP_HOST: 0.0.0.0
              UNIFI_MCP_HTTP_ENABLED: "true"
              UNIFI_MCP_PORT: "3000"
              UNIFI_NETWORK_HOST: host.invalid
              UNIFI_NETWORK_VERIFY_SSL: "true"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/sirkirby/unifi-network-mcp
              tag: 0.39.1
            # The server has no health endpoint.
            probes:
              liveness: &health
                type: TCP
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 10m
                memory: 128Mi
    service:
      main:
        ports:
          http:
            port: 3000
