apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
spec:
  refreshInterval: 1h
  # LiteLLM's item holds the gateway's provider credentials.
  data:
    - remoteRef:
        key: &item LiteLLM
        property: provider-unifi-api-key
      secretKey: UNIFI_NETWORK_API_KEY
    - remoteRef:
        key: *item
        property: provider-unifi-password
      secretKey: UNIFI_NETWORK_PASSWORD
    - remoteRef:
        key: *item
        property: provider-unifi-username
      secretKey: UNIFI_NETWORK_USERNAME
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
