apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-network-mcp
spec:
  # Bifrost's item holds the gateway's provider credentials.
  data:
    - remoteRef:
        key: &item Bifrost
        property: provider-unifi-api-key
      secretKey: UNIFI_NETWORK_API_KEY
    - remoteRef:
        key: *item
        property: provider-unifi-password
      secretKey: UNIFI_NETWORK_PASSWORD
    - remoteRef:
        key: *item
        property: provider-unifi-username
      secretKey: UNIFI_NETWORK_USERNAME
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unifi-network-mcp
