apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: songmirror
resources:
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../components/default-deny
  - ../../components/oauth2-proxy
  - ../../components/private-dns
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.SONGMIRROR_PUBLIC_URL
        options:
          delimiter: /
          index: 2
transformers:
  - ../../transformers/pocket-id-icon-private
  - ../../transformers/route-private
  - callback-alias.yaml
