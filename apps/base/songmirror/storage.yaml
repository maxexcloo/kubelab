apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  annotations:
    groupPattern: "568"
    permPattern: "0700"
    userPattern: "568"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music
  annotations:
    groupPattern: "568"
    permPattern: "0700"
    userPattern: "568"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path
