apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: linkwarden-database
  namespace: linkwarden
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:0fae0cb527912426a889ec0b21b9733e5b76fdc6ad8909914a6e8a6c8ba4f64b
  instances: 1
  bootstrap:
    initdb:
      database: linkwarden
      owner: linkwarden
      secret:
        name: linkwarden-database
  storage:
    size: 5Gi
    storageClass: local-path
