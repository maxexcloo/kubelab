apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"linkwarden"}'
    onepassword.excloo.dev/defaults: '{"username":"max@excloo.com"}'
    onepassword.excloo.dev/generate-fields: database-password,meili-master-key,nextauth-secret,password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: 37fmyulaj34v5ylihuophrd6ai
        property: database-password
      secretKey: database-password
    - remoteRef:
        key: 37fmyulaj34v5ylihuophrd6ai
        property: database-username
      secretKey: database-username
    - remoteRef:
        key: 37fmyulaj34v5ylihuophrd6ai
        property: provider-resend-api-key
      secretKey: api-key-resend
    - remoteRef:
        key: 37fmyulaj34v5ylihuophrd6ai
        property: keycloak-client-id
      secretKey: KEYCLOAK_CLIENT_ID
    - remoteRef:
        key: 37fmyulaj34v5ylihuophrd6ai
        property: keycloak-client-secret
      secretKey: KEYCLOAK_CLIENT_SECRET
    - remoteRef:
        key: 37fmyulaj34v5ylihuophrd6ai
        property: username
      secretKey: LOGIN_EMAIL
    - remoteRef:
        key: 37fmyulaj34v5ylihuophrd6ai
        property: password
      secretKey: LOGIN_PASSWORD
    - remoteRef:
        key: 37fmyulaj34v5ylihuophrd6ai
        property: meili-master-key
      secretKey: MEILI_MASTER_KEY
    - remoteRef:
        key: 37fmyulaj34v5ylihuophrd6ai
        property: nextauth-secret
      secretKey: NEXTAUTH_SECRET
    - remoteRef:
        key: 37fmyulaj34v5ylihuophrd6ai
        property: provider-openrouter-api-key
      secretKey: OPENROUTER_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: application
    template:
      engineVersion: v2
      data:
        DATABASE_URL: postgresql://{{ index . "database-username" | urlquery }}:{{ index . "database-password" | urlquery }}@linkwarden-database-rw:5432/linkwarden?sslmode=require
        EMAIL_SERVER: smtps://resend:{{ index . "api-key-resend" | urlquery }}@smtp.resend.com:465
        KEYCLOAK_CLIENT_ID: "{{ .KEYCLOAK_CLIENT_ID }}"
        KEYCLOAK_CLIENT_SECRET: "{{ .KEYCLOAK_CLIENT_SECRET }}"
        LOGIN_EMAIL: "{{ .LOGIN_EMAIL }}"
        LOGIN_PASSWORD: "{{ .LOGIN_PASSWORD }}"
        MEILI_MASTER_KEY: "{{ .MEILI_MASTER_KEY }}"
        NEXTAUTH_SECRET: "{{ .NEXTAUTH_SECRET }}"
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-database
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"linkwarden"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: 37fmyulaj34v5ylihuophrd6ai
        property: database-password
      secretKey: password
    - remoteRef:
        key: 37fmyulaj34v5ylihuophrd6ai
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: linkwarden-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
