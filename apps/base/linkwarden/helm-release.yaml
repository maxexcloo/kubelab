apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkwarden
  namespace: linkwarden
spec:
  interval: 30m
  releaseName: linkwarden
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.2.1
  values:
    controllers:
      linkwarden:
        strategy: Recreate
        containers:
          linkwarden:
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/linkwarden/linkwarden
              tag: v2.16.3@sha256:0664c28a039bda8ffa6663389e8536b2fc717219e329f85b83faca7efed3b144
            envFrom:
              - secretRef:
                  name: linkwarden
            probes:
              readiness:
                custom: true
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  tcpSocket:
                    port: 3000
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  tcpSocket:
                    port: 3000
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 50m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            env:
              BASE_URL: https://app.invalid
              NEXTAUTH_URL: https://app.invalid/api/v1/auth
              KEYCLOAK_ISSUER: https://identity.invalid
      meilisearch:
        strategy: Recreate
        containers:
          meilisearch:
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/getmeili/meilisearch
              tag: v1.54.3@sha256:e68913ab7d6f5b159529e472cfd362ce3c741fafd3c127961b2142abbe41b3c9
            env:
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    key: MEILI_MASTER_KEY
                    name: linkwarden
            probes:
              readiness:
                custom: true
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /health
                    port: 7700
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /health
                    port: 7700
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 20m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: linkwarden
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        advancedMounts:
          linkwarden:
            linkwarden:
              - path: /data/data
      meilisearch:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: local-path
        type: persistentVolumeClaim
        advancedMounts:
          meilisearch:
            meilisearch:
              - path: /meili_data
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        hostnames:
          - app.invalid
          - linkwarden.mbk.excloo.dev
        labels:
          app.kubernetes.io/name: linkwarden
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: linkwarden
                port: 3000
      public:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/pod-selector: app.kubernetes.io/name=linkwarden,app.kubernetes.io/controller=linkwarden
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_FILE_LINKWARDEN_KEY}}" }}'
          gethomepage.dev/widget.type: linkwarden
          gethomepage.dev/widget.url: https://app.invalid
        labels:
          app.kubernetes.io/name: linkwarden
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
        rules:
          - backendRefs:
              - name: linkwarden
                port: 3000
    service:
      linkwarden:
        controller: linkwarden
        ports:
          http:
            port: 3000
            protocol: HTTP
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
            protocol: HTTP
