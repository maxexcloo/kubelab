apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkwarden
  namespace: linkwarden
spec:
  interval: 30m
  releaseName: linkwarden
  suspend: true
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.1.0
  values:
    controllers:
      linkwarden:
        strategy: Recreate
        containers:
          linkwarden:
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/linkwarden/linkwarden
              tag: v2.16.1@sha256:6902e62a6d68e1906045310dbf9b2df7f3d784a7b2e9d0f02c23666023791634
            env:
              BASE_URL: https://links.excloo.com
              EMAIL_FROM: linkwarden@excloo.dev
              KEYCLOAK_CUSTOM_NAME: Excloo ID
              KEYCLOAK_ISSUER: https://id.excloo.com
              MEILI_HOST: http://linkwarden-meilisearch:7700
              NEXTAUTH_INTERNAL_URL: http://localhost:3000/api/v1/auth
              NEXTAUTH_URL: https://links.excloo.com/api/v1/auth
              NEXT_PUBLIC_EMAIL_PROVIDER: "true"
              NEXT_PUBLIC_KEYCLOAK_ENABLED: "true"
              OPENROUTER_MODEL: openrouter/auto
              PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
              PORT: "3000"
              TZ: Australia/Sydney
            envFrom:
              - secretRef:
                  name: linkwarden
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 50m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
      meilisearch:
        strategy: Recreate
        containers:
          meilisearch:
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/getmeili/meilisearch
              tag: v1.53.1@sha256:8d6643d86d71fad6ad3cba92cde7ccfce9e4d6c384bda67598eb553571c32431
            env:
              MEILI_HTTP_ADDR: 0.0.0.0:7700
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    key: MEILI_MASTER_KEY
                    name: linkwarden
              MEILI_NO_ANALYTICS: "true"
              MEILI_SERVER_PROVIDER: docker
              MEILI_UPGRADE_DB: "true"
              TZ: Australia/Sydney
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 20m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: linkwarden
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        advancedMounts:
          linkwarden:
            linkwarden:
              - path: /data/data
      meilisearch:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: local-path
        type: persistentVolumeClaim
        advancedMounts:
          meilisearch:
            meilisearch:
              - path: /meili_data
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      linkwarden:
        controller: linkwarden
        ports:
          http:
            port: 3000
            protocol: HTTP
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
            protocol: HTTP
