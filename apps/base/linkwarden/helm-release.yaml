apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              BASE_URL: https://app.invalid
              EMAIL_FROM: linkwarden@${mail_domain}
              KEYCLOAK_CUSTOM_NAME: Pocket ID
              KEYCLOAK_ISSUER: https://${identity_host}
              MEILI_HOST: "http://{{ .Release.Name }}-meilisearch:7700"
              NEXTAUTH_INTERNAL_URL: http://localhost:3000/api/v1/auth
              NEXTAUTH_URL: https://app.invalid/api/v1/auth
              NEXT_PUBLIC_EMAIL_PROVIDER: "true"
              NEXT_PUBLIC_KEYCLOAK_ENABLED: "true"
              OPENROUTER_MODEL: openrouter/auto
              PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
              PORT: "3000"
              TZ: ${time_zone}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/linkwarden/linkwarden
              tag: v2.16.3
            probes:
              liveness: null
              readiness: &ready
                type: TCP
              startup: *ready
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 50m
                memory: 512Mi
            securityContext:
              readOnlyRootFilesystem: null
      meilisearch:
        strategy: Recreate
        containers:
          meilisearch:
            env:
              MEILI_HTTP_ADDR: 0.0.0.0:7700
              MEILI_NO_ANALYTICS: "true"
              MEILI_SERVER_PROVIDER: docker
              MEILI_UPGRADE_DB: "true"
              TZ: ${time_zone}
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    key: MEILI_MASTER_KEY
                    name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/getmeili/meilisearch
              tag: v1.56.0
            probes:
              readiness:
                enabled: true
                path: /health
                type: HTTP
                spec:
                  timeoutSeconds: 5
              startup:
                enabled: true
                path: /health
                type: HTTP
                spec:
                  failureThreshold: 30
                  timeoutSeconds: 5
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 20m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
              - path: /data/data
      meilisearch:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: local-path
        type: persistentVolumeClaim
        advancedMounts:
          meilisearch:
            meilisearch:
              - path: /meili_data
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 3000
      public:
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: Bookmark Manager
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-linkwarden
          gethomepage.dev/name: &title Linkwarden
          gethomepage.dev/pod-selector: app.kubernetes.io/name=linkwarden,app.kubernetes.io/controller=linkwarden
          gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_LINKWARDEN_ACCESS_TOKEN}}" }}'
          gethomepage.dev/widget.type: linkwarden
          gethomepage.dev/widget.url: https://app.invalid
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: *title
        hostnames:
          - links.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 3000
    service:
      main:
        ports:
          http:
            port: 3000
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
            protocol: HTTP
