apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden
  namespace: linkwarden
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: linkwarden
        property: password
      secretKey: database-password
    - remoteRef:
        key: linkwarden
        property: email-server
      secretKey: EMAIL_SERVER
    - remoteRef:
        key: linkwarden
        property: keycloak-client-id
      secretKey: KEYCLOAK_CLIENT_ID
    - remoteRef:
        key: linkwarden
        property: keycloak-client-secret
      secretKey: KEYCLOAK_CLIENT_SECRET
    - remoteRef:
        key: linkwarden
        property: meili-master-key
      secretKey: MEILI_MASTER_KEY
    - remoteRef:
        key: linkwarden
        property: nextauth-secret
      secretKey: NEXTAUTH_SECRET
    - remoteRef:
        key: linkwarden
        property: openrouter-api-key
      secretKey: OPENROUTER_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: linkwarden
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgresql://linkwarden:{{ index . "database-password" | urlquery }}@linkwarden-database-rw:5432/linkwarden?sslmode=require'
        EMAIL_SERVER: "{{ .EMAIL_SERVER }}"
        KEYCLOAK_CLIENT_ID: "{{ .KEYCLOAK_CLIENT_ID }}"
        KEYCLOAK_CLIENT_SECRET: "{{ .KEYCLOAK_CLIENT_SECRET }}"
        MEILI_MASTER_KEY: "{{ .MEILI_MASTER_KEY }}"
        NEXTAUTH_SECRET: "{{ .NEXTAUTH_SECRET }}"
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-database
  namespace: linkwarden
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: linkwarden
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: linkwarden-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: linkwarden
