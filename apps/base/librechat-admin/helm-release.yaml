apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              API_SERVER_URL: http://librechat.librechat.svc.cluster.local:3080
              HOME: /tmp
              SESSION_COOKIE_SECURE: "true"
              TZ: ${time_zone}
              VITE_API_BASE_URL: https://librechat.invalid
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/clickhouse/librechat-admin-panel
              tag: 1.0.0
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 20m
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
    service:
      main:
        ports:
          http:
            port: 3000
