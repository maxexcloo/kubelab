apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: application
  labels:
    app.kubernetes.io/name: application
    gateway.excloo.dev/internal-alias: "true"
spec:
  hostnames:
    - librechat-admin.excloo.com
    - app.cluster.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: librechat-admin
          port: 3000
