apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: librechat-admin
  labels:
    app.kubernetes.io/name: librechat-admin
spec:
  hostnames:
    - librechat-admin.excloo.com
    - librechat-admin.${cluster_name}.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: librechat-admin
          port: 3000
