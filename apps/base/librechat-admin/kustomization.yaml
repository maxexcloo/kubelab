apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: librechat-admin
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - route.yaml
components:
  - ../../components/application
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
