apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: librechat-admin
resources:
  - admin-panel.yaml
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - route.yaml
replacements:
  - source:
      kind: HTTPRoute
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: PrivateDNSRecord
        fieldPaths:
          - spec.hostname
components:
  - ../../components/private-dns
