apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: LibreChat
        property: admin-panel-session-secret
      secretKey: SESSION_SECRET
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: application
