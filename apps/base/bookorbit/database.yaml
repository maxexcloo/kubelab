apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookorbit-database
  namespace: bookorbit
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:58d19a1edb30d42fc2be3470ac7719caa496a4f3a7f1289472d6c3f6b04c8fd1
  instances: 1
  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      secret:
        name: bookorbit-database
  storage:
    size: 5Gi
    storageClass: local-path
