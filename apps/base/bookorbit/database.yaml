apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookorbit-database
  namespace: bookorbit
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:79be0d10e78b7ac4520cf6c5db199a8bb7f6de53b3229f47e90cab5865528a0d
  instances: 1
  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      secret:
        name: bookorbit-database
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi
  storage:
    size: 5Gi
    storageClass: local-path
