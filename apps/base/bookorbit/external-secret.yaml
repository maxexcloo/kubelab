apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit
  namespace: bookorbit
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"bookorbit"}'
    onepassword.excloo.dev/defaults: '{"email":"admin@excloo.com","username":"admin"}'
    onepassword.excloo.dev/generate-fields: database-password,email-encryption-key,jwt-secret,migration-encryption-key,password,setup-bootstrap-token
    onepassword.excloo.dev/login: "true"
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: BookOrbit
        property: database-password
      secretKey: database-password
    - remoteRef:
        key: BookOrbit
        property: database-username
      secretKey: database-username
    - remoteRef:
        key: BookOrbit
        property: email-encryption-key
      secretKey: EMAIL_ENCRYPTION_KEY
    - remoteRef:
        key: BookOrbit
        property: email
      secretKey: LOGIN_EMAIL
    - remoteRef:
        key: BookOrbit
        property: jwt-secret
      secretKey: JWT_SECRET
    - remoteRef:
        key: BookOrbit
        property: migration-encryption-key
      secretKey: MIGRATION_ENCRYPTION_KEY
    - remoteRef:
        key: BookOrbit
        property: password
      secretKey: LOGIN_PASSWORD
    - remoteRef:
        key: BookOrbit
        property: setup-bootstrap-token
      secretKey: SETUP_BOOTSTRAP_TOKEN
    - remoteRef:
        key: BookOrbit
        property: username
      secretKey: LOGIN_USERNAME
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: bookorbit
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgresql://{{ index . "database-username" | urlquery }}:{{ index . "database-password" | urlquery }}@bookorbit-database-rw:5432/bookorbit?sslmode=require&uselibpqcompat=true'
        EMAIL_ENCRYPTION_KEY: "{{ .EMAIL_ENCRYPTION_KEY }}"
        JWT_SECRET: "{{ .JWT_SECRET }}"
        LOGIN_EMAIL: "{{ .LOGIN_EMAIL }}"
        LOGIN_PASSWORD: "{{ .LOGIN_PASSWORD }}"
        LOGIN_USERNAME: "{{ .LOGIN_USERNAME }}"
        MIGRATION_ENCRYPTION_KEY: "{{ .MIGRATION_ENCRYPTION_KEY }}"
        SETUP_BOOTSTRAP_TOKEN: "{{ .SETUP_BOOTSTRAP_TOKEN }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-database
  namespace: bookorbit
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"bookorbit"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: BookOrbit
        property: database-password
      secretKey: password
    - remoteRef:
        key: BookOrbit
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: bookorbit-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
