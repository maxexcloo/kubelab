apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit
  namespace: bookorbit
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: bookorbit
        property: password
      secretKey: database-password
    - remoteRef:
        key: bookorbit
        property: email-encryption-key
      secretKey: EMAIL_ENCRYPTION_KEY
    - remoteRef:
        key: bookorbit
        property: jwt-secret
      secretKey: JWT_SECRET
    - remoteRef:
        key: bookorbit
        property: migration-encryption-key
      secretKey: MIGRATION_ENCRYPTION_KEY
    - remoteRef:
        key: bookorbit
        property: setup-bootstrap-token
      secretKey: SETUP_BOOTSTRAP_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: bookorbit
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgresql://bookorbit:{{ index . "database-password" | urlquery }}@bookorbit-database-rw:5432/bookorbit?sslmode=require&uselibpqcompat=true'
        EMAIL_ENCRYPTION_KEY: "{{ .EMAIL_ENCRYPTION_KEY }}"
        JWT_SECRET: "{{ .JWT_SECRET }}"
        MIGRATION_ENCRYPTION_KEY: "{{ .MIGRATION_ENCRYPTION_KEY }}"
        SETUP_BOOTSTRAP_TOKEN: "{{ .SETUP_BOOTSTRAP_TOKEN }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-database
  namespace: bookorbit
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: bookorbit
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: bookorbit-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: bookorbit
