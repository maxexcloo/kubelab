apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookdrop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: bookorbit-bookdrop
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: books
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: bookorbit-books
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  annotations:
    groupPattern: "568"
    permPattern: "0700"
    userPattern: "568"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bookorbit-bookdrop
  labels:
    app.kubernetes.io/name: application
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /dataset-root.invalid/truenas-nvme/bookorbit/bookdrop
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - storage-node.invalid
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bookorbit-books
  labels:
    app.kubernetes.io/name: application
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /dataset-root.invalid/truenas-nvme/bookorbit/books
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - storage-node.invalid
