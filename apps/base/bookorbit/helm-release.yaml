apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookorbit
  namespace: bookorbit
spec:
  interval: 30m
  releaseName: bookorbit
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  values:
    controllers:
      bookorbit:
        strategy: Recreate
        containers:
          bookorbit:
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.4.0@sha256:99539be044c94f10fa5fba616cb08e1b128deb4996c975d181a950818a8632e4
            envFrom:
              - secretRef:
                  name: bookorbit
            probes:
              readiness:
                custom: true
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /api/v1/health
                    port: 3000
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /api/v1/health
                    port: 3000
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            env:
              APP_URL: https://app.invalid
              CLIENT_URL: https://app.invalid
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: bookorbit
    persistence:
      bookdrop:
        existingClaim: bookdrop
        type: persistentVolumeClaim
        globalMounts:
          - path: /books-drop
      books:
        existingClaim: books
        type: persistentVolumeClaim
        globalMounts:
          - path: /books
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: bookorbit
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: bookorbit
                port: 3000
      public:
        forceRename: bookorbit
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/href: https://app.invalid
        labels:
          app.kubernetes.io/name: bookorbit
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
    service:
      bookorbit:
        controller: bookorbit
        ports:
          http:
            port: 3000
            protocol: HTTP
