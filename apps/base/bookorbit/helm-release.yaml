apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookorbit
  namespace: bookorbit
spec:
  interval: 30m
  releaseName: bookorbit
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.2.1
  values:
    controllers:
      bookorbit:
        strategy: Recreate
        containers:
          bookorbit:
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.2.0@sha256:1020eef9f004be972ac60e79dd5f416129f0d3d91491b803aa8fa656acb2b6a6
            env:
              APP_DATA_PATH: /data
              APP_URL: https://books.excloo.com
              BOOK_DOCK_PATH: /books-drop
              CLIENT_URL: https://books.excloo.com
              LIBRARY_BROWSE_ROOT: /books
              PORT: "3000"
              TZ: Australia/Sydney
            envFrom:
              - secretRef:
                  name: bookorbit
            probes:
              readiness:
                custom: true
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /api/v1/health
                    port: 3000
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
                  httpGet:
                    path: /api/v1/health
                    port: 3000
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: bookorbit
    persistence:
      bookdrop:
        existingClaim: bookdrop
        type: persistentVolumeClaim
        globalMounts:
          - path: /books-drop
      books:
        existingClaim: books
        type: persistentVolumeClaim
        globalMounts:
          - path: /books
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        hostnames:
          - books.excloo.com
        labels:
          app.kubernetes.io/name: bookorbit
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: bookorbit
                port: 3000
      public:
        forceRename: bookorbit
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: Digital Library
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/href: https://books.excloo.com
          gethomepage.dev/icon: bookorbit
          gethomepage.dev/name: BookOrbit
        hostnames:
          - books.excloo.com
        labels:
          app.kubernetes.io/name: bookorbit
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
    service:
      bookorbit:
        controller: bookorbit
        ports:
          http:
            port: 3000
            protocol: HTTP
