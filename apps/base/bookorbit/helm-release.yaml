apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              APP_DATA_PATH: /data
              APP_URL: https://app.invalid
              BOOK_DOCK_PATH: /books-drop
              CLIENT_URL: https://app.invalid
              LIBRARY_BROWSE_ROOT: /books
              PORT: "3000"
              TZ: Australia/Sydney
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.4.0
            probes:
              liveness: null
              readiness: &ready
                path: /api/v1/health
              startup: *ready
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 256Mi
            securityContext:
              readOnlyRootFilesystem: null
    persistence:
      bookdrop:
        existingClaim: bookdrop
        type: persistentVolumeClaim
        globalMounts:
          - path: /books-drop
      books:
        existingClaim: books
        type: persistentVolumeClaim
        globalMounts:
          - path: /books
      data:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /data
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: 3000
      public:
        forceRename: "{{ .Release.Name }}"
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: Digital Library
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: bookorbit
          gethomepage.dev/name: &title BookOrbit
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: *title
        hostnames:
          - books.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 3000
