apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit
  namespace: bookorbit
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"bookorbit"}'
    onepassword.excloo.dev/defaults: '{"email":"admin@excloo.com","username":"admin"}'
    onepassword.excloo.dev/generate-fields: database-password,email-encryption-key,jwt-secret,migration-encryption-key,password,setup-bootstrap-token
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: BookOrbit
        property: database-password
      secretKey: database-password
    - remoteRef:
        key: BookOrbit
        property: database-username
      secretKey: database-username
    - remoteRef:
        key: BookOrbit
        property: email-encryption-key
      secretKey: EMAIL_ENCRYPTION_KEY
    - remoteRef:
        key: BookOrbit
        property: email
      secretKey: LOGIN_EMAIL
    - remoteRef:
        key: BookOrbit
        property: jwt-secret
      secretKey: JWT_SECRET
    - remoteRef:
        key: BookOrbit
        property: migration-encryption-key
      secretKey: MIGRATION_ENCRYPTION_KEY
    - remoteRef:
        key: BookOrbit
        property: password
      secretKey: LOGIN_PASSWORD
    - remoteRef:
        key: BookOrbit
        property: setup-bootstrap-token
      secretKey: SETUP_BOOTSTRAP_TOKEN
    - remoteRef:
        key: BookOrbit
        property: username
      secretKey: LOGIN_USERNAME
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: bookorbit
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgresql://{{ index . "database-username" | urlquery }}:{{ index . "database-password" | urlquery }}@bookorbit-database-rw:5432/bookorbit?sslmode=require&uselibpqcompat=true'
        EMAIL_ENCRYPTION_KEY: "{{ .EMAIL_ENCRYPTION_KEY }}"
        JWT_SECRET: "{{ .JWT_SECRET }}"
        LOGIN_EMAIL: "{{ .LOGIN_EMAIL }}"
        LOGIN_PASSWORD: "{{ .LOGIN_PASSWORD }}"
        LOGIN_USERNAME: "{{ .LOGIN_USERNAME }}"
        MIGRATION_ENCRYPTION_KEY: "{{ .MIGRATION_ENCRYPTION_KEY }}"
        SETUP_BOOTSTRAP_TOKEN: "{{ .SETUP_BOOTSTRAP_TOKEN }}"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-database
  namespace: bookorbit
  annotations:
    onepassword.excloo.dev/constants: '{"database-username":"bookorbit"}'
    onepassword.excloo.dev/generate-fields: database-password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: BookOrbit
        property: database-password
      secretKey: password
    - remoteRef:
        key: BookOrbit
        property: database-username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: bookorbit-database
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        password: "{{ .password }}"
        username: "{{ .username }}"
---
apiVersion: v1
kind: Namespace
metadata:
  name: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
    gateway.excloo.dev/public-access: "true"
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookorbit
  namespace: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bookorbit
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bookorbit-database
  namespace: bookorbit
  labels:
    app.kubernetes.io/name: bookorbit
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backup
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bookorbit
      ports:
        - port: 5432
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
          protocol: TCP
  podSelector:
    matchLabels:
      cnpg.io/cluster: bookorbit-database
  policyTypes:
    - Ingress
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup
  namespace: bookorbit
  annotations:
    k8s-sigs.io/nfs-directory-gid: "26"
    k8s-sigs.io/nfs-directory-mode: "0700"
    k8s-sigs.io/nfs-directory-uid: "26"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: truenas-nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookdrop
  namespace: bookorbit
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: bookorbit-bookdrop
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: books
  namespace: bookorbit
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: bookorbit-books
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: bookorbit
  annotations:
    k8s-sigs.io/nfs-directory-gid: "568"
    k8s-sigs.io/nfs-directory-mode: "0700"
    k8s-sigs.io/nfs-directory-uid: "568"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: truenas-nfs
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bookorbit-bookdrop
  labels:
    app.kubernetes.io/name: bookorbit
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Gi
  mountOptions:
    - nfsvers=4.2
  nfs:
    path: /mnt/truenas-nvme/bookorbit/bookdrop
    server: 10.4.0.3
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bookorbit-books
  labels:
    app.kubernetes.io/name: bookorbit
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Gi
  mountOptions:
    - nfsvers=4.2
  nfs:
    path: /mnt/truenas-nvme/bookorbit/books
    server: 10.4.0.3
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: automation.excloo.dev/v1alpha1
kind: ResendKey
metadata:
  name: resend
  namespace: bookorbit
spec:
  displayName: BookOrbit
