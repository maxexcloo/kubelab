apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: papra
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
  - pocket-id.yaml
  - storage.yaml
components:
  - ../../components/application
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
  - ../../components/private-dns
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
replacements:
  - source:
      kind: PocketIDClient
      fieldPath: spec.client.id
    targets:
      - select:
          kind: ExternalSecret
          name: papra
        fieldPaths:
          - spec.target.template.data.AUTH_PROVIDERS_CUSTOMS
        options:
          delimiter: '"'
          # The client ID is the second quoted argument in the provider template.
          index: 3
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.APP_BASE_URL
        options:
          delimiter: /
          index: 2
transformers:
  - ../../transformers/route-private
