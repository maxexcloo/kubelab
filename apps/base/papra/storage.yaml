apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  annotations:
    k8s-sigs.io/nfs-directory-gid: "568"
    k8s-sigs.io/nfs-directory-mode: "0700"
    k8s-sigs.io/nfs-directory-uid: "568"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: truenas-nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retained-data
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: papra-data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: papra-data
  labels:
    app.kubernetes.io/name: application
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 1Gi
  mountOptions:
    - nfsvers=4.2
  nfs:
    path: /mnt/truenas-nvme/papra
    server: storage.invalid
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
