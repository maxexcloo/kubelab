apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  annotations:
    groupPattern: "568"
    permPattern: "0700"
    userPattern: "568"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retained-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: papra-data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: papra-data
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /dataset-root.invalid/truenas-nvme/papra
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - storage-node.invalid
