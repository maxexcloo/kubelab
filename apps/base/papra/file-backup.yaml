apiVersion: batch/v1
kind: CronJob
metadata:
  name: file-backup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              volumeMounts:
                - name: source
                  mountPath: /source
                  $patch: delete
                - name: source
                  mountPath: /source/data
                  readOnly: true
                - name: ingestion
                  mountPath: /source/ingestion
                  readOnly: true
                  subPath: ingestion
          volumes:
            - name: source
              persistentVolumeClaim:
                claimName: retained-data
                readOnly: true
            - name: ingestion
              persistentVolumeClaim:
                claimName: data
                readOnly: true
