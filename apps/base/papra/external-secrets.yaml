apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: papra
  annotations:
    onepassword.excloo.dev/generate-fields: auth-secret
spec:
  data:
    - remoteRef:
        key: &item Papra
        property: auth-secret
      secretKey: AUTH_SECRET
    - remoteRef:
        key: Bifrost
        property: virtual-key-papra
      secretKey: OPENAI_API_KEY
    - remoteRef:
        key: *item
        property: provider-resend-api-key
      secretKey: RESEND_API_KEY
    - remoteRef:
        key: *item
        property: oidc-client-id
      secretKey: oidc-client-id
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: oidc-client-secret
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: papra
    template:
      data:
        AUTH_PROVIDERS_CUSTOMS: >-
          {{ list (dict "clientId" (index . "oidc-client-id") "clientSecret" (index . "oidc-client-secret") "discoveryUrl" "https://${identity_host}/.well-known/openid-configuration" "pkce" true "providerId" "pocket-id" "providerName" "Excloo ID" "scopes" (list "openid" "profile" "email") "type" "oidc") | toJson }}
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        OPENAI_API_KEY: "{{ .OPENAI_API_KEY }}"
        RESEND_API_KEY: "{{ .RESEND_API_KEY }}"
