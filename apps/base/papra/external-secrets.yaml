apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/generate-fields: auth-secret
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item Papra
        property: auth-secret
      secretKey: AUTH_SECRET
    - remoteRef:
        key: *item
        property: provider-openrouter-api-key
      secretKey: OPENROUTER_API_KEY
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: oidc-client-secret
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
    template:
      engineVersion: v2
      data:
        AUTH_PROVIDERS_CUSTOMS: >-
          {{ list (dict "clientId" "client.invalid" "clientSecret" (index . "oidc-client-secret") "discoveryUrl" "https://identity.invalid/.well-known/openid-configuration" "pkce" true "providerId" "pocket-id" "providerName" "Excloo ID" "scopes" (list "openid" "profile" "email") "type" "oidc") | toJson }}
        AUTH_SECRET: "{{ .AUTH_SECRET }}"
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
