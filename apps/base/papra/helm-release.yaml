apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: papra
  namespace: papra
spec:
  interval: 30m
  releaseName: papra
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.2.1
  values:
    controllers:
      papra:
        strategy: Recreate
        containers:
          papra:
            envFrom:
              - secretRef:
                  name: papra
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/papra-hq/papra
              tag: 26.7.0-rootless@sha256:bf4a66e776d0a40d71543747a2e17af800204b4a81d19f7951b8552c8032dbeb
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 21221
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 21221
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  httpGet:
                    path: /api/health
                    port: 21221
                  periodSeconds: 2
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 20m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            env:
              APP_BASE_URL: https://app.invalid
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: papra
    persistence:
      data:
        existingClaim: retained-data
        type: persistentVolumeClaim
        globalMounts:
          - path: /app/app-data
      ingestion:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /app/ingestion
            subPath: ingestion
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        annotations:
          gethomepage.dev/href: https://app.invalid
        labels:
          app.kubernetes.io/name: papra
        parentRefs:
          - name: private
            namespace: networking
    service:
      papra:
        controller: papra
        ports:
          http:
            port: 21221
            protocol: HTTP
