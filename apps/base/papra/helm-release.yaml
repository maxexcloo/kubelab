apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            env:
              AI_DEFAULT_MODEL: openrouter://openrouter/auto
              AI_IS_ENABLED: "true"
              APP_BASE_URL: https://app.invalid
              AUTO_TAGGING_ENABLED: "true"
              DATABASE_URL: file:/app/app-data/db/db.sqlite
              DOCUMENT_STORAGE_DRIVER: filesystem
              DOCUMENT_STORAGE_FILESYSTEM_ROOT: /app/app-data/documents
              HOME: /tmp
              INGESTION_FOLDER_ERROR_FOLDER_PATH: /app/ingestion/ingestion-error
              INGESTION_FOLDER_IS_ENABLED: "true"
              INGESTION_FOLDER_POST_PROCESSING_MOVE_FOLDER_PATH: /app/ingestion/ingestion-done
              INGESTION_FOLDER_ROOT_PATH: /app/ingestion
              IS_FREE_PLAN_UNLIMITED: "true"
              PORT: "21221"
              PROCESS_MODE: all
              TZ: Australia/Sydney
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/papra-hq/papra
              tag: 26.7.0-rootless@sha256:bf4a66e776d0a40d71543747a2e17af800204b4a81d19f7951b8552c8032dbeb
            probes:
              liveness: &health
                path: /api/health
              readiness: *health
              startup: *health
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 20m
                memory: 512Mi
    persistence:
      data:
        existingClaim: retained-data
        type: persistentVolumeClaim
        globalMounts:
          - path: /app/app-data
      ingestion:
        existingClaim: data
        type: persistentVolumeClaim
        globalMounts:
          - path: /app/ingestion
            subPath: ingestion
    route:
      private:
        annotations:
          gethomepage.dev/description: Document Management
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-papra
          gethomepage.dev/name: &title Papra
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: k3c4sjg26qsapc3g7it6f7bcl4
          onepassword.excloo.dev/title: *title
        hostnames:
          - papra.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 21221
