apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openspeedtest
  namespace: openspeedtest
spec:
  interval: 30m
  chart:
    spec:
      chart: openspeedtest
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: openspeedtest
        namespace: flux-system
      version: 0.1.2
  releaseName: openspeedtest
  values:
    image:
      repository: openspeedtest/latest
      pullPolicy: IfNotPresent
      tag: v2.0.6
    serviceAccount:
      create: false
    service:
      type: ClusterIP
      port: 80
      annotations:
        gethomepage.dev/description: Network Speed Test
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/icon: openspeedtest
        gethomepage.dev/name: OpenSpeedTest
    podSecurityContext:
      runAsGroup: 101
      runAsUser: 101
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 512Mi
