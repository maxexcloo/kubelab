apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: application
  namespace: openspeedtest
  annotations:
    gethomepage.dev/description: Network Speed Test
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Operations
    gethomepage.dev/href: https://app.invalid
    gethomepage.dev/icon: sh-openspeedtest
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=app.invalid
    monitoring.excloo.dev/enabled: "true"
  labels:
    app.kubernetes.io/name: app.invalid
spec:
  hostnames:
    - app.${cluster_name}.excloo.dev
  parentRefs:
    - name: private
      namespace: networking
  rules:
    - backendRefs:
        - name: app.invalid
          port: 80
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: openspeedtest-buffering
