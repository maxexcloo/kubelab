apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
  namespace: homepage
  annotations:
    onepassword.excloo.dev/defaults: '{"provider-cloudflare-api-token":"","provider-home-assistant-access-token":"","provider-immich-api-key":"","provider-linkwarden-access-token":"","provider-miniflux-api-key":"","provider-syncthing-api-key":"","provider-tailscale-api-token":"","provider-truenas-api-key":"","provider-unifi-api-key":""}'
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &beszel Beszel
        property: password
      secretKey: HOMEPAGE_VAR_BESZEL_PASSWORD
    - remoteRef:
        key: *beszel
        property: username
      secretKey: HOMEPAGE_VAR_BESZEL_USERNAME
    - remoteRef:
        key: &grafana Grafana
        property: password
      secretKey: HOMEPAGE_VAR_GRAFANA_PASSWORD
    - remoteRef:
        key: *grafana
        property: username
      secretKey: HOMEPAGE_VAR_GRAFANA_USERNAME
  # Every Homepage item field becomes a variable, e.g. provider-truenas-api-key
  # is HOMEPAGE_VAR_TRUENAS_API_KEY; shared app items stay field-scoped above.
  dataFrom:
    - extract:
        key: Homepage
      rewrite:
        - regexp:
            source: ^provider-
            target: ""
        - transform:
            template: HOMEPAGE_VAR_{{ .value | upper | replace "-" "_" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-infrastructure
  namespace: homepage
  annotations:
    onepassword.excloo.dev/item: &item Infrastructure Inventory
    onepassword.excloo.dev/login-item: Homepage
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: *item
        property: notesPlain
      secretKey: inventory.json
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-infrastructure
