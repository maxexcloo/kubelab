apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
  namespace: homepage
  annotations:
    onepassword.excloo.dev/defaults: '{"provider-home-assistant-access-token":"","provider-immich-api-key":"","provider-karakeep-api-key":"","provider-miniflux-api-key":"","provider-tailscale-api-token":"","provider-unifi-api-key":""}'
spec:
  data:
    - remoteRef:
        key: &beszel Beszel
        property: password
      secretKey: HOMEPAGE_VAR_BESZEL_PASSWORD
    - remoteRef:
        key: *beszel
        property: username
      secretKey: HOMEPAGE_VAR_BESZEL_USERNAME
    - remoteRef:
        key: Cloudflare Tunnel Monitoring
        property: password
      secretKey: HOMEPAGE_VAR_CLOUDFLARE_API_TOKEN
    - remoteRef:
        key: &grafana Grafana
        property: password
      secretKey: HOMEPAGE_VAR_GRAFANA_PASSWORD
    - remoteRef:
        key: *grafana
        property: username
      secretKey: HOMEPAGE_VAR_GRAFANA_USERNAME
    - remoteRef:
        key: Syncthing (syd-saturn)
        property: api-key
      secretKey: HOMEPAGE_VAR_SYNCTHING_SATURN_API_KEY
    - remoteRef:
        key: Syncthing (syd-venus)
        property: api-key
      secretKey: HOMEPAGE_VAR_SYNCTHING_VENUS_API_KEY
    - remoteRef:
        key: TrueNAS Monitoring
        property: password
      secretKey: HOMEPAGE_VAR_TRUENAS_API_KEY
  dataFrom:
    - extract:
        key: Homepage
      rewrite:
        - regexp:
            source: ^provider-
            target: ""
        - transform:
            template: HOMEPAGE_VAR_{{ .value | upper | replace "-" "_" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-infrastructure
  namespace: homepage
  annotations:
    onepassword.excloo.dev/item: &item Infrastructure Inventory
    onepassword.excloo.dev/login-item: Homepage
spec:
  data:
    - remoteRef:
        key: *item
        property: notesPlain
      secretKey: inventory.json
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homepage-infrastructure
