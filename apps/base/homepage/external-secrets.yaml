apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
  namespace: homepage
  annotations:
    onepassword.excloo.dev/defaults: '{"provider-cloudflare-api-token":"","provider-home-assistant-access-token":"","provider-immich-api-key":"","provider-linkwarden-access-token":"","provider-miniflux-api-key":"","provider-syncthing-api-key":"","provider-tailscale-api-token":"","provider-truenas-api-key":"","provider-unifi-api-key":""}'
    onepassword.excloo.dev/remove-fields: grafana-syd-password,grafana-syd-username
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &beszel Beszel
        property: password
      secretKey: beszel-password
    - remoteRef:
        key: *beszel
        property: username
      secretKey: beszel-username
    - remoteRef:
        key: &homepage Homepage
        property: provider-cloudflare-api-token
      secretKey: cloudflare-key
    - remoteRef:
        key: &grafana Grafana
        property: password
      secretKey: grafana-syd-password
    - remoteRef:
        key: *grafana
        property: username
      secretKey: grafana-syd-username
    - remoteRef:
        key: *homepage
        property: provider-home-assistant-access-token
      secretKey: home-assistant-key
    - remoteRef:
        key: *homepage
        property: provider-immich-api-key
      secretKey: immich-key
    - remoteRef:
        key: *homepage
        property: provider-linkwarden-access-token
      secretKey: linkwarden-key
    - remoteRef:
        key: *homepage
        property: provider-miniflux-api-key
      secretKey: miniflux-key
    - remoteRef:
        key: *homepage
        property: provider-syncthing-api-key
      secretKey: syncthing-key
    - remoteRef:
        key: *homepage
        property: provider-tailscale-api-token
      secretKey: tailscale-key
    - remoteRef:
        key: *homepage
        property: provider-truenas-api-key
      secretKey: truenas-key
    - remoteRef:
        key: *homepage
        property: provider-unifi-api-key
      secretKey: unifi-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: homepage
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-infrastructure
  namespace: homepage
  annotations:
    onepassword.excloo.dev/item: &item Infrastructure Inventory
    onepassword.excloo.dev/login-item: Homepage
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: *item
        property: notesPlain
      secretKey: inventory.json
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: homepage-infrastructure
