apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
  namespace: homepage
  annotations:
    onepassword.excloo.dev/defaults: '{"provider-cloudflare-api-token":"","provider-home-assistant-access-token":"","provider-immich-api-key":"","provider-linkwarden-access-token":"","provider-miniflux-api-key":"","provider-syncthing-api-key":"","provider-tailscale-api-token":"","provider-truenas-api-key":"","provider-unifi-api-key":""}'
    onepassword.excloo.dev/remove-fields: grafana-syd-password,grafana-syd-username
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: l6ndlsmefn6gafyr7cfk3u24gm
        property: password
      secretKey: beszel-password
    - remoteRef:
        key: l6ndlsmefn6gafyr7cfk3u24gm
        property: username
      secretKey: beszel-username
    - remoteRef:
        key: 2yyv3pzwee6gstpq4n6hvklhy4
        property: provider-cloudflare-api-token
      secretKey: cloudflare-key
    - remoteRef:
        key: mqtqi77tr25d7zzz27hnbkktqe
        property: password
      secretKey: grafana-syd-password
    - remoteRef:
        key: mqtqi77tr25d7zzz27hnbkktqe
        property: username
      secretKey: grafana-syd-username
    - remoteRef:
        key: 2yyv3pzwee6gstpq4n6hvklhy4
        property: provider-home-assistant-access-token
      secretKey: home-assistant-key
    - remoteRef:
        key: 2yyv3pzwee6gstpq4n6hvklhy4
        property: provider-immich-api-key
      secretKey: immich-key
    - remoteRef:
        key: 2yyv3pzwee6gstpq4n6hvklhy4
