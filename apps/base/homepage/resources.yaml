      secretKey: linkwarden-key
    - remoteRef:
        key: 2yyv3pzwee6gstpq4n6hvklhy4
        property: provider-miniflux-api-key
      secretKey: miniflux-key
    - remoteRef:
        key: 2yyv3pzwee6gstpq4n6hvklhy4
        property: provider-syncthing-api-key
