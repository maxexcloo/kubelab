    name: onepassword
  target:
    creationPolicy: Owner
    name: homepage
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-infrastructure
  namespace: homepage
  annotations:
    onepassword.excloo.dev/item: 3plwv6rsgl2hcz5j7tf7gyj7je
    onepassword.excloo.dev/login-item: 2yyv3pzwee6gstpq4n6hvklhy4
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: 3plwv6rsgl2hcz5j7tf7gyj7je
        property: notesPlain
      secretKey: inventory.json
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: homepage-infrastructure
---
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
    gateway.excloo.dev/private-access: "true"
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homepage
  policyTypes:
    - Ingress
