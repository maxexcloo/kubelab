apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
  namespace: homepage
  annotations:
    onepassword.excloo.dev/defaults: '{"cloudflare-key":"","grafana-syd-password":"","grafana-syd-username":"","home-assistant-key":"","immich-key":"","linkwarden-key":"","miniflux-key":"","syncthing-key":"","tailscale-key":"","truenas-key":"","unifi-key":""}'
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: Beszel
        property: password
      secretKey: beszel-password
    - remoteRef:
        key: Beszel
        property: username
      secretKey: beszel-username
    - remoteRef:
        key: Homepage
        property: cloudflare-key
      secretKey: cloudflare-key
    - remoteRef:
        key: Grafana
        property: password
      secretKey: grafana-mbk-password
    - remoteRef:
        key: Grafana
        property: username
      secretKey: grafana-mbk-username
    - remoteRef:
        key: Homepage
        property: grafana-syd-password
      secretKey: grafana-syd-password
    - remoteRef:
        key: Homepage
        property: grafana-syd-username
      secretKey: grafana-syd-username
    - remoteRef:
        key: Homepage
        property: home-assistant-key
      secretKey: home-assistant-key
    - remoteRef:
        key: Homepage
        property: immich-key
      secretKey: immich-key
    - remoteRef:
        key: Homepage
        property: linkwarden-key
      secretKey: linkwarden-key
    - remoteRef:
        key: Homepage
        property: miniflux-key
      secretKey: miniflux-key
    - remoteRef:
        key: Homepage
        property: syncthing-key
      secretKey: syncthing-key
    - remoteRef:
        key: Homepage
        property: tailscale-key
      secretKey: tailscale-key
    - remoteRef:
        key: Homepage
        property: truenas-key
      secretKey: truenas-key
    - remoteRef:
        key: Homepage
        property: unifi-key
      secretKey: unifi-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: homepage
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-infrastructure
  namespace: homepage
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: Infrastructure Inventory
        property: notesPlain
      secretKey: inventory.json
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: homepage-infrastructure
---
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
    gateway.excloo.dev/private-access: "true"
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homepage
  policyTypes:
    - Ingress
