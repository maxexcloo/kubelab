apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage-inventory
  namespace: homepage
spec:
  # Reconcile inventory separately so apps can use the last published ConfigMap.
  interval: 5m
  path: ./apps/base/homepage/inventory
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
