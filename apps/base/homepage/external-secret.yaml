apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
  namespace: homepage
  annotations:
    onepassword.excloo.dev/defaults: '{"beszel-password":"","beszel-username":"admin@excloo.com","home-assistant-key":"","immich-key":"","linkwarden-key":"","miniflux-key":"","tailscale-key":"","truenas-key":"","unifi-key":""}'
    onepassword.excloo.dev/migrate-fields: '{"tailscale_homepage_widget_key":"tailscale-key"}'
    onepassword.excloo.dev/remove-fields: tailscale_homepage_widget_key
spec:
  refreshInterval: 1h
  dataFrom:
    - extract:
        key: Homepage
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: homepage
    template:
      engineVersion: v2
      data:
        HOMEPAGE_VAR_BESZEL_PASSWORD: '{{ get . "beszel-password" | default "" }}'
        HOMEPAGE_VAR_BESZEL_USERNAME: '{{ get . "beszel-username" | default "" }}'
        HOMEPAGE_VAR_HOME_ASSISTANT_KEY: '{{ get . "home-assistant-key" | default "" }}'
        HOMEPAGE_VAR_IMMICH_KEY: '{{ get . "immich-key" | default "" }}'
        HOMEPAGE_VAR_LINKWARDEN_KEY: '{{ get . "linkwarden-key" | default "" }}'
        HOMEPAGE_VAR_MINIFLUX_KEY: '{{ get . "miniflux-key" | default "" }}'
        HOMEPAGE_VAR_TAILSCALE_KEY: '{{ get . "tailscale-key" | default "" }}'
        HOMEPAGE_VAR_TRUENAS_KEY: '{{ get . "truenas-key" | default "" }}'
        HOMEPAGE_VAR_UNIFI_KEY: '{{ get . "unifi-key" | default "" }}'
