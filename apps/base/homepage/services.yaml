    - Zigbee2MQTT:
        description: Zigbee Coordinator
        href: homelab://mbk/hass/management/45df7312_zigbee2mqtt
        icon: sh-zigbee2mqtt
- Infrastructure:
    - Netboot:
        description: Network Boot Server
        href: &netboot homelab://mbk/kimbap/netboot
        icon: sh-netboot-xyz
        siteMonitor: *netboot
    - Syncthing:
        description: File Synchronisation
        href: &syncthing homelab://mbk/kimbap/syncthing
        icon: sh-syncthing
