        widget:
          enablePools: true
          key: "{{HOMEPAGE_FILE_TRUENAS_KEY}}"
          type: truenas
          url: *truenas
          version: 2
    - UniFi:
        description: Network Controller
        href: &unifi homelab://mbk/gateway/management
        icon: sh-ubiquiti-unifi
        siteMonitor: *unifi
        widget:
          key: "{{HOMEPAGE_FILE_UNIFI_KEY}}"
          type: unifi
          url: *unifi
- Operations:
    - Gatus:
        description: Health Monitoring & Status Page • Fly
        href: &gatus homelab-dns://excloo-gatus.fly.dev
        icon: sh-gatus
        siteMonitor: *gatus
        widget:
