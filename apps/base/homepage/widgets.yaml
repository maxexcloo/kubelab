# Node names, Ready state and usage come from the local Kubernetes API and metrics-server.
- kubernetes:
    cluster:
      cpu: true
      label: Cluster
      memory: true
      show: true
      showLabel: true
    nodes:
      cpu: true
      memory: true
      show: true
      showLabel: true
- search:
    provider: google
    target: _blank
# Weather, then the time over the date at the right-hand end.
- openmeteo:
    label: Sydney
    latitude: -33.8688
    longitude: 151.2093
    units: metric
- datetime:
    locale: en-AU
    text_size: xl
    format:
      hour: 2-digit
      hourCycle: h23
      minute: 2-digit
- datetime:
    locale: en-AU
    text_size: xs
    format:
      day: numeric
      month: short
      weekday: short
