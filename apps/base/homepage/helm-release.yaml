apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 30m
  releaseName: homepage
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.1.0
  values:
    controllers:
      homepage:
        containers:
          homepage:
            env:
              HOMEPAGE_ALLOWED_HOSTS: homepage.mbk.excloo.dev
              PGID: "1000"
              PUID: "1000"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/gethomepage/homepage
              tag: v2.0.0
            probes:
              liveness:
                enabled: true
                path: /api/healthcheck
                port: 3000
                type: HTTP
              readiness:
                enabled: true
                path: /api/healthcheck
                port: 3000
                type: HTTP
              startup:
                enabled: true
                path: /api/healthcheck
                port: 3000
                type: HTTP
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        serviceAccount:
          identifier: homepage
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: homepage
    persistence:
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
      config:
        name: homepage
        type: configMap
        advancedMounts:
          homepage:
            homepage:
              - path: /app/config/bookmarks.yaml
                readOnly: true
                subPath: bookmarks.yaml
              - path: /app/config/docker.yaml
                readOnly: true
                subPath: docker.yaml
              - path: /app/config/kubernetes.yaml
                readOnly: true
                subPath: kubernetes.yaml
              - path: /app/config/services.yaml
                readOnly: true
                subPath: services.yaml
              - path: /app/config/settings.yaml
                readOnly: true
                subPath: settings.yaml
              - path: /app/config/widgets.yaml
                readOnly: true
                subPath: widgets.yaml
      config-directory:
        type: emptyDir
        globalMounts:
          - path: /app/config
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      homepage:
        controller: homepage
        ports:
          http:
            port: 3000
            protocol: HTTP
    serviceAccount:
      homepage:
        automountServiceAccountToken: true
        forceRename: homepage
