apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 30m
  releaseName: homepage
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.1.0
  values:
    controllers:
      homepage:
        containers:
          homepage:
            env:
              HOMEPAGE_ALLOWED_HOSTS: home.excloo.com,homepage.mbk.excloo.dev
              HOMEPAGE_VAR_CLUSTER: mbk
              PGID: "1000"
              PUID: "1000"
            envFrom:
              - secretRef:
                  name: homepage
                  optional: true
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/gethomepage/homepage
              tag: v2.0.0
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: homepage.mbk.excloo.dev
              readiness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: homepage.mbk.excloo.dev
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: homepage.mbk.excloo.dev
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        serviceAccount:
          identifier: homepage
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: homepage
    persistence:
      background:
        name: homepage-background
        type: configMap
        advancedMounts:
          homepage:
            homepage:
              - path: /app/public/images/background.jpg
                readOnly: true
                subPath: background.jpg
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
      config:
        name: homepage
        type: configMap
        advancedMounts:
          homepage:
            homepage:
              - path: /app/config/bookmarks.yaml
                readOnly: true
                subPath: bookmarks.yaml
              - path: /app/config/custom.css
                readOnly: true
                subPath: custom.css
              - path: /app/config/docker.yaml
                readOnly: true
                subPath: docker.yaml
              - path: /app/config/kubernetes.yaml
                readOnly: true
                subPath: kubernetes.yaml
              - path: /app/config/services.yaml
                readOnly: true
                subPath: services.yaml
              - path: /app/config/settings.yaml
                readOnly: true
                subPath: settings.yaml
              - path: /app/config/widgets.yaml
                readOnly: true
                subPath: widgets.yaml
      config-directory:
        type: emptyDir
        globalMounts:
          - path: /app/config
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      homepage:
        controller: homepage
        ports:
          http:
            port: 3000
            protocol: HTTP
    serviceAccount:
      homepage:
        automountServiceAccountToken: true
        forceRename: homepage
    route:
      main:
        annotations:
          gethomepage.dev/description: Application Dashboard
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Applications
          gethomepage.dev/href: https://home.excloo.com
          gethomepage.dev/icon: homepage
          gethomepage.dev/name: Homepage
          gethomepage.dev/siteMonitor: https://home.excloo.com
        hostnames:
          - home.excloo.com
          - homepage.mbk.excloo.dev
        labels:
          app.kubernetes.io/name: homepage
        parentRefs:
          - name: private
            namespace: networking
