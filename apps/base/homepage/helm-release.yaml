apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 30m
  releaseName: homepage
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.2.1
  values:
    controllers:
      homepage:
        containers:
          homepage:
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/gethomepage/homepage
              tag: v2.4.0
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: alias.invalid
              readiness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: alias.invalid
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: alias.invalid
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            env:
              HOMEPAGE_ALLOWED_HOSTS: app.invalid,alias.invalid
              HOMEPAGE_FILE_BESZEL_PASSWORD: /secrets/beszel-password
              HOMEPAGE_FILE_BESZEL_USERNAME: /secrets/beszel-username
              HOMEPAGE_FILE_CLOUDFLARE_KEY: /secrets/cloudflare-key
              HOMEPAGE_FILE_GRAFANA_MBK_PASSWORD: /secrets/grafana-mbk-password
              HOMEPAGE_FILE_GRAFANA_MBK_USERNAME: /secrets/grafana-mbk-username
              HOMEPAGE_FILE_GRAFANA_SYD_PASSWORD: /secrets/grafana-syd-password
              HOMEPAGE_FILE_GRAFANA_SYD_USERNAME: /secrets/grafana-syd-username
              HOMEPAGE_FILE_HOME_ASSISTANT_KEY: /secrets/home-assistant-key
              HOMEPAGE_FILE_IMMICH_KEY: /secrets/immich-key
              HOMEPAGE_FILE_LINKWARDEN_KEY: /secrets/linkwarden-key
              HOMEPAGE_FILE_MINIFLUX_KEY: /secrets/miniflux-key
              HOMEPAGE_FILE_SYNCTHING_KEY: /secrets/syncthing-key
              HOMEPAGE_FILE_TAILSCALE_KEY: /secrets/tailscale-key
              HOMEPAGE_FILE_TRUENAS_KEY: /secrets/truenas-key
              HOMEPAGE_FILE_UNIFI_KEY: /secrets/unifi-key
        initContainers:
          bootstrap:
            command:
              - /bin/cp
              - /usr/local/bin/kubectl
              - /tools/kubectl
            image:
              repository: ghcr.io/fluxcd/flux-cli
              tag: v2.9.6
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          endpoints:
            restartPolicy: Always
            command:
              - /bin/sh
              - /scripts/render_dashboard.sh
              - --watch
              - /source
              - /output
            env:
              HOMELAB_INFRASTRUCTURE_FILE: /infrastructure/inventory.json
              HOMEPAGE_CLUSTER: mbk
              KUBECTL: /tools/kubectl
            image:
              repository: docker.io/mikefarah/yq
              tag: 4.54.1
            probes:
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 5
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - test -s /output/settings.yaml
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 5m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        serviceAccount:
          identifier: homepage
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: homepage
    persistence:
      background:
        name: homepage-background
        type: configMap
        advancedMounts:
          homepage:
            homepage:
              - path: /app/public/images/background.jpg
                readOnly: true
                subPath: background.jpg
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
      config-directory:
        type: emptyDir
        advancedMounts:
          homepage:
            endpoints:
              - path: /output
            homepage:
              - path: /app/config
      endpoint-scripts:
        name: homepage-endpoints
        type: configMap
        advancedMounts:
          homepage:
            endpoints:
              - path: /scripts
                readOnly: true
      endpoint-source:
        name: homepage
        type: configMap
        advancedMounts:
          homepage:
            endpoints:
              - path: /source
                readOnly: true
      infrastructure:
        name: homepage-infrastructure
        type: secret
        advancedMounts:
          homepage:
            endpoints:
              - path: /infrastructure
                readOnly: true
      secrets:
        name: homepage
        type: secret
        advancedMounts:
          homepage:
            homepage:
              - path: /secrets
                readOnly: true
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
      tools:
        type: emptyDir
        advancedMounts:
          homepage:
            bootstrap:
              - path: /tools
            endpoints:
              - path: /tools
                readOnly: true
    route:
      private:
        annotations:
          gethomepage.dev/href: https://app.invalid
        labels:
          app.kubernetes.io/name: homepage
        parentRefs:
          - name: private
            namespace: networking
    service:
      homepage:
        controller: homepage
        ports:
          http:
            port: 3000
            protocol: HTTP
    serviceAccount:
      homepage:
        automountServiceAccountToken: true
        forceRename: homepage
