apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  releaseName: homepage
  values:
    controllers:
      homepage:
        containers:
          homepage:
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/gethomepage/homepage
              tag: v2.6.0
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: alias.invalid
              readiness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: alias.invalid
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: alias.invalid
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            env:
              HOMEPAGE_ALLOWED_HOSTS: app.invalid,alias.invalid
            envFrom:
              - secretRef:
                  name: homepage
        initContainers:
          bootstrap:
            command:
              - /bin/cp
              - /usr/local/bin/kubectl
              - /tools/kubectl
            image:
              repository: ghcr.io/fluxcd/flux-cli
              tag: v2.9.6
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          endpoints:
            restartPolicy: Always
            command:
              - /bin/sh
              - /scripts/render_dashboard.sh
              - --watch
              - /source
              - /output
            env:
              HOMELAB_INFRASTRUCTURE_FILE: /infrastructure/inventory.json
              HOMEPAGE_CACHE_DIRECTORY: /tmp/homepage
              HOMEPAGE_REVALIDATE_URL: http://127.0.0.1:3000/api/revalidate
              HOMEPAGE_ROUTE_SCRIPT: /routes/service_routes.yq
              KUBECTL: /tools/kubectl
            image:
              repository: docker.io/mikefarah/yq
              tag: 4.54.1
            probes:
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 5
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - test -s /output/settings.yaml
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 5m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        serviceAccount:
          identifier: homepage
    defaultPodOptions:
      automountServiceAccountToken: true
      # The inherited OCI search suffix returns SERVFAIL for external names.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
    global:
      nameOverride: homepage
    persistence:
      background:
        name: homepage-background
        type: configMap
        advancedMounts:
          homepage:
            homepage:
              - path: /app/public/images/background.jpg
                readOnly: true
                subPath: background.jpg
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/.next/cache
      config-directory:
        type: emptyDir
        advancedMounts:
          homepage:
            endpoints:
              - path: /output
            homepage:
              - path: /app/config
      endpoint-scripts:
        name: homepage-endpoints
        type: configMap
        advancedMounts:
          homepage:
            endpoints:
              - path: /scripts
                readOnly: true
      endpoint-source:
        name: homepage
        type: configMap
        advancedMounts:
          homepage:
            endpoints:
              - path: /source
                readOnly: true
      infrastructure:
        name: homepage-infrastructure
        type: secret
        advancedMounts:
          homepage:
            endpoints:
              - path: /infrastructure
                readOnly: true
      route-script:
        name: homepage-route-script
        type: configMap
        advancedMounts:
          homepage:
            endpoints:
              - path: /routes
                readOnly: true
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
      tools:
        type: emptyDir
        advancedMounts:
          homepage:
            bootstrap:
              - path: /tools
            endpoints:
              - path: /tools
                readOnly: true
    route:
      private:
        annotations:
          gethomepage.dev/href: https://app.invalid
        labels:
          app.kubernetes.io/name: homepage
        parentRefs:
          - name: private
            namespace: networking
    service:
      homepage:
        controller: homepage
        ports:
          http:
            port: 3000
            protocol: HTTP
    serviceAccount:
      homepage:
        automountServiceAccountToken: true
        forceRename: homepage
