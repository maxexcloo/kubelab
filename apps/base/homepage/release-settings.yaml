apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  values:
    route:
      private:
        hostnames:
          - home.excloo.com
        annotations:
          gethomepage.dev/description: Application Dashboard
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Operations
          gethomepage.dev/icon: sh-homepage
          gethomepage.dev/name: &title Homepage
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/category: SERVER
          onepassword.excloo.dev/item: 2yyv3pzwee6gstpq4n6hvklhy4
          onepassword.excloo.dev/title: *title
    controllers:
      homepage:
        containers:
          homepage:
            env:
              PGID: "1000"
              PUID: "1000"
