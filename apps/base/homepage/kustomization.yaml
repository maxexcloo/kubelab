apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-release.yaml
  - rbac.yaml
  - resources.yaml
configMapGenerator:
  - name: homepage
    namespace: homepage
    files:
      - custom.css
      - docker.yaml
      - kubernetes.yaml
      - services.yaml
      - settings.yaml
      - widgets.yaml
  - name: homepage-background
    namespace: homepage
    files:
      - background.jpg
    options:
      annotations:
        homepage.excloo.dev/original-sha256: d80bc91f85fcec93c826b3ae4122aba5f7265f7f22adfd8f41e42b9f3c2777e1
        homepage.excloo.dev/rendered-sha256: b2a02ba177a8ad1a0de2b9405b7a44199f875135f01bfe5a3b4bc14c987ab982
      labels:
        app.kubernetes.io/name: homepage
  - name: homepage-endpoints
    namespace: homepage
    files:
      - render_dashboard.sh
      - render_services.sh
      - dashboard.yq
      - machine_widgets.yq
      - service_routes.yq
configurations:
  - name-reference.yaml
patches:
  - path: release-settings.yaml
replacements:
  - source:
      kind: HelmRelease
      name: homepage
      namespace: homepage
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
          name: homepage
          namespace: homepage
        fieldPaths:
          - spec.values.route.private.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: homepage
          namespace: homepage
        fieldPaths:
          - spec.values.controllers.homepage.containers.homepage.env.HOMEPAGE_ALLOWED_HOSTS
        options:
          delimiter: ","
          index: 0
