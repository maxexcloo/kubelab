apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - rbac.yaml
configMapGenerator:
  - name: homepage
    namespace: homepage
    files:
      - custom.css
      - custom.js
      - docker.yaml
      - kubernetes.yaml
      - settings.yaml
      - widgets.yaml
  - name: homepage-background
    namespace: homepage
    files:
      - background.jpg
    options:
      labels:
        app.kubernetes.io/name: homepage
  - name: homepage-endpoints
    namespace: homepage
    files:
      - dashboard.yq
      - layout.yq
      - machine_widgets.yq
      - provider_widgets.yq
      - render_dashboard.sh
      - render_services.sh
      - resolve_endpoints.yq
      - route_nodes.sh
      - service_routes.yq
configurations:
  - name-reference.yaml
transformers:
  - ../../transformers/internal-alias
  - routing
components:
  - ../../../platform/components/app-template
