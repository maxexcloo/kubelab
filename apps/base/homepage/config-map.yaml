apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  custom.css: |
    :root {
      --homepage-card-bg: rgba(0, 0, 0, 0.15);
      --homepage-card-radius: 15px;
      --tw-shadow-color: none;
    }
    html,
    body {
      -webkit-font-smoothing: auto !important;
      font-size: 110% !important;
      text-rendering: auto !important;
    }
    .rounded,
    .rounded-md {
      border-radius: var(--homepage-card-radius) !important;
    }
    .bookmark > a,
    .service-card {
      background: var(--homepage-card-bg) !important;
      box-shadow: none !important;
    }
    .service-card {
      transition: none !important;
    }
    .service-block {
      background: transparent !important;
    }
    .service-container {
      background: var(--homepage-card-bg) !important;
      border-radius: var(--homepage-card-radius);
    }
    .service-card > *:nth-child(n + 3) > div {
      margin-top: 0 !important;
      padding-top: 0 !important;
    }
    .service-title {
      position: relative;
    }
    .service-tags {
      bottom: 0;
    }
    .site-monitor-status {
      height: 100%;
      padding: 8px !important;
    }
    .site-monitor-status > .rounded-full {
      border-radius: var(--homepage-card-radius) !important;
      height: 100% !important;
      width: 6px !important;
    }
  docker.yaml: |
    {}
  kubernetes.yaml: |
    gateway: true
    ingress: false
    mode: cluster
    traefik: false
  services.yaml: |
    - Home Automation:
        - ESPHome:
            description: ESP Device Builder
            href: homelab://mbk/hass/management/5c53de3b_esphome
            icon: esphome
            weight: 0
        - ESPresense:
            description: Room Presence
            href: homelab://mbk/hass/management/f32ea98b_espresense-companion
            icon: espressif
            weight: 0
        - Home Assistant:
            description: Smart Home & Automations
            href: homelab://mbk/hass/management
            icon: home-assistant
            siteMonitor: homelab://mbk/hass/management
            weight: -100
            widget:
              hideErrors: true
              key: "{{HOMEPAGE_VAR_HOME_ASSISTANT_KEY}}"
              type: homeassistant
              url: homelab://mbk/hass/management
        - Home Assistant Matter Hub:
            description: Matter Bridge
            href: homelab://mbk/hass/management/3fd9e6b0_hamh
            icon: sh-home-assistant-matter-hub
            weight: 0
        - Studio Code Server:
            description: Browser IDE
            href: homelab://mbk/hass/management/a0d7b954_vscode
            icon: visual-studio-code
            weight: 0
        - Zigbee2MQTT:
            description: Zigbee Coordinator
            href: homelab://mbk/hass/management/45df7312_zigbee2mqtt
            icon: zigbee2mqtt
            weight: 0
    - Infrastructure:
        - Netboot:
            description: Network Boot Server
            href: homelab://mbk/kimbap/netboot
            icon: netbootxyz
            siteMonitor: homelab://mbk/kimbap/netboot
            weight: 0
        - Syncthing:
            description: File Synchronisation
            href: homelab://mbk/kimbap/syncthing
            icon: syncthing
            siteMonitor: homelab://mbk/kimbap/syncthing
            weight: 0
        - TrueNAS:
            description: Storage Appliance
            href: homelab://mbk/kimbap/management
            icon: truenas
            siteMonitor: homelab://mbk/kimbap/management
            weight: -100
            widget:
              enablePools: true
              hideErrors: true
              key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
              type: truenas
              url: homelab://mbk/kimbap/management
              version: 2
        - UniFi:
            description: Network Controller
            href: homelab://mbk/gateway/management
            icon: unifi
            siteMonitor: homelab://mbk/gateway/management
            weight: -100
            widget:
              hideErrors: true
              key: "{{HOMEPAGE_VAR_UNIFI_KEY}}"
              type: unifi
              url: homelab://mbk/gateway/management
    - Operations:
        - Gatus:
            description: Health Monitoring & Status Page
            href: https://status.excloo.com
            icon: gatus
            siteMonitor: https://status.excloo.com
            weight: -100
            widget:
              type: gatus
              url: https://status.excloo.com
  settings.yaml: |
    cardBlur: xs
    color: slate
    disableCollapse: true
    disableIndexing: true
    headerStyle: clean
    hideVersion: true
    statusStyle: dot
    theme: dark
    title: Homepage
    background:
      brightness: 50
      image: /images/background.jpg
    layout:
      Applications:
        columns: 4
        style: row
        tab: Services
      Artificial Intelligence:
        columns: 2
        style: row
        tab: Services
      Media:
        columns: 4
        style: row
        tab: Services
      Operations:
        columns: 2
        style: row
        tab: Services
      Providers:
        columns: 2
        style: row
        tab: Services
      Home Automation:
        columns: 4
        style: row
        tab: Servers
      Infrastructure:
        columns: 2
        style: row
        tab: Servers
  widgets.yaml: |
    - kubernetes:
        cluster:
          cpu: true
          label: "{{HOMEPAGE_VAR_CLUSTER}}"
          memory: true
          show: true
          showLabel: true
        nodes:
          cpu: true
          memory: true
          show: true
          showLabel: true
    - search:
        provider: google
        target: _blank
