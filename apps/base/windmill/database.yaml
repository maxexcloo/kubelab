apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: windmill-database
  namespace: windmill
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:0fae0cb527912426a889ec0b21b9733e5b76fdc6ad8909914a6e8a6c8ba4f64b
  instances: 1
  bootstrap:
    initdb:
      database: windmill
      owner: windmill
      secret:
        name: windmill-database
  managed:
    roles:
      - name: windmill_user
        ensure: present
      - name: windmill_admin
        ensure: present
        inRoles:
          - windmill_user
      - name: windmill
        ensure: present
        inRoles:
          - windmill_admin
          - windmill_user
        login: true
  storage:
    size: 10Gi
    storageClass: local-path
