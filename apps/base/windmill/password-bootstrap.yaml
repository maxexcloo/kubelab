apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: windmill-database
  namespace: windmill
spec:
  allowRepeat: false
  digits: 10
  encoding: raw
  length: 48
  noUpper: false
  symbolCharacters: -._~
  symbols: 5
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: windmill-database
  namespace: windmill
spec:
  deletionPolicy: None
  refreshInterval: 1h
  updatePolicy: IfNotExists
  data:
    - match:
        secretKey: password
        remoteRef:
          property: password
          remoteKey: database-windmill
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          fieldType: password
    - match:
        secretKey: username
        remoteRef:
          property: username
          remoteKey: database-windmill
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          fieldType: string
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: onepassword
  selector:
    generatorRef:
      kind: Password
      name: windmill-database
  template:
    mergePolicy: Merge
    data:
      username: windmill
