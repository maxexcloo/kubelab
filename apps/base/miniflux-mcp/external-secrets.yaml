apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-mcp
spec:
  refreshInterval: 1h
  # Bifrost's item holds the gateway's provider credentials and the token it sends.
  data:
    - remoteRef:
        key: &item Bifrost
        property: provider-miniflux-api-key
      secretKey: MINIFLUX_API_KEY
    - remoteRef:
        key: *item
        property: miniflux-mcp-token
      secretKey: MCP_AUTH_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: miniflux-mcp
