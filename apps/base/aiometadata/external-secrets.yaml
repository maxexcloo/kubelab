apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aiometadata
  annotations:
    onepassword.excloo.dev/generate-fields: password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item AIOMetadata
        property: oidc-client-id
      secretKey: OIDC_CLIENT_ID
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: OIDC_CLIENT_SECRET
    - remoteRef:
        key: *item
        property: password
      secretKey: ADMIN_KEY
    # BUILT_IN_ keys stay server-side; the unprefixed ones are published by /api/config.
    - remoteRef:
        key: *item
        property: provider-fanart-api-key
      secretKey: BUILT_IN_FANART_API_KEY
    - remoteRef:
        key: *item
        property: provider-tmdb-api-key
      secretKey: BUILT_IN_TMDB_API_KEY
    - remoteRef:
        key: *item
        property: provider-tvdb-api-key
      secretKey: BUILT_IN_TVDB_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: aiometadata
