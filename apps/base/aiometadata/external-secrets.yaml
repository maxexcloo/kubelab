apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  annotations:
    onepassword.excloo.dev/generate-fields: password
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: &item ia4ldwhyyqxnbrqugi7i4jyhf4
        property: oidc-client-id
      secretKey: OIDC_CLIENT_ID
    - remoteRef:
        key: *item
        property: oidc-client-secret
      secretKey: OIDC_CLIENT_SECRET
    - remoteRef:
        key: *item
        property: password
      secretKey: ADMIN_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
