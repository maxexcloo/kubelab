apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        defaultContainerOptionsStrategy: merge
        containers:
          main:
            env:
              AUTH_REQUIRE_SIGNIN: "true"
              DATABASE_URI: sqlite://addon/data/db.sqlite
              ENABLE_CACHE_WARMING: "false"
              HOST_NAME: https://app.invalid
              MAL_WARMUP_ENABLED: "false"
              OIDC_ENABLED: "true"
              OIDC_GROUP_PERMISSIONS: all_services=admin
              OIDC_ISSUER: https://${identity_host}
              REDIS_URL: redis://localhost:6379
              TZ: ${time_zone}
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              pullPolicy: IfNotPresent
              repository: ghcr.io/cedya77/aiometadata
              tag: 3.8.2
            probes:
              liveness: &health
                path: /health/live
                port: 3232
              readiness:
                path: /health/ready
                port: 3232
              startup: *health
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 512Mi
            securityContext:
              runAsGroup: 1000
              runAsUser: 1000
          redis:
            args:
              - redis-server
              - --appendonly
              - "no"
              - --save
              - ""
              - --maxmemory
              - 192mb
              - --maxmemory-policy
              - volatile-lfu
            image:
              pullPolicy: IfNotPresent
              repository: docker.io/library/redis
              tag: 8.10.3
            probes:
              liveness:
                enabled: true
                port: 6379
                spec:
                  timeoutSeconds: 5
              readiness:
                enabled: true
                port: 6379
                spec:
                  timeoutSeconds: 5
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 20m
                memory: 64Mi
            securityContext:
              runAsGroup: 999
              runAsUser: 999
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
    defaultPodOptions:
      securityContext:
        fsGroup: null
        fsGroupChangePolicy: null
        runAsGroup: null
        runAsNonRoot: null
        runAsUser: null
    persistence:
      data:
        existingClaim: data
        type: persistentVolumeClaim
        advancedMounts:
          main:
            main:
              - path: /app/addon/data
      redis:
        type: emptyDir
        advancedMounts:
          main:
            redis:
              - path: /data
    route:
      private:
        hostnames:
          - app.invalid
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
        parentRefs:
          - name: private
            namespace: networking
      public:
        forceRename: "{{ .Release.Name }}"
        annotations:
          external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
          gethomepage.dev/description: Stremio Metadata
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-aiometadata
          gethomepage.dev/name: &title AIOMetadata
          monitoring.excloo.dev/enabled: "true"
          onepassword.excloo.dev/item: *title
        hostnames:
          - aiometadata.excloo.com
        labels:
          app.kubernetes.io/name: "{{ .Release.Name }}"
          gateway.excloo.dev/public-access: "true"
        parentRefs:
          - name: public-tunnel
            namespace: networking
    service:
      main:
        ports:
          http:
            port: 3232
