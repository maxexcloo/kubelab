apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          main:
            # Karakeep's server speaks only stdio, so Supergateway serves it over
            # streamable HTTP. Stateful sessions keep one server process per client.
            args:
              - --healthEndpoint=/health
              - --outputTransport=streamableHttp
              - --stateful
              # renovate: datasource=npm depName=@karakeep/mcp
              - --stdio=npx --yes @karakeep/mcp@0.34.0
            env:
              HOME: /tmp
              KARAKEEP_API_ADDR: http://karakeep.karakeep.svc.cluster.local:3000
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image:
              repository: docker.io/supercorp/supergateway
              tag: 4.2.2
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 10m
                memory: 128Mi
    service:
      main:
        ports:
          http:
            port: 8000
