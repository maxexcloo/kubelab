apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-mcp
spec:
  refreshInterval: 1h
  # Bifrost's item holds the gateway's provider credentials.
  data:
    - remoteRef:
        key: Bifrost
        property: provider-karakeep-api-key
      secretKey: KARAKEEP_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: karakeep-mcp
