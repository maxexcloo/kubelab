apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-mcp
spec:
  # Bifrost's item holds the gateway's provider credentials.
  data:
    - remoteRef:
        key: Bifrost
        property: provider-immich-api-key
      secretKey: IMMICH_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-mcp
