apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-mcp
spec:
  # The MCP endpoint has no caller authentication; Bifrost is its only client.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bifrost
      ports:
        - port: 5000
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich-mcp
  policyTypes:
    - Ingress
