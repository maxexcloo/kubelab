apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich-mcp
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
components:
  - ../../components/application
  - ../../components/default-deny
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
