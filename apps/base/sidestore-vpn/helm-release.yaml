apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        applyDefaultContainerOptionsToInitContainers: false
        defaultContainerOptionsStrategy: merge
        strategy: Recreate
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
              drop:
                - ALL
        initContainers:
          forwarding:
            command:
              - sysctl
            args:
              - -w
              - net.ipv4.ip_forward=1
            image: &tailscale-image
              repository: ghcr.io/tailscale/tailscale
              tag: v1.104.1
            securityContext:
              privileged: true
        containers:
          reflector:
            image:
              repository: ghcr.io/xddxdd/sidestore-vpn
              tag: sha-1cb5f5d
            resources:
              limits:
                memory: 32Mi
              requests:
                cpu: 5m
                memory: 8Mi
            securityContext:
              readOnlyRootFilesystem: true
          tailscale:
            env:
              TS_DEBUG_FIREWALL_MODE: nftables
              TS_ENABLE_HEALTH_CHECK: "true"
              TS_EXTRA_ARGS: --snat-subnet-routes=false
              TS_HOSTNAME: "{{ .Release.Name }}"
              TS_KUBE_SECRET: ""
              TS_LOCAL_ADDR_PORT: 0.0.0.0:9002
              TS_ROUTES: 10.7.0.1/32
              TS_STATE_DIR: /var/lib/tailscale
              TS_USERSPACE: "false"
              TS_AUTHKEY:
                valueFrom:
                  secretKeyRef:
                    key: TS_AUTHKEY
                    name: "{{ .Release.Name }}"
            image:
              <<: *tailscale-image
              pullPolicy: IfNotPresent
            probes:
              readiness:
                enabled: true
                path: /healthz
                port: 9002
                type: HTTP
                spec:
                  timeoutSeconds: 5
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsGroup: 0
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
    persistence:
      state:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: local-path
        type: persistentVolumeClaim
        advancedMounts:
          main:
            tailscale:
              - path: /var/lib/tailscale
      tun:
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        type: hostPath
        advancedMounts:
          main:
            reflector:
              - path: /dev/net/tun
            tailscale:
              - path: /dev/net/tun
