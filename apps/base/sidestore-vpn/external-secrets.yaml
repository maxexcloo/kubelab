apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sidestore-vpn
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: SideStore VPN
        property: password
      secretKey: TS_AUTHKEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sidestore-vpn
