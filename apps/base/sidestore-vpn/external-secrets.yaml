apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: SideStore VPN
        property: auth-key
      secretKey: TS_AUTHKEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: application
