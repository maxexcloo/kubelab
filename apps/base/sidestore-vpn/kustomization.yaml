apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sidestore-vpn
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
components:
  - ../../components/workload
  - ../../../platform/backups/credentials
  - ../../../platform/backups/files
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: backup.yaml
    target:
      kind: CronJob
      name: state-backup
