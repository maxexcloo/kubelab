apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - external-secrets.yaml
  - namespace.yaml
  - network-policy.yaml
components:
  - ../../components/workload
  - ../../../platform/backups/destination
  - ../../../platform/backups/files
  - ../../components/app-namespace
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
  - path: file-backup.yaml
    target:
      kind: CronJob
      name: file-backup
