apiVersion: batch/v1
kind: CronJob
metadata:
  name: state-backup
spec:
  schedule: 45 3 * * *
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: sidestore-vpn
                readOnly: true
          securityContext:
            fsGroup: 0
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
