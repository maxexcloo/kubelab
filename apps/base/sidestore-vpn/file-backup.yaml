apiVersion: batch/v1
kind: CronJob
metadata:
  name: file-backup
spec:
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsGroup: 0
            runAsNonRoot: false
            runAsUser: 0
          volumes:
            - name: source
              persistentVolumeClaim:
                claimName: sidestore-vpn-state
                readOnly: true
