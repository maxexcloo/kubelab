apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: comfyui-image
spec:
  ingress:
    - from:
        # Studio queues jobs and fetches outputs; Traefik serves the editor.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: studio
          podSelector:
            matchLabels:
              app.kubernetes.io/name: studio
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8188
  podSelector:
    matchLabels:
      app.kubernetes.io/name: comfyui-image
  policyTypes:
    - Ingress
