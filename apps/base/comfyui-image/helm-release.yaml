apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  # GPU workloads stay stopped until started with kubectl scale; any upgrade of
  # the release stops them again.
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              - op: add
                path: /spec/replicas
                value: 0
            target:
              kind: Deployment
  values:
    # A pool of one-GPU workers that each run images and video; Studio routes work to
    # whichever is free and holds the model.
    controllers:
      main:
        strategy: Recreate
        annotations:
          studio.excloo.dev/capabilities: image,video,upscale,models
          studio.excloo.dev/label: GPU 1
          studio.excloo.dev/worker: primary
        labels:
          studio.excloo.dev/kind: image
        containers:
          main: &container
            env:
              CLI_ARGS: --cache-classic --disable-mmap --disable-pinned-memory --enable-assets --force-non-blocking --use-ck-attention
              HSA_OVERRIDE_GFX_VERSION: 12.0.1
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}"
            image: &image
              repository: ghcr.io/maxexcloo/studio-worker
              tag: 2026.11.10.5
            # Readiness only, as under Docker: loading never restarts the worker.
            probes:
              readiness:
                enabled: true
                path: /system_stats
                port: 8188
                type: HTTP
                spec:
                  timeoutSeconds: 5
            resources:
              claims:
                - name: gpu
            securityContext:
              capabilities:
                add:
                  - SYS_PTRACE
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: gpu-1
      secondary:
        strategy: Recreate
        annotations:
          studio.excloo.dev/capabilities: image,video,upscale
          studio.excloo.dev/label: GPU 2
          studio.excloo.dev/worker: secondary
        labels:
          studio.excloo.dev/kind: image
        containers:
          main: *container
        pod:
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: gpu-1
      prepull:
        containers:
          main:
            image: *image
    defaultPodOptions:
      nodeSelector:
        node.excloo.dev/dedicated: gpu
      securityContext:
        seccompProfile:
          type: Unconfined
      tolerations:
        - key: node.excloo.dev/dedicated
          operator: Equal
          value: gpu
    # Studio is the shared worker client: it fetches outputs and the worker node
    # deletes ComfyUI's copies.
    persistence:
      # Each worker keeps its own cache, config, output and user folders; both share the
      # primary's input folder, so Studio stages inputs once.
      data:
        hostPath: ${dataset_root}/ai/comfyui-image/data
        hostPathType: Directory
        type: hostPath
        advancedMounts:
          main:
            main:
              - path: /root/.cache
                subPath: cache
              - path: /root/.config
                subPath: config
              - &input
                path: /root/ComfyUI/input
                subPath: input
              - path: /root/ComfyUI/output
                subPath: output
              - path: /root/ComfyUI/user
                subPath: user
          secondary:
            main:
              - *input
      models:
        hostPath: ${dataset_root}/ai/models
        hostPathType: Directory
        type: hostPath
        advancedMounts:
          main:
            main:
              # Writable only here: Studio's model downloads land in the primary worker.
              - path: /root/ComfyUI/models
                subPath: comfyui
              - &radiance-image
                path: /models/radiance-image
                readOnly: true
                subPath: radiance
              # Radiance H3 video profiles load their .rad packages from here.
              - &radiance-video
                path: /models/radiance-video
                readOnly: true
                subPath: radiance
          secondary:
            main:
              - path: /root/ComfyUI/models
                readOnly: true
                subPath: comfyui
              - *radiance-image
              - *radiance-video
      # The former video worker's folders; tp2 (comfyui-video) never runs beside it.
      secondary-data:
        hostPath: ${dataset_root}/ai/comfyui-video/data
        hostPathType: Directory
        type: hostPath
        advancedMounts:
          secondary:
            main:
              - path: /root/.cache
                subPath: cache
              - path: /root/.config
                subPath: config
              - path: /root/ComfyUI/output
                subPath: output
              - path: /root/ComfyUI/user
                subPath: user
      shm:
        medium: Memory
        type: emptyDir
        globalMounts:
          - path: /dev/shm
    route:
      private:
        annotations:
          gethomepage.dev/description: Image Workflows
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Artificial Intelligence
          gethomepage.dev/href: https://app.invalid
          gethomepage.dev/icon: sh-comfyui
          gethomepage.dev/name: ComfyUI Image
        hostnames:
          - comfyui-image.${cluster_name}.excloo.dev
        parentRefs:
          - name: private
            namespace: networking
        # The editor opens on the primary worker.
        rules:
          - backendRefs:
              - identifier: main
                port: 8188
    service:
      main:
        controller: main
        forceRename: "{{ .Release.Name }}"
        ports:
          http: &http
            port: 8188
            protocol: HTTP
      secondary:
        controller: secondary
        ports:
          http: *http
