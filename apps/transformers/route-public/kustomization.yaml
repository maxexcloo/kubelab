apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../route-private
patches:
  - target:
      kind: ReplacementTransformer
    patch: |-
      - op: test
        path: /replacements/0/source/fieldPath
        value: spec.values.route.private.hostnames.0
      - op: replace
        path: /replacements/0/source/fieldPath
        value: spec.values.route.public.hostnames.0
      - op: add
        path: /replacements/0/targets/-
        value:
          select:
            kind: HelmRelease
          fieldPaths:
            - spec.values.route.private.hostnames.0
