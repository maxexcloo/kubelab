apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app-template
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.3.0
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      nodeSelector:
        node.excloo.dev/network: internal
