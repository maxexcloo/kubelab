# Studio finds the GPU workloads (Settings › Workers) from their labelled
# Deployments, Services and GPU claims, and switches them by scaling: it updates
# only the scale subresource.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: studio-runtime
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [list]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaimtemplates]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: studio-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: studio-runtime
subjects:
  - kind: ServiceAccount
    name: studio
    namespace: studio
