apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application-oauth2-proxy
  annotations:
    onepassword.excloo.dev/generate-fields: oauth2-proxy-cookie-secret
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: item.invalid
        property: oauth2-proxy-cookie-secret
      secretKey: cookie
    - remoteRef:
        key: item.invalid
        property: oidc-client-id
      secretKey: client-id
    - remoteRef:
        key: item.invalid
        property: oidc-client-secret
      secretKey: client
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: application-oauth2-proxy
    template:
      engineVersion: v2
      # oauth2-proxy needs a 16-, 24- or 32-byte cookie secret.
      data:
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .cookie | sha256sum | trunc 32 }}"
        OIDC_CLIENT_ID: '{{ index . "client-id" }}'
        OIDC_CLIENT_SECRET: "{{ .client }}"
