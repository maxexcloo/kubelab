apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        containers:
          oauth2-proxy:
            args:
              - --code-challenge-method=S256
              - --email-domain=*
              - --http-address=0.0.0.0:4180
              - --oidc-issuer-url=https://${identity_host}
              - --provider=oidc
              - --provider-display-name=Pocket ID
              - --reverse-proxy=true
              - --silence-ping-logging=true
              # Pocket ID's client groups decide access, so skip oauth2-proxy's own page.
              - --skip-provider-button=true
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-oauth2-proxy"
            image:
              pullPolicy: IfNotPresent
              repository: quay.io/oauth2-proxy/oauth2-proxy
              tag: v7.15.5
            probes:
              liveness: &health
                enabled: true
                path: /ping
                port: 4180
                type: HTTP
                spec:
                  timeoutSeconds: 5
              readiness: *health
              startup:
                <<: *health
                spec:
                  failureThreshold: 30
                  timeoutSeconds: 5
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      main:
        ports:
          http:
            port: 4180
