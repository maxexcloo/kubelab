apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Puts oauth2-proxy in front of the main container and signs browsers in with the
# app's PocketIDClient. The app sets OAUTH2_PROXY_UPSTREAMS, OAUTH2_PROXY_REDIRECT_URL
# and any OAUTH2_PROXY_SKIP_AUTH_ROUTES, gives its main probes an explicit port, and
# admits only the proxy port (4180) in its NetworkPolicy.
resources:
  - external-secret.yaml
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  # Fill the item before renaming, while the selector still matches.
  - source:
      kind: PocketIDClient
      fieldPath: spec.item
    targets:
      - select:
          kind: ExternalSecret
          name: application-oauth2-proxy
        fieldPaths:
          - spec.data.0.remoteRef.key
          - spec.data.1.remoteRef.key
          - spec.data.2.remoteRef.key
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: ExternalSecret
          name: application-oauth2-proxy
        fieldPaths:
          - metadata.name
          - spec.target.name
        options:
          delimiter: "-"
          index: 0
