apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Puts oauth2-proxy in front of the main container and signs browsers in with the
# app's PocketIDClient. The app sets UPSTREAM_URI and OAUTH2_PROXY_REDIRECT_URL, gives
# its main probes an explicit port and admits Traefik on the proxy port (4180).
# Optionally it sets OAUTH2_PROXY_SKIP_AUTH_ROUTES, or UPSTREAM_REQUEST_HEADERS to pass
# its own credential upstream, for example
# [{name: Authorization, values: [{secretSource: {fromEnv: UPSTREAM_AUTHORIZATION}}]}].
# Injected headers also reach skipped routes, so an app that injects one routes its
# API paths straight to the app port instead of skipping them here.
resources:
  - external-secret.yaml
configMapGenerator:
  - name: oauth2-proxy
    files:
      - oauth2-proxy.yaml
    options:
      # oauth2-proxy expands the ${...} references itself.
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - name-reference.yaml
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  # Fill the item before renaming, while the selector still matches.
  - source:
      kind: PocketIDClient
      fieldPath: spec.item
    targets:
      - select:
          kind: ExternalSecret
          name: application-oauth2-proxy
        fieldPaths:
          - spec.data.0.remoteRef.key
          - spec.data.1.remoteRef.key
          - spec.data.2.remoteRef.key
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: ExternalSecret
          name: application-oauth2-proxy
        fieldPaths:
          - metadata.name
          - spec.target.name
        options:
          delimiter: "-"
          index: 0
