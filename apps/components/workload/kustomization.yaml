apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - helm-release.yaml
components:
  - ../../../platform/components/app-template
# Name the release and its chart resources after the app's Namespace.
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - metadata.name
          - spec.releaseName
          - spec.values.global.nameOverride
        options:
          create: true
