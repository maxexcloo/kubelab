apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: application
spec:
  values:
    controllers:
      main:
        # Every container in the controller, sidecars and init containers
        # included, starts from this hardening and overrides only what it needs.
        defaultContainerOptionsStrategy: merge
        strategy: Recreate
        defaultContainerOptions:
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        containers:
          main:
            nameOverride: "{{ .Release.Name }}"
            probes:
              liveness:
                enabled: true
                path: /health
                type: HTTP
                spec:
                  timeoutSeconds: 5
              readiness:
                enabled: true
                path: /health
                type: HTTP
                spec:
                  timeoutSeconds: 5
              startup:
                enabled: true
                path: /health
                type: HTTP
                spec:
                  failureThreshold: 30
                  timeoutSeconds: 5
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 568
        runAsNonRoot: true
        runAsUser: 568
        seccompProfile:
          type: RuntimeDefault
    persistence:
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      main:
        controller: main
        forceRename: "{{ .Release.Name }}"
        ports:
          http:
            protocol: HTTP
