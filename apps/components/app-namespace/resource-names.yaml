source:
  kind: Namespace
  fieldPath: metadata.name
targets:
  - select:
      labelSelector: app.kubernetes.io/name=application
    fieldPaths:
      - metadata.labels.[app.kubernetes.io/name]
  - select:
      kind: ExternalSecret
      name: application
    fieldPaths:
      - metadata.name
      - spec.target.name
  - select:
      kind: B2ObjectStorage
      name: application
    fieldPaths:
      - metadata.name
  - select:
      kind: CloudflareWAFPolicy
      name: application
    fieldPaths:
      - metadata.name
  - select:
      kind: HTTPRoute
      name: application
    fieldPaths:
      - metadata.name
  - select:
      kind: NetworkPolicy
      name: application
    fieldPaths:
      - metadata.name
  - select:
      kind: PocketIDClient
      name: application
    fieldPaths:
      - metadata.name
  - select:
      kind: PrivateDNSRecord
      name: application
    fieldPaths:
      - metadata.name
