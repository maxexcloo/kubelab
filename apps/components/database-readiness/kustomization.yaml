apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: database-check
    files:
      - wait-for-database.sh
configurations:
  - name-reference.yaml
patches:
  - path: helm-release.yaml
    target:
      kind: HelmRelease
replacements:
  - source:
      kind: Cluster
      fieldPath: spec.imageName
      options:
        delimiter: ":"
        index: 0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.initContainers.wait-for-database.image.repository
  - source:
      kind: Cluster
      fieldPath: spec.imageName
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.controllers.main.initContainers.wait-for-database.image.tag
