# Before each upgrade, a hook Job pulls the app's new image onto its node, so the
# running pod keeps serving through the pull. The app sets the Job's image to its
# own, through a YAML anchor, and its node where the pod's placement is not shared.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: _
spec:
  values:
    controllers:
      prepull:
        type: job
        annotations:
          helm.sh/hook: pre-install,pre-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        containers:
          main:
            # The shell's builtin, as some images ship no true binary.
            command:
              - /bin/sh
              - -c
              - "true"
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
            # Restricted namespaces admit only hardened containers.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
