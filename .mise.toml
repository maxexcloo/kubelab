[tools]
1password-cli = "2.41.0"
actionlint = "1.7.12"
flux2 = "2.9.6"
helm = "4.3.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
prek = "0.5.5"
prettier = "3.9.10"
python = "3.15.0"
shellcheck = "0.11.0"
updatecli = "0.122.1"
yq = "4.54.1"

# Bootstrap

[tasks.bootstrap]
description = "Bootstrap A Cluster In Dependency Order"
run = 'echo "Cluster $usage_cluster bootstrap submitted. Check progress with: mise run status $usage_cluster"'
usage = 'arg "<cluster>"'
depends = [
  { task = "bootstrap-cilium", args = [
    "{{usage.cluster}}",
  ] },
  { task = "bootstrap-secrets", args = [
    "{{usage.cluster}}",
  ] },
  { task = "bootstrap-flux", args = [
    "{{usage.cluster}}",
  ] },
]

[tasks.bootstrap-cilium]
description = "Bootstrap Cilium Networking For A Cluster"
interactive = true
run = "scripts/bootstrap_cilium.sh"

[tasks.bootstrap-flux]
description = "Bootstrap Flux Reconciliation For A Cluster"
run = "scripts/bootstrap_flux.sh"
wait_for = ["bootstrap-secrets"]

[tasks.bootstrap-secrets]
description = "Bootstrap 1Password Connect Credentials"
run = "scripts/bootstrap_cluster_secrets.sh"
wait_for = ["bootstrap-cilium"]

# Dependency Updates

[tasks."dependencies:check"]
description = "Preview Local Dependency Updates"
run = """
GITHUB_TOKEN="$(gh auth token)"
export GITHUB_TOKEN
updatecli pipeline diff --config .updatecli.d --disable-changelog --disable-udash-report --unique-tmp-dir
"""

[tasks."dependencies:update"]
description = "Apply Reviewed Local Dependency Updates"
usage = 'flag "--labels <labels>" help="Select Updatecli groups, such as group:tools"'
run = """
GITHUB_TOKEN="$(gh auth token)"
export GITHUB_TOKEN
set --
if [ -n "${usage_labels:-}" ]; then
  set -- --labels "$usage_labels"
fi
updatecli pipeline apply --config .updatecli.d --disable-changelog --disable-udash-report --unique-tmp-dir "$@"
"""

# Deploy

[tasks.deploy]
description = "Reconcile A Cluster Or Flux Component From Git"
run = 'flux --context "$usage_cluster" reconcile kustomization "${usage_component:-flux-system}" --with-source'
usage = '''
arg "<cluster>"
arg "[component]"
'''

[tasks.status]
description = "Show Cluster Reconciliation Or Watch An Application's Helm Release"
run = '''
if [ -n "${usage_application:-}" ]; then
  flux --context "$usage_cluster" get helmreleases "$usage_application" --namespace "$usage_application" --watch
else
  flux --context "$usage_cluster" get kustomizations
  flux --context "$usage_cluster" get helmreleases --all-namespaces
fi
'''
usage = '''
arg "<cluster>"
arg "[application]"
'''

# Development

[tasks.check]
description = "Run All Repository Checks"
run = "prek run --all-files"

[tasks.fmt]
description = "Format Project Files"
run = "prettier --write ."

[tasks.validate]
description = "Check Project Files & Configuration"
run = """
updatecli manifest validate --config .updatecli.d --disable-templating --strict
actionlint .github/workflows/*.yaml
prettier --check .
shellcheck scripts/*.sh apps/base/homepage/*.sh
manifest_directory="$(mktemp -d "${TMPDIR:-/tmp}/kubelab-check.XXXXXX")"
trap 'rm -fr -- "${manifest_directory:?}"' EXIT
scripts/render_manifests.sh "$manifest_directory"
scripts/check_manifests.sh "$manifest_directory"
scripts/check_service_metadata.sh "$manifest_directory"
python -m unittest discover -p 'test_*.py' -s tests
"""

# Setup

[tasks.setup]
description = "Install Tools & Git Hooks"
run = """
mise install
prek install
"""
