[tools]
flux2 = "latest"
kubeconform = "latest"
# Match the Kubernetes API configured in Homelab; Renovate groups client updates.
kubectl = "1.37.2"

# Bootstrap
[tasks.bootstrap]
description = "Bootstrap A Cluster"
interactive = true
run = '''
set -eu
scripts/bootstrap_cilium.sh "$usage_cluster"
scripts/bootstrap_cluster_secrets.sh "$usage_cluster"
scripts/bootstrap_flux.sh "$usage_cluster"
'''
usage = 'arg "<cluster>"'

# Deploy
[tasks.deploy]
description = "Verify An Application At The Exact Main Revision"
run = '''
set -eu
namespace="${usage_application%%/*}"
release="${usage_application##*/}"
revision="${usage_revision:-$(git ls-remote --exit-code origin refs/heads/main)}"
expected="main@sha1:${revision%%[[:space:]]*}"
flux --context "$usage_cluster" reconcile kustomization apps --with-source
flux --context "$usage_cluster" -n "$namespace" reconcile helmrelease "$release"
test "$(kubectl --context "$usage_cluster" -n flux-system get kustomization apps -o jsonpath='{.status.lastAppliedRevision}')" = "$expected"
echo "$usage_application Ready at $expected"
'''
usage = '''
arg "<cluster>"
arg "<application>" help="HelmRelease name, or namespace/name"
arg "[revision]" help="Full commit SHA; defaults to remote main"
'''

[tasks.status]
description = "Show Cluster Reconciliation Or Watch An Application's Helm Release"
run = '''
if [ -n "${usage_application:-}" ]; then
  flux --context "$usage_cluster" get helmreleases "${usage_application##*/}" --namespace "${usage_application%%/*}" --watch
else
  flux --context "$usage_cluster" get kustomizations
  flux --context "$usage_cluster" get helmreleases --all-namespaces
fi
'''
usage = '''
arg "<cluster>"
arg "[application]" help="HelmRelease name, or namespace/name"
'''

# Development
[tasks.check]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:python",
  "check:shell",
  "check:updates",
  "check:whitespace",
  "hooks:check",
  "test:python",
]

[tasks."check:homelab"]
description = "Render Homepage Services From Homelab Main Or HOMELAB_DIRECTORY"
run = '''
set -eu
temporary_directory=$(mktemp -d)
trap 'rm -fr -- "$temporary_directory"' EXIT
homelab_directory=${HOMELAB_DIRECTORY:-}
if [ -z "$homelab_directory" ]; then
  homelab_directory="$temporary_directory/homelab"
  mkdir "$homelab_directory"
  curl -fsSL https://codeload.github.com/maxexcloo/homelab/tar.gz/refs/heads/main | tar -xz -C "$homelab_directory" --strip-components=1
fi
HOMELAB_INFRASTRUCTURE_FILE=tests/fixtures/homepage/infrastructure.json \
  HOMEPAGE_BESZEL_ROUTES=tests/fixtures/homepage/beszel-routes.json \
  sh apps/base/homepage/render_services.sh "$temporary_directory/services.yaml" "$homelab_directory"
'''

# Setup
[tasks.setup]
depends = ["hooks:install"]
