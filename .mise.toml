[tools]
1password-cli = "2.38.1"
actionlint = "1.7.12"
flux2 = "2.9.4"
helm = "4.2.4"
jq = "1.8.2"
kubeconform = "0.8.0"
kubectl = "1.36.4"
kustomize = "5.8.1"
prek = "0.4.14"
prettier = "3.9.6"
shellcheck = "0.11.0"
trivy = "0.74.0"
yq = "4.53.6"

# Deploy
[tasks.bootstrap]
description = "Bootstrap a cluster in dependency order"
run = 'echo "Cluster $(kubectl config current-context) is bootstrapped and reconciled."'
depends = ["bootstrap-flux"]

[tasks.bootstrap-cilium]
description = "Bootstrap Cilium cluster networking"
interactive = true
run = "scripts/bootstrap_cilium.sh"

[tasks.bootstrap-flux]
description = "Bootstrap Flux reconciliation"
run = "scripts/bootstrap_flux.sh"
depends = ["bootstrap-secrets"]

[tasks.bootstrap-secrets]
description = "Bootstrap the 1Password Connect secret"
run = "scripts/bootstrap_cluster_secrets.sh"
depends = ["bootstrap-cilium"]

# Development
[tasks.check]
description = "Check formatting and repository configuration"
run = """
actionlint .github/workflows/*.yaml
prettier --check .
shellcheck scripts/*.sh
scripts/check_manifests.sh
trivy config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml .
"""

[tasks.fmt]
description = "Format project files"
run = """
prettier --write .
"""

[tasks.prek]
description = "Run all repository hooks"
run = "prek run --all-files"

# Setup
[tasks.setup]
description = "Install tools and Git hooks"
run = """
mise install
prek install
"""
