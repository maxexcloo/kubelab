[tools]
1password-cli = "2.39.0"
actionlint = "1.7.12"
flux2 = "2.9.5"
helm = "4.3.0"
jq = "1.8.2"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.1"
prek = "0.5.3"
prettier = "3.9.9"
python = "3.14.7"
shellcheck = "0.11.0"
yq = "4.53.6"

# Bootstrap
[tasks.bootstrap]
description = "Bootstrap a cluster in dependency order"
run = 'echo "Cluster $usage_cluster bootstrap submitted. Check progress with: mise run status $usage_cluster"'
usage = 'arg "<cluster>"'
depends = [
  { task = "bootstrap-cilium", args = ["{{usage.cluster}}"] },
  { task = "bootstrap-secrets", args = ["{{usage.cluster}}"] },
  { task = "bootstrap-flux", args = ["{{usage.cluster}}"] },
]

[tasks.bootstrap-cilium]
description = "Bootstrap Cilium networking for a cluster"
interactive = true
run = "scripts/bootstrap_cilium.sh"

[tasks.bootstrap-flux]
description = "Bootstrap Flux reconciliation for a cluster"
run = "scripts/bootstrap_flux.sh"
wait_for = ["bootstrap-secrets"]

[tasks.bootstrap-secrets]
description = "Bootstrap 1Password Connect credentials"
run = "scripts/bootstrap_cluster_secrets.sh"
wait_for = ["bootstrap-cilium"]

# Deploy
[tasks.deploy]
description = "Reconcile a cluster or Flux component from Git"
run = 'flux --context "$usage_cluster" reconcile kustomization "${usage_component:-flux-system}" --with-source'
usage = '''
arg "<cluster>"
arg "[component]"
'''

[tasks.status]
description = "Show cluster reconciliation or watch an application's Helm release"
run = '''
if [ -n "${usage_application:-}" ]; then
  flux --context "$usage_cluster" get helmreleases "$usage_application" --namespace "$usage_application" --watch
else
  flux --context "$usage_cluster" get kustomizations
  flux --context "$usage_cluster" get helmreleases --all-namespaces
fi
'''
usage = '''
arg "<cluster>"
arg "[application]"
'''

# Development
[tasks.check]
description = "Check project files and configuration"
run = """
actionlint .github/workflows/*.yaml
prettier --check .
shellcheck scripts/*.sh
scripts/check_manifests.sh
scripts/check_service_metadata.sh
python -m unittest discover -s tests -p 'test_*.py'
"""

[tasks.fmt]
description = "Format project files"
run = "prettier --write ."

[tasks.prek]
description = "Run all repository hooks"
run = "prek run --all-files"

# Setup
[tasks.setup]
description = "Install tools and Git hooks"
run = """
mise install
prek install
"""
