apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      version: 2.6.0
  releaseName: external-secrets
  valuesFrom:
    - kind: ConfigMap
      name: external-secrets-values
      valuesKey: values.yaml
