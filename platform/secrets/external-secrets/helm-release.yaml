apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 30m
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      version: 2.9.0
  values:
    installCRDs: false
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
