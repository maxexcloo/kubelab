apiVersion: v1
kind: ServiceAccount
metadata:
  name: onepassword-items
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: onepassword-items
rules:
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, pushsecrets]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: onepassword-items
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: onepassword-items
subjects:
  - kind: ServiceAccount
    name: onepassword-items
    namespace: external-secrets
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: onepassword-items
  namespace: external-secrets
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  schedule: "17 * * * *"
  timeZone: Australia/Sydney
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          serviceAccountName: onepassword-items
          containers:
            - name: reconciler
              image: docker.io/library/python:3.15.0-alpine3.24@sha256:1afb480ba8d3b3b7a8439a84f2365ce5c75ac45a79cf07daa091b49235cbe27b
              command: [python, /app/reconcile.py]
              env:
                - name: OP_CONNECT_HOST
                  value: http://onepassword-connect:8080
                - name: OP_CONNECT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: token
                      name: onepassword-connect
              resources:
                limits:
                  memory: 128Mi
                requests:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - mountPath: /app
                  name: script
                  readOnly: true
                - mountPath: /tmp
                  name: temporary
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - configMap:
                name: onepassword-items
              name: script
            - emptyDir: {}
              name: temporary
