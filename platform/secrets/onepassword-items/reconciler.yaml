apiVersion: v1
kind: ServiceAccount
metadata:
  name: onepassword-items
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: onepassword-items
rules:
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets, pushsecrets]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resourceNames: [apps]
    resources: [kustomizations]
    verbs: [get]
  - apiGroups: [source.toolkit.fluxcd.io]
    resourceNames: [flux-system]
    resources: [gitrepositories]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: onepassword-items
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: onepassword-items
subjects:
  - kind: ServiceAccount
    name: onepassword-items
    namespace: external-secrets
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: onepassword-items
  namespace: external-secrets
data:
  reconcile.py: |
    import copy
    import json
    import os
    import ssl
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    ANNOTATION_PREFIX = "onepassword.excloo.dev/"
    KUBERNETES_HOST = "https://kubernetes.default.svc"
    KUBERNETES_SERVICE_ACCOUNT = "/var/run/secrets/kubernetes.io/serviceaccount"
    SECRET_SUFFIXES = ("key", "password", "secret", "token")


    def request(url, *, token, body=None, context=None, method="GET"):
        data = None if body is None else json.dumps(body).encode()
        headers = {"Authorization": f"Bearer {token}"}
        if data is not None:
            headers["Content-Type"] = "application/json"
        api_request = urllib.request.Request(
            url,
            data=data,
            headers=headers,
            method=method,
        )
        try:
            with urllib.request.urlopen(api_request, context=context, timeout=30) as response:
                content = response.read()
                return None if not content else json.loads(content)
        except urllib.error.HTTPError as error:
            detail = error.read().decode(errors="replace")
            raise RuntimeError(f"{method} {url} returned {error.code}: {detail}") from error
        except urllib.error.URLError as error:
            raise RuntimeError(f"{method} {url} failed: {error.reason}") from error


    def kubernetes_request(path):
        with open(
            f"{KUBERNETES_SERVICE_ACCOUNT}/token",
            encoding="utf-8",
        ) as token_file:
            token = token_file.read()
        context = ssl.create_default_context(
            cafile=f"{KUBERNETES_SERVICE_ACCOUNT}/ca.crt"
        )
        return request(
            f"{KUBERNETES_HOST}{path}",
            token=token,
            context=context,
        )


    def kubernetes_list(path):
        return kubernetes_request(path).get("items", [])


    def kubernetes_get(path):
        return kubernetes_request(path)


    def connect(path, *, body=None, method="GET"):
        host = os.environ["OP_CONNECT_HOST"].rstrip("/")
        token = os.environ["OP_CONNECT_TOKEN"]
        return request(
            f"{host}/v1{path}",
            token=token,
            body=body,
            method=method,
        )


    def annotations(resource):
        return resource.get("metadata", {}).get("annotations", {})


    def item_configuration(resource):
        values = annotations(resource)
        return {
            "adopt": set(
                filter(None, values.get(f"{ANNOTATION_PREFIX}adopt-titles", "").split(","))
            ),
            "constants": json.loads(values.get(f"{ANNOTATION_PREFIX}constants", "{}")),
            "defaults": json.loads(values.get(f"{ANNOTATION_PREFIX}defaults", "{}")),
            "generate": set(
                filter(None, values.get(f"{ANNOTATION_PREFIX}generate-fields", "").split(","))
            ),
            "migrate": json.loads(values.get(f"{ANNOTATION_PREFIX}migrate-fields", "{}")),
            "remove": set(
                filter(None, values.get(f"{ANNOTATION_PREFIX}remove-fields", "").split(","))
            ),
        }


    def merge_configuration(item, resource):
        configuration = item_configuration(resource)
        item["adopt"].update(configuration["adopt"])
        item["constants"].update(configuration["constants"])
        item["defaults"].update(configuration["defaults"])
        item["generate"].update(configuration["generate"])
        item["migrate"].update(configuration["migrate"])
        item["remove"].update(configuration["remove"])


    def new_item():
        return {
            "adopt": set(),
            "constants": {},
            "defaults": {},
            "fields": set(),
            "generate": set(),
            "login": False,
            "migrate": {},
            "namespaces": set(),
            "remove": set(),
            "urls": set(),
        }


    def slug(value):
        return "".join(character for character in value.lower() if character.isalnum())


    def applications_ready():
        resource = kubernetes_get(
            "/apis/kustomize.toolkit.fluxcd.io/v1/namespaces/flux-system/"
            "kustomizations/apps"
        )
        metadata = resource.get("metadata", {})
        source_reference = resource.get("spec", {}).get("sourceRef", {})
        status = resource.get("status", {})
        source_namespace = source_reference.get("namespace", metadata.get("namespace"))
        source = kubernetes_get(
            f"/apis/source.toolkit.fluxcd.io/v1/namespaces/{source_namespace}/"
            f"gitrepositories/{source_reference.get('name')}"
        )
        source_revision = source.get("status", {}).get("artifact", {}).get("revision")
        ready = any(
            condition.get("type") == "Ready" and condition.get("status") == "True"
            for condition in status.get("conditions", [])
        )
        return (
            ready
            and status.get("observedGeneration") == metadata.get("generation")
            and bool(source_revision)
            and status.get("lastAppliedRevision") == source_revision
        )


    def externally_owned(item):
        return "Homelab" in item.get("tags", [])


    def is_dry_run():
        return os.environ.get("DRY_RUN", "false") == "true"


    def discover_items():
        desired = {}
        resources = kubernetes_list(
            "/apis/external-secrets.io/v1/externalsecrets"
        ) + kubernetes_list("/apis/external-secrets.io/v1alpha1/pushsecrets")
        for resource in resources:
            namespace = resource["metadata"]["namespace"]
            references = []
            if resource["kind"] == "ExternalSecret":
                store = resource.get("spec", {}).get("secretStoreRef", {})
                if store.get("name") != "onepassword":
                    continue
                references = (
                    [
                        data.get("remoteRef", {})
                        for data in resource.get("spec", {}).get("data", [])
                    ]
                    + [
                        {"key": data.get("extract", {}).get("key")}
                        for data in resource.get("spec", {}).get("dataFrom", [])
                    ]
                )
            else:
                stores = resource.get("spec", {}).get("secretStoreRefs", [])
                if not any(store.get("name") == "onepassword" for store in stores):
                    continue
                references = [
                    data.get("match", {}).get("remoteRef", {})
                    for data in resource.get("spec", {}).get("data", [])
                ]
            titles = {
                reference.get("key") or reference.get("remoteKey")
                for reference in references
            } - {None}
            matching_titles = {
                title
                for title in titles
                if slug(title) == slug(resource["metadata"]["name"])
            }
            owner_title = None
            if len(matching_titles) == 1:
                owner_title = matching_titles.pop()
            elif len(titles) == 1:
                owner_title = next(iter(titles))
            for reference in references:
                title = reference.get("key") or reference.get("remoteKey")
                field = reference.get("property")
                if not title:
                    continue
                item = desired.setdefault(title, new_item())
                if title == owner_title:
                    item["namespaces"].add(namespace)
                    merge_configuration(item, resource)
                if field:
                    item["fields"].add(field)
        routes = kubernetes_list("/apis/gateway.networking.k8s.io/v1/httproutes")
        routes_by_namespace = {}
        for route in routes:
            namespace = route["metadata"]["namespace"]
            route_annotations = annotations(route)
            if route_annotations.get("gethomepage.dev/enabled") != "true":
                continue
            urls = set()
            homepage_url = route_annotations.get("gethomepage.dev/href")
            if homepage_url:
                urls.add(homepage_url)
            for hostname in route.get("spec", {}).get("hostnames", []):
                urls.add(f"https://{hostname}")
            title = route_annotations.get("gethomepage.dev/name")
            if not title or not urls:
                continue
            item = desired.setdefault(title, new_item())
            item["login"] = True
            item["namespaces"].add(namespace)
            item["urls"].update(urls)
            namespace_routes = routes_by_namespace.setdefault(namespace, [])
            namespace_routes.append((route["metadata"]["name"], urls))
        for title, item in desired.items():
            for namespace in item["namespaces"]:
                namespace_routes = routes_by_namespace.get(namespace, [])
                matching_routes = [
                    urls
                    for name, urls in namespace_routes
                    if slug(name)
                    in {slug(title), f"{slug(title)}private", f"{slug(title)}public"}
                ]
                if matching_routes:
                    for urls in matching_routes:
                        item["urls"].update(urls)
                elif len(namespace_routes) == 1:
                    item["urls"].update(namespace_routes[0][1])
            item["login"] = bool(item["urls"])
        return desired


    def field_label(field):
        return field.get("label") or field.get("id")


    def field_sort_key(field, login):
        label = field_label(field) or ""
        purpose = field.get("purpose")
        if purpose == "NOTES":
            return (2 if login else -1, 0, label)
        if purpose == "USERNAME":
            return (0, 0, label)
        if purpose == "PASSWORD":
            return (1, 0, label)
        credential_order = 0 if label.endswith("-username") else 1
        if not label.endswith(("-username", "-password")):
            credential_order = 2
        if label == "database" or label.startswith("database-"):
            return (3 if login else 2, credential_order, label)
        if label == "api-key" or label.startswith("api-key-"):
            return (4 if login else 3, credential_order, label)
        return (5 if login else 4, credential_order, label)


    def generated_field(label, *, value=None):
        native = label in {"password", "username"}
        field = {
            "id": label,
            "label": label,
            "type": "CONCEALED" if label.endswith(SECRET_SUFFIXES) else "STRING",
        }
        if native:
            field["purpose"] = label.upper()
        if value is None:
            field["generate"] = True
            field["recipe"] = {
                "characterSets": ["DIGITS", "LETTERS", "SYMBOLS"],
                "length": 48,
            }
        else:
            field["value"] = value
        return field


    def normalise_item(current, title, desired, vault_id):
        fields = current.get("fields", [])
        by_label = {}
        for field in fields:
            label = field_label(field)
            if not label:
                continue
            if label not in by_label or (
                not by_label[label].get("value") and field.get("value")
            ):
                by_label[label] = field
        migrated_sources = set()
        for old, new in desired["migrate"].items():
            if new not in by_label and old in by_label:
                migrated = dict(by_label[old])
                migrated["id"] = new
                migrated["label"] = new
                migrated.pop("purpose", None)
                by_label[new] = migrated
                migrated_sources.add(old)
        for label in desired["remove"]:
            if label in migrated_sources or label not in (
                desired["fields"]
                | desired["generate"]
                | set(desired["constants"])
                | set(desired["defaults"])
            ):
                by_label.pop(label, None)
        for label, value in desired["constants"].items():
            by_label[label] = generated_field(label, value=value)
        for label in (
            desired["fields"]
            | desired["generate"]
            | set(desired["constants"])
            | set(desired["defaults"])
        ):
            if label not in by_label or not by_label[label].get("value"):
                if label in desired["defaults"]:
                    by_label[label] = generated_field(label, value=desired["defaults"][label])
                elif label in desired["generate"]:
                    by_label[label] = generated_field(label)
                else:
                    continue
        for label in ("username", "password"):
            if label in by_label:
                if desired["login"]:
                    by_label[label]["id"] = label
                    by_label[label]["label"] = label
                    by_label[label]["purpose"] = label.upper()
                else:
                    by_label[label].pop("purpose", None)
        current.update(
            {
                "category": "LOGIN" if desired["login"] else "SERVER",
                "fields": sorted(
                    by_label.values(),
                    key=lambda field: field_sort_key(field, desired["login"]),
                ),
                "tags": ["Kubelab"],
                "title": title,
                "urls": [
                    {"href": url} | ({"primary": True} if index == 0 else {})
                    for index, url in enumerate(sorted(desired["urls"]))
                ],
                "vault": current.get("vault", {}) | {"id": vault_id},
            }
        )
        return current


    def comparable(item):
        ignored = {"createdAt", "lastEditedBy", "updatedAt", "version"}
        result = {key: value for key, value in item.items() if key not in ignored}
        result["urls"] = result.get("urls") or []
        return result


    def creation_payload(item, vault_id):
        return {
            key: item[key]
            for key in ("category", "fields", "sections", "tags", "title", "urls")
            if key in item
        } | {"vault": {"id": vault_id}}


    def update_eventually(path, item):
        for attempt in range(1, 7):
            try:
                return connect(path, body=item, method="PUT")
            except RuntimeError as error:
                if " returned 404:" not in str(error) or attempt == 6:
                    raise
                time.sleep(attempt * 5)


    def main():
        dry_run = is_dry_run()
        vaults = connect("/vaults")
        if len(vaults) != 1:
            raise RuntimeError(f"Connect token must expose exactly one vault; found {len(vaults)}")
        vault_id = vaults[0]["id"]
        desired = discover_items()
        summaries = connect(f"/vaults/{vault_id}/items")
        active = {summary["title"]: summary for summary in summaries}
        changed = 0
        managed_ids = set()
        for title, configuration in sorted(desired.items()):
            summary = active.get(title)
            if summary is None:
                candidates = [
                    active[candidate]
                    for candidate in sorted(configuration["adopt"])
                    if candidate in active
                ]
                if len(candidates) > 1:
                    titles = ", ".join(candidate["title"] for candidate in candidates)
                    raise RuntimeError(f"multiple adoption candidates for {title}: {titles}")
                if candidates:
                    summary = candidates[0]
            if summary:
                managed_ids.add(summary["id"])
            current = (
                connect(f"/vaults/{vault_id}/items/{summary['id']}")
                if summary
                else {"fields": [], "sections": []}
            )
            if externally_owned(current) and not configuration["adopt"]:
                continue
            wanted = normalise_item(copy.deepcopy(current), title, configuration, vault_id)
            if summary:
                if current.get("category") != wanted["category"]:
                    action = "replaced"
                    if not dry_run:
                        replacement = creation_payload(wanted, vault_id)
                        replacement["title"] = f"{title} (Kubelab replacement)"
                        created = connect(
                            f"/vaults/{vault_id}/items",
                            body=replacement,
                            method="POST",
                        )
                        created["title"] = title
                        update_eventually(
                            f"/vaults/{vault_id}/items/{created['id']}",
                            created,
                        )
                        connect(
                            f"/vaults/{vault_id}/items/{summary['id']}",
                            method="DELETE",
                        )
                    changed += 1
                    prefix = "would be " if dry_run else ""
                    print(f"{title} {prefix}{action}")
                    continue
                if comparable(current) == comparable(wanted):
                    continue
                action = "updated"
                if not dry_run:
                    connect(
                        f"/vaults/{vault_id}/items/{summary['id']}",
                        body=wanted,
                        method="PUT",
                    )
            else:
                action = "created"
                if not dry_run:
                    connect(f"/vaults/{vault_id}/items", body=wanted, method="POST")
            changed += 1
            prefix = "would be " if dry_run else ""
            print(f"{title} {prefix}{action}")
        try:
            archive_ready = applications_ready()
        except RuntimeError as error:
            archive_ready = False
            print(f"skipped archival because application readiness could not be read: {error}")
        else:
            if not archive_ready:
                print("skipped archival because applications are not fully reconciled")
        if not archive_ready:
            print(f"reconciled {len(desired)} items; changed {changed}")
            return
        for summary in sorted(summaries, key=lambda item: item["title"].lower()):
            title = summary["title"]
            if summary["id"] in managed_ids or title in desired:
                continue
            current = connect(f"/vaults/{vault_id}/items/{summary['id']}")
            if current.get("tags") != ["Kubelab"]:
                continue
            if not dry_run:
                connect(f"/vaults/{vault_id}/items/{summary['id']}", method="DELETE")
            changed += 1
            prefix = "would be " if dry_run else ""
            print(f"{title} {prefix}archived")
        print(f"reconciled {len(desired)} items; changed {changed}")


    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: onepassword-items
  namespace: external-secrets
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  schedule: "17 * * * *"
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          serviceAccountName: onepassword-items
          containers:
            - name: reconciler
              image: docker.io/library/python:3.14.0-alpine3.22@sha256:8373231e1e906ddfb457748bfc032c4c06ada8c759b7b62d9c73ec2a3c56e710
              command: [python, /app/reconcile.py]
              env:
                - name: OP_CONNECT_HOST
                  value: http://onepassword-connect:8080
                - name: OP_CONNECT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: token
                      name: onepassword-connect
              resources:
                limits:
                  memory: 128Mi
                requests:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - mountPath: /app
                  name: script
                  readOnly: true
                - mountPath: /tmp
                  name: temporary
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - configMap:
                name: onepassword-items
              name: script
            - emptyDir: {}
              name: temporary
