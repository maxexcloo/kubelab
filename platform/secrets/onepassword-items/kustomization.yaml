# Routes declare onepassword.excloo.dev/item independently of dashboard metadata.
# An optional url retains a login path; secret resources can link a login-item by name.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - reconciler.yaml
configMapGenerator:
  - name: onepassword-items
    namespace: external-secrets
    files:
      - reconcile.py
generatorOptions:
  disableNameSuffixHash: true
