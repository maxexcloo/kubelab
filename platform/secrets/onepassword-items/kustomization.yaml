# Item UUIDs own credential identity; only an explicit onepassword.excloo.dev/title sets
# an item title. Routes alias it to their gethomepage.dev/name so the names stay in step.
# Declared route URLs are authoritative once every Flux Kustomization is current.
# Route category defaults to LOGIN; SERVER keeps integration secrets without login fields.
# Item URLs are route FQDNs; secret resources can link a login-item by UUID.
# Secret annotations configure their onepassword.excloo.dev/item, else their namespace route's item.
# A values map copies declared fields from a Secret so one write keeps an item current.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cron-job.yaml
  - rbac.yaml
configMapGenerator:
  - name: onepassword-items
    namespace: external-secrets
    files:
      - reconcile.py
generatorOptions:
  disableNameSuffixHash: true
