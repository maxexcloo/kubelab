# References are item titles in the cluster vault; the reconciler never renames items
# and creates one only to replace a PushSecret-created item of the wrong category.
# Routes alias their item to gethomepage.dev/name so the names stay in step.
# Declared route URLs are authoritative once every Flux Kustomization is current.
# Route category defaults to LOGIN; SERVER keeps integration secrets without login fields.
# Item URLs are route FQDNs; secret resources can link a login-item by title.
# Secret annotations configure their onepassword.excloo.dev/item, else their namespace route's item.
# owner-email-fields default to the shared owner email; extracted items keep every field.
# Field names set STRING or CONCEALED types; concealed-fields conceals neutral names.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cron-job.yaml
  - rbac.yaml
configMapGenerator:
  - name: onepassword-items
    namespace: external-secrets
    files:
      - reconcile.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
