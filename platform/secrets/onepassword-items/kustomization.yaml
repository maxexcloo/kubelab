# Item UUIDs own credential identity; route display names own their titles by default.
# An explicit onepassword.excloo.dev/title overrides the default or names a non-routed item.
# Declared route URLs are authoritative once Flux apps are current.
# Route category defaults to LOGIN; SERVER keeps integration secrets without login fields.
# An optional url retains a login path; secret resources can link a login-item by UUID.
# A values map copies declared fields from a Secret so one write keeps an item current.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - reconciler.yaml
configMapGenerator:
  - name: onepassword-items
    namespace: external-secrets
    files:
      - reconcile.py
generatorOptions:
  disableNameSuffixHash: true
