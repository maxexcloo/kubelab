apiVersion: batch/v1
kind: CronJob
metadata:
  name: onepassword-items
  namespace: external-secrets
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  # New apps wait on this run for their item fields.
  schedule: "*/5 * * * *"
  timeZone: ${time_zone}
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          automountServiceAccountToken: true
          # Failed pods remain with their logs; OnFailure pods go with the Job.
          restartPolicy: Never
          serviceAccountName: onepassword-items
          containers:
            - name: reconciler
              image: docker.io/library/python:3.15.0-alpine3.24
              command: [python, /app/reconcile.py]
              env:
                - name: OP_CONNECT_HOST
                  value: http://onepassword-connect.invalid
                - name: OP_CONNECT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: token
                      name: onepassword-connect
                - name: OWNER_EMAIL
                  value: ${owner_email}
              resources:
                limits:
                  memory: 128Mi
                requests:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - mountPath: /app
                  name: script
                  readOnly: true
                - mountPath: /tmp
                  name: temporary
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - configMap:
                name: onepassword-items
              name: script
            - emptyDir: {}
              name: temporary
