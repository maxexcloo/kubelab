apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-role-binding.yaml
  - helm-release.yaml
  - namespace.yaml
  - network-policy.yaml
  - oidc-cluster-role-binding.yaml
  - route.yaml
  - service-account.yaml
  - source.yaml
replacements:
  - source:
      kind: HTTPRoute
      fieldPath: spec.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.config.oidc.callbackURL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HTTPRoute
        fieldPaths:
          - metadata.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
