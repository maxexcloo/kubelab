apiVersion: automation.excloo.dev/v1alpha1
kind: PocketIDClient
metadata:
  name: headlamp
spec:
  client:
    description: Kubernetes Dashboard
    # Matches the route's Homepage icon.
    icon: sh-headlamp
    id: headlamp
    isPublic: true
    launchURL: https://headlamp.${cluster_name}.excloo.dev
    name: Headlamp
    pkceEnabled: true
    callbackURLs:
      - https://headlamp.${cluster_name}.excloo.dev/oidc-callback
  crossplane:
    compositionRef:
      name: pocket-id-public-client
