apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 30m
  releaseName: headlamp
  chart:
    spec:
      chart: headlamp
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      version: 0.44.0
  values:
    automountServiceAccountToken: false
    clusterRoleBinding:
      create: false
    config:
      inCluster: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsGroup: 101
      runAsNonRoot: true
      runAsUser: 100
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
