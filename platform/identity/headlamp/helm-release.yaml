apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      version: 0.44.0
  releaseName: headlamp
  values:
    config:
      inCluster: true
    clusterRoleBinding:
      create: false
    automountServiceAccountToken: false
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
