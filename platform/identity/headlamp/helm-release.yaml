apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 30m
  releaseName: headlamp
  chart:
    spec:
      chart: headlamp
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      version: 0.46.0
  values:
    automountServiceAccountToken: true
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node.excloo.dev/network
                  operator: In
                  values:
                    - internal
    clusterRoleBinding:
      create: false
    config:
      inCluster: true
      # OIDC adds a sign-in choice alongside Kubernetes token authentication.
      oidc:
        callbackURL: https://app.invalid/oidc-callback
        clientID: headlamp
        issuerURL: https://identity.invalid
        scopes: profile,email,groups
        usePKCE: true
        secret:
          create: false
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsGroup: 101
      runAsNonRoot: true
      runAsUser: 100
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
