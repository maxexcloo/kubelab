apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - settings.yaml
replacements:
  # The Minilab domain is a subdomain of the public domain, so resolve it first.
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.public_domain
    targets:
      - select:
          kind: ConfigMap
          name: shared-settings
        fieldPaths:
          - data.minilab_domain
        options:
          delimiter: mini.
          index: 1
      - select:
          kind: Certificate
          name: wildcard
          namespace: networking
        fieldPaths:
          - spec.dnsNames.0
        options:
          delimiter: "*."
          index: 1
      - select:
          kind: CloudflareWAFPolicy
          name: redlib
          namespace: redlib
        fieldPaths:
          - spec.zoneName
      - select:
          kind: HelmRelease
          name: external-dns-private
          namespace: external-dns
        fieldPaths:
          - spec.values.domainFilters.0
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.beszel_host
    targets:
      - select:
          kind: PrivateDNSRecord
          name: beszel
          namespace: beszel
        fieldPaths:
          - spec.hostname
      - select:
          kind: PocketIDClient
          name: beszel
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: beszel
          namespace: beszel
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.APP_URL
          - spec.values.route.private.annotations.[gethomepage.dev/href]
          - spec.values.route.private.annotations.[gethomepage.dev/widget.url]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: beszel
          namespace: beszel
        fieldPaths:
          - spec.values.route.private.hostnames.0
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.control_d_profile
    targets:
      - select:
          kind: CompositeResourceDefinition
          name: privatednsrecords.automation.excloo.dev
        fieldPaths:
          - spec.versions.0.schema.openAPIV3Schema.properties.spec.properties.controlDProfileID.default
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.headlamp_client_id
    targets:
      - select:
          kind: HelmRelease
          name: headlamp
          namespace: headlamp
        fieldPaths:
          - spec.values.config.oidc.clientID
      - select:
          kind: PocketIDClient
          name: headlamp
        fieldPaths:
          - spec.client.id
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.homelab_branch
    targets:
      - select:
          kind: HelmRelease
          name: homepage
          namespace: homepage
        fieldPaths:
          - spec.values.controllers.homepage.initContainers.endpoints.env.HOMELAB_BRANCH
        options:
          create: true
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.homelab_repository
    targets:
      - select:
          kind: HelmRelease
          name: homepage
          namespace: homepage
        fieldPaths:
          - spec.values.controllers.homepage.initContainers.endpoints.env.HOMELAB_REPOSITORY
        options:
          create: true
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.identity_host
    targets:
      - select:
          kind: ExternalSecret
          name: papra
          namespace: papra
        fieldPaths:
          - spec.target.template.data.AUTH_PROVIDERS_CUSTOMS
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: actual-budget
          namespace: actual-budget
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.ACTUAL_OPENID_DISCOVERY_URL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: aiometadata
          namespace: aiometadata
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.OIDC_ISSUER
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: aiostreams
          namespace: aiostreams
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.AIOSTREAMS_OIDC_ISSUER
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: headlamp
          namespace: headlamp
        fieldPaths:
          - spec.values.config.oidc.issuerURL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: studio
          namespace: studio
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.STUDIO_OIDC_ISSUER
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: larapaper
          namespace: larapaper
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.OIDC_ENDPOINT
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: librechat
          namespace: librechat
        fieldPaths:
          - spec.values.librechat.configEnv.OPENID_ISSUER
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: linkwarden
          namespace: linkwarden
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.KEYCLOAK_ISSUER
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: litellm
          namespace: litellm
        fieldPaths:
          - spec.values.envVars.GENERIC_AUTHORIZATION_ENDPOINT
          - spec.values.envVars.GENERIC_TOKEN_ENDPOINT
          - spec.values.envVars.GENERIC_USERINFO_ENDPOINT
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: miniflux
          namespace: miniflux
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.OAUTH2_OIDC_DISCOVERY_ENDPOINT
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: pocket-id
          namespace: pocket-id
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.APP_URL
          - spec.values.route.public.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: pocket-id
          namespace: pocket-id
        fieldPaths:
          - spec.values.route.private.hostnames.0
          - spec.values.route.public.hostnames.0
      - select:
          kind: HelmRelease
          name: romm
          namespace: romm
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.OIDC_SERVER_APPLICATION_URL
          - spec.values.controllers.main.containers.main.env.OIDC_SERVER_METADATA_URL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: shelfmark
          namespace: shelfmark
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.OIDC_DISCOVERY_URL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: victoria-metrics-k8s-stack
          namespace: observability
        fieldPaths:
          - spec.values.grafana.[grafana.ini].[auth.generic_oauth].api_url
          - spec.values.grafana.[grafana.ini].[auth.generic_oauth].auth_url
          - spec.values.grafana.[grafana.ini].[auth.generic_oauth].token_url
        options:
          delimiter: /
          index: 2
      - select:
          kind: PrivateDNSRecord
          name: pocket-id
          namespace: pocket-id
        fieldPaths:
          - spec.hostname
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.mail_domain
    targets:
      - select:
          kind: HelmRelease
          name: linkwarden
          namespace: linkwarden
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.EMAIL_FROM
        options:
          delimiter: "@"
          index: 1
      - select:
          kind: HelmRelease
          name: pocket-id
          namespace: pocket-id
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.SMTP_FROM
        options:
          delimiter: "@"
          index: 1
      - select:
          kind: HelmRelease
          name: romm
          namespace: romm
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.SMTP_FROM
        options:
          delimiter: "@"
          index: 1
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.minilab_domain
    targets:
      - select:
          kind: Certificate
          name: wildcard
          namespace: networking
        fieldPaths:
          - spec.dnsNames.1
        options:
          delimiter: "*."
          index: 1
      - select:
          kind: Kustomization
          name: minilab
          namespace: flux-system
        fieldPaths:
          - spec.postBuild.substitute.MINILAB_DOMAIN
        options:
          create: true
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.owner_email
    targets:
      - select:
          kind: ClusterIssuer
          name: letsencrypt-dns01
        fieldPaths:
          - spec.acme.email
      - select:
          kind: CronJob
          name: onepassword-items
          namespace: external-secrets
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=reconciler].env.[name=OWNER_EMAIL].value
      - select:
          kind: HelmRelease
          name: librechat
          namespace: librechat
        fieldPaths:
          - spec.values.librechat.configEnv.OPENID_ADMIN_ROLE
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.pocket_id_api_authority
    targets:
      - select:
          kind: Composition
          name: pocket-id-client
        fieldPaths:
          - spec.pipeline.[step=patch-and-transform].input.resources.[name=client].base.spec.forProvider.payload.baseUrl
          - spec.pipeline.[step=patch-and-transform].input.resources.[name=client-secret].base.spec.forProvider.payload.baseUrl
          - spec.pipeline.[step=patch-and-transform].input.resources.[name=client-secret].patches.[toFieldPath=spec.forProvider.payload.baseUrl].transforms.0.string.fmt
          - spec.pipeline.[step=patch-and-transform].input.resources.[name=group-access].base.spec.forProvider.payload.baseUrl
          - spec.pipeline.[step=patch-and-transform].input.resources.[name=group-access].patches.[toFieldPath=spec.forProvider.payload.baseUrl].transforms.0.string.fmt
        options:
          delimiter: /
          index: 2
      - select:
          kind: Request
          name: pocket-id-group-all-services
          namespace: pocket-id
        fieldPaths:
          - spec.forProvider.payload.baseUrl
        options:
          delimiter: /
          index: 2
      - select:
          kind: Request
          name: pocket-id-group-all-services-details
          namespace: pocket-id
        fieldPaths:
          - spec.forProvider.payload.baseUrl
        options:
          delimiter: /
          index: 2
      - select:
          kind: Request
          name: pocket-id-group-books
          namespace: pocket-id
        fieldPaths:
          - spec.forProvider.payload.baseUrl
        options:
          delimiter: /
          index: 2
      - select:
          kind: Request
          name: pocket-id-group-books-details
          namespace: pocket-id
        fieldPaths:
          - spec.forProvider.payload.baseUrl
        options:
          delimiter: /
          index: 2
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.time_zone
    targets:
      - select:
          kind: CronJob
        fieldPaths:
          - spec.timeZone
      - select:
          kind: Deployment
          name: librechat-admin
          namespace: librechat-admin
        fieldPaths:
          - spec.template.spec.containers.[name=admin].env.[name=TZ].value
      - select:
          kind: HelmRelease
          name: actual-budget
          namespace: actual-budget
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: actual-up
          namespace: actual-up
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: aiometadata
          namespace: aiometadata
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: atvloadly
          namespace: atvloadly
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: beszel
          namespace: beszel
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: bichon
          namespace: bichon
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: bookorbit
          namespace: bookorbit
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: cliproxyapi
          namespace: cliproxyapi
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: studio
          namespace: studio
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: immich
          namespace: immich
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: linkwarden
          namespace: linkwarden
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: miniflux
          namespace: miniflux
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: papra
          namespace: papra
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: romm
          namespace: romm
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: shelfmark
          namespace: shelfmark
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: syncthing
          namespace: syncthing
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: larapaper
          namespace: larapaper
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.APP_TIMEZONE
      - select:
          kind: HelmRelease
          name: librechat
          namespace: librechat
        fieldPaths:
          - spec.values.librechat.configEnv.TZ
      - select:
          kind: HelmRelease
          name: linkwarden
          namespace: linkwarden
        fieldPaths:
          - spec.values.controllers.meilisearch.containers.meilisearch.env.TZ
      - select:
          kind: HelmRelease
          name: litellm
          namespace: litellm
        fieldPaths:
          - spec.values.envVars.TZ
