apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - settings.yaml
replacements:
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.beszel_host
    targets:
      - select:
          kind: PrivateDNSRecord
          name: beszel
          namespace: beszel
        fieldPaths:
          - spec.hostname
      - select:
          kind: PocketIDClient
          name: beszel
          namespace: beszel
        fieldPaths:
          - spec.client.callbackURLs.0
          - spec.client.launchURL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: beszel
          namespace: beszel
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.APP_URL
          - spec.values.route.private.annotations.[gethomepage.dev/href]
          - spec.values.route.private.annotations.[gethomepage.dev/widget.url]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: beszel
          namespace: beszel
        fieldPaths:
          - spec.values.route.private.hostnames.0
      - select:
          kind: HelmRelease
          name: homepage
          namespace: homepage
        fieldPaths:
          - spec.values.controllers.homepage.initContainers.endpoints.env.HOMEPAGE_BESZEL_URL
        options:
          delimiter: /
          index: 2
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.control_d_profile
    targets:
      - select:
          kind: CompositeResourceDefinition
          name: privatednsrecords.automation.excloo.dev
        fieldPaths:
          - spec.versions.0.schema.openAPIV3Schema.properties.spec.properties.controlDProfileID.default
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.headlamp_client_id
    targets:
      - select:
          kind: HelmRelease
          name: headlamp
          namespace: headlamp
        fieldPaths:
          - spec.values.config.oidc.clientID
      - select:
          kind: PocketIDClient
          name: headlamp
          namespace: headlamp
        fieldPaths:
          - spec.client.id
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.homelab_branch
    targets:
      - select:
          kind: HelmRelease
          name: homepage
          namespace: homepage
        fieldPaths:
          - spec.values.controllers.homepage.initContainers.endpoints.env.HOMELAB_BRANCH
        options:
          create: true
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.homelab_repository
    targets:
      - select:
          kind: HelmRelease
          name: homepage
          namespace: homepage
        fieldPaths:
          - spec.values.controllers.homepage.initContainers.endpoints.env.HOMELAB_REPOSITORY
        options:
          create: true
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.identity_host
    targets:
      - select:
          kind: ExternalSecret
          name: papra
          namespace: papra
        fieldPaths:
          - spec.target.template.data.AUTH_PROVIDERS_CUSTOMS
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: actual-budget
          namespace: actual-budget
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.ACTUAL_OPENID_DISCOVERY_URL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: aiometadata
          namespace: aiometadata
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.OIDC_ISSUER
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: aiostreams
          namespace: aiostreams
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.AIOSTREAMS_OIDC_ISSUER
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: headlamp
          namespace: headlamp
        fieldPaths:
          - spec.values.config.oidc.issuerURL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: larapaper
          namespace: larapaper
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.OIDC_ENDPOINT
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: librechat
          namespace: librechat
        fieldPaths:
          - spec.values.librechat.configEnv.OPENID_ISSUER
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: linkwarden
          namespace: linkwarden
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.KEYCLOAK_ISSUER
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: litellm
          namespace: litellm
        fieldPaths:
          - spec.values.envVars.GENERIC_AUTHORIZATION_ENDPOINT
          - spec.values.envVars.GENERIC_TOKEN_ENDPOINT
          - spec.values.envVars.GENERIC_USERINFO_ENDPOINT
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: miniflux
          namespace: miniflux
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.OAUTH2_OIDC_DISCOVERY_ENDPOINT
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: pocket-id
          namespace: pocket-id
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.APP_URL
          - spec.values.route.public.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: pocket-id
          namespace: pocket-id
        fieldPaths:
          - spec.values.route.private.hostnames.0
          - spec.values.route.public.hostnames.0
      - select:
          kind: HelmRelease
          name: romm
          namespace: romm
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.OIDC_SERVER_APPLICATION_URL
          - spec.values.controllers.main.containers.main.env.OIDC_SERVER_METADATA_URL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: shelfmark
          namespace: shelfmark
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.OIDC_DISCOVERY_URL
        options:
          delimiter: /
          index: 2
      - select:
          kind: HelmRelease
          name: victoria-metrics-k8s-stack
          namespace: observability
        fieldPaths:
          - spec.values.grafana.[grafana.ini].[auth.generic_oauth].api_url
          - spec.values.grafana.[grafana.ini].[auth.generic_oauth].auth_url
          - spec.values.grafana.[grafana.ini].[auth.generic_oauth].token_url
        options:
          delimiter: /
          index: 2
      - select:
          kind: PrivateDNSRecord
          name: pocket-id
          namespace: pocket-id
        fieldPaths:
          - spec.hostname
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.owner_email
    targets:
      - select:
          kind: ClusterIssuer
          name: letsencrypt-dns01
        fieldPaths:
          - spec.acme.email
      # Defaults are JSON strings; the index counts quote-delimited tokens.
      - select:
          kind: ExternalSecret
          name: actual-up
          namespace: actual-up
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: '"'
          index: 3
      - select:
          kind: ExternalSecret
          name: aiostreams
          namespace: aiostreams
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: '"'
          index: 3
      - select:
          kind: ExternalSecret
          name: beszel
          namespace: beszel
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: '"'
          index: 3
      - select:
          kind: ExternalSecret
          name: bookorbit
          namespace: bookorbit
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: '"'
          index: 3
      - select:
          kind: ExternalSecret
          name: bookorbit
          namespace: bookorbit
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: '"'
          index: 7
      - select:
          kind: ExternalSecret
          name: immich-login
          namespace: immich
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: '"'
          index: 3
      - select:
          kind: ExternalSecret
          name: librechat
          namespace: librechat
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: '"'
          index: 7
      - select:
          kind: ExternalSecret
          name: linkwarden
          namespace: linkwarden
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: '"'
          index: 3
      - select:
          kind: ExternalSecret
          name: litellm
          namespace: litellm
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: '"'
          index: 27
      - select:
          kind: ExternalSecret
          name: miniflux
          namespace: miniflux
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: '"'
          index: 3
      - select:
          kind: ExternalSecret
          name: grafana
          namespace: observability
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: '"'
          index: 3
      - select:
          kind: ExternalSecret
          name: syncthing
          namespace: syncthing
        fieldPaths:
          - metadata.annotations.[onepassword.excloo.dev/defaults]
        options:
          delimiter: '"'
          index: 3
      - select:
          kind: HelmRelease
          name: librechat
          namespace: librechat
        fieldPaths:
          - spec.values.librechat.configEnv.OPENID_ADMIN_ROLE
  - source:
      kind: ConfigMap
      name: shared-settings
      fieldPath: data.time_zone
    targets:
      - select:
          kind: CronJob
        fieldPaths:
          - spec.timeZone
      - select:
          kind: Deployment
          name: librechat-admin
          namespace: librechat-admin
        fieldPaths:
          - spec.template.spec.containers.[name=admin].env.[name=TZ].value
      - select:
          kind: HelmRelease
          name: actual-budget
          namespace: actual-budget
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: actual-up
          namespace: actual-up
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: aiometadata
          namespace: aiometadata
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: atvloadly
          namespace: atvloadly
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: beszel
          namespace: beszel
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: bichon
          namespace: bichon
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: bookorbit
          namespace: bookorbit
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: cliproxyapi
          namespace: cliproxyapi
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: immich
          namespace: immich
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: linkwarden
          namespace: linkwarden
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: miniflux
          namespace: miniflux
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: papra
          namespace: papra
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: romm
          namespace: romm
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: shelfmark
          namespace: shelfmark
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: syncthing
          namespace: syncthing
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.TZ
      - select:
          kind: HelmRelease
          name: larapaper
          namespace: larapaper
        fieldPaths:
          - spec.values.controllers.main.containers.main.env.APP_TIMEZONE
      - select:
          kind: HelmRelease
          name: librechat
          namespace: librechat
        fieldPaths:
          - spec.values.librechat.configEnv.TZ
      - select:
          kind: HelmRelease
          name: linkwarden
          namespace: linkwarden
        fieldPaths:
          - spec.values.controllers.meilisearch.containers.meilisearch.env.TZ
      - select:
          kind: HelmRelease
          name: litellm
          namespace: litellm
        fieldPaths:
          - spec.values.envVars.TZ
