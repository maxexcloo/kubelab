# Flux substitutes these cross-cluster ${variables} when it builds each cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: _
spec:
  postBuild:
    substitute:
      identity_host: id.excloo.com
      mail_domain: excloo.dev
      owner_email: max@excloo.com
      public_domain: excloo.com
      time_zone: Australia/Sydney
