apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: observability
spec:
  interval: 30m
  releaseName: victoria-metrics-k8s-stack
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
      version: 0.99.0
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
    - name: local-path-provisioner
      namespace: storage
    - name: onepassword-connect
      namespace: external-secrets
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    alertmanager:
      config:
        route:
          group_by: [alertname]
          receiver: owner
        receivers:
          - name: owner
            email_configs:
              - auth_password_file: /etc/vm/secrets/alertmanager-resend/password
                auth_username: resend
                from: kubelab@${mail_domain}
                send_resolved: true
                smarthost: smtp.resend.com:587
                to: ${owner_email}
      enabled: true
      spec:
        nodeSelector:
          node.excloo.dev/network: internal
        secrets:
          - alertmanager-resend
        selectAllByDefault: false
    coreDns:
      enabled: true
    defaultDashboards:
      enabled: false
    defaultRules:
      enabled: false
    extraObjects:
      - apiVersion: operator.victoriametrics.com/v1beta1
        kind: VMPodScrape
        metadata:
          name: cnpg-backups
        spec:
          namespaceSelector:
            any: true
          podMetricsEndpoints:
            - metricRelabelConfigs:
                - action: keep
                  sourceLabels: [__name__]
                  regex: barman_cloud_cloudnative_pg_io_last_available_backup_timestamp|cnpg_collector_pg_wal_archive_status
              port: metrics
              relabelConfigs:
                - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
                  targetLabel: cnpg_cluster
                - replacement: cnpg-backups
                  targetLabel: job
          selector:
            matchLabels:
              cnpg.io/instanceRole: primary
              cnpg.io/podRole: instance
    extraRules:
      backups:
        groups:
          - name: backups
            rules:
              - alert: FileBackupOverdue
                expr: |
                  time() - (
                    kube_cronjob_status_last_successful_time{cronjob=~".+-backup"}
                    or on (cluster, namespace, cronjob)
                    kube_cronjob_created{cronjob=~".+-backup"}
                  ) > 30 * 3600
                for: 5m
                annotations:
                  summary: File backup for {{ $labels.namespace }} is more than 30 hours old
              - alert: BackupWorkloadStranded
                expr: |
                  kube_deployment_annotations{annotation_backup_excloo_dev_resume_state!=""}
                  unless on (cluster, namespace)
                  kube_cronjob_status_active{cronjob="state-backup"} > 0
                for: 5m
                annotations:
                  summary: Backup has not resumed {{ $labels.namespace }}/{{ $labels.deployment }}
              - alert: PostgreSQLBackupOverdue
                expr: |
                  time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 30 * 3600
                  or (
                    up{job="cnpg-backups"}
                    unless on (cluster, namespace, pod)
                    barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
                  )
                for: 15m
                annotations:
                  summary: PostgreSQL backup for {{ $labels.cnpg_cluster }} is overdue or its metrics are unreachable
              - alert: PostgreSQLWALArchivingStalled
                expr: cnpg_collector_pg_wal_archive_status{value="ready"} > 0
                for: 15m
                annotations:
                  summary: WAL is waiting to be archived for {{ $labels.cnpg_cluster }}
    grafana:
      automountServiceAccountToken: false
      enabled: true
      plugins:
        - victoriametrics-logs-datasource@0.34.0@https://github.com/VictoriaMetrics/victorialogs-datasource/releases/download/v0.34.0/victoriametrics-logs-datasource-v0.34.0.zip
      admin:
        existingSecret: grafana
        passwordKey: password
        userKey: username
      containerSecurityContext:
        readOnlyRootFilesystem: true
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: VictoriaLogs
              access: proxy
              isDefault: false
              type: victoriametrics-logs-datasource
              uid: VictoriaLogs
              url: http://vlsingle-victoria-metrics-k8s-stack.observability.svc:9428
            - name: VictoriaMetrics
              access: proxy
              isDefault: true
              type: prometheus
              uid: VictoriaMetrics
              url: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428
      deploymentStrategy:
        rollingUpdate: null
        type: Recreate
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
          secretKeyRef:
            key: oidc-client-id
            name: grafana-oidc
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            key: oidc-client-secret
            name: grafana-oidc
      grafana.ini:
        analytics:
          check_for_updates: false
          reporting_enabled: false
        auth:
          disable_login_form: false
          # Link password accounts to identities from the trusted Pocket ID provider.
          oauth_allow_insecure_email_lookup: true
        auth.basic:
          enabled: true
        auth.generic_oauth:
          allow_sign_up: true
          api_url: https://${identity_host}/api/oidc/userinfo
          auth_url: https://${identity_host}/authorize
          auto_login: true
          enabled: true
          name: Excloo ID
          scopes: openid profile email
          token_url: https://${identity_host}/api/oidc/token
          use_pkce: true
        security:
          disable_gravatar: true
        server:
          domain: ${grafana_host}
          root_url: https://${grafana_host}
        users:
          auto_assign_org_role: Admin
          default_theme: system
      initChownData:
        enabled: false
      persistence:
        accessModes: [ReadWriteOnce]
        enabled: true
        size: 1Gi
        storageClassName: local-path
        type: pvc
      nodeSelector:
        node.excloo.dev/network: internal
      rbac:
        create: false
        namespaced: true
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 512Mi
      sidecar:
        dashboards:
          enabled: false
        datasources:
          enabled: false
    kube-state-metrics:
      collectors:
        [
          cronjobs,
          daemonsets,
          deployments,
          endpoints,
          endpointslices,
          horizontalpodautoscalers,
          ingresses,
          jobs,
          leases,
          limitranges,
          namespaces,
          networkpolicies,
          nodes,
          persistentvolumeclaims,
          persistentvolumes,
          poddisruptionbudgets,
          pods,
          replicasets,
          replicationcontrollers,
          resourcequotas,
          services,
          statefulsets,
          storageclasses,
          validatingwebhookconfigurations,
          volumeattachments,
        ]
      enabled: true
      metricAnnotationsAllowList:
        - deployments=[backup.excloo.dev/resume-state]
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 128Mi
      nodeSelector:
        node.excloo.dev/network: internal
    kubeApiServer:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              interval: 60s
              port: https
              scheme: https
              metricRelabelConfigs:
                # Retain request latency, errors, storage and process health.
                - action: keep
                  regex: apiserver_(current_inflight_requests|registered_watchers|request_duration_seconds_(bucket|count|sum)|request_total|storage_objects|storage_size_bytes)|etcd_object_counts|go_(goroutines|memstats_.*)|process_.*
                  sourceLabels: [__name__]
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubelet:
      vmScrapes:
        # cAdvisor already supplies container CPU and memory metrics.
        resources:
          enabled: false
    prometheus-node-exporter:
      enabled: false
    syncJob:
      enabled: false
    victoria-metrics-operator:
      crds:
        cleanup:
          enabled: false
      env:
        - name: VM_ENABLESTRICTSECURITY
          value: "true"
      nodeSelector:
        node.excloo.dev/network: internal
      operator:
        disable_prometheus_converter: true
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
    vlagent:
      enabled: true
      namespaceOverride: observability-node
      spec:
        useStrictSecurity: true
        k8sCollector:
          enabled: true
        # Collect logs from dedicated nodes too.
        tolerations:
          - key: node.excloo.dev/dedicated
            operator: Exists
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: 7d
        useStrictSecurity: true
        extraArgs:
          memory.allowedPercent: "40"
        nodeSelector:
          node.excloo.dev/network: internal
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        storage:
          accessModes: [ReadWriteOnce]
          storageClassName: local-path
          resources:
            requests:
              storage: 10Gi
    vmagent:
      enabled: true
      spec:
        scrapeInterval: 60s
        useStrictSecurity: true
        externalLabels:
          cluster: ${cluster_name}
        nodeSelector:
          node.excloo.dev/network: internal
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 384Mi
    vmalert:
      enabled: true
      spec:
        nodeSelector:
          node.excloo.dev/network: internal
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: 7d
        useStrictSecurity: true
        nodeSelector:
          node.excloo.dev/network: internal
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
        storage:
          accessModes: [ReadWriteOnce]
          storageClassName: local-path
          resources:
            requests:
              storage: 10Gi
