apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vlagent-victoria-metrics-k8s-stack
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list]
