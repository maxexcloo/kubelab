apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pushover
  namespace: observability
spec:
  data:
    - remoteRef:
        key: &item Pushover
        property: app-token
      secretKey: app-token
    - remoteRef:
        key: *item
        property: user-key
      secretKey: user-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-pushover
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-resend
  namespace: observability
spec:
  data:
    - remoteRef:
        key: Kubelab Alertmanager
        property: provider-resend-api-key
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-resend
