apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-resend
  namespace: observability
spec:
  data:
    - remoteRef:
        key: Kubelab Alertmanager
        property: provider-resend-api-key
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-resend
