apiVersion: automation.excloo.dev/v1alpha1
kind: PocketIDClient
metadata:
  name: grafana
spec:
  client:
    callbackURLs:
      - https://${grafana_host}/login/generic_oauth
    description: Infrastructure Observability
    # Matches the route's Homepage icon.
    icon: sh-grafana
    id: grafana
    launchURL: https://${grafana_host}
    name: Grafana
    pkceEnabled: true
  item: Grafana
