apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
spec:
  interval: 30m
  releaseName: victoria-metrics-k8s-stack

  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      interval: 24h
      version: 0.91.0

      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system

  install:
    crds: CreateReplace

  upgrade:
    crds: CreateReplace

  values:
    alertmanager:
      enabled: false

    coreDns:
      enabled: true

    defaultDashboards:
      enabled: false

    defaultRules:
      enabled: false

    grafana:
      automountServiceAccountToken: false
      enabled: true
      plugins: [victoriametrics-logs-datasource@0.30.1]

      admin:
        existingSecret: grafana-admin
        passwordKey: admin-password
        userKey: admin-user

      containerSecurityContext:
        readOnlyRootFilesystem: true

      datasources:
        datasources.yaml:
          apiVersion: 1

          datasources:
            - name: VictoriaLogs
              access: proxy
              isDefault: false
              type: victoriametrics-logs-datasource
              uid: VictoriaLogs
              url: http://vlsingle-victoria-metrics-k8s-stack.observability.svc:9428
            - name: VictoriaMetrics
              access: proxy
              isDefault: true
              type: prometheus
              uid: VictoriaMetrics
              url: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428

      grafana.ini:
        analytics:
          check_for_updates: false
          reporting_enabled: false

        security:
          disable_gravatar: true

        users:
          default_theme: system

      initChownData:
        enabled: false

      resources:
        limits:
          memory: 512Mi

        requests:
          cpu: 50m
          memory: 128Mi

      rbac:
        create: false
        namespaced: true

      sidecar:
        dashboards:
          enabled: false

        datasources:
          enabled: false

    kube-state-metrics:
      collectors:
        [
          cronjobs,
          daemonsets,
          deployments,
          endpoints,
          endpointslices,
          horizontalpodautoscalers,
          ingresses,
          jobs,
          leases,
          limitranges,
          namespaces,
          networkpolicies,
          nodes,
          persistentvolumeclaims,
          persistentvolumes,
          poddisruptionbudgets,
          pods,
          replicasets,
          replicationcontrollers,
          resourcequotas,
          services,
          statefulsets,
          storageclasses,
          validatingwebhookconfigurations,
          volumeattachments,
        ]
      enabled: true

      resources:
        limits:
          memory: 128Mi

        requests:
          cpu: 20m
          memory: 32Mi

    kubeApiServer:
      enabled: true

    kubeControllerManager:
      enabled: false

    kubeEtcd:
      enabled: false

    kubeScheduler:
      enabled: false

    prometheus-node-exporter:
      enabled: false

    syncJob:
      enabled: false

    victoria-metrics-operator:
      watchNamespaces: [observability]

      crds:
        cleanup:
          enabled: false

      env:
        - name: VM_ENABLESTRICTSECURITY
          value: "true"

      operator:
        disable_prometheus_converter: true

      resources:
        limits:
          memory: 256Mi

        requests:
          cpu: 50m
          memory: 64Mi

    vlagent:
      enabled: true

      spec:
        useStrictSecurity: true

        k8sCollector:
          enabled: true

        resources:
          limits:
            memory: 256Mi

          requests:
            cpu: 50m
            memory: 64Mi

    vlsingle:
      enabled: true

      spec:
        retentionPeriod: 7d
        storage: null
        useStrictSecurity: true

        resources:
          limits:
            memory: 512Mi

          requests:
            cpu: 50m
            memory: 128Mi

    vmalert:
      enabled: false

    vmagent:
      enabled: true

      spec:
        useStrictSecurity: true

        externalLabels:
          cluster: _

        resources:
          limits:
            memory: 256Mi

          requests:
            cpu: 50m
            memory: 64Mi

    vmsingle:
      enabled: true

      spec:
        retentionPeriod: 7d
        storage: null
        useStrictSecurity: true

        resources:
          limits:
            memory: 1Gi

          requests:
            cpu: 100m
            memory: 256Mi
