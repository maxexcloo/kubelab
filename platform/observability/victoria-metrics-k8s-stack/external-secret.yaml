apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: grafana/password
      secretKey: password

  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword

  target:
    deletionPolicy: Retain
    name: grafana-admin
    template:
      data:
        admin-password: "{{ .password }}"
        admin-user: admin
