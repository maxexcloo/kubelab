apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: observability
spec:
  interval: 30m
  releaseName: metrics-server
  chart:
    spec:
      chart: metrics-server
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
      version: 3.14.0
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  values:
    apiService:
      insecureSkipTLSVerify: false
    args:
      # Talos kubelets use self-signed serving certificates without IP SANs.
      - --kubelet-insecure-tls
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 200Mi
    tls:
      type: cert-manager
