apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-source.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: controller
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  limits:
                    cpu: null
                  requests:
                    memory: 128Mi
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=flux
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --requeue-dependency=1s
    target:
      kind: Deployment
      name: (helm|kustomize)-controller
  # Fail post-build substitution on undefined variables instead of rendering empty values,
  # and apply a new revision without waiting out health checks still running for an older one.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --feature-gates=CancelHealthCheckOnNewRevision=true,StrictPostBuildSubstitutions=true
    target:
      kind: Deployment
      name: kustomize-controller
