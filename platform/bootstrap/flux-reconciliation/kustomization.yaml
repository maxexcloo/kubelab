apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - automation.yaml
  - crossplane-runtime.yaml
  - foundation.yaml
patches:
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: _
      spec:
        interval: 30m
        prune: true
        retryInterval: 2m
        timeout: 10m
        wait: true
        sourceRef:
          kind: GitRepository
          name: flux-system
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: crossplane-runtime
      spec:
        wait: false
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: crossplane-runtime
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: flux-system
      spec:
        healthChecks:
          - apiVersion: kustomize.toolkit.fluxcd.io/v1
            kind: Kustomization
            name: apps
            namespace: flux-system
          - apiVersion: kustomize.toolkit.fluxcd.io/v1
            kind: Kustomization
            name: automation
            namespace: flux-system
          - apiVersion: kustomize.toolkit.fluxcd.io/v1
            kind: Kustomization
            name: crossplane-runtime
            namespace: flux-system
          - apiVersion: kustomize.toolkit.fluxcd.io/v1
            kind: Kustomization
            name: foundation
            namespace: flux-system
          - apiVersion: kustomize.toolkit.fluxcd.io/v1
            kind: Kustomization
            name: platform
            namespace: flux-system
        interval: 10m
        retryInterval: 2m
        timeout: 2m
        wait: false
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: flux-system
