apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - crossplane-runtime.yaml
  - foundation.yaml
patches:
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: _
      spec:
        interval: 30m
        prune: true
        retryInterval: 30s
        timeout: 10m
        wait: true
        sourceRef:
          kind: GitRepository
          name: flux-system
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: _
      spec:
        wait: false
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: (automation|crossplane-runtime|flux-system|platform)
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: flux-system
      spec:
        interval: 10m
        timeout: 2m
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: flux-system
