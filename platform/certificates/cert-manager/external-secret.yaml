apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-acme-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: cloudflare-acme/password
      secretKey: api-token
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: cloudflare-api-token
