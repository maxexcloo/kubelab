apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: crossplane-system
spec:
  interval: 30m
  releaseName: crossplane
  chart:
    spec:
      chart: crossplane
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: crossplane
        namespace: flux-system
      version: 2.4.0
  values:
    function:
      packages:
        [
          xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.8.2,
        ]
    provider:
      packages: [xpkg.upbound.io/crossplane-contrib/provider-http:v1.0.14]
    resourcesCrossplane:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
    resourcesRBACManager:
      limits:
        memory: 256Mi
      requests:
        cpu: 20m
        memory: 64Mi
    securityContextCrossplane:
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    securityContextRBACManager:
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
