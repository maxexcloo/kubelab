apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: crossplane-system
spec:
  interval: 30m
  releaseName: crossplane
  chart:
    spec:
      chart: crossplane
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: crossplane
        namespace: flux-system
      version: 2.4.3
  values:
    function:
      # renovate: datasource=docker depName=xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform
      packages: [xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.11.2]
    nodeSelector:
      node.excloo.dev/network: internal
    rbacManager:
      nodeSelector:
        node.excloo.dev/network: internal
    resourcesCrossplane:
      limits:
        cpu: null
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 384Mi
    resourcesRBACManager:
      limits:
        cpu: null
        memory: 256Mi
      requests:
        cpu: 20m
        memory: 64Mi
    securityContextCrossplane:
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    securityContextRBACManager:
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
