apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crossplane
  namespace: crossplane-system
spec:
  interval: 30m
  releaseName: crossplane
  chart:
    spec:
      chart: crossplane
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: crossplane
        namespace: flux-system
      version: 2.4.0
  values:
    provider:
      packages: [xpkg.upbound.io/crossplane-contrib/provider-http:v1.0.14]
    resourcesCrossplane:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    resourcesRBACManager:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    securityContextCrossplane:
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    securityContextRBACManager:
      runAsNonRoot: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
