apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: b2-credentials
  namespace: crossplane-system
spec:
  data:
    - remoteRef:
        key: &item Backblaze B2
        property: username
      secretKey: username
    - remoteRef:
        key: *item
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: b2-credentials
    template:
      data:
        authorization: 'Basic {{ printf "%s:%s" .username .password | b64enc }}'
