apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resend-credentials
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: Resend
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: resend-credentials
    template:
      engineVersion: v2
      data:
        authorization: "Bearer {{ .password }}"
