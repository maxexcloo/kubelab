apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: resend-key
spec:
  compositeTypeRef:
    apiVersion: automation.excloo.dev/v1alpha1
    kind: ResendKey
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: crossplane-contrib-function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: api-key
            base:
              apiVersion: http.m.crossplane.io/v1alpha2
              kind: Request
              metadata:
                name: resend
              spec:
                managementPolicies: [Create, Delete, LateInitialize, Observe]
                forProvider:
                  # A key exists while a successful list shows its name; failed lists change nothing.
                  expectedResponseCheck:
                    logic: "true"
                    type: CUSTOM
                  headers:
                    Content-Type: [application/json]
                    User-Agent: [kubelab-crossplane/1.0]
                  isRemovedCheck:
                    logic: |-
                      .payload.body.name as $name |
                      .response.statusCode == 200
                      and (.response.body.data | type) == "array"
                      and (any(.response.body.data[]; .name == $name) | not)
                    type: CUSTOM
                  mappings:
                    - action: CREATE
                      body: "{name: .payload.body.name, permission: .payload.body.permission}"
                      method: POST
                      url: .payload.baseUrl
                    - action: OBSERVE
                      url: .payload.baseUrl
                    # Deletion repeats until no key carries the name, which also clears duplicates.
                    - action: REMOVE
                      method: DELETE
                      url: |-
                        .payload.body.name as $name |
                        .payload.baseUrl + "/" + first(.response.body.data[] | select(.name == $name) | .id)
                  payload:
                    baseUrl: https://api.resend.com/api-keys
                    body: "{}"
                  secretInjectionConfigs:
                    - keyMappings:
                        - missingFieldStrategy: preserve
                          responseJQ: .body.token
                          secretKey: api-key
                      secretRef:
                        name: resend-api-key
                        namespace: default
                      setOwnerReference: true
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: resend
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.secretInjectionConfigs[0].secretRef.namespace
              - type: CombineFromComposite
                combine:
                  strategy: string
                  string:
                    fmt: '{"name":"cluster-%s-%s","permission":"sending_access"}'
                  variables:
                    - fromFieldPath: spec.cluster
                    - fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.payload.body
          - name: onepassword-item
            base:
              apiVersion: external-secrets.io/v1alpha1
              kind: PushSecret
              metadata:
                name: resend
              spec:
                data:
                  - match:
                      secretKey: api-key
                      remoteRef:
                        property: provider-resend-api-key
                        remoteKey: placeholder
                    metadata:
                      apiVersion: kubernetes.external-secrets.io/v1alpha1
                      kind: PushSecretMetadata
                      spec:
                        tags: [Kubelab]
                secretStoreRefs:
                  - kind: ClusterSecretStore
                    name: onepassword
                selector:
                  secret:
                    name: resend-api-key
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.item
                toFieldPath: spec.data[0].match.remoteRef.remoteKey
                policy:
                  fromFieldPath: Required
