apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: resend-credentials
  namespace: crossplane-system
spec:
  data:
    - remoteRef:
        key: Resend
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: resend-credentials
    template:
      data:
        authorization: "Bearer {{ .password }}"
