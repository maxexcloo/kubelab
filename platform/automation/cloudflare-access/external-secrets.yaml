# Homelab mints the token and owns the shared policies; Kubelab only attaches them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-access
  namespace: crossplane-system
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: Cloudflare Access Applications
        property: password
      secretKey: password
    - remoteRef:
        key: Infrastructure Inventory
        property: notesPlain
      secretKey: inventory
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-access
    template:
      engineVersion: v2
      data:
        account-id: "{{ (.inventory | fromJson).cloudflare.account_id }}"
        authorization: "Bearer {{ .password }}"
        bypass: "{{ (.inventory | fromJson).cloudflare.access_policies.bypass }}"
        excloo-id: "{{ (.inventory | fromJson).cloudflare.access_policies.excloo_id }}"
        gatus: "{{ (.inventory | fromJson).cloudflare.access_policies.gatus }}"
