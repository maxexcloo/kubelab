apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: cloudflarewafpolicies.automation.excloo.dev
spec:
  defaultCompositionRef:
    name: cloudflare-waf-policy
  group: automation.excloo.dev
  names:
    kind: CloudflareWAFPolicy
    plural: cloudflarewafpolicies
  scope: Namespaced
  versions:
    - name: v1alpha1
      referenceable: true
      served: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                rule:
                  type: object
                  properties:
                    action:
                      maxLength: 64
                      minLength: 1
                      pattern: ^[a-z_]+$
                      type: string
                    description:
                      maxLength: 500
                      minLength: 1
                      type: string
                    enabled:
                      default: true
                      type: boolean
                    expression:
                      maxLength: 4096
                      minLength: 1
                      type: string
                    ref:
                      maxLength: 255
                      minLength: 1
                      pattern: ^[A-Za-z0-9_-]+$
                      type: string
                  required: [action, description, expression, ref]
                zoneName:
                  format: hostname
                  maxLength: 253
                  minLength: 1
                  type: string
              required: [rule, zoneName]
            status:
              type: object
              properties:
                zone:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
