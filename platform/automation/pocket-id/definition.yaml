apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: pocketidclients.automation.excloo.dev
  annotations:
    # Scope is immutable; Flux recreates the definition, which deletes its clients'
    # Requests without deleting the clients in Pocket ID.
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  defaultCompositionRef:
    name: pocket-id-client
  group: automation.excloo.dev
  names:
    kind: PocketIDClient
    plural: pocketidclients
  scope: Cluster
  versions:
    - name: v1alpha1
      referenceable: true
      served: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                client:
                  type: object
                  properties:
                    accessTokenDurationMinutes:
                      default: 60
                      maximum: 525600
                      minimum: 1
                      type: integer
                    callbackURLs:
                      minItems: 1
                      type: array
                      items:
                        format: uri
                        type: string
                    description:
                      default: ""
                      maxLength: 150
                      type: string
                    id:
                      maxLength: 128
                      minLength: 2
                      pattern: ^[A-Za-z0-9._~-]+$
                      type: string
                    isGroupRestricted:
                      default: true
                      type: boolean
                    isPublic:
                      default: false
                      type: boolean
                    launchURL:
                      format: uri
                      minLength: 1
                      type: string
                    logoutCallbackURLs:
                      default: []
                      type: array
                      items:
                        format: uri
                        type: string
                    name:
                      maxLength: 50
                      minLength: 1
                      type: string
                    pkceEnabled:
                      default: false
                      type: boolean
                    refreshTokenDurationMinutes:
                      default: 43200
                      maximum: 525600
                      minimum: 1
                      type: integer
                    requiresPushedAuthorizationRequests:
                      default: false
                      type: boolean
                    requiresReauthentication:
                      default: false
                      type: boolean
                    skipConsent:
                      default: false
                      type: boolean
                  required: [callbackURLs, id, launchURL, name]
                item:
                  description: Title of the existing 1Password item that receives a confidential client's oidc-client-secret.
                  minLength: 1
                  type: string
                itemTag:
                  default: Kubelab
                  description: Ownership tag the push writes to the item; Homelab-owned items keep their tag.
                  enum: [Homelab, Kubelab]
                  type: string
              required: [client]
              x-kubernetes-validations:
                - message: Confidential clients need an item for their secret; public clients have none and use pocket-id-public-client.
                  rule: self.client.isPublic != has(self.item)
