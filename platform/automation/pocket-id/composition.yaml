apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: pocket-id-client
spec:
  compositeTypeRef:
    apiVersion: automation.excloo.dev/v1alpha1
    kind: PocketIDClient
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: crossplane-contrib-function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: client
            base:
              apiVersion: http.m.crossplane.io/v1alpha2
              kind: Request
              metadata:
                name: pocket-id-client
                namespace: pocket-id
              spec:
                managementPolicies: [Create, LateInitialize, Observe, Update]
                forProvider:
                  expectedResponseCheck:
                    logic: |-
                      .response.statusCode == 200
                      and .response.body.accessTokenDurationMinutes == .payload.body.accessTokenDurationMinutes
                      and (.response.body.callbackURLs | sort) == (.payload.body.callbackURLs | sort)
                      and .response.body.description == .payload.body.description
                      and .response.body.isGroupRestricted == .payload.body.isGroupRestricted
                      and .response.body.isPublic == .payload.body.isPublic
                      and .response.body.launchURL == .payload.body.launchURL
                      and (.response.body.logoutCallbackURLs | sort) == (.payload.body.logoutCallbackURLs | sort)
                      and .response.body.name == .payload.body.name
                      and .response.body.pkceEnabled == .payload.body.pkceEnabled
                      and .response.body.refreshTokenDurationMinutes == .payload.body.refreshTokenDurationMinutes
                      and .response.body.requiresPushedAuthorizationRequests == .payload.body.requiresPushedAuthorizationRequests
                      and .response.body.requiresReauthentication == .payload.body.requiresReauthentication
                      and .response.body.skipConsent == .payload.body.skipConsent
                    type: CUSTOM
                  headers:
                    Content-Type: [application/json]
                    User-Agent: [kubelab-crossplane/1.0]
                    X-API-Key: ["{{ pocket-id:pocket-id:STATIC_API_KEY }}"]
                  mappings:
                    - action: CREATE
                      body: .payload.body
                      method: POST
                      url: .payload.baseUrl
                    - action: OBSERVE
                      url: .payload.baseUrl + "/" + .payload.body.id
                    - action: UPDATE
                      body: .payload.body | del(.id)
                      method: PUT
                      url: .payload.baseUrl + "/" + .payload.body.id
                  payload:
                    baseUrl: http://pocket-id.pocket-id.svc.cluster.local:1411/api/oidc/clients
                    body: "{}"
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pocket-id
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      fmt: pocket-id-client-%s
                      type: Format
              - type: FromCompositeFieldPath
                fromFieldPath: spec.client
                toFieldPath: spec.forProvider.payload.body
                transforms:
                  - type: string
                    string:
                      convert: ToJson
                      type: Convert
          # The client's own user group, adopted by name if it already exists.
          - name: group
            base:
              apiVersion: http.m.crossplane.io/v1alpha2
              kind: Request
              metadata:
                name: pocket-id-group
                namespace: pocket-id
              spec:
                managementPolicies: [Create, LateInitialize, Observe, Update]
                forProvider:
                  expectedResponseCheck:
                    logic: .payload.body.name as $name | .response.body.name == $name or any(.response.body.data[]?; .name == $name)
                    type: CUSTOM
                  headers:
                    Content-Type: [application/json]
                    User-Agent: [kubelab-crossplane/1.0]
                    X-API-Key: ["{{ pocket-id:pocket-id:STATIC_API_KEY }}"]
                  mappings:
                    - action: CREATE
                      body: .payload.body
                      method: POST
                      url: .payload.baseUrl
                    - action: OBSERVE
                      url: .payload.baseUrl + "?pagination%5Blimit%5D=100"
                    - action: UPDATE
                      body: .payload.body
                      method: POST
                      url: .payload.baseUrl
                  payload:
                    baseUrl: http://pocket-id.pocket-id.svc.cluster.local:1411/api/user-groups
                    body: "{}"
                  secretInjectionConfigs:
                    - keyMappings:
                        - missingFieldStrategy: preserve
                          responseJQ: placeholder
                          secretKey: id
                      secretRef:
                        name: placeholder
                        namespace: pocket-id
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pocket-id
            patches:
              - &group-name
                type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      fmt: pocket-id-group-%s
                      type: Format
              - <<: *group-name
                toFieldPath: spec.forProvider.secretInjectionConfigs[0].secretRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.secretInjectionConfigs[0].keyMappings[0].responseJQ
                transforms:
                  - type: string
                    string:
                      fmt: if .body.id then .body.id else first(.body.data[]? | select(.name == "%s") | .id) end
                      type: Format
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.client.name
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: '{"friendlyName":"%s","name":"%s"}'
                toFieldPath: spec.forProvider.payload.body
          - name: group-access
            base:
              apiVersion: http.m.crossplane.io/v1alpha2
              kind: Request
              metadata:
                name: pocket-id-client-groups
                namespace: pocket-id
              spec:
                managementPolicies: [LateInitialize, Observe, Update]
                forProvider:
                  expectedResponseCheck:
                    logic: "false"
                    type: CUSTOM
                  headers:
                    Content-Type: [application/json]
                    User-Agent: [kubelab-crossplane/1.0]
                    X-API-Key: ["{{ pocket-id:pocket-id:STATIC_API_KEY }}"]
                  mappings:
                    - action: OBSERVE
                      url: .payload.baseUrl
                    - action: UPDATE
                      body: .payload.body
                      method: PUT
                      url: .payload.baseUrl + "/allowed-user-groups"
                  payload:
                    baseUrl: http://pocket-id.pocket-id.svc.cluster.local:1411/api/oidc/clients/placeholder
                    body: "{}"
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pocket-id
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      fmt: pocket-id-client-groups-%s
                      type: Format
              - type: FromCompositeFieldPath
                fromFieldPath: spec.client.id
                toFieldPath: spec.forProvider.payload.baseUrl
                transforms:
                  - type: string
                    string:
                      fmt: http://pocket-id.pocket-id.svc.cluster.local:1411/api/oidc/clients/%s
                      type: Format
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.expectedResponseCheck.logic
                transforms:
                  - type: string
                    string:
                      fmt: |-
                        .response.statusCode == 200
                        and ([.response.body.allowedUserGroups[]?.id] | sort) == (["{{ pocket-id-group-all-services:pocket-id:id }}", "{{ pocket-id-group-%s:pocket-id:id }}"] | sort)
                      type: Format
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.payload.body
                transforms:
                  - type: string
                    string:
                      fmt: '{"userGroupIds":["{{ pocket-id-group-all-services:pocket-id:id }}","{{ pocket-id-group-%s:pocket-id:id }}"]}'
                      type: Format
          # Confidential clients get one generated secret; Pocket ID keeps earlier
          # secrets valid, so replacing this Request never breaks a signed-in app.
          - name: client-secret
            base:
              apiVersion: http.m.crossplane.io/v1alpha2
              kind: Request
              metadata:
                name: pocket-id-client-secret
                namespace: pocket-id
              spec:
                managementPolicies: [Create, Observe]
                forProvider:
                  expectedResponseCheck:
                    logic: "true"
                    type: CUSTOM
                  headers:
                    Content-Type: [application/json]
                    User-Agent: [kubelab-crossplane/1.0]
                    X-API-Key: ["{{ pocket-id:pocket-id:STATIC_API_KEY }}"]
                  mappings:
                    - action: CREATE
                      body: "{}"
                      method: POST
                      url: .payload.baseUrl
                    # Until a create succeeds there is no secret to observe, so the
                    # null URL makes the provider create one.
                    - action: OBSERVE
                      url: if (.response.statusCode // 0) >= 200 and .response.statusCode < 300 then .payload.baseUrl else null end
                  payload:
                    baseUrl: http://pocket-id.pocket-id.svc.cluster.local:1411/api/oidc/clients/placeholder/secrets
                    body: "{}"
                  secretInjectionConfigs:
                    - keyMappings:
                        - missingFieldStrategy: preserve
                          responseJQ: .body.secret
                          secretKey: client-secret
                      secretRef:
                        name: placeholder
                        namespace: pocket-id
                      setOwnerReference: true
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pocket-id
            patches:
              - &secret-name
                type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      fmt: pocket-id-client-secret-%s
                      type: Format
              - <<: *secret-name
                toFieldPath: spec.forProvider.secretInjectionConfigs[0].secretRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.client.id
                toFieldPath: spec.forProvider.payload.baseUrl
                transforms:
                  - type: string
                    string:
                      fmt: http://pocket-id.pocket-id.svc.cluster.local:1411/api/oidc/clients/%s/secrets
                      type: Format
              - &item
                type: FromCompositeFieldPath
                fromFieldPath: spec.item
                toFieldPath: metadata.annotations[automation.excloo.dev/item]
                policy:
                  fromFieldPath: Required
          # One field per PushSecret: 1Password Connect briefly serves the previous
          # item version after a write, so a second write in the same push
          # conflicts (HTTP 400). Separate pushes retry independently instead.
          - name: onepassword-client-secret
            base:
              apiVersion: external-secrets.io/v1alpha1
              kind: PushSecret
              metadata:
                name: pocket-id-client-secret
                namespace: pocket-id
              spec:
                data:
                  - match:
                      secretKey: client-secret
                      remoteRef:
                        property: oidc-client-secret
                        remoteKey: placeholder
                    metadata:
                      apiVersion: kubernetes.external-secrets.io/v1alpha1
                      kind: PushSecretMetadata
                      spec:
                        tags: [Kubelab]
                secretStoreRefs:
                  - kind: ClusterSecretStore
                    name: onepassword
                selector:
                  secret:
                    name: placeholder
            patches:
              - *secret-name
              - <<: *secret-name
                toFieldPath: spec.selector.secret.name
              - <<: *item
                toFieldPath: spec.data[0].match.remoteRef.remoteKey
              - type: FromCompositeFieldPath
                fromFieldPath: spec.itemTag
                toFieldPath: spec.data[0].metadata.spec.tags[0]
          # Publishes the client ID beside its secret so consumers read both from
          # the item.
          - name: onepassword-client-id
            base:
              apiVersion: external-secrets.io/v1alpha1
              kind: PushSecret
              metadata:
                name: pocket-id-client-id
                namespace: pocket-id
              spec:
                data:
                  - match:
                      secretKey: oidc-client-id
                      remoteRef:
                        property: oidc-client-id
                        remoteKey: placeholder
                secretStoreRefs:
                  - kind: ClusterSecretStore
                    name: onepassword
                selector:
                  secret:
                    name: placeholder
                template:
                  data:
                    oidc-client-id: placeholder
                  engineVersion: v2
                  mergePolicy: Merge
            patches:
              - <<: *secret-name
                transforms:
                  - type: string
                    string:
                      fmt: pocket-id-client-id-%s
                      type: Format
              - <<: *secret-name
                toFieldPath: spec.selector.secret.name
              - <<: *item
                toFieldPath: spec.data[0].match.remoteRef.remoteKey
              - type: FromCompositeFieldPath
                fromFieldPath: spec.client.id
                toFieldPath: spec.template.data[oidc-client-id]
