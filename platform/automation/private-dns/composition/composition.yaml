apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: private-dns-record
spec:
  compositeTypeRef:
    apiVersion: automation.excloo.dev/v1alpha1
    kind: PrivateDNSRecord
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: crossplane-contrib-function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: cloudflare-record
            base:
              apiVersion: externaldns.k8s.io/v1alpha1
              kind: DNSEndpoint
              metadata:
                name: private-dns
                labels:
                  gateway.excloo.dev/private-dns: "true"
              spec:
                endpoints:
                  - dnsName: placeholder.excloo.com
                    recordTTL: 300
                    recordType: CNAME
                    targets: [private.mbk.excloo.dev]
                    providerSpecific:
                      - name: external-dns.kubernetes.io/cloudflare-proxied
                        value: "false"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.hostname
                toFieldPath: spec.endpoints[0].dnsName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.target
                toFieldPath: spec.endpoints[0].targets[0]
            readinessChecks:
              - type: None
          - name: control-d-rule
            base:
              apiVersion: http.m.crossplane.io/v1alpha2
              kind: Request
              metadata:
                name: private-dns
              spec:
                managementPolicies: [Create, LateInitialize, Observe, Update]
                forProvider:
                  expectedResponseCheck:
                    logic: |-
                      .payload.body as $wanted |
                      .response.statusCode == 200
                      and ([
                        .response.body.body.rules[]?
                        | select(.PK == $wanted.hostname)
                        | select(.action.do == 2)
                        | select(.action.status == 1)
                        | select(.action.via == "{{ private-dns-target-ipv4:crossplane-system:address }}")
                        | select(
                            if $wanted.ipv6Enabled then
                              .action.via_v6 == "{{ private-dns-target-ipv6:crossplane-system:address }}"
                            else
                              (.action.via_v6 // "") == ""
                            end
                          )
                      ] | length) == 1
                    type: CUSTOM
                  headers:
                    Content-Type: [application/json]
                    User-Agent: [kubelab-crossplane/1.0]
                  isRemovedCheck:
                    logic: |-
                      .payload.body.hostname as $hostname |
                      .response.statusCode == 200
                      and .response.body.success == true
                      and (.response.body.body.rules | type) == "array"
                      and ([.response.body.body.rules[]? | select(.PK == $hostname)] | length) == 0
                    type: CUSTOM
                  mappings:
                    - action: CREATE
                      body: |-
                        {
                          do: 2,
                          hostnames: [.payload.body.hostname],
                          status: 1,
                          via: .payload.body.ipv4
                        } + (if .payload.body.ipv6Enabled then {via_v6: .payload.body.ipv6} else {} end)
                      method: POST
                      url: .payload.baseUrl
                    - action: OBSERVE
                      url: .payload.baseUrl
                    - action: UPDATE
                      body: |-
                        {
                          do: 2,
                          hostnames: [.payload.body.hostname],
                          status: 1,
                          via: .payload.body.ipv4
                        } + (if .payload.body.ipv6Enabled then {via_v6: .payload.body.ipv6} else {} end)
                      method: PUT
                      url: .payload.baseUrl
                  payload:
                    baseUrl: https://api.controld.com/profiles/placeholder/rules
                    body: |-
                      {
                        "hostname": "placeholder.excloo.com",
                        "ipv4": "{{ private-dns-target-ipv4:crossplane-system:address }}",
                        "ipv6": "{{ private-dns-target-ipv6:crossplane-system:address }}",
                        "ipv6Enabled": true
                      }
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: control-d
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.controlDProfileID
                toFieldPath: spec.forProvider.payload.baseUrl
                transforms:
                  - type: string
                    string:
                      fmt: https://api.controld.com/profiles/%s/rules
                      type: Format
              - type: CombineFromComposite
                toFieldPath: spec.forProvider.payload.body
                combine:
                  strategy: string
                  string:
                    fmt: '{"hostname":"%s","ipv4":"{{ private-dns-target-ipv4:crossplane-system:address }}","ipv6":"{{ private-dns-target-ipv6:crossplane-system:address }}","ipv6Enabled":%t}'
                  variables:
                    - fromFieldPath: spec.hostname
                    - fromFieldPath: spec.ipv6Enabled
                policy:
                  fromFieldPath: Required
