apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: control-d-credentials
  namespace: crossplane-system
spec:
  data:
    - remoteRef:
        key: Control D
        property: password
      secretKey: password
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: control-d-credentials
    template:
      data:
        authorization: "Bearer {{ .password }}"
