apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: privatednsrecords.automation.excloo.dev
spec:
  defaultCompositionRef:
    name: private-dns-record
  group: automation.excloo.dev
  names:
    kind: PrivateDNSRecord
    plural: privatednsrecords
  scope: Namespaced
  versions:
    - name: v1alpha1
      referenceable: true
      served: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                controlDProfileID:
                  default: ${control_d_profile}
                  maxLength: 128
                  minLength: 1
                  pattern: ^[A-Za-z0-9_-]+$
                  type: string
                hostname:
                  format: hostname
                  maxLength: 253
                  minLength: 1
                  type: string
                ipv6Enabled:
                  default: ${private_dns_ipv6}
                  type: boolean
                target:
                  default: private.${cluster_name}.excloo.dev
                  format: hostname
                  maxLength: 253
                  minLength: 1
                  type: string
              required: [hostname]
