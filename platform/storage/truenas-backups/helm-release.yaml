apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-backups
  namespace: storage
spec:
  releaseName: truenas-backups
  values:
    nfs:
      # Homelab must provision the HDD dataset and NFS export before deployment.
      path: /mnt/truenas/clusters/syd
    storageClass:
      name: truenas-backups
      provisionerName: cluster.local/truenas-backups
