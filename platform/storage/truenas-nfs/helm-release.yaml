apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-subdir-external-provisioner
  namespace: storage
spec:
  interval: 30m
  releaseName: nfs-subdir-external-provisioner
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: flux-system
      version: 4.0.18
  values:
    nfs:
      path: /mnt/truenas-nvme/clusters/mbk
      server: storage.invalid
      mountOptions:
        - nfsvers=4.2
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 128Mi
    storageClass:
      accessModes: ReadWriteMany
      name: truenas-nfs
      onDelete: retain
      pathPattern: ${.PVC.namespace}/${.PVC.name}
      provisionerName: cluster.local/truenas-nfs
      reclaimPolicy: Retain
