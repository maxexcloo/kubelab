apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-private
  namespace: external-dns
spec:
  releaseName: external-dns-private
  values:
    domainFilters:
      - excloo.com
    labelFilter: gateway.excloo.dev/private-dns=true
    managedRecordTypes:
      - CNAME
    sources:
      - crd
