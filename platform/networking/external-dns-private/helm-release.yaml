apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-private
  namespace: external-dns
spec:
  releaseName: external-dns-private
  values:
    labelFilter: gateway.excloo.dev/private-dns=true
    txtOwnerId: kubelab-${cluster_name}-private
    domainFilters:
      - ${public_domain}
    managedRecordTypes:
      - CNAME
    nodeSelector:
      node.excloo.dev/network: internal
    sources:
      - crd
