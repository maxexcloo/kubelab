apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-private
  namespace: external-dns
spec:
  releaseName: external-dns-private
  values:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node.excloo.dev/network
                  operator: In
                  values:
                    - internal
    domainFilters:
      - public-domain.invalid
    labelFilter: gateway.excloo.dev/private-dns=true
    managedRecordTypes:
      - CNAME
    sources:
      - crd
