ipam:
  mode: kubernetes

# Override the auto-detected MTU; the node's Tailscale interface reports 1280.
MTU: 1500

# Keep kube-proxy while learning and migrating. Replacing it is a later,
# separately observed networking change.
kubeProxyReplacement: false

# Talos mounts cgroup v2 itself. Cilium must use that existing mount.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Talos host DNS forwarding requires legacy host routing with Cilium.
bpf:
  hostLegacyRouting: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# Both clusters initially have one schedulable control-plane node.
operator:
  replicas: 1

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - flow
      - httpV2
      - icmp
      - port-distribution
      - tcp
