apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      version: 1.19.6
  releaseName: cilium
  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
