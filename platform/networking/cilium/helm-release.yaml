apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 30m
  releaseName: cilium
  chart:
    spec:
      chart: cilium
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      version: 1.20.2
  values:
    MTU: 1280
    kubeProxyReplacement: false
    bpf:
      hostLegacyRouting: true
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    hubble:
      relay:
        nodeSelector:
          node.excloo.dev/network: internal
        enabled: true
      ui:
        nodeSelector:
          node.excloo.dev/network: internal
        enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - flow
          - httpV2
          - icmp
          - port-distribution
          - tcp
    ipam:
      mode: kubernetes
    operator:
      nodeSelector:
        node.excloo.dev/network: internal
      replicas: 1
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
