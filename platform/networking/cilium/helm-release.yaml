apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 30m
  releaseName: cilium
  chart:
    spec:
      chart: cilium
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      version: 1.20.1
  values:
    ipam:
      mode: kubernetes
    MTU: 1500
    kubeProxyReplacement: false
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    bpf:
      hostLegacyRouting: true
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    operator:
      replicas: 1
    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - flow
          - httpV2
          - icmp
          - port-distribution
          - tcp
