apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tailscale-node-endpoints
spec:
  description: Keep peers from choosing a node's Cilium address as its Tailscale endpoint, which would route Tailscale through itself.
  nodeSelector: {}
  enableDefaultDeny:
    egress: false
    ingress: false
  ingressDeny:
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            # Homelab fixes each node's Tailscale port.
            - port: "41641"
              protocol: UDP
