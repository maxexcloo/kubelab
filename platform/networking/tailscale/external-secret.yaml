apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  data:
    - remoteRef:
        key: tailscale-operator/username
      secretKey: client_id
    - remoteRef:
        key: tailscale-operator/password
      secretKey: client_secret
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: operator-oauth
