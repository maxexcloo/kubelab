apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  data:
    - remoteRef:
        key: g4osooqtv75hghesoglcpmmuuq
        property: username
      secretKey: client_id
    - remoteRef:
        key: g4osooqtv75hghesoglcpmmuuq
        property: password
      secretKey: client_secret
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    deletionPolicy: Retain
    name: operator-oauth
