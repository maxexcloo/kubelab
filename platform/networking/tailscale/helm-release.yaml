apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  releaseName: tailscale-operator
  chart:
    spec:
      chart: tailscale-operator
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      version: 1.104.2
  values:
    installCRDs: true
    apiServerProxyConfig:
      mode: "false"
    operatorConfig:
      logging: info
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.excloo.dev/network
                    operator: In
                    values:
                      - internal
      image:
        pullPolicy: IfNotPresent
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 128Mi
