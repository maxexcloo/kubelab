apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  chart:
    spec:
      chart: tailscale-operator
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      version: 1.102.2
  interval: 30m
  releaseName: tailscale-operator
  values:
    installCRDs: true
    operatorConfig:
      image:
        pullPolicy: IfNotPresent
      logging: info
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
    proxyConfig:
      image:
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
    apiServerProxyConfig:
      mode: "false"
