apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: ingress
spec:
  statefulSet:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  tailscale.com/parent-resource: ingress
                  tailscale.com/parent-resource-type: proxygroup
              topologyKey: kubernetes.io/hostname
      tailscaleContainer:
        env:
          # Avoid slow bulk transfers through kernel-mode proxies: tailscale/tailscale#20858.
          - name: TS_DEBUG_DISABLE_UDP_GSO
            value: "true"
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 20m
            memory: 128Mi
