apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - external-secrets.yaml
configMapGenerator:
  - name: traefik-homelab
    namespace: networking
    files:
      - host_services.yq
      - render_host_services.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - name-reference.yaml
patches:
  - path: helm-release.yaml
