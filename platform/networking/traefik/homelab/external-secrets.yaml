apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-services-settings
  namespace: flux-system
spec:
  refreshInterval: 5m
  data:
    - remoteRef:
        key: Infrastructure Inventory
        property: private-proxy-dns-names
      secretKey: homelab_private_proxy_dns_names
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelab-services-settings
    template:
      mergePolicy: Merge
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
