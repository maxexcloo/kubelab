apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-services
  annotations:
    # Homelab's service inventory owns monitoring for these runtime names.
    monitoring.excloo.dev/enabled: "false"
spec:
  secretName: homelab-services
  dnsNames: ${homelab_private_proxy_dns_names}
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns01
