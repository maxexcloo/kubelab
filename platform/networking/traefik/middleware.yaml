# The private websecure entrypoint compresses text responses only, so media,
# downloads and event streams pass through unchanged.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: networking
spec:
  compress:
    includedContentTypes:
      - application/javascript
      - application/json
      - image/svg+xml
      - text/css
      - text/html
      - text/javascript
      - text/plain
