apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: networking
spec:
  interval: 30m
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      version: 42.1.3
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    accessLog:
      enabled: true
      format: json
      fields:
        names:
          # Paths can carry capability URLs, such as mini-app list links.
          RequestPath: drop
    # A DaemonSet runs ingress on every untainted node; dedicated taints keep
    # it off the GPU nodes, and surge updates keep it available while rolling.
    deployment:
      kind: DaemonSet
    gateway:
      enabled: false
    gatewayClass:
      enabled: true
      name: traefik
    ingressClass:
      enabled: false
    log:
      format: json
      level: INFO
    ports:
      web:
        http:
          redirections:
            entryPoint:
              permanent: true
              scheme: https
              to: websecure
      webtunnel:
        exposedPort: 80
        port: 8081
        protocol: TCP
        expose:
          default: false
          tunnel: true
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    service:
      additionalServices:
        tunnel:
          spec:
            # Fall back to another node's ingress instead of failing locally.
            trafficDistribution: PreferSameNode
            type: ClusterIP
      spec:
        trafficDistribution: PreferSameNode
        type: ClusterIP
