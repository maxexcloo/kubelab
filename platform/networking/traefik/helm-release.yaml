apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: networking
spec:
  interval: 30m
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      version: 42.3.1
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    accessLog:
      enabled: true
      format: json
      fields:
        names:
          # Paths can carry capability URLs, such as mini-app list links.
          RequestPath: drop
    # A DaemonSet runs ingress on every node, dedicated ones included, so each
    # node can take its own traffic; surge updates keep it available while rolling.
    deployment:
      kind: DaemonSet
    gateway:
      enabled: false
    gatewayClass:
      enabled: true
      name: traefik
    ingressClass:
      enabled: false
    log:
      format: json
      level: INFO
    ports:
      web:
        http:
          redirections:
            entryPoint:
              permanent: true
              scheme: https
              to: websecure
      websecure:
        http:
          middlewares:
            - networking-compress@kubernetescrd
      webtunnel:
        exposedPort: 80
        port: 8081
        protocol: TCP
        # Keep cloudflared's X-Forwarded-Proto: https and client address (pod subnet), so apps mark cookies Secure.
        forwardedHeaders:
          trustedIPs:
            - 10.100.0.0/22
        expose:
          default: false
          tunnel: true
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    service:
      # Only the named Services carry traffic.
      enabled: false
      additionalServices:
        tunnel:
          spec:
            # Fall back to another node's ingress instead of failing locally.
            trafficDistribution: PreferSameNode
            type: ClusterIP
    tolerations:
      - effect: NoSchedule
        key: node.excloo.dev/dedicated
        operator: Exists
