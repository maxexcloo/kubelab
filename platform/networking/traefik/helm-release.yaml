apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      version: 41.2.0
  releaseName: traefik
  values:
    deployment:
      replicas: 1
    ingressClass:
      enabled: false
    providers:
      kubernetesCRD:
        enabled: false
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true
    gatewayClass:
      enabled: true
      name: traefik
    gateway:
      enabled: true
      name: private
      listeners:
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy:
            from: All
    service:
      spec:
        type: ClusterIP
    log:
      format: json
      level: INFO
    accessLog:
      enabled: true
      format: json
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 256Mi
