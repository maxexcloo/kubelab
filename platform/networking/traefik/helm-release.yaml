apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 30m
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      version: 42.1.2
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    accessLog:
      enabled: true
      format: json
      fields:
        names:
          # Paths can carry capability URLs, such as mini-app list links.
          RequestPath: drop
    deployment:
      replicas: 2
    gateway:
      enabled: false
    gatewayClass:
      enabled: true
      name: traefik
    ingressClass:
      enabled: false
    log:
      format: json
      level: INFO
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    ports:
      web:
        http:
          redirections:
            entryPoint:
              permanent: true
              scheme: https
              to: websecure
      webtunnel:
        exposedPort: 80
        port: 8081
        protocol: TCP
        expose:
          default: false
          tunnel: true
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    service:
      additionalServices:
        tunnel:
          spec:
            internalTrafficPolicy: Local
            type: ClusterIP
      spec:
        internalTrafficPolicy: Local
        type: ClusterIP
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
