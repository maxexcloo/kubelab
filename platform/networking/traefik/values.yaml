deployment:
  replicas: 1

# Gateway API is the only routing API used by this repository.
ingressClass:
  enabled: false
providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true

gatewayClass:
  enabled: true
  name: traefik
gateway:
  enabled: true
  name: private
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All

# Tailscale and cloudflared connect to the in-cluster Service. There is no
# bare-metal load balancer in the initial design.
service:
  spec:
    type: ClusterIP

logs:
  general:
    format: json
    level: INFO
  access:
    enabled: true
    format: json

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi
