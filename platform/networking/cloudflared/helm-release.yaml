apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  chart:
    spec:
      chart: app-template
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.1.0
  interval: 30m
  releaseName: cloudflared
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
    controllers:
      cloudflared:
        containers:
          cloudflared:
            image:
              repository: cloudflare/cloudflared
              tag: 2026.8.0@sha256:2535e54b16adf1d50630f99d0886471926c5ef3f6b328100ec6589f731c48969
              pullPolicy: IfNotPresent
            args:
              - tunnel
              - --no-autoupdate
              - run
            env:
              - name: TUNNEL_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: tunnel-token
                    key: token
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
        strategy: Recreate
        type: deployment
    serviceAccount:
      create: true
