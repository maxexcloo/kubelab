apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  releaseName: cloudflared
  values:
    controllers:
      # One connector per node, so public traffic can enter through any node.
      cloudflared:
        type: daemonset
        containers:
          cloudflared:
            image:
              repository: cloudflare/cloudflared
              tag: 2026.11.0
            args:
              - tunnel
              - --no-autoupdate
              - --protocol
              - http2
              - run
            env:
              - name: TUNNEL_TOKEN
                valueFrom:
                  secretKeyRef:
                    key: token
                    name: tunnel-token
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 20m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - effect: NoSchedule
          key: node.excloo.dev/dedicated
          operator: Exists
