apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  releaseName: cloudflared
  values:
    controllers:
      cloudflared:
        replicas: 2
        strategy: RollingUpdate
        type: deployment
        containers:
          cloudflared:
            image:
              pullPolicy: IfNotPresent
              repository: cloudflare/cloudflared
              tag: 2026.10.3
            args:
              - tunnel
              - --no-autoupdate
              - --protocol
              - http2
              - run
            env:
              - name: TUNNEL_TOKEN
                valueFrom:
                  secretKeyRef:
                    key: token
                    name: tunnel-token
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 20m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
    defaultPodOptions:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: cloudflared
                  app.kubernetes.io/name: cloudflared
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
