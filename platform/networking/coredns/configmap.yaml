# Talos owns CoreDNS; this pins the identity host to the private gateway so
# in-cluster OIDC discovery does not depend on the Cloudflare tunnel. The
# private gateway and wildcard certificate already serve id.excloo.com.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        rewrite name exact id.excloo.com traefik-private.networking.svc.cluster.local

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
