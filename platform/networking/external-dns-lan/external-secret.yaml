apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-external-dns
  namespace: external-dns
spec:
  refreshInterval: 1h
  data:
    # This existing infrastructure API credential also serves the UniFi MCP.
    - remoteRef:
        key: LiteLLM
        property: provider-unifi-api-key
      secretKey: api-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unifi-api-key
