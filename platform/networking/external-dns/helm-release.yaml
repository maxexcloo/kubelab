apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  releaseName: external-dns
  values:
    labelFilter: gateway.excloo.dev/public-access=true
    txtOwnerId: kubelab-${cluster_name}-public
    nodeSelector:
      node.excloo.dev/network: internal
    managedRecordTypes:
      - A
      - AAAA
      - CNAME
    sources:
      - gateway-httproute
    extraArgs:
      enable-legacy-annotation-prefix: null
