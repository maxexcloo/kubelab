apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  releaseName: external-dns
  values:
    labelFilter: gateway.excloo.dev/public-access=true
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node.excloo.dev/network
                  operator: In
                  values:
                    - internal
    managedRecordTypes:
      - A
      - AAAA
      - CNAME
    sources:
      - gateway-httproute
    extraArgs:
      enable-legacy-annotation-prefix: null
