apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - cron-job.yaml
  - rbac.yaml
configMapGenerator:
  - name: state-backup
    files:
      - backup.sh
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: CronJob
          name: state-backup
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=backup].env.[name=DEPLOYMENT].value
          - spec.jobTemplate.spec.template.spec.containers.[name=backup].env.[name=HELM_RELEASE].value
      - select:
          kind: Role
          name: state-backup
        fieldPaths:
          - rules.0.resourceNames.0
          - rules.1.resourceNames.0
generatorOptions:
  labels:
    backup.excloo.dev/component: state
