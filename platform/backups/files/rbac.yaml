apiVersion: v1
kind: ServiceAccount
metadata:
  name: state-backup
  labels:
    backup.excloo.dev/component: state
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: state-backup
  labels:
    backup.excloo.dev/component: state
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/scale
    resourceNames:
      - application
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    resourceNames:
      - application
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: state-backup
  labels:
    backup.excloo.dev/component: state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: state-backup
subjects:
  - kind: ServiceAccount
    name: state-backup
