apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-backup
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-backup
      ports:
        - port: 5432
          protocol: TCP
  podSelector:
    matchLabels:
      cnpg.io/cluster: database
  policyTypes:
    - Ingress
