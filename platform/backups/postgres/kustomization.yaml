apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - object-store.yaml
  - scheduled-backup.yaml
patches:
  - path: cluster.yaml
    target:
      kind: Cluster
replacements:
  - source:
      kind: Cluster
      fieldPath: metadata.name
    targets:
      - select:
          kind: ScheduledBackup
        fieldPaths:
          - spec.cluster.name
