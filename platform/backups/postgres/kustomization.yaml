apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - cronjob.yaml
  - network-policy.yaml
configMapGenerator:
  - name: postgres-backup
    files:
      - postgres_backup.sh
replacements:
  - source:
      group: postgresql.cnpg.io
      kind: Cluster
      fieldPath: metadata.name
    targets:
      - select:
          kind: CronJob
          name: postgres-backup
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=backup].env.[name=PGHOST].value
        options:
          delimiter: "-"
          index: 0
      - select:
          kind: NetworkPolicy
          name: postgres-backup
        fieldPaths:
          - spec.podSelector.matchLabels.[cnpg.io/cluster]
  - source:
      group: postgresql.cnpg.io
      kind: Cluster
      fieldPath: spec.bootstrap.initdb.secret.name
    targets:
      - select:
          kind: CronJob
          name: postgres-backup
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=backup].env.[name=PGPASSWORD].valueFrom.secretKeyRef.name
          - spec.jobTemplate.spec.template.spec.containers.[name=backup].env.[name=PGUSER].valueFrom.secretKeyRef.name
  - source:
      group: postgresql.cnpg.io
      kind: Cluster
      fieldPath: spec.bootstrap.initdb.database
    targets:
      - select:
          kind: CronJob
          name: postgres-backup
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=backup].env.[name=PGDATABASE].value
  - source:
      group: postgresql.cnpg.io
      kind: Cluster
      fieldPath: spec.imageName
    targets:
      - select:
          kind: CronJob
          name: postgres-backup
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=backup].image
