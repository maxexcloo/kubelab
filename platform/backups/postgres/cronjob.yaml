apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "0 * * * *"
  timeZone: Australia/Sydney
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3300
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 568
            runAsNonRoot: true
            runAsUser: 568
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              # Replaced from the owning Cluster, keeping client and server versions aligned.
              image: postgresql.invalid
              command:
                - /bin/bash
                - /scripts/postgres_backup.sh
              env:
                - name: BACKUP_DIRECTORY
                  value: /backups/postgres
                - name: PGCONNECT_TIMEOUT
                  value: "30"
                - name: PGDATABASE
                  value: database
                - name: PGHOST
                  value: database-rw
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: database
                      key: password
                - name: PGSSLMODE
                  value: require
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: database
                      key: username
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 20m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: backups
            - name: scripts
              configMap:
                name: postgres-backup
            - name: temporary
              emptyDir: {}
