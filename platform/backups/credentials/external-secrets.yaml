apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-credentials
  labels:
    backup.excloo.dev/component: state
spec:
  data:
    - remoteRef:
        key: &item S3 Backups
        property: username
      secretKey: AWS_ACCESS_KEY_ID
    - remoteRef:
        key: *item
        property: password
      secretKey: AWS_SECRET_ACCESS_KEY
    - remoteRef:
        key: *item
        property: bucket
      secretKey: BACKUP_BUCKET
    - remoteRef:
        key: *item
        property: endpoint
      secretKey: BACKUP_ENDPOINT
    - remoteRef:
        key: *item
        property: restic-password
      secretKey: RESTIC_PASSWORD
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: backup-credentials
