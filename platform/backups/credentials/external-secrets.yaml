apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-credentials
  labels:
    backup.excloo.dev/component: state
spec:
  data:
    - remoteRef:
        key: &access_key_item S3 Backup Access Key
        property: username
      secretKey: AWS_ACCESS_KEY_ID
    - remoteRef:
        key: *access_key_item
        property: password
      secretKey: AWS_SECRET_ACCESS_KEY
    - remoteRef:
        key: S3 Backups
        property: restic-password
      secretKey: RESTIC_PASSWORD
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: backup-credentials
