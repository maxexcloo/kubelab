apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-credentials
  labels:
    backup.excloo.dev/component: state
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: backup-credentials
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: psklh2wmikie3byefnaepvnbkm
        property: username
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: psklh2wmikie3byefnaepvnbkm
        property: password
    - secretKey: BACKUP_BUCKET
      remoteRef:
        key: psklh2wmikie3byefnaepvnbkm
        property: bucket
    - secretKey: BACKUP_ENDPOINT
      remoteRef:
        key: psklh2wmikie3byefnaepvnbkm
        property: endpoint
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: psklh2wmikie3byefnaepvnbkm
        property: restic-password
