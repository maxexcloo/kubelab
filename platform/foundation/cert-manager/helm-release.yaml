apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      version: v1.21.2
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    dns01RecursiveNameservers: 1.1.1.1:53,1.0.0.1:53
    dns01RecursiveNameserversOnly: true
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node.excloo.dev/network
                  operator: In
                  values:
                    - internal
    cainjector:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.excloo.dev/network
                    operator: In
                    values:
                      - internal
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 128Mi
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      gatewayAPI:
        enabled: true
    crds:
      enabled: true
      keep: true
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 20m
        memory: 128Mi
    webhook:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.excloo.dev/network
                    operator: In
                    values:
                      - internal
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 128Mi
