apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  interval: 30m
  releaseName: onepassword-connect
  chart:
    spec:
      chart: connect
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: onepassword
        namespace: flux-system
      version: 2.4.2
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  install:
    skipCRDs: true
  values:
    connect:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.excloo.dev/network
                    operator: In
                    values:
                      - internal
      credentialsName: onepassword-connect
      api:
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 5m
            memory: 64Mi
      sync:
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 5m
            memory: 64Mi
    operator:
      create: false
