apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
  namespace: external-secrets
spec:
  interval: 30m
  releaseName: onepassword-connect
  chart:
    spec:
      chart: connect
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: onepassword
        namespace: flux-system
      version: 2.4.1
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  install:
    skipCRDs: true
  values:
    connect:
      credentialsName: onepassword-connect
      api:
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 5m
    operator:
      create: false
