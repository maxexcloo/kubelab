# Discrete AMD GPUs. Integrated GPUs have at most a dozen compute units, report
# shared system memory as VRAM and drive host displays, so claims never get them.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gpu.excloo.dev
spec:
  selectors:
    - cel:
        expression: >-
          device.driver == "gpu.amd.com" &&
          device.attributes["gpu.amd.com"].type == "amdgpu" &&
          device.capacity["gpu.amd.com"].computeUnits.compareTo(quantity("32")) >= 0
