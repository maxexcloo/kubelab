apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 30m
  releaseName: cloudnative-pg
  chart:
    spec:
      chart: cloudnative-pg
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      version: 0.29.0
  values:
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 20m
        memory: 128Mi
