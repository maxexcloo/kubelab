apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-database
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  instances: 1
  affinity:
    nodeSelector:
      node.excloo.dev/network: internal
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: app-database
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backups
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi
  storage:
    size: 5Gi
    storageClass: local-path
