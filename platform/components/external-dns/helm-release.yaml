apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      version: 1.23.0
  values:
    logFormat: json
    policy: upsert-only
    registry: noop
    triggerLoopOnEvent: true
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            key: token
            name: cloudflare-api-token
    extraArgs:
      cloudflare-dns-records-per-page: "5000"
      cloudflare-record-comment: Kubelab ExternalDNS Managed
    provider:
      name: cloudflare
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 20m
        memory: 64Mi
