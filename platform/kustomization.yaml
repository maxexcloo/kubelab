apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certificates/cert-manager
  - identity
  - namespaces
  - networking/cilium
  - networking/cloudflared
  - networking/external-dns
  - networking/tailscale
  - networking/traefik
  - observability
  - secrets/external-secrets
  - secrets/onepassword-connect
  - sources/bifrost
  - sources/bjw-s
  - sources/cert-manager
  - sources/cilium
  - sources/external-dns
  - sources/external-secrets
  - sources/headlamp
  - sources/local-path-provisioner
  - sources/onepassword
  - sources/openspeedtest
  - sources/tailscale
  - sources/traefik
  - sources/victoria-metrics
  - sources/windmill
  - storage/local-path-provisioner
patches:
  - patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        install:
          remediation:
            retries: 3
        upgrade:
          remediation:
            retries: 3
    target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
