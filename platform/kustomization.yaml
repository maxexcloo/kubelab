apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - automation/crossplane
  - certificates/cert-manager
  - databases/cloudnative-pg
  - identity/headlamp
  - maintenance/failed-pods
  - maintenance/reloader
  - networking/cilium
  - networking/cloudflared
  - networking/coredns
  - networking/external-dns
  - networking/external-dns-private
  - networking/tailscale
  - networking/traefik
  - observability/grafana-credentials
  - observability/metrics-server
  - observability/victoria-metrics
  - secrets/external-secrets
  - secrets/onepassword-items
  - sources/bjw-s.yaml
  - sources/external-dns.yaml
components:
  - components/helm-remediation
replacements:
  - source:
      kind: ClusterSecretStore
      name: onepassword
      fieldPath: spec.provider.onepassword.connectHost
    targets:
      - select:
          kind: CronJob
          name: onepassword-items
          namespace: external-secrets
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=reconciler].env.[name=OP_CONNECT_HOST].value
