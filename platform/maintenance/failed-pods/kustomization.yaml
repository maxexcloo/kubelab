apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cron-job.yaml
  - rbac.yaml
configMapGenerator:
  - name: failed-pods
    namespace: kube-system
    files:
      - delete_failed_pods.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
