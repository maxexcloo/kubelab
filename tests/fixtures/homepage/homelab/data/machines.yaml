machines:
  mbk:
    bento:
      platform: ucore
      type: server
    gateway:
      platform: unifi
      type: router
      services:
        management:
          description: Network Controller
          group: Infrastructure
          icon: sh-ubiquiti-unifi
          name: UniFi
          port: 443
          scheme: https
          widget:
            key: "{{HOMEPAGE_VAR_UNIFI_API_KEY}}"
            type: unifi
    hass:
      name: HASS
      platform: haos
      type: appliance
      services:
        esphome:
          description: ESP Device Builder
          group: Smart Home
          icon: sh-esphome
          name: ESPHome
          path: /5c53de3b_esphome
          port: 443
          scheme: https
          siteMonitor: ""
        management:
          description: Smart Home & Automations
          group: Smart Home
          icon: sh-home-assistant
          name: Home Assistant
          port: 443
          scheme: https
          widget:
            key: "{{HOMEPAGE_VAR_HOME_ASSISTANT_ACCESS_TOKEN}}"
            type: homeassistant
    kimbap:
      hostname: storage
      platform: truenas
      type: storage
      services:
        management:
          description: Storage Appliance
          group: Infrastructure
          icon: sh-truenas-scale
          name: TrueNAS
          port: 8444
          scheme: https
          widget:
            enablePools: true
            key: "{{HOMEPAGE_VAR_TRUENAS_API_KEY}}"
            type: truenas
            version: 2
        netboot:
          description: Network Boot Server
          group: Infrastructure
          icon: mdi-server-network-#ffffff
          name: Netboot
          port: 31010
          scheme: http
        syncthing:
          port: 20910
          scheme: http
    nanokvm:
      platform: nanokvm
      type: appliance
      services:
        management:
          description: Remote Console & Power Control
          icon: sipeed
          name: NanoKVM
          port: 80
          scheme: http
    slzb-06m:
      platform: slzb
      type: appliance
      interfaces:
        - address: 192.0.2.6
      services:
        management:
          description: Zigbee Ethernet Adapter
          icon: zigbee
          name: SLZB-06M
          port: 80
          scheme: http
      tailscale:
        enabled: false
    taco:
      cluster: syd
      platform: talos
      type: vm
  syd:
    hsp:
      cluster: syd
      platform: talos
      type: vm
