machines:
  mbk:
    bento:
      platform: ucore
      type: server
    gateway:
      management_port: 443
      platform: unifi
      type: router
    hass:
      display_name: HASS
      management_port: 443
      platform: haos
      type: appliance
    kimbap:
      hostname: storage
      management_port: 8444
      platform: truenas
      type: storage
      services:
        netboot:
          port: 31010
          scheme: http
        syncthing:
          port: 20910
          scheme: http
    nanokvm:
      platform: nanokvm
      type: appliance
      services:
        console:
          port: 80
          scheme: http
          homepage:
            description: Remote Console & Power Control
            icon: sipeed
            name: NanoKVM
    slzb-06m:
      platform: slzb
      type: appliance
      interfaces:
        - address: 192.0.2.6
      services:
        console:
          port: 80
          scheme: http
          homepage:
            description: Zigbee Ethernet Adapter
            icon: zigbee
            name: SLZB-06M
      tailscale:
        enabled: false
    taco:
      cluster: mbk
      platform: talos
      type: vm
  syd:
    hsp:
      cluster: syd
      platform: talos
      type: vm
