machines:
  mbk:
    bento:
      platform: ucore
      type: server
    gateway:
      platform: unifi
      type: router
      services:
        management:
          port: 443
          scheme: https
    hass:
      name: HASS
      platform: haos
      type: appliance
      services:
        management:
          port: 443
          scheme: https
    kimbap:
      hostname: storage
      platform: truenas
      type: storage
      services:
        management:
          port: 8444
          scheme: https
        netboot:
          port: 31010
          scheme: http
        syncthing:
          port: 20910
          scheme: http
    nanokvm:
      platform: nanokvm
      type: appliance
      services:
        console:
          description: Remote Console & Power Control
          icon: sipeed
          name: NanoKVM
          port: 80
          scheme: http
    slzb-06m:
      platform: slzb
      type: appliance
      interfaces:
        - address: 192.0.2.6
      services:
        console:
          description: Zigbee Ethernet Adapter
          icon: zigbee
          name: SLZB-06M
          port: 80
          scheme: http
      tailscale:
        enabled: false
    taco:
      cluster: mbk
      platform: talos
      type: vm
  syd:
    hsp:
      cluster: syd
      platform: talos
      type: vm
